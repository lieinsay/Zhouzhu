<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-01-current-state desc-01-current-state" data-chapter="01-current-state"><title id="title-01-current-state">当前状态与四类责任</title><desc id="desc-01-current-state">有来源的施工改变原因，同一份水盐沙在当前世界响应。 自然源是起点，不是施工后重抽世界：初始成因与真实材料保留；玩家改造有工料与过程，不借此修补自然河宽深。；玩家施工改变真实实体和开口：挖填、材料与完成工量有来源，预览和画线不直接改地或造水。；运行水态继续唯一物质账：原R/L/M/G与盐沙沿实际空间交换，不为玩家渠道另加一份供水。；宿主相容发布，显示读取结果：核心过程同源，几何、碰撞、水面与查询引用同一接受状态。；范围限浅表改造与运行引水：第六层设计已确认；生态专题延期，用水与水上交互另作第七层讨论。。第六层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-01-current-state" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">01 / 当前状态与四类责任</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="70" y="185" width="195" height="92" rx="9" class="active"/><text x="167.5" y="217" class="label" text-anchor="middle">自然源包</text><text x="167.5" y="246" class="small" text-anchor="middle">成因 / 材料</text><line x1="273" y1="231" x2="282" y2="231" class="flow" marker-end="url(#arrow-01-current-state)"/><rect x="290" y="185" width="195" height="92" rx="9" class="card"/><text x="387.5" y="217" class="label" text-anchor="middle">玩家施工</text><text x="387.5" y="246" class="small" text-anchor="middle">实际工量</text><line x1="493" y1="231" x2="502" y2="231" class="flow" marker-end="url(#arrow-01-current-state)"/><rect x="510" y="185" width="195" height="92" rx="9" class="card"/><text x="607.5" y="217" class="label" text-anchor="middle">运行水态</text><text x="607.5" y="246" class="small" text-anchor="middle">唯一库存</text><line x1="713" y1="231" x2="722" y2="231" class="flow" marker-end="url(#arrow-01-current-state)"/><rect x="730" y="185" width="195" height="92" rx="9" class="card"/><text x="827.5" y="217" class="label" text-anchor="middle">宿主 / 表示</text><text x="827.5" y="246" class="small" text-anchor="middle">相容接受</text><rect x="240" y="355" width="460" height="85" rx="9" class="card"/><text x="470" y="387" class="label" text-anchor="middle">一套当前实体与水盐沙状态</text><text x="470" y="416" class="small" text-anchor="middle">本图不提供施工、流量或地质参数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  自然源是起点，不是施工后重抽世界</text><text x="42" y="575