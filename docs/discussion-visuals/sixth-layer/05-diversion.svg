<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-05-diversion desc-05-diversion" data-chapter="05-diversion"><title id="title-05-diversion">分流、改道与旧槽</title><desc id="desc-05-diversion">新支路分走实际水，旧槽原水不会跟着名字瞬移。 实际新路径成立才分流：分水受当前几何、两端水态、阻力与储留约束，不按固定比例保满。；原河与新渠共用有限来水：不能原河保留完整旧Q，新渠再得同一份；边界通量只记一次。；旧槽残水保留原位置：孤立潭和剩余通路继续蒸渗或排出，不改名就清空或瞬移库存。；回水可使交换减弱或反向：流向消费当前水态，不把所有新路强制为永久单向树。；新渠床岸仍受真实水沙反馈：冲淤、侧蚀和塌落改变当前几何与材料，不永久锁死施工模板。。第六层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-05-diversion" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">05 / 分流、改道与旧槽</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M100 280Q280 200 430 280Q600 380 840 300" class="widewater" /><path d="M430 280Q600 185 840 205" class="widewater" /><text x="100" y="150" class="small" text-anchor="start">平面示意；高程与能力条件由接受状态另给</text><line x1="255" y1="248" x2="360" y2="258" class="flow" marker-end="url(#arrow-05-diversion)"/><line x1="520" y1="235" x2="655" y2="212" class="flow" marker-end="url(#arrow-05-diversion)"/><line x1="570" y1="326" x2="710" y2="328" class="flow" marker-end="url(#arrow-05-diversion)"/><text x="120" y="430" class="label" text-anchor="start">没有通路和水头条件不因画线分水</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  实际新路径成立才分流</text><text x="42" y="575" class="note" text-anchor="start">分水受当前几何、两端水态、阻力与储留约束，不按固定比例保满。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M100 280Q280 200 430 280Q600 380 840 300" class="widewater" /><path d="M430 280Q600 185 840 205" class="widewater" /><text x="100" y="150" class="small" text-anchor="start">平面示意；高程与能力条件由接受状态另给</text><line x1="255" y1="248" x2="360" y2="258" class="flow" marker-end="url(#arrow-05-diversion)"/><line x1="520" y1="235" x2="655" y2="212" class="flow" marker-end="url(#arrow-05-diversion)"/><line x1="570" y1="326" x2="710" y2="328" class="flow" marker-end="url(#arrow-05-diversion)"/><text x="120" y="430" class="label" text-anchor="start">两条支路引用同一供体，不复制来水</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  原河与新渠共用有限来水</text><text x="42" y="575" class="note" text-anchor="start">不能原河保留完整旧Q，新渠再得同一份；边界通量只记一次。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M100 280Q280 200 430 280Q600 380 840 300" class="widewater" /><path d="M430 280Q600 185 840 205" class="widewater" /><text x="100" y="150" class="small" text-anchor="start">平面示意；高程与能力条件由接受状态另给</text><path d="M475 302Q525 326 565 333" class="ghost" /><text x="535" y="420" class="small" text-anchor="start">旧槽已有水仍在原位</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  旧槽残水保留原位置</text><text x="42" y="575" class="note" text-anchor="start">孤立潭和剩余通路继续蒸渗或排出，不改名就清空或瞬移库存。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M100 280Q280 200 430 280Q600 380 840 300" class="widewater" /><path d="M430 280Q600 185 840 205" class="widewater" /><text x="100" y="150" class="small" text-anchor="start">平面示意；高程与能力条件由接受状态另给</text><line x1="680" y1="210" x2="560" y2="225" class="flow" marker-end="url(#arrow-05-diversion)"/><text x="125" y="435" class="label" text-anchor="start">箭头只表示相应真实水态可支持的方向</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  回水可使交换减弱或反向</text><text x="42" y="575" class="note" text-anchor="start">流向消费当前水态，不把所有新路强制为永久单向树。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><text x="110" y="170" class="label" text-anchor="start">实际材料—水沙—床岸反馈继续，工程不冻结断面</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  新渠床岸仍受真实水沙反馈</text><text x="42" y="575" class="note" text-anchor="start">冲淤、侧蚀和塌落改变当前几何与材料，不永久锁死施工模板。</text></g></svg>
