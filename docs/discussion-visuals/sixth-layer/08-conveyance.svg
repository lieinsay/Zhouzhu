<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-08-conveyance desc-08-conveyance" data-chapter="08-conveyance"><title id="title-08-conveyance">井管泵的有限接入</title><desc id="desc-08-conveyance">这里只定义接入已有水系的边界，不展开第七层用水玩法。 入口与出口都引用真实接受状态：井、管、涵洞有实际供体、受体和空间，不从设备名生成固定供水。；通路自身也有储量和有限能力：接通不等于满管，干路径、阻力和时间不能略去。；向高处提升需实际技术和机械功：只在世界设备能力成立时支持，不默认已有任何泵具或无限动力。；供体不足时不能继续凭额定量出水：盐沙各随真实迁移和适用过程，不在出口自动变淡或穿过全部拦截。；超出当前能力的工况明确未支持：不按标签自动跨山虹吸；具体技术、模型与饮用灌溉消耗留后续。。第六层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-08-conveyance" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">08 / 井管泵的有限接入</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="205" width="255" height="100" rx="9" class="active"/><text x="207.5" y="237" class="label" text-anchor="middle">实际供体</text><text x="207.5" y="266" class="small" text-anchor="middle">已有水 / 水势</text><rect x="375" y="205" width="190" height="100" rx="9" class="card"/><text x="470" y="237" class="label" text-anchor="middle">真实通路</text><text x="470" y="266" class="small" text-anchor="middle">储量 / 能力</text><rect x="605" y="205" width="255" height="100" rx="9" class="active"/><text x="732.5" y="237" class="label" text-anchor="middle">实际受体</text><text x="732.5" y="266" class="small" text-anchor="middle">可用空间</text><line x1="345" y1="252" x2="365" y2="252" class="flow" marker-end="url(#arrow-08-conveyance)"/><line x1="575" y1="252" x2="595" y2="252" class="flow" marker-end="url(#arrow-08-conveyance)"/><text x="130" y="427" class="small" text-anchor="start">取水点不是新水源，三者在同一预算内</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  入口与出口都引用真实接受状态</text><text x="42" y="575" class="note" text-anchor="start">井、管、涵洞有实际供体、受体和空间，不从设备名生成固定供水。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="205" width="255" height="100" rx="9" class="active"/><text x="207.5" y="237" class="label" text-anchor="middle">实际供体</text><text x="207.5" y="266" class="small" text-anchor="middle">已有水 / 水势</text><rect x="375" y="205" width="190" height="100" rx="9" class="card"/><text x="470" y="237" class="label" text-anchor="middle">真实通路</text><text x="470" y="266" class="small" text-anchor="middle">储量 / 能力</text><rect x="605" y="205" width="255" height="100" rx="9" class="active"/><text x="732.5" y="237" class="label" text-anchor="middle">实际受体</text><text x="732.5" y="266" class="small" text-anchor="middle">可用空间</text><line x1="345" y1="252" x2="365" y2="252" class="flow" marker-end="url(#arrow-08-conveyance)"/><line x1="575" y1="252" x2="595" y2="252" class="flow" marker-end="url(#arrow-08-conveyance)"/><text x="130" y="427" class="small" text-anchor="start">真实到达时间，不使用瞬时传送</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  通路自身也有储量和有限能力</text><text x="42" y="575" class="note" text-anchor="start">接通不等于满管，干路径、阻力和时间不能略去。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="205" width="255" height="100" rx="9" class="active"/><text x="207.5" y="237" class="label" text-anchor="middle">实际供体</text><text x="207.5" y="266" class="small" text-anchor="middle">已有水 / 水势</text><rect x="375" y="205" width="190" height="100" rx="9" class="card"/><text x="470" y="237" class="label" text-anchor="middle">真实通路</text><text x="470" y="266" class="small" text-anchor="middle">储量 / 能力</text><rect x="605" y="205" width="255" height="100" rx="9" class="active"/><text x="732.5" y="237" class="label" text-anchor="middle">实际受体</text><text x="732.5" y="266" class="small" text-anchor="middle">可用空间</text><line x1="345" y1="252" x2="365" y2="252" class="flow" marker-end="url(#arrow-08-conveyance)"/><line x1="575" y1="252" x2="595" y2="252" class="flow" marker-end="url(#arrow-08-conveyance)"/><rect x="300" y="365" width="340" height="80" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">有限机械功与相容设备</text><text x="470" y="426" class="small" text-anchor="middle">技术和动力成立才支持</text><line x1="470" y1="360" x2="470" y2="315" class="event" marker-end="url(#arrow-08-conveyance)"/><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  向高处提升需实际技术和机械功</text><text x="42" y="575" class="note" text-anchor="start">只在世界设备能力成立时支持，不默认已有任何泵具或无限动力。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="205" width="255" height="100" rx="9" class="active"/><text x="207.5" y="237" class="label" text-anchor="middle">实际供体</text><text x="207.5" y="266" class="small" text-anchor="middle">已有水 / 水势</text><rect x="375" y="205" width="190" height="100" rx="9" class="card"/><text x="470" y="237" class="label" text-anchor="middle">真实通路</text><text x="470" y="266" class="small" text-anchor="middle">储量 / 能力</text><rect x="605" y="205" width="255" height="100" rx="9" class="active"/><text x="732.5" y="237" class="label" text-anchor="middle">实际受体</text><text x="732.5" y="266" class="small" text-anchor="middle">可用空间</text><line x1="345" y1="252" x2="365" y2="252" class="flow" marker-end="url(#arrow-08-conveyance)"/><line x1="575" y1="252" x2="595" y2="252" class="flow" marker-end="url(#arrow-08-conveyance)"/><text x="130" y="427" class="small" text-anchor="start">不足时降低或停止实际输送，不复制水</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  供体不足时不能继续凭额定量出水</text><text x="42" y="575" class="note" text-anchor="start">盐沙各随真实迁移和适用过程，不在出口自动变淡或穿过全部拦截。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="205" width="255" height="100" rx="9" class="active"/><text x="207.5" y="237" class="label" text-anchor="middle">实际供体</text><text x="207.5" y="266" class="small" text-anchor="middle">已有水 / 水势</text><rect x="375" y="205" width="190" height="100" rx="9" class="card"/><text x="470" y="237" class="label" text-anchor="middle">真实通路</text><text x="470" y="266" class="small" text-anchor="middle">储量 / 能力</text><rect x="605" y="205" width="255" height="100" rx="9" class="active"/><text x="732.5" y="237" class="label" text-anchor="middle">实际受体</text><text x="732.5" y="266" class="small" text-anchor="middle">可用空间</text><line x1="345" y1="252" x2="365" y2="252" class="flow" marker-end="url(#arrow-08-conveyance)"/><line x1="575" y1="252" x2="595" y2="252" class="flow" marker-end="url(#arrow-08-conveyance)"/><text x="130" y="427" class="small" text-anchor="start">本层仅确定接口责任，不安装设备或实现管网</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  超出当前能力的工况明确未支持</text><text x="42" y="575" class="note" text-anchor="start">不按标签自动跨山虹吸；具体技术、模型与饮用灌溉消耗留后续。</text></g></svg>
