<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-07-groundwater desc-07-groundwater" data-chapter="07-groundwater"><title id="title-07-groundwater">地下接触与原储量</title><desc id="desc-07-groundwater">挖坑改变接触与空间，不能把岩石承压或新孔隙当供水。 坑的空间与含水带的接触分开：低于某个摘要水位不保证涌水，真实层界、孔隙与路径决定能否交换。；新空间由原储量与真实补给充水：有水进入就有对应供体变化，地下新容积不自动满水。；回填压密排挤原有孔隙水：储水空间与水反力相容，水沿真实路径有限排出，不能删水。；封闭通路仍保留两侧原库存：关闭的是相应交换，不是同时排干两侧；其他实际通路可继续。；固态岩层压力不是地下水水头：骨架缝隙不自动导水，有限岩层更新不因挖一格变成无限泉源。。第六层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-07-groundwater" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">07 / 地下接触与原储量</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="220" width="780" height="250" rx="9" class="rock"/><line x1="80" y1="275" x2="860" y2="275" class="layer" /><line x1="80" y1="410" x2="860" y2="410" class="layer" /><rect x="115" y="305" width="270" height="80" rx="9" class="watercard"/><text x="250" y="337" class="label" text-anchor="middle">实际含水域</text><text x="250" y="366" class="small" text-anchor="middle">原库存 / 水头</text><rect x="560" y="305" width="270" height="80" rx="9" class="watercard"/><text x="695" y="337" class="label" text-anchor="middle">坑 / 相邻域</text><text x="695" y="366" class="small" text-anchor="middle">原状态 / 有限空间</text><line x1="405" y1="345" x2="540" y2="345" class="ghost" /><text x="110" y="170" class="small" text-anchor="start">空间与接触，不由距离或岩性名称决定</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  坑的空间与含水带的接触分开</text><text x="42" y="575" class="note" text-anchor="start">低于某个摘要水位不保证涌水，真实层界、孔隙与路径决定能否交换。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="220" width="780" height="250" rx="9" class="rock"/><line x1="80" y1="275" x2="860" y2="275" class="layer" /><line x1="80" y1="410" x2="860" y2="410" class="layer" /><rect x="115" y="305" width="270" height="80" rx="9" class="watercard"/><text x="250" y="337" class="label" text-anchor="middle">实际含水域</text><text x="250" y="366" class="small" text-anchor="middle">原库存 / 水头</text><rect x="560" y="305" width="270" height="80" rx="9" class="watercard"/><text x="695" y="337" class="label" text-anchor="middle">坑 / 相邻域</text><text x="695" y="366" class="small" text-anchor="middle">原状态 / 有限空间</text><line x1="405" y1="345" x2="540" y2="345" class="ghost" /><line x1="405" y1="345" x2="540" y2="345" class="flow" marker-end="url(#arrow-07-groundwater)"/><text x="110" y="170" class="small" text-anchor="start">实际供体扣，受体加，充水需要经过时间</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  新空间由原储量与真实补给充水</text><text x="42" y="575" class="note" text-anchor="start">有水进入就有对应供体变化，地下新容积不自动满水。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="220" width="780" height="250" rx="9" class="rock"/><line x1="80" y1="275" x2="860" y2="275" class="layer" /><line x1="80" y1="410" x2="860" y2="410" class="layer" /><rect x="115" y="305" width="270" height="80" rx="9" class="watercard"/><text x="250" y="337" class="label" text-anchor="middle">实际含水域</text><text x="250" y="366" class="small" text-anchor="middle">原库存 / 水头</text><rect x="560" y="305" width="270" height="80" rx="9" class="watercard"/><text x="695" y="337" class="label" text-anchor="middle">坑 / 相邻域</text><text x="695" y="366" class="small" text-anchor="middle">原状态 / 有限空间</text><line x1="405" y1="345" x2="540" y2="345" class="ghost" /><line x1="405" y1="345" x2="540" y2="345" class="flow" marker-end="url(#arrow-07-groundwater)"/><text x="110" y="170" class="small" text-anchor="start">移动孔隙与相对渗流共同处理</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  回填压密排挤原有孔隙水</text><text x="42" y="575" class="note" text-anchor="start">储水空间与水反力相容，水沿真实路径有限排出，不能删水。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="220" width="780" height="250" rx="9" class="rock"/><line x1="80" y1="275" x2="860" y2="275" class="layer" /><line x1="80" y1="410" x2="860" y2="410" class="layer" /><rect x="115" y="305" width="270" height="80" rx="9" class="watercard"/><text x="250" y="337" class="label" text-anchor="middle">实际含水域</text><text x="250" y="366" class="small" text-anchor="middle">原库存 / 水头</text><rect x="560" y="305" width="270" height="80" rx="9" class="watercard"/><text x="695" y="337" class="label" text-anchor="middle">坑 / 相邻域</text><text x="695" y="366" class="small" text-anchor="middle">原状态 / 有限空间</text><line x1="405" y1="345" x2="540" y2="345" class="ghost" /><line x1="460" y1="335" x2="480" y2="355" class="bad" /><line x1="460" y1="355" x2="480" y2="335" class="bad" /><text x="110" y="170" class="small" text-anchor="start">封路后两侧库存与各自水头仍存在</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  封闭通路仍保留两侧原库存</text><text x="42" y="575" class="note" text-anchor="start">关闭的是相应交换，不是同时排干两侧；其他实际通路可继续。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="220" width="780" height="250" rx="9" class="rock"/><line x1="80" y1="275" x2="860" y2="275" class="layer" /><line x1="80" y1="410" x2="860" y2="410" class="layer" /><rect x="115" y="305" width="270" height="80" rx="9" class="watercard"/><text x="250" y="337" class="label" text-anchor="middle">实际含水域</text><text x="250" y="366" class="small" text-anchor="middle">原库存 / 水头</text><rect x="560" y="305" width="270" height="80" rx="9" class="watercard"/><text x="695" y="337" class="label" text-anchor="middle">坑 / 相邻域</text><text x="695" y="366" class="small" text-anchor="middle">原状态 / 有限空间</text><text x="110" y="170" class="small" text-anchor="start">固态约束与水相压力是不同状态</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  固态岩层压力不是地下水水头</text><text x="42" y="575" class="note" text-anchor="start">骨架缝隙不自动导水，有限岩层更新不因挖一格变成无限泉源。</text></g></svg>
