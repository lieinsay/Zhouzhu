<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-10-history-review desc-10-history-review" data-chapter="10-history-review"><title id="title-10-history-review">版本、恢复与验收</title><desc id="desc-10-history-review">已完成的材料、水与时间保留历史，恢复外形不是撤销整个世界。 自然源、当前状态与工程历史分开：当前冲淤或形变与玩家材料共同演化，不在新自然地形上再叠一份永久挖填。；一个接受进度保存相关库存：工程、背包/堆料、水盐沙和时间相容；中断重试不重复发料或推进。；旧数据错位或损坏要保留恢复证据：不静默清空营造，不拿新容量补满旧渠；本轮不执行迁移。；已发生排水后，回填是新施工：只有未接受预览可无影响取消；恢复外形不倒退水沙和已过时间。；验收既看账，也看路径与实际过程：原47米问题仍未验证；第六层设计已确认，参数与实现另待授权。。第六层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-10-history-review" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">10 / 版本、恢复与验收</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="90" y="185" width="235" height="115" rx="9" class="card"/><text x="207.5" y="217" class="label" text-anchor="middle">自然源与来源</text><text x="207.5" y="246" class="small" text-anchor="middle">初始事实</text><rect x="355" y="185" width="235" height="115" rx="9" class="active"/><text x="472.5" y="217" class="label" text-anchor="middle">当前实体 / 水态</text><text x="472.5" y="246" class="small" text-anchor="middle">实际演化</text><rect x="620" y="185" width="235" height="115" rx="9" class="card"/><text x="737.5" y="217" class="label" text-anchor="middle">工程历史</text><text x="737.5" y="246" class="small" text-anchor="middle">真实已完成过程</text><text x="125" y="420" class="label" text-anchor="start">旧高差不让已经冲走的同一堤料重新长回</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  自然源、当前状态与工程历史分开</text><text x="42" y="575" class="note" text-anchor="start">当前冲淤或形变与玩家材料共同演化，不在新自然地形上再叠一份永久挖填。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="140" y="185" width="660" height="115" rx="9" class="active"/><text x="470" y="217" class="label" text-anchor="middle">同一接受进度的保存边界</text><text x="470" y="246" class="small" text-anchor="middle">几何 / 工料 / 水盐沙 / 过程时间</text><text x="135" y="420" class="label" text-anchor="start">普通工料与真实水态成对核对，开发自由情景单列</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  一个接受进度保存相关库存</text><text x="42" y="575" class="note" text-anchor="start">工程、背包/堆料、水盐沙和时间相容；中断重试不重复发料或推进。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="140" y="185" width="660" height="115" rx="9" class="active"/><text x="470" y="217" class="label" text-anchor="middle">冲突 / 缺项 / 恢复路径</text><text x="470" y="246" class="small" text-anchor="middle">几何 / 工料 / 水盐沙 / 过程时间</text><text x="135" y="420" class="label" text-anchor="start">旧原件保留，显式审阅后才谈转换</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  旧数据错位或损坏要保留恢复证据</text><text x="42" y="575" class="note" text-anchor="start">不静默清空营造，不拿新容量补满旧渠；本轮不执行迁移。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="100" y="185" width="285" height="110" rx="9" class="active"/><text x="242.5" y="217" class="label" text-anchor="middle">已接受的排水历史</text><text x="242.5" y="246" class="small" text-anchor="middle">水已经实际迁移</text><line x1="400" y1="240" x2="540" y2="240" class="flow" marker-end="url(#arrow-10-history-review)"/><rect x="555" y="185" width="285" height="110" rx="9" class="candidate"/><text x="697.5" y="217" class="label" text-anchor="middle">新的回填 / 拆除</text><text x="697.5" y="246" class="small" text-anchor="middle">新材料与新的响应</text><text x="145" y="420" class="label" text-anchor="start">不回滚库存、时间或自然过程来假装从未施工</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  已发生排水后，回填是新施工</text><text x="42" y="575" class="note" text-anchor="start">只有未接受预览可无影响取消；恢复外形不倒退水沙和已过时间。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="140" y="185" width="660" height="115" rx="9" class="active"/><text x="470" y="217" class="label" text-anchor="middle">真实路径 + 局地库存 + 时长 + 物料</text><text x="470" y="246" class="small" text-anchor="middle">前五层设计保持；本轮仅说明材料</text><text x="135" y="420" class="label" text-anchor="start">普通工料与真实水态成对核对，开发自由情景单列</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  验收既看账，也看路径与实际过程</text><text x="42" y="575" class="note" text-anchor="start">原47米问题仍未验证；第六层设计已确认，参数与实现另待授权。</text></g></svg>
