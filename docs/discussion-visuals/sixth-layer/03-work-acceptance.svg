<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-03-work-acceptance desc-03-work-acceptance" data-chapter="03-work-acceptance"><title id="title-03-work-acceptance">分段施工与相容接受</title><desc id="desc-03-work-acceptance">物理区间内共同更新，不能先接受塞不下原水的终态。 预览不扣料、不改地、不灌水：已有数据只能支持相应预测或范围；未知不画成保证满水的蓝沟。；实际完成工量提出候选变化：定位真实作业面、供受体和施工方法，不按数值迭代重复挖掘。；移动边界与原水在同区间响应：有限迁移、孔隙与反力共同核对；不另设没有物理空间的待处理水库。；几何、水态和工料相容才发布：显示、碰撞、查询和物料回执对应真实已完成增量，迟到旧结果不能覆盖。；取消预览与回填已完成工程不同：施工后水沙已经搬运，恢复外形也是新的过程；重试不重复奖励或计时。。第六层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-03-work-acceptance" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">03 / 分段施工与相容接受</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="90" y="185" width="255" height="115" rx="9" class="active"/><text x="217.5" y="217" class="label" text-anchor="middle">已接受t0</text><text x="217.5" y="246" class="small" text-anchor="middle">原几何 / 原库存</text><rect x="585" y="185" width="255" height="115" rx="9" class="candidate"/><text x="712.5" y="217" class="label" text-anchor="middle">候选施工</text><text x="712.5" y="246" class="small" text-anchor="middle">工料 / 水态 / 版本</text><line x1="360" y1="245" x2="570" y2="245" class="event" marker-end="url(#arrow-03-work-acceptance)"/><rect x="245" y="365" width="450" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">不改变事实的预览</text><text x="470" y="426" class="small" text-anchor="middle">过程图不指定求解器或施工工时</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  预览不扣料、不改地、不灌水</text><text x="42" y="575" class="note" text-anchor="start">已有数据只能支持相应预测或范围；未知不画成保证满水的蓝沟。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="90" y="185" width="255" height="115" rx="9" class="active"/><text x="217.5" y="217" class="label" text-anchor="middle">已接受t0</text><text x="217.5" y="246" class="small" text-anchor="middle">原几何 / 原库存</text><rect x="585" y="185" width="255" height="115" rx="9" class="candidate"/><text x="712.5" y="217" class="label" text-anchor="middle">候选施工</text><text x="712.5" y="246" class="small" text-anchor="middle">工料 / 水态 / 版本</text><line x1="360" y1="245" x2="570" y2="245" class="event" marker-end="url(#arrow-03-work-acceptance)"/><rect x="245" y="365" width="450" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">有时长的实际施工增量</text><text x="470" y="426" class="small" text-anchor="middle">过程图不指定求解器或施工工时</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  实际完成工量提出候选变化</text><text x="42" y="575" class="note" text-anchor="start">定位真实作业面、供受体和施工方法，不按数值迭代重复挖掘。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="90" y="185" width="255" height="115" rx="9" class="active"/><text x="217.5" y="217" class="label" text-anchor="middle">已接受t0</text><text x="217.5" y="246" class="small" text-anchor="middle">原几何 / 原库存</text><rect x="585" y="185" width="255" height="115" rx="9" class="candidate"/><text x="712.5" y="217" class="label" text-anchor="middle">候选施工</text><text x="712.5" y="246" class="small" text-anchor="middle">工料 / 水态 / 版本</text><line x1="360" y1="245" x2="570" y2="245" class="event" marker-end="url(#arrow-03-work-acceptance)"/><rect x="245" y="365" width="450" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">真实空间与水反力相容</text><text x="470" y="426" class="small" text-anchor="middle">过程图不指定求解器或施工工时</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  移动边界与原水在同区间响应</text><text x="42" y="575" class="note" text-anchor="start">有限迁移、孔隙与反力共同核对；不另设没有物理空间的待处理水库。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="90" y="185" width="255" height="115" rx="9" class="active"/><text x="217.5" y="217" class="label" text-anchor="middle">已接受t0</text><text x="217.5" y="246" class="small" text-anchor="middle">原几何 / 原库存</text><rect x="585" y="185" width="255" height="115" rx="9" class="active"/><text x="712.5" y="217" class="label" text-anchor="middle">相容接受t1</text><text x="712.5" y="246" class="small" text-anchor="middle">工料 / 水态 / 版本</text><line x1="360" y1="245" x2="570" y2="245" class="event" marker-end="url(#arrow-03-work-acceptance)"/><rect x="245" y="365" width="450" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">一个接受边界共同发布</text><text x="470" y="426" class="small" text-anchor="middle">过程图不指定求解器或施工工时</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  几何、水态和工料相容才发布</text><text x="42" y="575" class="note" text-anchor="start">显示、碰撞、查询和物料回执对应真实已完成增量，迟到旧结果不能覆盖。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="90" y="185" width="255" height="115" rx="9" class="active"/><text x="217.5" y="217" class="label" text-anchor="middle">已接受t0</text><text x="217.5" y="246" class="small" text-anchor="middle">原几何 / 原库存</text><rect x="585" y="185" width="255" height="115" rx="9" class="active"/><text x="712.5" y="217" class="label" text-anchor="middle">相容接受t1</text><text x="712.5" y="246" class="small" text-anchor="middle">工料 / 水态 / 版本</text><line x1="360" y1="245" x2="570" y2="245" class="event" marker-end="url(#arrow-03-work-acceptance)"/><rect x="245" y="365" width="450" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">新回填不倒退已经经过的历史</text><text x="470" y="426" class="small" text-anchor="middle">过程图不指定求解器或施工工时</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  取消预览与回填已完成工程不同</text><text x="42" y="575" class="note" text-anchor="start">施工后水沙已经搬运，恢复外形也是新的过程；重试不重复奖励或计时。</text></g></svg>
