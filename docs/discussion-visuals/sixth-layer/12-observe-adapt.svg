<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-12-observe-adapt desc-12-observe-adapt" data-chapter="12-observe-adapt"><title id="title-12-observe-adapt">观察、分段施工与复查</title><desc id="desc-12-observe-adapt">普通信息支持逐步判断；工程有效性沿真实时序与来水条件核对。 先定一个能观察的环境目标：看水线、高低、湿态与已知历程；区分现场线索、测量、估计和未知。；条件许可，先做干侧并保留土塞：分段施工与控制余地来自真实方法；不是附赠围护，也不是每次必做步骤。；实际切通后看有限到达与上下游：未完成部分按当前几何起作用；暂停施工不暂停水，不承诺切口就全线满流。；复查时记下来水、下游与经过时间：晴天自然退水不全算工程功劳；涨水也不自动等于失败，预测不是已经发生。；按结果调整、维护、缩小或停止：小试和回填都有真实材料与水态后果；不免费回滚，不强迫玩家反复试错。；既验守恒相容，也验可理解的改善：实际环境允许时，应有可辨认、可延续的效果与取舍；是否有趣以后再试玩验证。。第六层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-12-observe-adapt" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">12 / 观察、分段施工与复查</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="80" y="185" width="245" height="115" rx="9" class="active"/><text x="202.5" y="217" class="label" text-anchor="middle">现场与实际记录</text><text x="202.5" y="246" class="small" text-anchor="middle">水线 / 湿态 / 高低</text><line x1="337" y1="242" x2="359" y2="242" class="event" marker-end="url(#arrow-12-observe-adapt)"/><rect x="370" y="185" width="230" height="115" rx="9" class="card"/><text x="485" y="217" class="label" text-anchor="middle">具体环境目标</text><text x="485" y="246" class="small" text-anchor="middle">改善哪里、什么条件</text><line x1="612" y1="242" x2="634" y2="242" class="event" marker-end="url(#arrow-12-observe-adapt)"/><rect x="645" y="185" width="220" height="115" rx="9" class="card"/><text x="755" y="217" class="label" text-anchor="middle">可承担的规模</text><text x="755" y="246" class="small" text-anchor="middle">不要求全知预报</text><text x="125" y="420" class="label" text-anchor="start">普通流程看现场因果，不要求读求解日志</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  先定一个能观察的环境目标</text><text x="42" y="575" class="note" text-anchor="start">看水线、高低、湿态与已知历程；区分现场线索、测量、估计和未知。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M80 225L150 225L170 350L360 350L390 300L445 300L445 245L485 245L485 315L860 375L860 475L80 475Z" class="rock" /><path d="M158 275L170 350L360 350L390 300L445 300L445 275Z" class="water" /><line x1="158" y1="275" x2="445" y2="275" class="flow" /><text x="100" y="155" class="small" text-anchor="start">条件示例：先完成干侧沟，暂留最后控制点</text><text x="510" y="220" class="small" text-anchor="start">原土塞仍在</text><line x1="455" y1="235" x2="475" y2="255" class="bad" /><line x1="455" y1="255" x2="475" y2="235" class="bad" /><text x="600" y="435" class="small" text-anchor="start">不是无代价撤销试水</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  条件许可，先做干侧并保留土塞</text><text x="42" y="575" class="note" text-anchor="start">分段施工与控制余地来自真实方法；不是附赠围护，也不是每次必做步骤。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M80 225L150 225L170 350L360 350L390 300L445 300L445 325L485 325L485 315L860 375L860 475L80 475Z" class="rock" /><path d="M160.08 288L170 350L360 350L390 300L445 300L445 288Z" class="water" /><line x1="160.08" y1="288" x2="445" y2="288" class="flow" /><path d="M485 303L485 315L585 331L585 325L540 317Z" class="water" /><path d="M445 288Q475 289 485 306" class="flow" /><line x1="505" y1="315" x2="565" y2="323" class="flow" marker-end="url(#arrow-12-observe-adapt)"/><text x="100" y="155" class="small" text-anchor="start">条件示例：完成切口，来水沿真实通路有限到达</text><text x="605" y="280" class="small" text-anchor="start">继续观察未到水区</text><text x="605" y="435" class="small" text-anchor="start">同时核对原下游与岸地</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  实际切通后看有限到达与上下游</text><text x="42" y="575" class="note" text-anchor="start">未完成部分按当前几何起作用；暂停施工不暂停水，不承诺切口就全线满流。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="80" y="185" width="245" height="110" rx="9" class="watercard"/><text x="202.5" y="217" class="label" text-anchor="middle">对应来水历程</text><text x="202.5" y="246" class="small" text-anchor="middle">天气 / 供水 / 储量</text><rect x="350" y="185" width="245" height="110" rx="9" class="card"/><text x="472.5" y="217" class="label" text-anchor="middle">相应施工阶段</text><text x="472.5" y="246" class="small" text-anchor="middle">实际开口与控制</text><rect x="620" y="185" width="245" height="110" rx="9" class="card"/><text x="742.5" y="217" class="label" text-anchor="middle">下游与经过时间</text><text x="742.5" y="246" class="small" text-anchor="middle">回水 / 到达 / 退水</text><rect x="235" y="365" width="470" height="85" rx="9" class="active"/><text x="470" y="397" class="label" text-anchor="middle">在相应条件下解释环境变化</text><text x="470" y="426" class="small" text-anchor="middle">不拿两张不同水情图直接判成败</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  复查时记下来水、下游与经过时间</text><text x="42" y="575" class="note" text-anchor="start">晴天自然退水不全算工程功劳；涨水也不自动等于失败，预测不是已经发生。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="310" y="130" width="320" height="85" rx="9" class="active"/><text x="470" y="162" class="label" text-anchor="middle">观察实际结果与代价</text><text x="470" y="191" class="small" text-anchor="middle">包括上下游和地下</text><line x1="360" y1="230" x2="250" y2="287" class="event" marker-end="url(#arrow-12-observe-adapt)"/><line x1="580" y1="230" x2="690" y2="287" class="event" marker-end="url(#arrow-12-observe-adapt)"/><rect x="85" y="305" width="320" height="90" rx="9" class="candidate"/><text x="245" y="337" class="label" text-anchor="middle">继续 / 调整 / 维护</text><text x="245" y="366" class="small" text-anchor="middle">有来源的实际新过程</text><rect x="535" y="305" width="320" height="90" rx="9" class="candidate"/><text x="695" y="337" class="label" text-anchor="middle">缩小 / 改址 / 停止</text><text x="695" y="366" class="small" text-anchor="middle">保留已发生水沙历史</text><text x="470" y="461" class="small" text-anchor="middle">初步响应、来水事件、长期变化沿同一世界时钟</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  按结果调整、维护、缩小或停止</text><text x="42" y="575" class="note" text-anchor="start">小试和回填都有真实材料与水态后果；不免费回滚，不强迫玩家反复试错。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="85" y="175" width="350" height="115" rx="9" class="active"/><text x="260" y="207" class="label" text-anchor="middle">物理与数据验收</text><text x="260" y="236" class="small" text-anchor="middle">路径 / 库存 / 时长 / 物料</text><rect x="505" y="175" width="350" height="115" rx="9" class="active"/><text x="680" y="207" class="label" text-anchor="middle">环境与工程反馈验收</text><text x="680" y="236" class="small" text-anchor="middle">改善 / 代价 / 可理解 / 保留</text><rect x="210" y="355" width="520" height="90" rx="9" class="card"/><text x="470" y="387" class="label" text-anchor="middle">合理有趣的土壤仍需以后真实交互检验</text><text x="470" y="416" class="small" text-anchor="middle">第六层已确认；第七层独立讨论</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  既验守恒相容，也验可理解的改善</text><text x="42" y="575" class="note" text-anchor="start">实际环境允许时，应有可辨认、可延续的效果与取舍；是否有趣以后再试玩验证。</text></g></svg>
