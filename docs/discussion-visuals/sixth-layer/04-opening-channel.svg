<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-04-opening-channel desc-04-opening-channel" data-chapter="04-opening-channel"><title id="title-04-opening-channel">挖沟、切口与有限到达</title><desc id="desc-04-opening-channel">低沟、真实切通和水已经到达，是三个不同事实。 低处有干沟，仍可能隔着土埂：完整路径控制点未切开，即使远端较低也不穿过屏障供水。；实际施工切通最后控制点：新空间不生成水，开口改变的是原水可达路径和有限能力。；水先占路径，湿润前沿有限推进：示意前沿只表示尚未全长到水；不是物理计算或几秒必达的承诺。；远端到水还受供水与损失限制：沿程储留、入渗和有限来源决定结果，不按新总容量瞬间灌满。；高程条件看全路，不只看两端：表面水不按玩家指定方向越高埂，承压路径另核对总水头与实际通路。。第六层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-04-opening-channel" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">04 / 挖沟、切口与有限到达</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 225L150 225L170 350L360 350L390 300L445 300L445 245L485 245L485 315L860 375L860 475L80 475Z" class="rock" /><path d="M158 275L170 350L360 350L390 300L445 300L445 275Z" class="water" /><line x1="158" y1="275" x2="445" y2="275" class="flow" /><text x="100" y="160" class="small" text-anchor="start">纵向因果示意：左侧原水，右侧新沟，非比例</text><line x1="455" y1="235" x2="475" y2="255" class="bad" /><line x1="455" y1="255" x2="475" y2="235" class="bad" /><text x="510" y="220" class="small" text-anchor="start">尚有高控制</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  低处有干沟，仍可能隔着土埂</text><text x="42" y="575" class="note" text-anchor="start">完整路径控制点未切开，即使远端较低也不穿过屏障供水。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 225L150 225L170 350L360 350L390 300L445 300L445 325L485 325L485 315L860 375L860 475L80 475Z" class="rock" /><path d="M158 275L170 350L360 350L390 300L445 300L445 275Z" class="water" /><line x1="158" y1="275" x2="445" y2="275" class="flow" /><text x="100" y="160" class="small" text-anchor="start">纵向因果示意：左侧原水，右侧新沟，非比例</text><text x="405" y="235" class="small" text-anchor="start">开口已改变</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  实际施工切通最后控制点</text><text x="42" y="575" class="note" text-a