"caption" text-anchor="start">4 / 5  远端到水还受供水与损失限制</text><text x="42" y="575" class="note" text-anchor="start">沿程储留、入渗和有限来源决定结果，不按新总容量瞬间灌满。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 225L150 225L170 350L360 350L390 300L445 300L445 245L485 245L485 315L860 375L860 475L80 475Z" class="rock" /><path d="M158 275L170 350L360 350L390 300L445 300L445 275Z" class="water" /><line x1="158" y1="275" x2="445" y2="275" class="flow" /><text x="100" y="160" class="small" text-anchor="start">纵向因果示意：左侧原水，右侧新沟，非比例</text><line x1="455" y1="235" x2="475" y2="255" class="bad" /><line x1="455" y1="255" x2="475" y2="235" class="bad" /><text x="510" y="220" class="small" text-anchor="start">尚有高控制</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  高程条件看全路，不只看两端</text><text x="42" y="575" class="note" text-anchor="start">表面水不按玩家指定方向越高埂，承压路径另核对总水头与实际通路。</text></g></svg>
