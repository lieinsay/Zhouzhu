<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-06-barriers-storage desc-06-barriers-storage" data-chapter="06-barriers-storage"><title id="title-06-barriers-storage">堵河、蓄排与维护</title><desc id="desc-06-barriers-storage">实体、接触和有限能力共同决定蓄排，墙名与碰撞不够。 阻水先核对实体与床岸接触：可以绕低岸、经实际孔隙或开口交换；普通墙门不自动成为密封坝闸。；实际来水可以逐步蓄积和顶托：水位与其他出口共同响应；原下游仍可有旧水，不能堵口一帧全干。；真实低口被淹后才有相应溢流：越顶、自由跌水或淹没出流按实际条件，不能满了瞬间排空。；开口或切低控制后有限排出：受上下游条件和能力限制，不能开闸一帧清空整湖。；贯通涵洞要有真实空间与接触：本图仅在明确存在开口时画通路；孔隙、涵洞和全不透水不混成一个标签。；清淤、冲毁与塌落都保留材料：清淤需搬走实际沉积，失效材料进入堆积或输运，不免费恢复原堤。。第六层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-06-barriers-storage" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">06 / 堵河、蓄排与维护</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 360L430 360L460 230L500 230L530 360L855 360L855 475L90 475Z" class="rock" /><path d="M90 300L90 360L430 360L443.84615384615387 300L443.84615384615387 300Z" class="water" /><line x1="90" y1="300" x2="443.84615384615387" y2="300" class="flow" /><path d="M527 345L530 360L855 360L855 345Z" class="water" /><line x1="527" y1="345" x2="855" y2="345" class="flow" /><text x="100" y="155" class="small" text-anchor="start">纵向阻水示意；来水、体积和流量未作计算</text><text x="580" y="405" class="small" text-anchor="start">原下游残水</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  阻水先核对实体与床岸接触</text><text x="42" y="575" class="note" text-anchor="start">可以绕低岸、经实际孔隙或开口交换；普通墙门不自动成为密封坝闸。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 360L430 360L460 230L500 230L530 360L855 360L855 475L90 475Z" class="rock" /><path d="M90 270L90 360L430 360L450.7692307692308 270L450.7692307692308 270Z" class="water" /><line x1="90" y1="270" x2="450.7692307692308" y2="270" class="flow" /><path d="M527 345L530 360L855 360L855 345Z" class="water" /><line x1="527" y1="345" x2="855" y2="345" class="flow" /><text x="100" y="155" class="small" text-anchor="start">纵向阻水示意；来水、体积和流量未作计算</text><line x1="145" y1="220" x2="145" y2="260" class="flow" marker-end="url(#arrow-06-barriers-storage)"/><text x="175" y="215" class="small" text-anchor="start">实际来水</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  实际来水可以逐步蓄积和顶托</text><text x="42" y="575" class="note" text-anchor="start">水位与其他出口共同响应；原下游仍可有旧水，不能堵口一帧全干。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 360L430 360L460 230L500 230L530 360L855 360L855 475L90 475Z" class="rock" /><path d="M90 220L90 360L430 360L460 230L460 220Z" class="water" /><line x1="90" y1="220" x2="460" y2="220" class="flow" /><path d="M527 345L530 360L855 360L855 345Z" class="water" /><line x1="527" y1="345" x2="855" y2="345" class="flow" /><path d="M455 220L505 220L505 230L455 230Z" class="water" /><path d="M500 225Q525 275 538 338" class="fall" /><text x="100" y="155" class="small" text-anchor="start">纵向阻水示意；来水、体积和流量未作计算</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  真实低口被淹后才有相应溢流</text><text x="42" y="575" class="note" text-anchor="start">越顶、自由跌水或淹没出流按实际条件，不能满了瞬间排空。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 360L430 360L460 310L500 310L530 360L855 360L855 475L90 475Z" class="rock" /><path d="M90 290L90 360L430 360L460 310L460 290Z" class="water" /><line x1="90" y1="290" x2="460" y2="290" class="flow" /><path d="M527 345L530 360L855 360L855 345Z" class="water" /><line x1="527" y1="345" x2="855" y2="345" class="flow" /><path d="M455 290L505 290L505 310L455 310Z" class="water" /><path d="M500 295Q525 305 538 338" class="fall" /><text x="100" y="155" class="small" text-anchor="start">纵向阻水示意；来水、体积和流量未作计算</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  开口或切低控制后有限排出</text><text x="42" y="575" class="note" text-anchor="start">受上下游条件和能力限制，不能开闸一帧清空整湖。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 360L430 360L460 230L500 230L530 360L855 360L855 475L90 475Z" class="rock" /><path d="M90 300L90 360L430 360L443.84615384615387 300L443.84615384615387 300Z" class="water" /><line x1="90" y1="300" x2="443.84615384615387" y2="300" class="flow" /><path d="M527 345L530 360L855 360L855 345Z" class="water" /><line x1="527" y1="345" x2="855" y2="345" class="flow" /><text x="100" y="155" class="small" text-anchor="start">纵向阻水示意；来水、体积和流量未作计算</text><rect x="425" y="330" width="110" height="20" rx="9" class="watercard"/><line x1="435" y1="340" x2="525" y2="340" class="flow" marker-end="url(#arrow-06-barriers-storage)"/><text x="580" y="295" class="small" text-anchor="start">此例有明确贯通涵洞</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  贯通涵洞要有真实空间与接触</text><text x="42" y="575" class="note" text-anchor="start">本图仅在明确存在开口时画通路；孔隙、涵洞和全不透水不混成一个标签。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="90" y="190" width="260" height="105" rx="9" class="active"/><text x="220" y="222" class="label" text-anchor="middle">工程 / 沉积材料</text><text x="220" y="251" class="small" text-anchor="middle">实际移除或冲毁</text><line x1="365" y1="243" x2="560" y2="243" class="flow" marker-end="url(#arrow-06-barriers-storage)"/><rect x="580" y="190" width="270" height="105" rx="9" class="active"/><text x="715" y="222" class="label" text-anchor="middle">工地 / 堆积 / 输运</text><text x="715" y="251" class="small" text-anchor="middle">材料有去向</text><text x="150" y="420" class="label" text-anchor="start">当前能力随实体改变，旧编辑高差不能让堤自动长回</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  清淤、冲毁与塌落都保留材料</text><text x="42" y="575" class="note" text-anchor="start">清淤需搬走实际沉积，失效材料进入堆积或输运，不免费恢复原堤。</text></g></svg>
