<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-02-earth-water desc-02-earth-water" data-chapter="02-earth-water"><title id="title-02-earth-water">土石、填筑与孔隙水</title><desc id="desc-02-earth-water">土方与原水都有去向，松方、实体和压实方不能直接混算。 挖掘从实际层序移除材料：土、颗粒、岩块与完整基岩分别有能力条件，不从固定土深标签编来源。；挖出材料进入真实工地去向：工地堆料、运输与填筑只转移一份材料，不能背包留着再长一份堤。；填筑体积要与材料和孔隙相容：质量、密度、松散与压实口径以后核定，不把旧一份料当任意体积。；湿土里的原孔隙水也要处理：随实际湿料保留或向真实通路排出；不能删水或原地下和背包各留一份。；普通作业与开发自由模式分开：作业面、工具和近距搬运有约束；开发无限料不作正常守恒与工时证据。。第六层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-02-earth-water" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">02 / 土石、填筑与孔隙水</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 235L850 235L850 465L90 465Z" class="rock" /><line x1="90" y1="290" x2="850" y2="290" class="layer" /><line x1="90" y1="370" x2="850" y2="370" class="layer" /><text x="120" y="175" class="label" text-anchor="start">源层序与材料决定可移除范围</text><text x="120" y="277" class="small" text-anchor="start">浅部材料</text><text x="120" y="355" class="small" text-anchor="start">下方实际岩层</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  挖掘从实际层序移除材料</text><text x="42" y="575" class="note" text-anchor="start">土、颗粒、岩块与完整基岩分别有能力条件，不从固定土深标签编来源。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="200" width="240" height="100" rx="9" class="active"/><text x="200" y="232" class="label" text-anchor="middle">原实体库存</text><text x="200" y="261" class="small" text-anchor="middle">实际移除</text><line x1="335" y1="250" x2="360" y2="250" class="flow" marker-end="url(#arrow-02-earth-water)"/><rect x="370" y="200" width="220" height="100" rx="9" class="active"/><text x="480" y="232" class="label" text-anchor="middle">工地物料</text><text x="480" y="261" class="small" text-anchor="middle">只转移一次</text><line x1="605" y1="250" x2="630" y2="250" class="flow" marker-end="url(#arrow-02-earth-water)"/><rect x="640" y="200" width="220" height="100" rx="9" class="active"/><text x="750" y="232" class="label" text-anchor="middle">新填筑实体</text><text x="750" y="261" class="small" text-anchor="middle">实际安放</text><text x="120" y="420" class="label" text-anchor="start">没有去向就不能一边挖走一边保留同一材料</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  挖出材料进入真实工地去向</text><text x="42" y="575" class="note" text-anchor="start">工地堆料、运输与填筑只转移一份材料，不能背包留着再长一份堤。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="200" width="240" height="100" rx="9" class="active"/><text x="200" y="232" class="label" text-anchor="middle">原实体库存</text><text x="200" y="261" class="small" text-anchor="middle">实际移除</text><line x1="335" y1="250" x2="360" y2="250" class="flow" marker-end="url(#arrow-02-earth-water)"/><rect x="370" y="200" width="220" height="100" rx="9" class="active"/><text x="480" y="232" class="label" text-anchor="middle">工地物料</text><text x="480" y="261" class="small" text-anchor="middle">只转移一次</text><line x1="605" y1="250" x2="630" y2="250" class="flow" marker-end="url(#arrow-02-earth-water)"/><rect x="640" y="200" width="220" height="100" rx="9" class="active"/><text x="750" y="232" class="label" text-anchor="middle">新填筑实体</text><text x="750" y="261" class="small" text-anchor="middle">实际安放</text><text x="120" y="420" class="label" text-anchor="start">实体体积还要区分密度、孔隙与压实</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  填筑体积要与材料和孔隙相容</text><text x="42" y="575" class="note" text-anchor="start">质量、密度、松散与压实口径以后核定，不把旧一份料当任意体积。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="90" y="190" width="285" height="105" rx="9" class="watercard"/><text x="232.5" y="222" class="label" text-anchor="middle">原M/G中的孔隙水</text><text x="232.5" y="251" class="small" text-anchor="middle">水本来就存在</text><line x1="390" y1="242" x2="540" y2="242" class="flow" marker-end="url(#arrow-02-earth-water)"/><rect x="560" y="190" width="285" height="105" rx="9" class="watercard"/><text x="702.5" y="222" class="label" text-anchor="middle">实际湿料或邻接水域</text><text x="702.5" y="251" class="small" text-anchor="middle">保留 / 有限排出</text><text x="130" y="418" class="label" text-anchor="start">移走材料不等于删水，也不新增一份背包水</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  湿土里的原孔隙水也要处理</text><text x="42" y="575" class="note" text-anchor="start">随实际湿料保留或向真实通路排出；不能删水或原地下和背包各留一份。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="100" y="190" width="315" height="110" rx="9" class="active"/><text x="257.5" y="222" class="label" text-anchor="middle">普通施工</text><text x="257.5" y="251" class="small" text-anchor="middle">可达 / 工量 / 物料</text><rect x="525" y="190" width="315" height="110" rx="9" class="candidate"/><text x="682.5" y="222" class="label" text-anchor="middle">开发自由情景</text><text x="682.5" y="251" class="small" text-anchor="middle">单列外部输入与覆盖</text><text x="150" y="420" class="label" text-anchor="start">长距离和大土方依赖真实运输，不强迫抱料走一公里</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  普通作业与开发自由模式分开</text><text x="42" y="575" class="note" text-anchor="start">作业面、工具和近距搬运有约束；开发无限料不作正常守恒与工时证据。</text></g></svg>
