<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-09-domains desc-09-domains" data-chapter="09-domains"><title id="title-09-domains">受影响域与远域边界</title><desc id="desc-09-domains">计算和显示可分级，物理影响不能在tile边上凭空结束。 影响范围看实际连接和控制点：小切口可影响远盆地，大填方也可能不接水；不固定笔刷外几格。；相邻域共用一个区间交换记录：边界位置、朝向和接受时间相容，供体扣受体加只计一次。；回水或改道到边界就更新耦合：扩大相应范围或明确未解析，不能钉旧水位/旧Q吸收全部变化。；卸载显示不复原工程或水态：远域保有完成工程、库存和驱动；回来不按初始日指数重新灌满。；等待与多子步仍需相容接受：不能一边扣水另一边失联，不设没有空间的等待水库，不要求全行星每格同细度。。第六层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-09-domains" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">09 / 受影响域与远域边界</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="190" width="250" height="110" rx="9" class="active"/><text x="205" y="222" class="label" text-anchor="middle">上游 / 地下</text><text x="205" y="251" class="small" text-anchor="middle">当前状态 / 边界时段</text><line x1="340" y1="244" x2="365" y2="244" class="flow" marker-end="url(#arrow-09-domains)"/><rect x="375" y="190" width="250" height="110" rx="9" class="active"/><text x="500" y="222" class="label" text-anchor="middle">局部工程域</text><text x="500" y="251" class="small" text-anchor="middle">当前状态 / 边界时段</text><line x1="635" y1="244" x2="660" y2="244" class="flow" marker-end="url(#arrow-09-domains)"/><rect x="670" y="190" width="250" height="110" rx="9" class="active"/><text x="795" y="222" class="label" text-anchor="middle">下游 / 盆地</text><text x="795" y="251" class="small" text-anchor="middle">当前状态 / 边界时段</text><rect x="235" y="365" width="470" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">实际物理依赖，不按显示格定范围</text><text x="470" y="426" class="small" text-anchor="middle">域框只表示职责，不给计算半径参数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  影响范围看实际连接和控制点</text><text x="42" y="575" class="note" text-anchor="start">小切口可影响远盆地，大填方也可能不接水；不固定笔刷外几格。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="190" width="250" height="110" rx="9" class="card"/><text x="205" y="222" clas