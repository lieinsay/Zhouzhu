90" width="250" height="110" rx="9" class="active"/><text x="795" y="222" class="label" text-anchor="middle">下游 / 盆地</text><text x="795" y="251" class="small" text-anchor="middle">当前状态 / 边界时段</text><rect x="235" y="365" width="470" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">边界也响应，不保留任意旧Q曲线</text><text x="470" y="426" class="small" text-anchor="middle">域框只表示职责，不给计算半径参数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  回水或改道到边界就更新耦合</text><text x="42" y="575" class="note" text-anchor="start">扩大相应范围或明确未解析，不能钉旧水位/旧Q吸收全部变化。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="190" width="250" height="110" rx="9" class="card"/><text x="205" y="222" class="label" text-anchor="middle">上游 / 地下</text><text x="205" y="251" class="small" text-anchor="middle">当前状态 / 边界时段</text><line x1="340" y1="244" x2="365" y2="244" class="flow" marker-end="url(#arrow-09-domains)"/><rect x="375" y="190" width="250" height="110" rx="9" class="card"/><text x="500" y="222" class="label" text-anchor="middle">局部工程域</text><text x="500" y="251" class="small" text-anchor="middle">当前状态 / 边界时段</text><line x1="635" y1="244" x2="660" y2="244" class="flow" marker-end="url(#arrow-09-domains)"/><rect x="670" y="190" width="250" height="110" rx="9" class="card"/><text x="795" y="222" class="label" text-anchor="middle">下游 / 盆地</text><text x="795" y="251" class="small" text-anchor="middle">当前状态 / 边界时段</text><rect x="235" y="365" width="470" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">显示驻留不等于物理状态存亡</text><text x="470" y="426" class="small" text-anchor="middle">按真实历程继续或相容补算</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  卸载显示不复原工程或水态</text><text x="42" y="575" class="note" text-anchor="start">远域保有完成工程、库存和驱动；回来不按初始日指数重新灌满。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="190" width="250" height="110" rx="9" class="card"/><text x="205" y="222" class="label" text-anchor="middle">上游 / 地下</text><text x="205" y="251" class="small" text-anchor="middle">当前状态 / 边界时段</text><line x1="340" y1="244" x2="365" y2="244" class="flow" marker-end="url(#arrow-09-domains)"/><rect x="375" y="190" width="250" height="110" rx="9" class="card"/><text x="500" y="222" class="label" text-anchor="middle">局部工程域</text><text x="500" y="251" class="small" text-anchor="middle">当前状态 / 边界时段</text><line x1="635" y1="244" x2="660" y2="244" class="flow" marker-end="url(#arrow-09-domains)"/><rect x="670" y="190" width="250" height="110" rx="9" class="card"/><text x="795" y="222" class="label" text-anchor="middle">下游 / 盆地</text><text x="795" y="251" class="small" text-anchor="middle">当前状态 / 边界时段</text><rect x="235" y="365" width="470" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">受影响连接域共同等待或相容简化</text><text x="470" y="426" class="small" text-anchor="middle">域框只表示职责，不给计算半径参数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  等待与多子步仍需相容接受</text><text x="42" y="575" class="note" text-anchor="start">不能一边扣水另一边失联，不设没有空间的等待水库，不要求全行星每格同细度。</text></g></svg>
