<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-11-environment-choices desc-11-environment-choices" data-chapter="11-environment-choices"><title id="title-11-environment-choices">自然环境与治水取舍</title><desc id="desc-11-environment-choices">先有真实水陆差异，再有工程选择；不按任务配额制造缺水或洪灾。 先有环境成因，再有是否治水的理由：地形、层序、真实来水与水沙共同形成差异；不是沿河放一排固定待修任务点。；当前有水、旱时可供和涨水分开：同一时钟下的来水与有限储留决定变化；不靠每日强制洪水制造需求。；排水要看低口、低地与真实接触：主槽通水不保证邻地能排；回水、土层湿态和地下接触需要分别辨认。；泥沙与岸料差异带来不同维护条件：选址、留沉积空间或清理均看实际来源；较稳定的工程也允许长期起作用。；蓄、排和分洪都要看受体与余量：本图是备选方向，不是复制同一份水；改善本地还需核对上游、下游与地下影响。；保留自然空间、缩小或改址也有效：不是每处都需要修，也不保证每处都能改好；有趣来自可理解的选择与实际后果。。第六层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-11-environment-choices" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">11 / 自然环境与治水取舍</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="75" y="185" width="245" height="105" rx="9" class="active"/><text x="197.5" y="217" class="label" text-anchor="middle">自然原因</text><text x="197.5" y="246" class="small" text-anchor="middle">地形 / 层序 / 来水</text><line x1="332" y1="238" x2="354" y2="238" class="event" marker-end="url(#arrow-11-environment-choices)"/><rect x="365" y="185" width="230" height="105" rx="9" class="active"/><text x="480" y="217" class="label" text-anchor="middle">真实水陆差异</text><text x="480" y="246" class="small" text-anchor="middle">通水 / 储留 / 湿态</text><line x1="607" y1="238" x2="629" y2="238" class="event" marker-end="url(#arrow-11-environment-choices)"/><rect x="640" y="185" width="225" height="105" rx="9" class="card"/><text x="752.5" y="217" class="label" text-anchor="middle">判断与选择</text><text x="752.5" y="246" class="small" text-anchor="middle">改造 / 保留</text><text x="120" y="420" class="label" text-anchor="start">不按每岛任务数补造水源、低口或待修工程</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  先有环境成因，再有是否治水的理由</text><text x="42" y="575" class="note" text-anchor="start">地形、层序、真实来水与水沙共同形成差异；不是沿河放一排固定待修任务点。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="80" y="190" width="245" height="105" rx="9" class="watercard"/><text x="202.5" y="222" class="label" text-anchor="middle">低水条件</text><text x="202.5" y="251" class="small" text-anchor="middle">可供库存与来水有限</text><rect x="350" y="190" width="245" height="105" rx="9" class="watercard"/><text x="472.5" y="222" class="label" text-anchor="middle">涨水条件</text><text x="472.5" y="251" class="small" text-anchor="middle">经过 / 储留 / 外排</text><rect x="620" y="190" width="245" height="105" rx="9" class="watercard"/><text x="742.5" y="222" class="label" text-anchor="middle">退水条件</text><text x="742.5" y="251" class="small" text-anchor="middle">表水与土水有过程</text><line x1="100" y1="360" x2="840" y2="360" class="event" /><text x="470" y="403" class="small" text-anchor="middle">同一实际历程；示意条件，不是每天必经的剧情</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  当前有水、旱时可供和涨水分开</text><text x="42" y="575" class="note" text-anchor="start">同一时钟下的来水与有限储留决定变化；不靠每日强制洪水制造需求。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M80 235L170 235L205 350L360 350L420 285L490 285L550 350L730 350L775 235L860 235L860 475L80 475Z" class="rock" /><path d="M194.35 315L205 350L360 350L392.31 315Z" class="water" /><path d="M503.85 300L550 350L730 350L749.57 300Z" class="water" /><line x1="194.35" y1="315" x2="392.31" y2="315" class="flow" /><line x1="503.85" y1="300" x2="749.57" y2="300" class="flow" /><text x="470" y="155" class="small" text-anchor="middle">纵剖条件示意：两侧此刻不以地表液水贯通</text><text x="260" y="205" class="small" text-anchor="middle">低地原有水</text><text x="670" y="205" class="small" text-anchor="middle">下游水体此刻较高</text><text x="455" y="255" class="small" text-anchor="middle">高控制点</text><line x1="250" y1="415" x2="750" y2="415" class="layer" /><text x="470" y="453" class="small" text-anchor="middle">高控制点与下游水位均需核对；地下接触另有依据</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  排水要看低口、低地与真实接触</text><text x="42" y="575" class="note" text-anchor="start">主槽通水不保证邻地能排；回水、土层湿态和地下接触需要分别辨认。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="75" y="185" width="245" height="110" rx="9" class="active"/><text x="197.5" y="217" class="label" text-anchor="middle">实际来沙与床岸料</text><text x="197.5" y="246" class="small" text-anchor="middle">来源有限 / 能力不同</text><line x1="333" y1="240" x2="355" y2="240" class="event" marker-end="url(#arrow-11-environment-choices)"/><rect x="365" y="185" width="235" height="110" rx="9" class="card"/><text x="482.5" y="217" class="label" text-anchor="middle">工程位置与开口</text><text x="482.5" y="246" class="small" text-anchor="middle">按条件冲刷或留积</text><line x1="613" y1="240" x2="635" y2="240" class="event" marker-end="url(#arrow-11-environment-choices)"/><rect x="645" y="185" width="220" height="110" rx="9" class="card"/><text x="755" y="217" class="label" text-anchor="middle">后续选择</text><text x="755" y="246" class="small" text-anchor="middle">护持 / 清理 / 保留</text><text x="130" y="418" class="label" text-anchor="start">不凭空长淤泥，不强迫每天坏堤来产生维护</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  泥沙与岸料差异带来不同维护条件</text><text x="42" y="575" class="note" text-anchor="start">选址、留沉积空间或清理均看实际来源；较稳定的工程也允许长期起作用。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="300" y="125" width="340" height="85" rx="9" class="active"/><text x="470" y="157" class="label" text-anchor="middle">同一现场与有限来水</text><text x="470" y="186" class="small" text-anchor="middle">先看目标和限制</text><line x1="350" y1="225" x2="235" y2="283" class="event" marker-end="url(#arrow-11-environment-choices)"/><line x1="590" y1="225" x2="705" y2="283" class="event" marker-end="url(#arrow-11-environment-choices)"/><rect x="80" y="300" width="320" height="90" rx="9" class="candidate"/><text x="240" y="332" class="label" text-anchor="middle">留水 / 相容蓄滞</text><text x="240" y="361" class="small" text-anchor="middle">占地、湿态、有限余量</text><rect x="540" y="300" width="320" height="90" rx="9" class="candidate"/><text x="700" y="332" class="label" text-anchor="middle">输送 / 疏通排放</text><text x="700" y="361" class="small" text-anchor="middle">水沙去处与下游条件</text><text x="470" y="455" class="small" text-anchor="middle">备选取舍，非同时分配结果；不预定最佳方案</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  蓄、排和分洪都要看受体与余量</text><text x="42" y="575" class="note" text-anchor="start">本图是备选方向，不是复制同一份水；改善本地还需核对上游、下游与地下影响。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M483 352 L540 410 L599 352Z" class="water" /><line x1="483" y1="352" x2="599" y2="352" class="flow" /><circle cx="155" cy="193" r="8" class="person"/><line x1="155" y1="202" x2="155" y2="225" class="person" /><line x1="155" y1="208" x2="141" y2="218" class="person" /><line x1="155" y1="208" x2="168" y2="216" class="person" /><line x1="155" y1="225" x2="145" y2="245" class="person" /><line x1="155" y1="225" x2="165" y2="245" class="person" /><text x="110" y="160" class="small" text-anchor="start">选择示意：按环境与目标决定是否施工</text><text x="260" y="215" class="small" text-anchor="start">可先观察或改址</text><text x="440" y="465" class="small" text-anchor="start">保留相容低地与真实水路</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  保留自然空间、缩小或改址也有效</text><text x="42" y="575" class="note" text-anchor="start">不是每处都需要修，也不保证每处都能改好；有趣来自可理解的选择与实际后果。</text></g></svg>
