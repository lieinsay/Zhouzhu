<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-05-habitat desc-05-habitat"><title id="title-05-habitat">环境连续性：地貌与气候</title><desc id="desc-05-habitat">本轮只定义物理环境背景；生态环境与生物演化由用户以后另行设计。。内陆保存区与活动谷地有地质成因：基底、层序、坡向和出口历史留下不同环境；盆地淤积可以转为平地，不等于整岛陆地清零。。高度、坡向与遮阴改变辐射和温度：同一次区域天气在不同地形产生不同响应；地形差异须实际保留，不磨平后再补微气候。。迎背风差异需要实际来流与水汽：山脊与谷地改变抬升、通风和输送；没有合适水汽来流，不凭山体标签生成降雨或雨影。。土水储留能缓冲短时变化，容量有限：含水层延迟部分径流，湖水有热储存；冷空气汇聚只在合适辐射、静风与凹地条件下发生。。长期背景保留，生物逻辑以后另做：区域气候、漂移、浮高和环境重叠有连续历史；不按岛龄重抽。第一层只交付物理环境与扰动记录。</desc><defs><marker id="arrow-05-habitat" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">06 / 环境连续性：地貌与气候</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="90" y="183" width="760" height="292" rx="22" class="rock"/><rect x="130" y="215" width="245" height="115" rx="18" class="strata"/><rect x="500" y="278" width="265" height="135" rx="18" class="strata"/><path d="M110 397 Q320 308 445 357 Q585 427 812 247" class="water" style="fill:none;stroke:#72bdd3;stroke-width:23"/><text x="161" y="260" class="label">保存区 A</text><text x="525" y="327" class="label">保存区 B</text><path d="M182 364 L260 348 L278 380 L218 396Z" class="fault" /><text x="137" y="442" class="label">局部活动带</text><text x="112" y="152" class="label">非比例环境示意；不判定物种是否适宜</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 5  内陆保存区与活动谷地有地质成因</text><text x="43" y="575" class="label">基底、层序、坡向和出口历史留下不同环境；盆地淤积可以转为平地，不等于整岛陆地清零。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M170 280 L270 254 L350 218 L430 240 L510 270 L595 265 L650 239 L760 280 Q690 365 535 415 Q465 450 393 413 Q245 360 170 280Z" class="rock" /><path d="M170 280 L270 254 L350 218 L430 240 L510 270 L595 265 L650 239 L760 280 L760 295 Q470 307 170 295Z" class="strata" /><path d="M293 345 Q468 302 643 345 Q468 388 293 345Z" class="core" /><path d="M232 316 Q466 364 706 317" class="layerline" /><text x="402" y="349" class="oncore">深埋骨架</text><circle cx="770" cy="166" r="24" class="magma"/><path d="M744 184 L650 234" class="gravity" marker-end="url(#arrow-05-habitat)"/><path d="M727 181 L485 260" class="gravity" marker-end="url(#arrow-05-habitat)"/><text x="98" y="153" class="label">太阳与大气 → 实际辐射 / 地形遮阴</text><text x="105" y="471" class="label">只示意来光方向；不指定永久冷暖或固定温度梯度</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 5  高度、坡向与遮阴改变辐射和温度</text><text x="43" y="575" class="label">同一次区域天气在不同地形产生不同响应；地形差异须实际保留，不磨平后再补微气候。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M155 270 L260 240 L350 168 L430 211 L510 253 L595 252 L650 213 L775 270 Q690 365 535 415 Q465 450 393 413 Q245 360 155 270Z" class="rock" /><path d="M155 270 L260 240 L350 168 L430 211 L510 253 L595 252 L650 213 L775 270 L775 285 Q470 307 155 285Z" class="strata" /><path d="M293 345 Q468 302 643 345 Q468 388 293 345Z" class="core" /><path d="M232 316 Q466 364 706 317" class="layerline" /><text x="402" y="349" class="oncore">深埋骨架</text><path d="M89 227 Q210 223 300 170 Q350 107 435 194" class="flow" marker-end="url(#arrow-05-habitat)"/><path d="M441 194 Q570 228 818 230" class="flow" marker-end="url(#arrow-05-habitat)"/><text x="95" y="148" class="label">示例来流，不代表此岛常年风向</text><text x="110" y="470" class="label">气候驱动与真实地形共同产生环境，不新增山体水源</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 5  迎背风差异需要实际来流与水汽</text><text x="43" y="575" class="label">山脊与谷地改变抬升、通风和输送；没有合适水汽来流，不凭山体标签生成降雨或雨影。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="65" y="209" width="235" height="185" rx="12" class="strata"/><text x="80" y="242" class="label">天气 / 同一段输入</text><rect x="350" y="209" width="245" height="185" rx="12" class="strata"/><text x="365" y="242" class="label">真实地形 / 水储留</text><rect x="645" y="209" width="235" height="185" rx="12" class="strata"/><text x="660" y="242" class="label">局地 / 不同响应</text><path d="M304 310 L343 310" class="flow" marker-end="url(#arrow-05-habitat)"/><path d="M600 310 L638 310" class="flow" marker-end="url(#arrow-05-habitat)"/><text x="106" y="463" class="label">不是永久湿润保证；不能抵消长期干旱或气候转型</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 5  土水储留能缓冲短时变化，容量有限</text><text x="43" y="575" class="label">含水层延迟部分径流，湖水有热储存；冷空气汇聚只在合适辐射、静风与凹地条件下发生。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="65" y="209" width="235" height="185" rx="12" class="strata"/><text x="80" y="242" class="label">位置 / 高度 / 层序</text><rect x="350" y="209" width="245" height="185" rx="12" class="strata"/><text x="365" y="242" class="label">气候 / 水文 / 地貌</text><rect x="645" y="209" width="235" height="185" rx="12" class="strata"/><text x="660" y="242" class="label">历史 / 后续独立设定</text><path d="M304 310 L343 310" class="flow" marker-end="url(#arrow-05-habitat)"/><path d="M600 310 L638 310" class="flow" marker-end="url(#arrow-05-habitat)"/><text x="105" y="462" class="label">微气候不保证亿年区域气候恒定；不计算物种适应或进化</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 5  长期背景保留，生物逻辑以后另做</text><text x="43" y="575" class="label">区域气候、漂移、浮高和环境重叠有连续历史；不按岛龄重抽。第一层只交付物理环境与扰动记录</text><text x="43" y="602" class="label">。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>