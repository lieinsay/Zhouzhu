<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-03-rock-soil desc-03-rock-soil"><title id="title-03-rock-soil">岩土保存：供应、起动与反应</title><desc id="desc-03-rock-soil">说明低损失的具体成因，余量只在最后验收；不是一亿年计算结果。。层序形成保存条件，不事后贴耐蚀壳：继承基底与硅质层可经胶结、真实热影响重结晶；互锁颗粒和低裂隙区来自历史，不规定所有岛同岩性。。脱离后不持续制造整岛新高差和裂隙：基准无地幔供料或固定相对隆升；整体浮高不是造山，碰撞与卸荷只能按实际历史局部重启。。完整岩体先释放材料，颗粒再满足起动：风化、裂隙与失稳产生实际材料；洪水、块体拔出和工具撞击分别核对，不把所有岩石当松土。。化学损失看矿物、界面与水交换：易反应矿物可先消耗，残余骨架反应较慢；新鲜面、饱和状态与真实裂隙通水限制通量，不设风化为零。。低剥蚀参照不能直接外推一亿年：石英岩可有很低的实测速率，但古老地表可能曾埋藏再出露；湿润空岛出口和底部还要单独检查。。余量用于验收，不作为保存原因：先用层序、供应、起动、反应及出口过程求累计损失，再检查陆地和承载；不能反过来定低侵蚀率。</desc><defs><marker id="arrow-03-rock-soil" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">03 / 岩土保存：供应、起动与反应</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M155 270 L260 240 L350 168 L430 211 L510 253 L595 252 L650 213 L775 270 Q690 365 535 415 Q465 450 393 413 Q245 360 155 270Z" class="rock" /><path d="M155 270 L260 240 L350 168 L430 211 L510 253 L595 252 L650 213 L775 270 L775 285 Q470 307 155 285Z" class="strata" /><path d="M293 345 Q468 302 643 345 Q468 388 293 345Z" class="core" /><path d="M232 316 Q466 364 706 317" class="layerline" /><text x="402" y="349" class="oncore">深埋骨架</text><path d="M230 315 Q468 346 710 315" class="layerline" style="stroke-width:8"/><text x="98" y="148" class="label">实际抗蚀层段：低反应性、互锁颗粒、非贯通节理</text><text x="103" y="471" class="label">强度、抗溶蚀、裂隙与渗透性分别描述</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 6  层序形成保存条件，不事后贴耐蚀壳</text><text x="43" y="575" class="label">继承基底与硅质层可经胶结、真实热影响重结晶；互锁颗粒和低裂隙区来自历史，不规定所有岛同</text><text x="43" y="602" class="label">岩性。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M170 280 L270 254 L350 218 L430 240 L510 270 L595 265 L650 239 L760 280 Q690 365 535 415 Q465 450 393 413 Q245 360 170 280Z" class="rock" /><path d="M170 280 L270 254 L350 218 L430 240 L510 270 L595 265 L650 239 L760 280 L760 295 Q470 307 170 295Z" class="strata" /><path d="M293 345 Q468 302 643 345 Q468 388 293 345Z" class="core" /><path d="M232 316 Q466 364 706 317" class="layerline" /><text x="402" y="349" class="oncore">深埋骨架</text><text x="108" y="148" class="label">新鲜岩面和松散材料的供应可以减缓</text><text x="110" y="472" class="label">不因岛龄直接调侵蚀倍率，也不每年重新造陡坡</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 6  脱离后不持续制造整岛新高差和裂隙</text><text x="43" y="575" class="label">基准无地幔供料或固定相对隆升；整体浮高不是造山，碰撞与卸荷只能按实际历史局部重启。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="65" y="208" width="235" height="189" rx="12" class="strata"/><text x="80" y="241" class="label">完整岩体 / 连接</text><rect x="350" y="208" width="245" height="189" rx="12" class="strata"/><text x="365" y="241" class="label">释放 / 真实颗粒</text><rect x="645" y="208" width="235" height="189" rx="12" class="strata"/><text x="660" y="241" class="label">起动 / 输运或残留</text><path d="M304 310 L343 310" class="flow" marker-end="url(#arrow-03-rock-soil)"/><path d="M600 310 L638 310" class="flow" marker-end="url(#arrow-03-rock-soil)"/><text x="101" y="466" class="label">粒径、坡度、有效水力和库存决定移出，不统一扣表层</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 6  完整岩体先释放材料，颗粒再满足起动</text><text x="43" y="575" class="label">风化、裂隙与失稳产生实际材料；洪水、块体拔出和工具撞击分别核对，不把所有岩石当松土。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M192 293 L280 270 L350 250 L430 263 L510 283 L595 277 L650 260 L742 293 Q690 365 535 415 Q465 450 393 413 Q245 360 192 293Z" class="rock" /><path d="M192 293 L280 270 L350 250 L430 263 L510 283 L595 277 L650 260 L742 293 L742 308 Q470 307 192 308Z" class="strata" /><path d="M293 345 Q468 302 643 345 Q468 388 293 345Z" class="core" /><path d="M232 316 Q466 364 706 317" class="layerline" /><text x="402" y="349" class="oncore">深埋骨架</text><path d="M630 269 L610 295 L607 335" class="fault" /><path d="M715 223 L621 278" class="flow" marker-end="url(#arrow-03-rock-soil)"/><text x="113" y="153" class="label">水沿实际通路反应，不均匀冲洗全部岩体</text><text x="105" y="470" class="label">沉淀只是再分配；不能默认自修复、无限补土</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 6  化学损失看矿物、界面与水交换</text><text x="43" y="575" class="label">易反应矿物可先消耗，残余骨架反应较慢；新鲜面、饱和状态与真实裂隙通水限制通量，不设风化</text><text x="43" y="602" class="label">为零。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="95" y="210" width="340" height="190" rx="12" class="strata"/><text x="110" y="243" class="label">实证 / 支持低剥蚀可能</text><rect x="495" y="210" width="340" height="190" rx="12" class="strata"/><text x="510" y="243" class="label">本世界 / 独立地质输入</text><text x="119" y="336" class="label">岩性差异与保存历史</text><text x="520" y="336" class="label">不用参照值直接配置速率</text><text x="108" y="469" class="label">地表年龄不等于连续裸露年龄；不是已经达标</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 6  低剥蚀参照不能直接外推一亿年</text><text x="43" y="575" class="label">石英岩可有很低的实测速率，但古老地表可能曾埋藏再出露；湿润空岛出口和底部还要单独检查。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M192 293 L280 270 L350 250 L430 263 L510 283 L595 277 L650 260 L742 293 Q690 365 535 415 Q465 450 393 413 Q245 360 192 293Z" class="rock" /><path d="M192 293 L280 270 L350 250 L430 263 L510 283 L595 277 L650 260 L742 293 L742 308 Q470 307 192 308Z" class="strata" /><path d="M293 345 Q468 302 643 345 Q468 388 293 345Z" class="core" /><path d="M232 316 Q466 364 706 317" class="layerline" /><text x="402" y="349" class="oncore">深埋骨架</text><line x1="225" y1="274" x2="245" y2="325" class="reference"/><line x1="705" y1="304" x2="682" y2="337" class="reference"/><text x="106" y="151" class="label">保存成因 → 过程累计 → 剩余陆地和局部连接</text><text x="110" y="469" class="label">若湿润条件和实际结构不相容，回到形成或物性讨论</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">6 / 6  余量用于验收，不作为保存原因</text><text x="43" y="575" class="label">先用层序、供应、起动、反应及出口过程求累计损失，再检查陆地和承载；不能反过来定低侵蚀率</text><text x="43" y="602" class="label">。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>