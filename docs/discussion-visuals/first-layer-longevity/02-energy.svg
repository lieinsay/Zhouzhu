<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-02-energy desc-02-energy"><title id="title-02-energy">有限储能：支撑与机械功</title><desc id="desc-02-energy">建议修订下降负功全耗散；机械返回不是热充能，也不是免费循环。。静止承载，不按重量乘时间扣机械功：无位移不输出机械功；背景泄漏和结构变化另外按真实路径计算。。上升输出正功，下降可返回可逆部分：机械交换与耗散分开，是已确认 · 参数与实现未验证修订；返回不制造有效晶格、不取消损失。。闭合循环不产生净能量：有限能量势U由构型、纹理和高度共同决定；力与力矩取同一势的变化，闭合循环不能净产能。。水载荷与减载，用真实刚度求响应：岛内水转移不新增重量；降雨与外排改变总载荷。剥蚀减载可升高，但既不补土也不免费。</desc><defs><marker id="arrow-02-energy" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">02 / 有限储能：支撑与机械功</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M155 270 L260 240 L350 168 L430 211 L510 253 L595 252 L650 213 L775 270 Q690 365 535 415 Q465 450 393 413 Q245 360 155 270Z" class="rock" /><path d="M155 270 L260 240 L350 168 L430 211 L510 253 L595 252 L650 213 L775 270 L775 285 Q470 307 155 285Z" class="strata" /><path d="M293 345 Q468 302 643 345 Q468 388 293 345Z" class="core" /><path d="M232 316 Q466 364 706 317" class="layerline" /><text x="402" y="349" class="oncore">深埋骨架</text><path d="M325 384 L325 318" class="force" marker-end="url(#arrow-02-energy)"/><path d="M610 383 L610 317" class="force" marker-end="url(#arrow-02-energy)"/><path d="M466 166 L466 212" class="gravity" marker-end="url(#arrow-02-energy)"/><text x="105" y="151" class="label">有限储能存在；静止不等于持续烧能</text><text x="107" y="471" class="label">泄漏、实际运动及不可逆形变仍记账</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  静止承载，不按重量乘时间扣机械功</text><text x="43" y="575" class="label">无位移不输出机械功；背景泄漏和结构变化另外按真实路径计算。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="65" y="210" width="235" height="175" rx="12" class="inactive"/><text x="80" y="243" class="label">有限初始储能</text><rect x="352" y="210" width="245" height="175" rx="12" class="core"/><text x="367" y="243" class="oncore">机械交换 / 可返回</text><rect x="647" y="210" width="230" height="175" rx="12" class="strata"/><text x="662" y="243" class="label">真实损失 / 热</text><path d="M305 277 L343 277" class="flow" marker-end="url(#arrow-02-energy)"/><path d="M600 277 L639 277" class="flow" marker-end="url(#arrow-02-energy)"/><path d="M450 397 L450 440 L180 440 L180 395" class="flow" marker-end="url(#arrow-02-energy)"/><text x="104" y="163" class="label">出生后基准：没有隐藏热源或补料</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 4  上升输出正功，下降可返回可逆部分</text><text x="43" y="575" class="label">机械交换与耗散分开，是已确认 · 参数与实现未验证修订；返回不制造有效晶格、不取消损失</text><text x="43" y="602" class="label">。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="85" y="200" width="270" height="195" rx="12" class="core"/><text x="100" y="233" class="oncore">升高 / 储能付出</text><rect x="575" y="200" width="270" height="195" rx="12" class="inactive"/><text x="590" y="233" class="label">下降 / 部分返回</text><path d="M365 270 Q465 173 565 270" class="flow" marker-end="url(#arrow-02-energy)"/><path d="M565 361 Q465 454 365 361" class="flow" marker-end="url(#arrow-02-energy)"/><text x="389" y="319" class="label">有损循环</text><text x="389" y="352" class="label">减少存量</text><text x="99" y="445" class="label">U = C [ r + (1-r) a B(h) ]：构成提案，非实测参数</text><text x="99" y="475" class="label">力与力矩来自同一势；旧储能口径须一起修订</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 4  闭合循环不产生净能量</text><text x="43" y="575" class="label">有限能量势U由构型、纹理和高度共同决定；力与力矩取同一势的变化，闭合循环不能净产能。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M170 280 L270 254 L350 218 L430 240 L510 270 L595 265 L650 239 L760 280 Q690 365 535 415 Q465 450 393 413 Q245 360 170 280Z" class="rock" /><path d="M170 280 L270 254 L350 218 L430 240 L510 270 L595 265 L650 239 L760 280 L760 295 Q470 307 170 295Z" class="strata" /><path d="M293 345 Q468 302 643 345 Q468 388 293 345Z" class="core" /><path d="M232 316 Q466 364 706 317" class="layerline" /><text x="402" y="349" class="oncore">深埋骨架</text><path d="M478 258 L609.808 258 L595 265 L510 270Z" class="water" /><path d="M350 390 L350 336" class="force" marker-end="url(#arrow-02-energy)"/><text x="102" y="152" class="label">恢复刚度、实际载荷、重心和储能共同约束</text><text x="105" y="469" class="label">不把一场雨画成整岛大幅升降；幅度待计算</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  水载荷与减载，用真实刚度求响应</text><text x="43" y="575" class="label">岛内水转移不新增重量；降雨与外排改变总载荷。剥蚀减载可升高，但既不补土也不免费。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>