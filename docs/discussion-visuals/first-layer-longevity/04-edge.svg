<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-04-edge desc-04-edge"><title id="title-04-edge">临空岛缘：出口与退崖</title><desc id="desc-04-edge">空岛有永久临空边界，内陆变平不能独自证明长寿。。瀑布口可以侵蚀并向内后退：出口唇、节理与床载撞击决定实际切削；不能只核对流域平均下切。。离岛后的自由落水，不继续磨整座岛：空中落水到海面的巨大落差不能全部施加给内陆床面；突出下缘与岛内落水潭另按接触求作用。。出口与基底必须有真实连续岩层约束：抗蚀岩层可以减缓退缩，但节理、掏蚀与流量仍重要；不画一圈不可破坏边墙。。退缩距离必须小于保存区实际余量：水路退缩、侧壁、底部和地下掏空分别检查；平均净损失小也可能切断关键连接。</desc><defs><marker id="arrow-04-edge" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">05 / 临空岛缘：出口与退崖</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M120 280 L650 280 L675 460 L120 460Z" class="rock" /><path d="M120 300 L640 300 L650 325 L120 325Z" class="strata" /><path d="M150 267 L650 267 Q689 282 708 375 L698 375 Q680 295 650 282 L150 282Z" class="water" /><path d="M345 270 L600 270" class="flow" marker-end="url(#arrow-04-edge)"/><path d="M650 285 L635 322 L655 350" class="fault" /><text x="118" y="175" class="label">实际接触的出口与侧壁仍能受侵蚀</text><text x="132" y="491" class="label">岛缘损失与内部保存分开核对</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  瀑布口可以侵蚀并向内后退</text><text x="43" y="575" class="label">出口唇、节理与床载撞击决定实际切削；不能只核对流域平均下切。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M120 270 L635 270 L650 330 L620 400 L120 400Z" class="rock" /><path d="M150 257 L635 257 Q679 279 713 463 L703 463 Q670 284 635 272 L150 272Z" class="water" /><text x="113" y="180" class="label">岛内：水与岩体接触</text><text x="685" y="230" class="label">空中：已离陆地</text><path d="M756 301 L756 433" class="flow" marker-end="url(#arrow-04-edge)"/><text x="128" y="466" class="label">不把海面水头硬钉给所有内陆河段</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 4  离岛后的自由落水，不继续磨整座岛</text><text x="43" y="575" class="label">空中落水到海面的巨大落差不能全部施加给内陆床面；突出下缘与岛内落水潭另按接触求作用。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M120 278 L655 278 L662 336 L632 450 L120 450Z" class="rock" /><path d="M120 279 L655 279 L660 318 L120 318Z" class="strata" /><path d="M120 257 L655 257 Q690 282 706 438 L696 438 Q682 286 655 273 L120 273Z" class="water" /><line x1="565" y1="278" x2="583" y2="330" class="fault"/><text x="107" y="178" class="label">层序与裂隙来自成因；不是新增强度倍率</text><text x="112" y="470" class="label">湖盆滞沙有限，材料能再动，出口不是永不后退</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 4  出口与基底必须有真实连续岩层约束</text><text x="43" y="575" class="label">抗蚀岩层可以减缓退缩，但节理、掏蚀与流量仍重要；不画一圈不可破坏边墙。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M192 293 L280 270 L350 250 L430 263 L510 283 L595 277 L650 260 L742 293 Q690 365 535 415 Q465 450 393 413 Q245 360 192 293Z" class="rock" /><path d="M192 293 L280 270 L350 250 L430 263 L510 283 L595 277 L650 260 L742 293 L742 308 Q470 307 192 308Z" class="strata" /><path d="M293 345 Q468 302 643 345 Q468 388 293 345Z" class="core" /><path d="M232 316 Q466 364 706 317" class="layerline" /><text x="402" y="349" class="oncore">深埋骨架</text><path d="M700 290 L659 328 L637 363" class="fault" /><line x1="601" y1="226" x2="601" y2="310" class="reference"/><text x="138" y="157" class="label">内陆保存区与活动出口之间有真实空间余量</text><text x="627" y="206" class="label">活动前缘</text><text x="118" y="469" class="label">退缩率由材料与水力求，不由一亿年反配</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  退缩距离必须小于保存区实际余量</text><text x="43" y="575" class="label">水路退缩、侧壁、底部和地下掏空分别检查；平均净损失小也可能切断关键连接。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>