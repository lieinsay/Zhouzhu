<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-01-structure desc-01-structure"><title id="title-01-structure">结构封存：形成与保留</title><desc id="desc-01-structure">高压形成不等于必须永久高压；结构和储能分别核对。。深部形成与地面保留是不同条件：高温高压帮助有效晶格形成、长大和接合；出海后冷却不自动退相。。卸压后，需要跨越重排障碍才能失活：必须建立普通相界面并破坏重建相邻键；常温热运动不自动完成这条路径。。结构在，不代表储能必然不漏：有效晶格决定容量；高能内部构型决定储能，两种状态可以分别变化。。深埋降低扰动，缺陷仍有真实路径：包覆围岩缓冲温度和流体；缺陷、热事件与失活界面可改变局部有效域，不按岛龄统一扣百分比。</desc><defs><marker id="arrow-01-structure" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">01 / 结构封存：形成与保留</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="45" y="185" width="850" height="105" rx="0" class="strata"/><rect x="45" y="290" width="850" height="190" rx="0" class="rock"/><line x1="45" y1="255" x2="895" y2="255" class="layerline"/><line x1="45" y1="340" x2="895" y2="340" class="layerline"/><line x1="45" y1="414" x2="895" y2="414" class="layerline"/><path d="M225 355 Q470 297 715 355 Q470 413 225 355Z" class="core" /><text x="107" y="151" class="label">形成：重排路径可达</text><text x="107" y="467" class="label">保持：低温下重排受阻，物性提案待核定</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  深部形成与地面保留是不同条件</text><text x="43" y="575" class="label">高温高压帮助有效晶格形成、长大和接合；出海后冷却不自动退相。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><line x1="105" y1="430" x2="830" y2="430" class="edge"/><line x1="105" y1="430" x2="105" y2="175" class="edge"/><path d="M130 320 Q200 400 270 315 Q355 100 450 300 Q565 470 695 395 L795 365" class="layerline" /><text x="135" y="468" class="label">有效态</text><text x="635" y="468" class="label">普通态</text><text x="133" y="155" class="label">冷态概念能垒，不是实测曲线</text><text x="354" y="174" class="label">重排路径</text><circle cx="196" cy="365" r="12" class="core"/><text x="450" y="238" class="label">冷态难跨越</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 4  卸压后，需要跨越重排障碍才能失活</text><text x="43" y="575" class="label">必须建立普通相界面并破坏重建相邻键；常温热运动不自动完成这条路径。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="95" y="215" width="340" height="200" rx="12" class="core"/><text x="110" y="248" class="oncore">有效晶格 / 结构仍在</text><rect x="495" y="215" width="340" height="200" rx="12" class="inactive"/><text x="510" y="248" class="label">内部构型 / 储能可变</text><path d="M442 310 L485 310" class="flow" marker-end="url(#arrow-01-structure)"/><text x="129" y="365" class="oncore">不是材料持续发烫</text><text x="522" y="365" class="label">封存机制：新增世界物性</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 4  结构在，不代表储能必然不漏</text><text x="43" y="575" class="label">有效晶格决定容量；高能内部构型决定储能，两种状态可以分别变化。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M155 270 L260 240 L350 168 L430 211 L510 253 L595 252 L650 213 L775 270 Q690 365 535 415 Q465 450 393 413 Q245 360 155 270Z" class="rock" /><path d="M155 270 L260 240 L350 168 L430 211 L510 253 L595 252 L650 213 L775 270 L775 285 Q470 307 155 285Z" class="strata" /><path d="M293 345 Q468 302 643 345 Q468 388 293 345Z" class="core" /><path d="M232 316 Q466 364 706 317" class="layerline" /><text x="402" y="349" class="oncore">深埋骨架</text><line x1="640" y1="274" x2="604" y2="325" class="fault"/><text x="648" y="221" class="label">局部裂隙 / 流体</text><path d="M720 232 L615 312" class="flow" marker-end="url(#arrow-01-structure)"/><text x="110" y="471" class="label">剖面透视不表示骨架已在地表外露</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  深埋降低扰动，缺陷仍有真实路径</text><text x="43" y="575" class="label">包覆围岩缓冲温度和流体；缺陷、热事件与失活界面可改变局部有效域，不按岛龄统一扣百分比。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>