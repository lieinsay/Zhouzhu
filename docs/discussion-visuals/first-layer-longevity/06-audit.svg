<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-06-audit desc-06-audit"><title id="title-06-audit">一亿年：条件、余量与回收</title><desc id="desc-06-audit">有限时段的可行性约束；并非寿命计时器或已完成模拟。。三条保存链缺一不可：结构储能、连续岩体和环境背景共同核对；本轮不预测物种存活，不能只用总强度或岛龄判断。。几何除以时长，是反查条件而非参数：100米余量除以一亿年得到1毫米/千年；这个数只说明容许累计量，不能拿来直接配置侵蚀。。年龄不触发统一外露或统一坠落：只有真实盖层移除才露骨架；寿命失败来自结构、能量、传力或环境条件，详细摧毁仍延期。。若不相容，回到前提，不补能不造土：完整形成与保存设计已确认 · 参数与实现未验证；数值证据、长时过程及生境检查尚未完成，不宣称当前世界已达标。。风暴可触发回海，不按年龄强行沉底：老岛支撑余量不足时，实际扰动和不可逆变化可触发回海；若仍有恢复平衡应回升，进海后水浮力也要核对。。一亿年级背景，不等于每条缝隙同速释放：整体长寿是设计约束；局部释放看库存与真实通量，控制点看高差与速度，不能用一亿年直接配置速率。。生成时的地质加速，不进入日常运行：正常钟速100现实小时推进150游戏日；物理日长从行星契约换算。局部事件单独响应，不按日期强制造山。</desc><defs><marker id="arrow-06-audit" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">07 / 一亿年：条件、余量与回收</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;0;1" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="65" y="211" width="235" height="190" rx="12" class="core"/><text x="80" y="244" class="oncore">结构 / 能量 / 连接</text><rect x="350" y="211" width="245" height="190" rx="12" class="strata"/><text x="365" y="244" class="label">岩土 / 水路 / 陆地</text><rect x="645" y="211" width="235" height="190" rx="12" class="strata"/><text x="660" y="244" class="label">环境 / 连续历史</text><text x="100" y="471" class="label">都是待核对条件，框图不是计算通过</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 7  三条保存链缺一不可</text><text x="43" y="575" class="label">结构储能、连续岩体和环境背景共同核对；本轮不预测物种存活，不能只用总强度或岛龄判断。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="95" y="205" width="340" height="205" rx="12" class="strata"/><text x="110" y="238" class="label">实际保存余量</text><rect x="495" y="205" width="340" height="205" rx="12" class="strata"/><text x="510" y="238" class="label">过程累计损失</text><text x="124" y="325" class="label">覆盖、退崖、岩桥分别核对</text><text x="521" y="325" class="label">独立材料与历史得出</text><line x1="442" y1="306" x2="485" y2="306" class="reference"/><text x="129" y="473" class="label">未指定默认厚度、容量、泄漏率或退崖速度</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 7  几何除以时长，是反查条件而非参数</text><text x="43" y="575" class="label">100米余量除以一亿年得到1毫米/千年；这个数只说明容许累计量，不能拿来直接配置侵蚀。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><path d="M192 293 L280 270 L350 250 L430 263 L510 283 L595 277 L650 260 L742 293 Q690 365 535 415 Q465 450 393 413 Q245 360 192 293Z" class="rock" /><path d="M192 293 L280 270 L350 250 L430 263 L510 283 L595 277 L650 260 L742 293 L742 308 Q470 307 192 308Z" class="strata" /><path d="M293 345 Q468 302 643 345 Q468 388 293 345Z" class="core" /><path d="M232 316 Q466 364 706 317" class="layerline" /><text x="402" y="349" class="oncore">深埋骨架</text><text x="115" y="152" class="label">这幅图仍深埋：非常老也不自动外露</text><text x="109" y="473" class="label">一亿年是能够达到的寿命，不是到期失效开关</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 7  年龄不触发统一外露或统一坠落</text><text x="43" y="575" class="label">只有真实盖层移除才露骨架；寿命失败来自结构、能量、传力或环境条件，详细摧毁仍延期。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="90" y="204" width="330" height="199" rx="12" class="core"/><text x="105" y="237" class="oncore">保留：已确认形成链</text><rect x="510" y="204" width="330" height="199" rx="12" class="strata"/><text x="525" y="237" class="label">已确认 · 参数与实现未验证：长期保存补案</text><text x="119" y="325" class="oncore">有限材料与热输入</text><text x="538" y="325" class="label">封存、功账、生境与老化</text><text x="110" y="470" class="label">先完成第一层补案，再继续第三层；不实现、不commit</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 7  若不相容，回到前提，不补能不造土</text><text x="43" y="575" class="label">完整形成与保存设计已确认 · 参数与实现未验证；数值证据、长时过程及生境检查尚未完成，</text><text x="43" y="602" class="label">不宣称当前世界已达标。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="65" y="209" width="235" height="189" rx="12" class="strata"/><text x="80" y="242" class="label">实际扰动 / 支撑余量</text><rect x="350" y="209" width="245" height="189" rx="12" class="strata"/><text x="365" y="242" class="label">能否恢复 / 重新求解</text><rect x="645" y="209" width="235" height="189" rx="12" class="strata"/><text x="660" y="242" class="label">回海 / 漫长地质循环</text><path d="M304 310 L343 310" class="flow" marker-end="url(#arrow-06-audit)"/><path d="M600 310 L638 310" class="flow" marker-end="url(#arrow-06-audit)"/><text x="107" y="462" class="label">新方向已确认 · 参数与实现未验证：风暴触发不等于直接送入地幔</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 7  风暴可触发回海，不按年龄强行沉底</text><text x="43" y="575" class="label">老岛支撑余量不足时，实际扰动和不可逆变化可触发回海；若仍有恢复平衡应回升，进海后水浮力</text><text x="43" y="602" class="label">也要核对。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="65" y="209" width="235" height="185" rx="12" class="strata"/><text x="80" y="242" class="label">背景 / 长期保存</text><rect x="350" y="209" width="245" height="185" rx="12" class="strata"/><text x="365" y="242" class="label">释放 / M与dotM</text><rect x="645" y="209" width="235" height="185" rx="12" class="strata"/><text x="660" y="242" class="label">控制点 / dz与速度</text><text x="106" y="460" class="label">阶段时长与局部速率分别记录；信号快不等于岩石迁移快</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">6 / 7  一亿年级背景，不等于每条缝隙同速释放</text><text x="43" y="575" class="label">整体长寿是设计约束；局部释放看库存与真实通量，控制点看高差与速度，不能用一亿年直接配置</text><text x="43" y="602" class="label">速率。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;0;1;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="65" y="209" width="235" height="185" rx="12" class="strata"/><text x="80" y="242" class="label">生成 / 地质历史</text><rect x="350" y="209" width="245" height="185" rx="12" class="strata"/><text x="365" y="242" class="label">开局 / 实际物理时长</text><rect x="645" y="209" width="235" height="185" rx="12" class="strata"/><text x="660" y="242" class="label">水情 / 同时段子步</text><path d="M304 310 L343 310" class="flow" marker-end="url(#arrow-06-audit)"/><path d="M600 310 L638 310" class="flow" marker-end="url(#arrow-06-audit)"/><text x="104" y="460" class="label">地质参照年与336日世界历年分开；具体岩层速度尚未核定</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">7 / 7  生成时的地质加速，不进入日常运行</text><text x="43" y="575" class="label">正常钟速100现实小时推进150游戏日；物理日长从行星契约换算。局部事件单独响应，不按</text><text x="43" y="602" class="label">日期强制造山。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>