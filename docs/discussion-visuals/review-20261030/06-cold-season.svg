<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title-06-cold-season desc-06-cold-season" data-chapter="06-cold-season"><title id="title-06-cold-season">寒季：轻量的冰雪相态</title><desc id="desc-06-cold-season">由现有天气链的气温驱动度日规则，只改四件事；温暖世界整段不启用。 度日驱动积雪与冰盖：气温低于零度累积度日：积雪进入已有的N库，静水与缓流水面出现冰盖覆盖状态。不做热传导与冰力学。；冰雪只改四件事：冰下开水面蒸发停止；冻土降低入渗；冰盖增加湿周与阻力、抬高水位，小出口可冻结；融雪按度日进入水账。；冰面先是受限区：承载模型出现前，站在冰上判为未支持并给可见提示，不能潜入冰下。；破冰是材料操作：凿开的冰块仍计入N库，取到的是冰下实际可取的液水；冬季取水列为验收情景。；温暖世界整段不启用：若全年气温不支持，例如温暖的6068，整套规则关闭，不为寒季硬造冰雪。。2026-10-30复核补案，待用户确认；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="MK-06-cold-season" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2f6b5e"/></marker><marker id="WMK-06-cold-season" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b5533f"/></marker><pattern id="HT-06-cold-season" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f6e5df"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b5533f" stroke-width="3"/></pattern></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#22332f}.t{font-size:26px;font-weight:700}.b{font-size:14px;fill:#6a5a8a}.cap{font-size:20px;font-weight:700}.note{font-size:17px}.l{font-size:16px}.s{font-size:14px}.m{font-size:14px;fill:#5d6f69}.h{font-size:17px;font-weight:700}.big{font-size:30px;font-weight:700}.pv{font-size:15px;fill:#6a4f96;font-weight:700}.wv{font-size:15px;fill:#a2493a;font-weight:700}
