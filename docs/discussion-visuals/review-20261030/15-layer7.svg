802 158L838 158L838 184Z" class="card" /><path d="M796 160L820 140L844 160Z" class="deep" /><line x1="780" y1="170" x2="584" y2="250" class="thin" marker-end="url(#MK-15-layer7)"/><path d="M802 374L802 348L838 348L838 374Z" class="card" /><path d="M796 350L820 330L844 350Z" class="deep" /><line x1="780" y1="360" x2="584" y2="250" class="thin" marker-end="url(#MK-15-layer7)"/><text x="480" y="420" class="pv" text-anchor="middle">每村每区间一笔 · 路径只在依赖变化时重核</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">4 / 5  远域村落聚合取水</text><text x="44" y="552" class="note" text-anchor="start">每村每个接受区间记一笔取水，挂在声明的水源域上；建村时登记水源与距离，超过几十米公开标记。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M60 260L560 260L560 300L60 300Z" class="water" /><rect x="60" y="252" width="240" height="12" rx="3" class="ice"/><g transform="translate(200 252) scale(0.9)"><circle cx="0" cy="-52" r="8" class="person"/><line x1="0" y1="-43" x2="0" y2="-20" class="person" /><line x1="0" y1="-37" x2="-14" y2="-27" class="person" /><line x1="0" y1="-37" x2="13" y2="-29" class="person" /><line x1="0" y1="-20" x2="-10" y2="0" class="person" /><line x1="0" y1="-20" x2="10" y2="0" class="person" /></g><text x="80" y="230" class="pv" text-anchor="start">冰面：受限区</text><path d="M300 300L620 300L620 260L560 260Z" class="rock" /><path d="M624 264Q640 330 646 440" class="fall"><animate attributeName="stroke-dashoffset" from="60" to="0" dur="0.9s" repeatCount="indefinite"/></path><rect x="650" y="320" width="20" height="14" rx="3" class="card"/><line x1="680" y1="330" x2="740" y2="330" class="warn" marker-end="url(#WMK-15-layer7)"/><rect x="744" y="300" width="170" height="60" rx="8" class="warnc"/><text x="829" y="326" class="wv" text-anchor="middle">“离岛”</text><text x="829" y="348" class="s" text-anchor="middle">记日志