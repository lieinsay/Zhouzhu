<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title-15-layer7 desc-15-layer7" data-chapter="15-layer7"><title id="title-15-layer7">第七层：分级用水与交互</title><desc id="desc-15-layer7">T0—T3分级；取能装置是一维河段的内部边界；身体采样点读派生速度；远域村落聚合取水；冰与离岛有去向。 T0—T3分级：T0取水进真实容器、村缸与存档；T1涉水；T2水面载体；T3取能。T2、T3等内容需要时再开，不阻塞集成。；取能装置是内部边界：装置放在一维河段里，只用一个关系：取走的功加损失等于水头损失；局部冲刷只标记，交给第三层已有路径。；身体只取少量采样点：身体读取第四层的断面内派生速度，深处快、浅处慢；急变流区域限制使用。；远域村落聚合取水：每村每个接受区间记一笔取水，挂在声明的水源域上；建村时登记水源与距离，超过几十米公开标记。；冰与离岛都有去向：冰盖先是受限区；被冲走或越过岛缘的人或物记为“离岛”并留日志，恢复规则与水账分开。。2026-10-30复核补案，待用户确认；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="MK-15-layer7" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2f6b5e"/></marker><marker id="WMK-15-layer7" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b5533f"/></marker><pattern id="HT-15-layer7" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f6e5df"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b5533f" stroke-width="3"/></pattern></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#22332f}.t{font-size:26px;font-weight:700}.b{font-size:14px;fill:#6a5a8a}.cap{font-size:20px;font-weight:700}.note{font-size:17px}.l{font-size:16px}.s{font-size:14px}.m{font-size:14px;fill:#5d6f69}.h{font-size:17px;font-weight:700}.big{font-size:30px;font-weight:700}.pv{font-size:15px;fill:#6a4f96;font-weight:700}.wv{font-size:15px;fill:#a2493a;font-weight:700}
