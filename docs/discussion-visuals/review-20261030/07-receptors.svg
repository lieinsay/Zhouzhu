<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title-07-receptors desc-07-receptors" data-chapter="07-receptors"><title id="title-07-receptors">淹没包络与受体</title><desc id="desc-07-receptors">第二层逐地点输出淹没包络；房屋、农田、道路、码头与取水点登记为受体，后果可追溯，不设灾害频率。 逐地点的淹没包络：在可淹没岸地逐地点输出最高水位、受淹时间占比、最长连续受淹，并附统计窗口；这是物理输出，不是危险标签。；现有对象登记为受体：房屋、农田、存货、道路、码头与船台、取水点，各有“可用 / 受淹 / 受损需修”等简单状态。；原因可以追溯：新修的堤让上游水位抬高，田块受淹的原因指回这道堤和当时的来水，而不是一张随机灾害表。；他村也是受体：下游他村的取水点与田同样登记，玩家工程对下游的影响因此可以追溯；社会反应延期。；不设灾害频率：不配“每年几次洪灾”，不强制损坏；后果只来自真实时间序列下的水态。。2026-10-30复核补案，待用户确认；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="MK-07-receptors" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2f6b5e"/></marker><marker id="WMK-07-receptors" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b5533f"/></marker><pattern id="HT-07-receptors" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f6e5df"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b5533f" stroke-width="3"/></pattern></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#22332f}.t{font-size:26px;font-weight:700}.b{font-size:14px;fill:#6a5a8a}.cap{font-size:20px;font-weight:700}.note{font-size:17px}.l{font-size:16px}.s{font-size:14px}.m{font-size:14px;fill:#5d6f69}.h{font-size:17px;font-weight:700}.big{font-size:30px;font-weight:700}.pv{font-size:15px;fill:#6a4f96;font-weight:700}.wv{font-size:15px;fill:#a2493a;font-weight:700}
