f" /><text x="470" y="280" class="pv" text-anchor="middle">最高水位包络</text><rect x="600" y="370" width="300" height="82" rx="8" class="on"/><text x="616" y="396" class="l" text-anchor="start">最高水位 · 受淹占比</text><text x="616" y="424" class="l" text-anchor="start">最长连续受淹 · 统计窗口</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">1 / 5  逐地点的淹没包络</text><text x="44" y="552" class="note" text-anchor="start">在可淹没岸地逐地点输出最高水位、受淹时间占比、最长连续受淹，并附统计窗口；这是物理输出，不是</text><text x="44" y="579" class="note" text-anchor="start">危险标签。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M40 250L170 250L230 300L360 312L410 352L470 372L530 352L580 312L700 300L770 250L920 250L920 470L40 470Z" class="rock" /><path d="M40 250L170 250L230 300L360 312L410 352L470 372L530 352L580 312L700 300L770 250L920 250" class="grass" /><path d="M398 340L410 352L470 372L530 352L542 340Z" class="water" /><line x1="398" y1="340" x2="542" y2="340" class="wline" /><path d="M110 250L110 224L146 224L146 250Z" class="card" /><path d="M104 226L128 206L152 226Z" class="deep" /><rect x="250" y="292" width="90" height="8" rx="2" class="soil"/><line x1="258" y1="292" x2="254" y2="280" class="grass" /><line x1="274" y1="292" x2="270" y2="280" class="grass" /><line x1="290" y1="292" x2="286" y2="280" class="grass" /><line x1="306" y1="292" x2="302" y2="280" class="grass" /><line x1="322" y1="292" x2="318" y2="280" class="grass" /><line x1="338" y1="292" x2="334" y2="280" class="grass" /><rect x="700" y="292" width="90" height="8" rx="2" class="deep"/><text x="745" y="286" class="s" text-anchor="middle">道路</text><rect x="800" y="244" width="70" height="8" rx="2" class="card"/><text x="835" y="236" class="s" text-anchor="middle">码头</text><rect x="70" y="140" width="99" height="30" rx="15" class="chipon"/><text x="119.5"