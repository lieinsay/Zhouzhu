<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title-10-layer2 desc-10-layer2" data-chapter="10-layer2"><title id="title-10-layer2">第二层：五个库与第一版</title><desc id="desc-10-layer2">五个库各有基准表示；7.1—7.5的深方法只用于生成期与离散改地；L2-0首版只验五条；预热按漂移判停。 五个库的基准表示：R河段储水路由，L盆地V(z)库容，M少层土桶，G分区水头库，N积雪冰；包气带作延迟项。；深方法只用在两处：毛细、非饱和与移动边界做功，只用于生成期地质历程和第六层的离散改地；游玩期按固定几何求水情。；L2-0首版只验五条：无源不生水；同一盆地不同来水得到干、部分蓄水或溢流；湖低于出口时地表出流停止；断流三态；窄口不调平。；预热按漂移判停：每个库按“每周期储量漂移相对通量”判停；深部未平衡的可以带标记出包，开局情景在生成时选定并记录。；新增两类输出：岛缘出口的逐口流量与间歇统计，以及可淹没岸地的逐地点淹没包络。。2026-10-30复核补案，待用户确认；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="MK-10-layer2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2f6b5e"/></marker><marker id="WMK-10-layer2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b5533f"/></marker><pattern id="HT-10-layer2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f6e5df"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b5533f" stroke-width="3"/></pattern></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#22332f}.t{font-size:26px;font-weight:700}.b{font-size:14px;fill:#6a5a8a}.cap{font-size:20px;font-weight:700}.note{font-size:17px}.l{font-size:16px}.s{font-size:14px}.m{font-size:14px;fill:#5d6f69}.h{font-size:17px;font-weight:700}.big{font-size:30px;font-weight:700}.pv{font-size:15px;fill:#6a4f96;font-weight:700}.wv{font-size:15px;fill:#a2493a;font-weight:700}
