x="44" y="520" class="cap" text-anchor="start">1 / 5  五个库的基准表示</text><text x="44" y="552" class="note" text-anchor="start">R河段储水路由，L盆地V(z)库容，M少层土桶，G分区水头库，N积雪冰；包气带作延迟项。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="40" y="180" width="420" height="140" rx="10" class="panel"/><text x="60" y="210" class="h" text-anchor="start">生成期</text><rect x="60" y="240" width="130" height="30" rx="15" class="chipon"/><text x="125" y="260" class="s" text-anchor="middle">毛细 · 非饱和</text><rect x="60" y="280" width="113" height="30" rx="15" class="chipon"/><text x="116.5" y="300" class="s" text-anchor="middle">移动边界做功</text><rect x="500" y="180" width="420" height="140" rx="10" class="panel"/><text x="520" y="210" class="h" text-anchor="start">游玩期</text><rect x="521" y="248" width="18" height="14" rx="3" class="lock"/><path d="M524 248V242Q530 235 536 242V248" class="lockl" /><text x="550" y="258" class="l" text-anchor="start">固定几何上求水情</text><rect x="520" y="280" width="171" height="30" rx="15" class="chipon"/><text x="605.5" y="300" class="s" text-anchor="middle">第六层离散改地：可用</text><line x1="480" y1="160" x2="480" y2="340" class="ref" /><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">2 / 5  深方法只用在两处</text><text x="44" y="552" class="note" text-anchor="start">毛细、非饱和与移动边界做功，只用于生成期地质历程和第六层的离散改地；游玩期按固定几何求水情。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="140" width="560" height="44" rx="8" class="card"/><path d="M94 162L101 170L115 153" class="ok" /><text x="130" y="168" class="l" text-anchor="start">无源不生水</text><rect x="80" y="198" width="560" height="44" rx="8" class="card"/><path d="M94 220L101 228L115 211" class="ok" /><text x="130" y="226" class="l" text-anchor="start">同盆：干 / 部分 / 溢流</text><rect x="80" y="256" width="560" height="44" rx="8" class="card"/><path d="M94 278L101 286L115 269" class="ok" /><text x="130" y="284" class="l" text-anchor="start">湖低于出口 → 出流停</text><rect x="80" y="314" width="560" height="44" rx="8" class="card"/><path d="M94 336L101 344L115 327" class="ok" /><text x="130" y="342" class="l" text-anchor="start">断流三态</text><rect x="80" y="372" width="560" height="44" rx="8" class="card"/><path d="M94 394L101 402L115 385" class="ok" /><text x="130" y="400" class="l" text-anchor="start">窄口不调平</text><rect x="680" y="170" width="240" height="120" rx="10" class="prop"/><text x="800" y="210" class="pv" text-anchor="middle">未支持的能力</text><text x="800" y="240" class="s" text-anchor="middle">返回“未支持”</text><text x="800" y="264" class="s" text-anchor="middle">不判失败</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">3 / 5  L2-0首版只验五条</text><text x="44" y="552" class="note" text-anchor="start">无源不生水；同一盆地不同来水得到干、部分蓄水或溢流；湖低于出口时地表出流停止；断流三态；窄口</text><text x="44" y="579" class="note" text-anchor="start">不调平。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><line x1="80" y1="400" x2="880" y2="400" class="axis" /><line x1="80" y1="400" x2="80" y2="140" class="axis" /><text x="80" y="130" class="s" text-anchor="start">每周期储量漂移 / 通量</text><text x="880" y="430" class="s" text-anchor="end">周期</text><path d="M100 160C200 220 280 300 380 330S600 360 860 366" class="wline" /><line x1="80" y1="350" x2="880" y2="350" class="ref" /><text x="700" y="342" class="pv" text-anchor="start">判停</text><path d="M100 200C300 230 500 250 860 270" class="ghost" /><text x="640" y="250" class="m" text-anchor="start">深部：未平衡 → 带标记出包</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">4 / 5  预热按漂移判停</text><text x="44" y="552" class="note" text-anchor="start">每个库按“每周期储量漂移相对通量”判停；深部未平衡的可以带标记出包，开局情景在生成时选定并记</text><text x="44" y="579" class="note" text-anchor="start">录。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="180" width="360" height="100" rx="10" class="on"/><text x="260" y="226" class="h" text-anchor="middle">岛缘出口</text><text x="260" y="250" class="s" text-anchor="middle">逐口 Q · 间歇统计</text><rect x="520" y="180" width="360" height="100" rx="10" class="on"/><text x="700" y="226" class="h" text-anchor="middle">淹没包络</text><text x="700" y="250" class="s" text-anchor="middle">最高水位 · 受淹占比 · 最长受淹</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">5 / 5  新增两类输出</text><text x="44" y="552" class="note" text-anchor="start">岛缘出口的逐口流量与间歇统计，以及可淹没岸地的逐地点淹没包络。</text></g></svg>
