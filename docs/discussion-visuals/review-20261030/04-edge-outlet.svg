<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title-04-edge-outlet desc-04-edge-outlet" data-chapter="04-edge-outlet"><title id="title-04-edge-outlet">岛缘出口：空岛水系的终点</title><desc id="desc-04-edge-outlet">把岛缘出口定为跨层对象：控制断面、开放边界记账、下方承接、下切基准、显示四段与危险区。 河的终点只有两种：空岛没有海平面基准：自然河网要么停在封闭盆地，要么在岛缘自由跌落。；出口唇是控制断面：岛缘按自由出流的临界关系计算水深与流量，一维或二维都能处理，不需要三维非静水。；记账：岛级开放边界：记录每个接受区间的出流体积与瞬时Q，记为“岛缘外排”，不回灌本岛；崖面渗出记作地下岛缘外排。；下方岛承接，或离开岛群：按落水轨迹判断：命中下方岛已声明的接收范围，就转为该岛的外来落水；否则离开岛群，作开放边界。；唇高程是上游下切的基准：裂点从唇部向上游后退，限定上游能切多深；唇为硬岩时，上游缓而宽浅是合理结果。；显示四段与危险区：落水分水帘、破碎、雾化、没入云海四段，只显示到云带顶；出口近域可查询为危险区，越过岛缘的人或物记为“离岛”。。2026-10-30复核补案，待用户确认；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="MK-04-edge-outlet" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2f6b5e"/></marker><marker id="WMK-04-edge-outlet" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b5533f"/></marker><pattern id="HT-04-edge-outlet" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f6e5df"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b5533f" stroke-width="3"/></pattern></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#22332f}.t{font-size:26px;font-weight:700}.b{font-size:14px;fill:#6a5a8a}.cap{font-size:20px;font-weight:700}.note{font-size:17px}.l{font-size:16px}.s{font-size:14px}.m{font-size:14px;fill:#5d6f69}.h{font-size:17px;font-weight:700}.big{font-size:30px;font-weight:700}.pv{font-size:15px;fill:#6a4f96;font-weight:700}.wv{font-size:15px;fill:#a2493a;font-weight:700}
