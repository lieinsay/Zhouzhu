<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title-05-two-clocks desc-05-two-clocks" data-chapter="05-two-clocks"><title id="title-05-two-clocks">双时基：世界钟与现实秒</title><desc id="desc-05-two-clocks">一游戏日为2400现实秒，行星自转24小时：慢过程走世界钟，快场读取走现实秒。 1现实秒 = 36世界秒：正常钟速下一游戏日2400现实秒，行星自转24小时，所以物理过程比现实快36倍；加速钟再乘倍率，暂停为零。；慢过程走世界钟：水位涨落、库存、季节、渗漏、淤积、施工工量，以及洪峰和水色前锋的传播，都按世界钟的物理秒推进。；快场读取走现实秒：身体受力、船体阻力、流动纹理、浪花和水声，读取最近接受状态的瞬时场，按现实秒作用，不自行推进水量输运。；看起来不同步是明示的：纹理按物理流速播放，1米/秒看起来就是1米/秒；洪峰与色锋按世界钟传播，看起来约快36倍。这是声明的双时基，不算缺陷。；按节拍发布，插值只用于显示：水态按固定的现实秒节拍发布，节拍由实测预算确定；节拍间插值只给显示，查询与HUD读接受值；暂停时全部停止。。2026-10-30复核补案，待用户确认；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="MK-05-two-clocks" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2f6b5e"/></marker><marker id="WMK-05-two-clocks" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b5533f"/></marker><pattern id="HT-05-two-clocks" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f6e5df"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b5533f" stroke-width="3"/></pattern></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#22332f}.t{font-size:26px;font-weight:700}.b{font-size:14px;fill:#6a5a8a}.cap{font-size:20px;font-weight:700}.note{font-size:17px}.l{font-size:16px}.s{font-size:14px}.m{font-size:14px;fill:#5d6f69}.h{font-size:17px;font-weight:700}.big{font-size:30px;font-weight:700}.pv{font-size:15px;fill:#6a4f96;font-weight:700}.wv{font-size:15px;fill:#a2493a;font-weight:700}
