快36倍；加速钟再乘倍</text><text x="44" y="579" class="note" text-anchor="start">率，暂停为零。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><circle cx="130" cy="200" r="62" class="card"/><line x1="130" y1="200" x2="130" y2="152" class="arrow"><animateTransform attributeName="transform" type="rotate" from="0 130 200" to="360 130 200" dur="36s" repeatCount="indefinite"/></line><circle cx="130" cy="200" r="5" class="dot"/><text x="130" y="290" class="h" text-anchor="middle">现实秒</text><circle cx="320" cy="200" r="62" class="on"/><line x1="320" y1="200" x2="320" y2="152" class="arrow"><animateTransform attributeName="transform" type="rotate" from="0 320 200" to="360 320 200" dur="1s" repeatCount="indefinite"/></line><circle cx="320" cy="200" r="5" class="dot"/><text x="320" y="290" class="h" text-anchor="middle">世界钟</text><text x="225" y="206" class="big" text-anchor="middle">×36</text><rect x="436" y="110" width="500" height="350" rx="10" class="panel"/><path d="M450 260L510 360L630 360L690 260Z" class="rock" /><rect x="480" y="300" width="180" height="60" class="water"><animate attributeName="y" values="340;300;340" dur="4s" repeatCount="indefinite"/><animate attributeName="height" values="20;60;20" dur="4s" repeatCount="indefinite"/></rect><text x="450" y="240" class="l" text-anchor="start">水位涨落 · 库存 · 季节</text><rect x="720" y="300" width="200" height="16" rx="4" class="water"/><line x1="720" y1="308" x2="750" y2="308" class="front"><animate attributeName="x2" values="722;920" dur="1.2s" repeatCount="indefinite"/></line><text x="720" y="288" class="s" text-anchor="start">色锋 / 洪峰</text><text x="450" y="410" class="pv" text-anchor="start">按物理秒推进</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">2 / 5  慢过程走世界钟</text><text x="44" y="552" class="note" text-anchor="start">水位涨落、库