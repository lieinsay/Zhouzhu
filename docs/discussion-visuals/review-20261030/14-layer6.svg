<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title-14-layer6 desc-14-layer6" data-chapter="14-layer6"><title id="title-14-layer6">第六层：能读懂的治水</title><desc id="desc-14-layer6">近域二维、渠涵一维、远域节点；阶段一四个情景；水则记录变化；目标落到现有对象；水工构件契约由本层定义。 近域二维，渠涵一维，远域节点：近域用二维地表水（现有1米编辑格，半径有上限）；渠和涵是一维连接；远域湖塘与控制口用节点—连接。；阶段一的四个情景：一座真实岛，地表自由水加土方：土塞挖到最后一层才通、切通、堵口、开口；“够用”是答对通不通、涨还是落、谁先到。；水则：世界内的记录物：可建的刻度石让玩家记下不同日子的水位，比较工程前后的效果；雨停后的自然退水不全算工程功劳。；目标落到现有对象：改善绑定村民取水路程、田块积水与干湿、道路与房屋受淹；正向验收在副本里用同一驱动对比有无工程。；最小水工构件契约：闸、涵、井、管各有开口几何、开度、能力、材料与可建条件；第六层定义，第七层只读；哪些当前可建由用户决定。。2026-10-30复核补案，待用户确认；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="MK-14-layer6" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2f6b5e"/></marker><marker id="WMK-14-layer6" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b5533f"/></marker><pattern id="HT-14-layer6" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f6e5df"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b5533f" stroke-width="3"/></pattern></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#22332f}.t{font-size:26px;font-weight:700}.b{font-size:14px;fill:#6a5a8a}.cap{font-size:20px;font-weight:700}.note{font-size:17px}.l{font-size:16px}.s{font-size:14px}.m{font-size:14px;fill:#5d6f69}.h{font-size:17px;font-weight:700}.big{font-size:30px;font-weight:700}.pv{font-size:15px;fill:#6a4f96;font-weight:700}.wv{font-size:15px;fill:#a2493a;font-weight:700}
