="M60 330L380 330L380 440L60 440Z" class="water" /><line x1="60" y1="330" x2="380" y2="330" class="wline" /><rect x="540" y="180" width="170" height="30" rx="15" class="chip"/><text x="625" y="200" class="l" text-anchor="middle">工程前：盛夏 2 格</text><rect x="540" y="240" width="170" height="30" rx="15" class="chipon"/><text x="625" y="260" class="l" text-anchor="middle">工程后：盛夏 3 格</text><text x="540" y="320" class="l" text-anchor="start">记下来水与日期，再比较</text><text x="540" y="356" class="m" text-anchor="start">雨停退水不全算工程功劳</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">3 / 5  水则：世界内的记录物</text><text x="44" y="552" class="note" text-anchor="start">可建的刻度石让玩家记下不同日子的水位，比较工程前后的效果；雨停后的自然退水不全算工程功劳。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="60" y="170" width="260" height="100" rx="10" class="card"/><text x="190" y="216" class="h" text-anchor="middle">取水路程</text><text x="190" y="240" class="s" text-anchor="middle">村 → 水源</text><rect x="350" y="170" width="260" height="100" rx="10" class="card"/><text x="480" y="216" class="h" text-anchor="middle">田块干湿</text><text x="480" y="240" class="s" text-anchor="middle">积水 / 干裂</text><rect x="640" y="170" width="260" height="100" rx="10" class="card"/><text x="770" y="216" class="h" text-anchor="middle">受淹</text><text x="770" y="240" class="s" text-anchor="middle">道路 · 房屋</text><rect x="60" y="320" width="840" height="70" rx="10" class="prop"/><text x="480" y="362" class="pv" text-anchor="middle">副本中同一驱动：有工程 vs 无工程</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">4 / 5  目标落到现有对象</text><text x="44" y="552" class="note" text-anchor="start">改善绑定村民取水路程、田块积水与干湿、道路与房屋受淹；正向验收在副本里用同一驱动对比有无工程。</text></g><g data-step="4" opacity="0"><animate attributeN