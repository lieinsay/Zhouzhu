<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title-12-layer4 desc-12-layer4" data-chapter="12-layer4"><title id="title-12-layer4">第四层：按需导出与能力级</title><desc id="desc-12-layer4">只导出有消费者的量；按“岛群×域”声明能力级；游玩期几何静态为基础能力；新增仅粗版与未生成状态和断面内派生速度。 消费者需求矩阵：显示、碰撞、查询、HUD、水态、存档各列所需的量；应力、孔压、形成史等没有消费者，留在生成器，只导出摘要与来源哈希。；能力级L0—L3：L0为v1原样；L1统一查询与HUD口径；L2为真实断面与一维水态；L3起才有地下与运行时几何变化。按“岛群×域”声明。；几何静态，水态按节拍：游玩期几何不变是基础能力，只按节拍发布水态；声明“运行几何变更”能力时才启用完整的变地形发布流程。；仅粗版与未生成：新增两种状态：按需生成的岛群以当前世界时刻起始并预热；生成成本超预算的岛群锁在较低能力级。；断面内派生速度：由同一断面的A(h)/T(h)与当处水深做横向分配，标为近似；供纹理与身体采样，不进HUD与通航判定。。2026-10-30复核补案，待用户确认；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="MK-12-layer4" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2f6b5e"/></marker><marker id="WMK-12-layer4" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b5533f"/></marker><pattern id="HT-12-layer4" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f6e5df"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b5533f" stroke-width="3"/></pattern></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#22332f}.t{font-size:26px;font-weight:700}.b{font-size:14px;fill:#6a5a8a}.cap{font-size:20px;font-weight:700}.note{font-size:17px}.l{font-size:16px}.s{font-size:14px}.m{font-size:14px;fill:#5d6f69}.h{font-size:17px;font-weight:700}.big{font-size:30px;font-weight:700}.pv{font-size:15px;fill:#6a4f96;font-weight:700}.wv{font-size:15px;fill:#a2493a;font-weight:700}
