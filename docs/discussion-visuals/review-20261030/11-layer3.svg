<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title-11-layer3 desc-11-layer3" data-chapter="11-layer3"><title id="title-11-layer3">第三层：先归因，再改善</title><desc id="desc-11-layer3">河段分档；先在旧数据上把细浅拆三份；用冻结输入跑真实河段；按分布对比判断改善；运行期只做事件更新；岸料来源待定。 河段三档：主河段连续断面加准二维床岸；一般河段断面平均降阶闭合；不足一个源格宽的小沟只给统计属性和能力标记。；M0：把“细浅”拆成三份：在旧6068同版河段上，拆出来水限制、表示损失和模型限制三部分；各占多少要实测，图中不代表比例。；M1：冻结输入的真实河段：冻结现有地形、材料和第二层代表年Q，先跑几段真实河，产出可用于游戏的断面。；改善看分布，不看个例：参数先锁定，同一Q下与旧基线比较平均水深、宽深比的分布；独立实测的水力几何散布只作证伪带，不作目标。；运行期只做事件更新：生成期离线成形；运行期只在近域、洪水或新渠超过起动判据时做降阶更新，远域冻结。；岸料与植被的来源：黏聚与细料取第一层风化成土；植被取生成器已有的landcover_natural静态类别作物性输入，或写成无植被设定，需用户决定。。2026-10-30复核补案，待用户确认；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="MK-11-layer3" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2f6b5e"/></marker><marker id="WMK-11-layer3" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b5533f"/></marker><pattern id="HT-11-layer3" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f6e5df"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b5533f" stroke-width="3"/></pattern></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#22332f}.t{font-size:26px;font-weight:700}.b{font-size:14px;fill:#6a5a8a}.cap{font-size:20px;font-weight:700}.note{font-size:17px}.l{font-size:16px}.s{font-size:14px}.m{font-size:14px;fill:#5d6f69}.h{font-size:17px;font-weight:700}.big{font-size:30px;font-weight:700}.pv{font-size:15px;fill:#6a4f96;font-weight:700}.wv{font-size:15px;fill:#a2493a;font-weight:700}
