><rect x="554" y="340" width="28" height="60" rx="2" class="barp"/><rect x="588" y="280" width="28" height="120" rx="2" class="barp"/><rect x="622" y="240" width="28" height="160" rx="2" class="barp"/><rect x="656" y="290" width="28" height="110" rx="2" class="barp"/><rect x="690" y="350" width="28" height="50" rx="2" class="barp"/><text x="180" y="430" class="l" text-anchor="middle">旧基线</text><text x="620" y="430" class="l" text-anchor="middle">新（同一 Q）</text><rect x="500" y="140" width="240" height="260" rx="10" class="ref"/><text x="620" y="130" class="pv" text-anchor="middle">证伪带：实测散布</text><text x="80" y="150" class="h" text-anchor="start">平均水深 / 宽深比的分布</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">4 / 6  改善看分布，不看个例</text><text x="44" y="552" class="note" text-anchor="start">参数先锁定，同一Q下与旧基线比较平均水深、宽深比的分布；独立实测的水力几何散布只作证伪带，不</text><text x="44" y="579" class="note" text-anchor="start">作目标。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="60" y="140" width="380" height="300" rx="10" class="on"/><text x="80" y="170" class="h" text-anchor="start">近域</text><path d="M80 300C180 280 260 320 420 300" class="widew" /><text x="80" y="360" class="l" text-anchor="start">洪水 / 新渠超过起动判据</text><text x="80" y="390" class="pv" text-anchor="start">→ 事件式降阶更新</text><rect x="500" y="140" width="400" height="300" rx="10" class="card"/><text x="520" y="170" class="h" text-anchor="start">远域</text><rect x="531" y="212" width="18" height="14" rx="3" class="lock"/><path d="M534 212V206Q540 199 546 206V212" class="lockl" /><text x="560" y="222" class="l" text-anchor="start">冻结</text><text x="520" y="270" class="s" text-anchor="start">亚分辨率库存按8.1累计</text><rect x="24" y="486" width="912" height="134" rx="12" fill