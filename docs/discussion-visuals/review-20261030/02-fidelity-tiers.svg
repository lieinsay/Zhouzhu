ass="bad" /><line x1="646" y1="259" x2="662" y2="243" class="bad" /><rect x="410" y="332" width="142" height="30" rx="15" class="chipx"/><text x="481" y="352" class="l" text-anchor="middle">运行时地质积分</text><line x1="386" y1="339" x2="402" y2="355" class="bad" /><line x1="386" y1="355" x2="402" y2="339" class="bad" /><rect x="670" y="332" width="125" height="30" rx="15" class="chipx"/><text x="732.5" y="352" class="l" text-anchor="middle">每核能量闭合</text><line x1="646" y1="339" x2="662" y2="355" class="bad" /><line x1="646" y1="355" x2="662" y2="339" class="bad" /><text x="410" y="440" class="m" text-anchor="start">需要时只能逐项登记升档</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">3 / 5  基准档明确不做的</text><text x="44" y="552" class="note" text-anchor="start">三维非静水、Richards方程、孔隙弹性、热传导、运行时地质积分，以及每个计算核单独做能量</text><text x="44" y="579" class="note" text-anchor="start">闭合。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="40" y="120" width="330" height="92" rx="10" class="card"/><text x="205" y="162" class="h" text-anchor="middle">A 设定约束</text><text x="205" y="186" class="s" text-anchor="middle">论证一次 → 只核对</text><rect x="40" y="232" width="330" height="92" rx="10" class="card"/><text x="205" y="274" class="h" text-anchor="middle">B 生成期离线</text><text x="205" y="298" class="s" text-anchor="middle">只导出被消费的量</text><rect x="40" y="344" width="330" height="92" rx="10" class="card"/><text x="205" y="386" class="h" text-anchor="middle">C 运行时</text><text x="205" y="410" class="s" text-anchor="middle">固定几何上推进</text><line x1="400" y1="130" x2="580" y2="130" class="thin" /><line x1="400" y1="130" x2="400" y2="310" class="thin" /><line x1="400" y1="175" x2="580" y2="175" class="thin" /><line x1="445" y1="130" x2="445" y2="310" class="thin" /><line x1="400" y1="220" x2="580" y2="220" c