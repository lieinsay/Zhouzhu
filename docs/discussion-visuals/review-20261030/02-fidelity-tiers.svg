<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title-02-fidelity-tiers desc-02-fidelity-tiers" data-chapter="02-fidelity-tiers"><title id="title-02-fidelity-tiers">保真度档：先定算到哪里</title><desc id="desc-02-fidelity-tiers">规则分A设定约束、B生成期、C运行时三档；每个域有基准表示、明确不做的清单和“够用”判据，升档须过一道门。 三档归属：A档只在设计与参数表中论证一次，对快照做检查；B档由生成器离线计算，只导出有消费者的量；C档是游戏运行时推进的状态。；每个域都有基准表示：河用一维断面网，湖塘用V(z)库容，土水用少层土桶，地下水用分区水头，冰雪用度日，地质用冻结快照。基准档就是默认交付。；基准档明确不做的：三维非静水、Richards方程、孔隙弹性、热传导、运行时地质积分，以及每个计算核单独做能量闭合。；“够用”看判断是否改变：只在登记样本上换两档分辨率：连通与否、从哪个出口走、控制点水位等判断都不变，就算够用，不追求物理上无限收敛。；升档要过一道门：写明哪个下游判断在基准档会出错、估算成本、经用户批准，才在登记的局部升到二维等更高表示。。2026-10-30复核补案，待用户确认；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="MK-02-fidelity-tiers" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2f6b5e"/></marker><marker id="WMK-02-fidelity-tiers" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b5533f"/></marker><pattern id="HT-02-fidelity-tiers" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f6e5df"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b5533f" stroke-width="3"/></pattern></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#22332f}.t{font-size:26px;font-weight:700}.b{font-size:14px;fill:#6a5a8a}.cap{font-size:20px;font-weight:700}.note{font-size:17px}.l{font-size:16px}.s{font-size:14px}.m{font-size:14px;fill:#5d6f69}.h{font-size:17px;font-weight:700}.big{font-size:30px;font-weight:700}.pv{font-size:15px;fill:#6a4f96;font-weight:700}.wv{font-size:15px;fill:#a2493a;font-weight:700}
