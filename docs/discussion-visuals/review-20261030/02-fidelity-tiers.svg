.bar{fill:#9fb7ae}.barw{fill:#d79b8b}.barp{fill:#bba6d6}.panel{fill:#f1efe6;stroke:#c9c4b4;stroke-width:1.2}.widew{fill:none;stroke:#a9d6e2;stroke-width:22;stroke-linecap:round}</style><rect width="960" height="640" fill="#f6f4ec"/><text x="32" y="46" class="t" text-anchor="start">02 / 保真度档：先定算到哪里</text><text x="32" y="76" class="b" text-anchor="start">2026-10-30复核补案 · 待用户确认 · 非比例因果示意，图形秒数不是物理时间</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="40" y="120" width="330" height="92" rx="10" class="on"/><text x="205" y="162" class="h" text-anchor="middle">A 设定约束</text><text x="205" y="186" class="s" text-anchor="middle">论证一次 → 只核对</text><rect x="40" y="232" width="330" height="92" rx="10" class="on"/><text x="205" y="274" class="h" text-anchor="middle">B 生成期离线</text><text x="205" y="298" class="s" text-anchor="middle">只导出被消费的量</text><rect x="40" y="344" width="330" height="92" rx="10" class="on"/><text x="205" y="386" class="h" text-anchor="middle">C 运行时</text><text x="205" y="410" class="s" text-anchor="middle">固定几何上推进</text><text x="400" y="150" class="l" text-anchor="start">储能势 · 成核接合 · 亿年保存</text><line x1="400" y1="160" x2="880" y2="160" class="thin" marker-end="url(#MK-02-fidelity-tiers)"/><text x="400" y="190" class="s" text-anchor="start">核对：质量 · 支撑≥重量 · 力矩</text><text x="400" y="262" class="l" text-anchor="start">岛体顶底 · 层界 · V(z) · 断面 · 初始水</text><text x="400" y="292" class="s" text-anchor="start">导出包字段 + 来源哈希</text><text x="400" y="374" class="l" text-anchor="start">水态 · 改地 · 用水 · 载体</text><text x="400" y="404" class="s" text-anchor="start">存档与查询</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">1 / 5  三档归属</text><text x="44" y="552" class="note" text-anchor="start">A档只在设计与参数表中论证一次，对快照做检查；B档由生成器离线计算，只导出有消费者的量；C档</text><text x="44" y="579" class="note" text-anchor="start">是游戏运行时推进的状态。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="40" y="120" width="330" height="92" rx="10" class="card"/><text x="205" y="162" class="h" text-anchor="middle">A 设定约束</text><text x="205" y="186" class="s" text-anchor="middle">论证一次 → 只核对</text><rect x="40" y="232" width="330" height="92" rx="10" class="card"/><text x="205" y="274" class="h" text-anchor="middle">B 生成期离线</text><text x="205" y="298" class="s" text-anchor="middle">只导出被消费的量</text><rect x="40" y="344" width="330" height="92" rx="10" class="card"/><text x="205" y="386" class="h" text-anchor="middle">C 运行时</text><text x="205" y="410" class="s" text-anchor="middle">固定几何上推进</text><rect x="400" y="124" width="250" height="84" rx="10" class="on"/><text x="525" y="162" class="h" text-anchor="middle">河与渠</text><text x="525" y="186" class="s" text-anchor="middle">一维断面网</text><rect x="670" y="124" width="250" height="84" rx="10" class="on"/><text x="795" y="162" class="h" text-anchor="middle">湖塘</text><text x="795" y="186" class="s" text-anchor="middle">V(z) 库容</text><rect x="400" y="228" width="250" height="84" rx="10" class="on"/><text x="525" y="266" class="h" text-anchor="middle">土水</text><text x="525" y="290" class="s" text-anchor="middle">少层土桶</text><rect x="670" y="228" width="250" height="84" rx="10" class="on"/><text x="795" y="266" class="h" text-anchor="middle">地下水</text><text x="795" y="290" class="s" text-anchor="middle">分区水头</text><rect x="400" y="332" width="250" height="84" rx="10" class="on"/><text x="525" y="370" class="h" text-anchor="middle">冰雪</text><text x="525" y="394" class="s" text-anchor="middle">度日</text><rect x="670" y="332" width="250" height="84" rx="10" class="on"/><text x="795" y="370" class="h" text-anchor="middle">地质</text><text x="795" y="394" class="s" text-anchor="middle">冻结快照</text><rect x="24" y="486" width