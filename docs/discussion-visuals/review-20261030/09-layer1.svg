<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title-09-layer1 desc-09-layer1" data-chapter="09-layer1"><title id="title-09-layer1">第一层：成因分档与湖的来路</title><desc id="desc-09-layer1">出生链标A/B/C档；默认单向耦合、运行时冻结地质；先停止写回填洼；补湖与缓水的成因目录；定值前用冻结快照。 出生链标三档：元素迁移、成核接合、骨架上移属A档，只核对质量、支撑与力矩；岛体与地表属B档，只交下游用到的量。；单向耦合，运行时冻结地质：地质步算完再把原水量分到新几何上；运行时不积分地质，只有生成器交付的临界控制点能触发单点事件。；S0：停止把填洼写回地面：原生成链把priority_fill写回地面，真实盆地被填平；S0保留盆地，按V(z)蓄水，接上溢口与统一水量账。；湖与缓水的五种来路：原文只有断陷一类。补充崩塌堰塞、冲积扇堵塞支流、差异侵蚀与溶蚀洼地、岛体掀斜围合，寒区另有冰缘洼地；不设配额。；定值前用冻结快照：浮石等虚构物性由用户给出世界设定值；在此之前，各水层以现有地形、层序与岩性的冻结快照为输入，并标“旧成因输入”。。2026-10-30复核补案，待用户确认；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="MK-09-layer1" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2f6b5e"/></marker><marker id="WMK-09-layer1" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b5533f"/></marker><pattern id="HT-09-layer1" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f6e5df"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b5533f" stroke-width="3"/></pattern></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#22332f}.t{font-size:26px;font-weight:700}.b{font-size:14px;fill:#6a5a8a}.cap{font-size:20px;font-weight:700}.note{font-size:17px}.l{font-size:16px}.s{font-size:14px}.m{font-size:14px;fill:#5d6f69}.h{font-size:17px;font-weight:700}.big{font-size:30px;font-weight:700}.pv{font-size:15px;fill:#6a4f96;font-weight:700}.wv{font-size:15px;fill:#a2493a;font-weight:700}
