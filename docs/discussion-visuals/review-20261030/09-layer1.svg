.bar{fill:#9fb7ae}.barw{fill:#d79b8b}.barp{fill:#bba6d6}.panel{fill:#f1efe6;stroke:#c9c4b4;stroke-width:1.2}.widew{fill:none;stroke:#a9d6e2;stroke-width:22;stroke-linecap:round}</style><rect width="960" height="640" fill="#f6f4ec"/><text x="32" y="46" class="t" text-anchor="start">09 / 第一层：成因分档与湖的来路</text><text x="32" y="76" class="b" text-anchor="start">2026-10-30复核补案 · 待用户确认 · 非比例因果示意，图形秒数不是物理时间</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="40" y="200" width="160" height="70" rx="10" class="card"/><text x="120" y="241" class="h" text-anchor="middle">元素迁移</text><rect x="90" y="290" width="57" height="30" rx="15" class="chip"/><text x="118.5" y="310" class="s" text-anchor="middle">A 档</text><line x1="202" y1="235" x2="220" y2="235" class="arrow" marker-end="url(#MK-09-layer1)"/><rect x="222" y="200" width="160" height="70" rx="10" class="card"/><text x="302" y="241" class="h" text-anchor="middle">成核接合</text><rect x="272" y="290" width="57" height="30" rx="15" class="chip"/><text x="300.5" y="310" class="s" text-anchor="middle">A 档</text><line x1="384" y1="235" x2="402" y2="235" class="arrow" marker-end="url(#MK-09-layer1)"/><rect x="404" y="200" width="160" height="70" rx="10" class="card"/><text x="484" y="241" class="h" text-anchor="middle">骨架上移</text><rect x="454" y="290" width="57" height="30" rx="15" class="chip"/><text x="482.5" y="310" class="s" text-anchor="middle">A 档</text><line x1="566" y1="235" x2="584" y2="235" class="arrow" marker-end="url(#MK-09-layer1)"/><rect x="586" y="200" width="160" height="70" rx="10" class="card"/><text x="666" y="241" class="h" text-anchor="middle">岛体出生</text><rect x="636" y="290" width="57" height="30" rx="15" class="chipon"/><text x="664.5" y="310" class="s" text-anchor="middle">B 档</text><line x1="748" y1="235" x2="766" y2="235" class="arrow" marker-end="url(#MK-09-layer1)"/><rect x="768" y="200" width="160" height="70" rx="10" class="card"/><text x="848" y="241" class="h" text-anchor="middle">地表与水</text><rect x="818" y="290" width="74" height="30" rx="15" class="chipon"/><text x="855" y="310" class="s" text-anchor="middle">B/C 档</text><text x="40" y="400" class="pv" text-anchor="start">A：质量 · 支撑≥重量 · 力矩</text><text x="500" y="400" class="l" text-anchor="start">B：只交下游用到的量</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">1 / 5  出生链标三档</text><text x="44" y="552" class="note" text-anchor="start">元素迁移、成核接合、骨架上移属A档，只核对质量、支撑与力矩；岛体与地表属B档，只交下游用到的</text><text x="44" y="579" class="note" text-anchor="start">量。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="60" y="170" width="200" height="80" rx="10" class="card"/><text x="160" y="206" class="h" text-anchor="middle">地质快照</text><text x="160" y="230" class="s" text-anchor="middle">生成期</text><line x1="262" y1="210" x2="400" y2="210" class="arrow" marker-end="url(#MK-09-layer1)"/><rect x="404" y="170" width="200" height="80" rx="10" class="on"/><text x="504" y="206" class="h" text-anchor="middle">重新分配原水</text><text x="504" y="230" class="s" text-anchor="middle">单向</text><path d="M500 252Q330 330 180 254" class="ghost" marker-end="url(#MK-09-layer1)"/><text x="250" y="330" class="m" text-anchor="start">双向：只逐例登记</text><rect x="650" y="150" width="270" height="150" rx="8" class="panel"/><rect x="671" y="180" width="18" height="14" rx="3" class="lock"/><path d="M674 180V174Q680 167 686 174V180" class="lockl" /><text x="700" y="190" class="h" text-anchor="start">运行时：地质冻结</text><text x="670" y="226" class="pv" text-anchor="start">临界控制点清单</text><text x="670" y="252" class="s" text-anchor="start">· 濒临切通的出口</text><text x="670" y="276" class="s" text-anchor="start">· 濒临失稳的接触</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">2 / 5  单向耦合，运行时冻结地质</text><text x="44" y="552" class="note" text-anchor="start">地质步算完再把原水量分到新几何上；运行时不积分地质，只有生成器交付的临界控制点能触发单点事件。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><text x="80" y="150" class="h" text-anchor="start">原：写回填洼</text><path d="M60 300L140 240L200 290L280 290L340 230L420 300L420 400L60 400Z" class="rock" /><path d="M140 240L180 260L200 260L280 260L320 240L340 230L330 260Z" class="ghost" /><rect x="160" y="258" width="140" height="32" rx="3" class="warnc"/><text x="230" y="280" class="wv" text-anchor="middle">填平</text><text x="520" y="150" class="h" text-anchor="start">S0：保留盆地</text><path d="M500 300L580 240L640 330L720 330L780 230L860 300L860 400L500 400Z" class="rock" /><path d="M612 290L640 330L720 330L748 290Z" class="water" /><line x1="612" y1="290" x2="748" y2="290" class="wline" /><text x="680" y="360" class="pv" text-anchor="middle">按 V(z) 蓄水</text><line x1="750" y1="288" x2="800" y2="250" class="arrow" marker-end="url(#MK-09-layer1)"/><text x="804" y="246" class="s" text-anchor="start">溢口</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">3 / 5  S0：停止把填洼写回地面</text><text x="44" y="552" class="note" text-anchor="start">原生成链把priority_fill写回地面，真实盆地被填平；S0保留盆地，按V(z)蓄水，</text><text x="44" y="579" class="note" text-anchor="start">接上溢口与统一水量账。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><g transform="translate(30 150)"><rect x="0" y="0" width="160" height="150" rx="10" class="card"/><path d="M20 60L50 60L60 90L100 90L110 60L140 60L140 140L20 140Z" class="rock" /><path d="M55 75L60 90L100 90L105 75Z" class="water" /></g><text x="110" y="330" class="h" text-anchor="middle">断陷</text><g transform="translate(212 150)"><rect x="0" y="0" width="160" height="150" rx="10" class="card"/><path d="M20 50L60 80L95 90L100 70L115 55L140 50L140 140L20 140Z" class="rock" /><path d="M48 72L60 80L95 90L97 80Z" class="water" /><path d="M95 90L100 70L115 55L125 90Z" class="deep" /></g><text x="292" y="330" class="h" text-anchor="middle">崩塌堰塞</text><g transform="translate(394 150)"><rect x="0" y="0" width="160" height="150" rx="10" class="card"/><path d="M20 60L70 85L110 85L140 60L140 140L20 140Z" class="rock" /><path d="M36 68L70 85L90 85L92 72Z" class="water" /><path d="M90 85Q110 60 140 60L140 85Z" class="deep" /></g><text x="474" y="330" class="h" text-anchor="middle">扇堵支流</text><g transform="translate(576 150)"><rect x="0" y="0" width="160" height="150" rx="10" class="card"/><path d="M20 55L55 55Q80 100 105 55L140 55L140 140L20 140Z" class="rock" /><path d="M62 68Q80 92 98 68Z" class="water" /></g><text x="656" y="330" class="h" text-anchor="middle">溶蚀洼地</text><g transform="translate(758 150)"><rect x="0" y="0" width="160" height="150" rx="10" class="card"/><path d="M20 40L80 90L140 70L140 140L20 140Z" class="rock" /><path d="M56 70L80 90L104 82L104 70Z" class="water" /></g><text x="838" y="330" class="h" text-anchor="middle">掀斜围合</text><text x="30" y="380" class="pv" text-anchor="start">各写所需过程与未覆盖项 · 不设湖泊配额 · 堰塞溃决并入出口能力</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">4 / 5  湖与缓水的五种来路</text><text x="44" y="552" class="note" text-anchor="start">原文只有断陷一类。补充崩塌堰塞、冲积扇堵塞支流、差异侵蚀与溶蚀洼地、岛体掀斜围合，寒区另有冰</text><text x="44" y="579" class="note" text-anchor="start">缘洼地；不设配额。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="60" y="160" width="220" height="80" rx="10" class="prop"/><text x="170" y="196" class="h" text-anchor="middle">用户给世界值</text><text x="170" y="220" class="s" text-anchor="middle">浮石物性范围</text><line x1="282" y1="200" x2="380" y2="200" class="arrow" marker-end="url(#MK-09-layer1)"/><rect x="384" y="160" width="220" height="80" rx="10" class="on"/><text x="494" y="196" class="h" text-anchor="middle">成因快照</text><text x="494" y="220" class="s" text-anchor="middle">W4</text><rect x="60" y="300" width="220" height="80" rx="10" class="card"/><text x="170" y="336" class="h" text-anchor="middle">冻结快照</text><text x="170" y="360" class="s" text-anchor="middle">旧成因输入</text><line x1="282" y1="340" x2="640" y2="250" class="arrow" marker-end="url(#MK-09-layer1)"/><line x1="606" y1="200" x2="640" y2="230" class="arrow" marker-end="url(#MK-09-layer1)"/><rect x="644" y="200" width="260" height="80" rx="10" class="card"/><text x="774" y="236" class="h" text-anchor="middle">各水层输入</text><text x="774" y="260" class="s" text-anchor="middle">契约相同</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">5 / 5  定值前用冻结快照</text><text x="44" y="552" class="note" text-anchor="start">浮石等虚构物性由用户给出世界设定值；在此之前，各水层以现有地形、层序与岩性的冻结快照为输入，</text><text x="44" y="579" class="note" text-anchor="start">并标“旧成因输入”。</text></g></svg>
