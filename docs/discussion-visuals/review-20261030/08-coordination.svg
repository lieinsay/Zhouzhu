<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title-08-coordination desc-08-coordination" data-chapter="08-coordination"><title id="title-08-coordination">与之后落地的决定对齐</title><desc id="desc-08-coordination">浮高、天气、精绘日式、水色、盐与农田，分别和七层原文对齐。 浮高计划F2/F3：W4之前F2按岛龄定高度作“旧成因输入”，W4起由岛体平衡高度替换；F3截短龙骨改为检查项，不满足就报告。；天气只有一个来源：现有WeatherModel与行星天气场是唯一运行时降雨来源；第一层的雨程统计改为对它的检查，游戏里不另造降雨。；精绘日式是单调重映射：风格化只能把光程、当处深度、实际接触、受支持的流动等物理派生量重映射成色阶、手绘波纹与接触描边，不引入没有物理驱动的信号。；水色按控制域赋色类：生成器按来源（雨、泉、湖、咸、浑）给控制域赋色类，只在域间交换时更新；色类附带吸收色与清度级两项光学预设。；盐只作生成期示踪：盐质量只在生成期守恒示踪，用来定初始色类淡、微咸、咸；运行时不携带盐量，结晶等过程延期。；农田有墒情读口：农田模型增加“土水状态→墒情”读口；饮用等用途的去向进入既有蒸散开放边界或真实地面受体。。2026-10-30复核补案，待用户确认；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="MK-08-coordination" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2f6b5e"/></marker><marker id="WMK-08-coordination" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b5533f"/></marker><pattern id="HT-08-coordination" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f6e5df"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b5533f" stroke-width="3"/></pattern></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#22332f}.t{font-size:26px;font-weight:700}.b{font-size:14px;fill:#6a5a8a}.cap{font-size:20px;font-weight:700}.note{font-size:17px}.l{font-size:16px}.s{font-size:14px}.m{font-size:14px;fill:#5d6f69}.h{font-size:17px;font-weight:700}.big{font-size:30px;font-weight:700}.pv{font-size:15px;fill:#6a4f96;font-weight:700}.wv{font-size:15px;fill:#a2493a;font-weight:700}
