 class="card"/><text x="60" y="429" class="l" text-anchor="start">农田墒情</text><rect x="310" y="110" width="620" height="350" rx="10" class="panel"/><line x1="360" y1="420" x2="880" y2="420" class="axis" /><line x1="360" y1="420" x2="360" y2="160" class="axis" /><text x="620" y="450" class="s" text-anchor="middle">物理派生量（如光程）</text><text x="370" y="152" class="s" text-anchor="start">色阶</text><path d="M360 400H464V354H568V308H672V262H776V216H880V170" class="wline" /><text x="390" y="200" class="pv" text-anchor="start">单调：深的不会比浅的浅</text><rect x="650" y="320" width="113" height="30" rx="15" class="chipx"/><text x="706.5" y="340" class="s" text-anchor="middle">无驱动的信号</text><line x1="632" y1="327" x2="648" y2="343" class="bad" /><line x1="632" y1="343" x2="648" y2="327" class="bad" /><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">3 / 6  精绘日式是单调重映射</text><text x="44" y="552" class="note" text-anchor="start">风格化只能把光程、当处深度、实际接触、受支持的流动等物理派生量重映射成色阶、手绘波纹与接触描</text><text x="44" y="579" class="note" text-anchor="start">边，不引入没有物理驱动的信号。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="40" y="110" width="230" height="46" rx="8" class="card"/><text x="60" y="139" class="l" text-anchor="start">浮高 F2/F3</text><rect x="40" y="168" width="230" height="46" rx="8" class="card"/><text x="60" y="197" class="l" text-anchor="start">天气来源</text><rect x="40" y="226" width="230" height="46" rx="8" class="card"/><text x="60" y="255" class="l" text-anchor="start">精绘日式</text><rect x="40" y="284" width="230" height="46" rx="8" class="on"/><text x="60" y="313" class="h" text-anchor="start">水色色类</text><rect x="40" y="342" width="230" height="46" rx="8" class="card"/><text x="60" y="371" class="l" text-anchor="start">盐</text><rect x="40" y="400" width="230" height="46" rx="8" class="card"/><text x="60" y="429" class="l" text-anchor="start">农田墒情</text><rect x="310" y="110" width="620" height="350" rx="10" class="panel"/><rect x="350" y="170" width="96" height="70" rx="8" fill="#9fd0de"/><text x="398" y="212" class="h" text-anchor="middle">雨</text><rect x="462" y="170" width="96" height="70" rx="8" fill="#7fc4cf"/><text x="510" y="212" class="h" text-anchor="middle">泉</text><rect x="574" y="170" width="96" height="70" rx="8" fill="#5aa5c0"/><text x="622" y="212" class="h" text-anchor="middle">湖</text><rect x="686" y="170" width="96" height="70" rx="8" fill="#8fb7a6"/><text x="734" y="212" class="h" text-anchor="middle">咸</text><rect x="798" y="170" width="96" height="70" rx="8" fill="#b9a77f"/><text x="846" y="212" class="h" text-anchor="middle">浑</text><text x="350" y="280" class="l" text-anchor="start">每个色类附：吸收色 · 清度级</text><text x="350" y="320" class="l" text-anchor="start">只在域间交换时更新；容器按体积线性混合</text><text x="350" y="360" class="m" text-anchor="start">用途规则写出前：饮用、做饭、灌溉不依赖色类</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">4 / 6  水色按控制域赋色类</text><text x="44" y="552" class="note" text-anchor="start">生成器按来源（雨、泉、湖、咸、浑）给控制域赋色类，只在域间交换时更新；色类附带吸收色与清度级</text><text x="44" y="579" class="note" text-anchor="start">两项光学预设。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="40" y="110" width="230" height="46" rx="8" class="card"/><text x="60" y="139" class="l" text-anchor="start">浮高 F2/F3</text><rect x="40" y="168" width="230" height="46" rx="8" class="card"/><text x="60" y="197" class="l" text-anchor="start">天气来源</text><rect x="40" y="226" width="230" height="46" rx="8" class="card"/><text x="60" y="255" class="l" text-anchor="start">精绘日式</text><rect x="40" y="284" width="230" height="46" rx="8" class="card"/><text x="60" y="313" class="l" text-anchor="start">水色色类</text><rect x="40" y="342" width="230" height="46" rx="8" class="on"/><text x="60" y="371" class="h" text-anchor="start">盐</text><rect x="40" y="400" width="230" height="46" rx="8" class="card"/><text x="60" y="429" class="l" text-anchor="start">农田墒情</text><rect x="310" y="110" width="620" height="350" rx="10" class="panel"/><rect x="350" y="170" width="190" height="70" rx="10" class="on"/><text x="445" y="201" class="h" text-anchor="middle">生成期</text><text x="445" y="225" class="s" text-anchor="middle">盐守恒示踪</text><line x1="542" y1="205" x2="600" y2="205" class="arrow" marker-end="url(#MK-08-coordination)"/><rect x="610" y="190" width="43" height="30" rx="15" class="chip"/><text x="631.5" y="210" class="l" text-anchor="middle">淡</text><rect x="700" y="190" width="59" height="30" rx="15" class="chip"/><text x="729.5" y="210" class="l" text-anchor="middle">微咸</text><rect x="790" y="190" width="43" height="30" rx="15" class="chip"/><text x="811.5" y="210" class="l" text-anchor="middle">咸</text><rect x="350" y="300" width="190" height="70" rx="10" class="card"/><text x="445" y="331" class="h" text-anchor="middle">运行时</text><text x="445" y="355" class="s" text-anchor="middle">不携带盐量</text><text x="570" y="340" class="pv" text-anchor="start">结晶等过程：延期（需用户确认）</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">5 / 6  盐只作生成期示踪</text><text x="44" y="552" class="note" text-anchor="start">盐质量只在生成期守恒示踪，用来定初始色类淡、微咸、咸；运行时不携带盐量，结晶等过程延期。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="40" y="110" width="230" height="46" rx="8" class="card"/><text x="60" y="139" class="l" text-anchor="start">浮高 F2/F3</text><rect x="40" y="168" width="230" height="46" rx="8" class="card"/><text x="60" y="197" class="l" text-anchor="start">天气来源</text><rect x="40" y="226" width="230" height="46" rx="8" class="card"/><text x="60" y="255" class="l" text-anchor="start">精绘日式</text><rect x="40" y="284" width="230" height="46" rx="8" class="card"/><text x="60" y="313" class="l" text-anchor="start">水色色类</text><rect x="40" y="342" width="230" height="46" rx="8" class="card"/><text x="60" y="371" class="l" text-anchor="start">盐</text><rect x="40" y="400" width="230" height="46" rx="8" class="on"/><text x="60" y="429" class="h" text-anchor="start">农田墒情</text><rect x="310" y="110" width="620" height="350" rx="10" class="panel"/><rect x="350" y="170" width="160" height="64" rx="10" class="card"/><text x="430" y="208" class="h" text-anchor="middle">土水状态</text><line x1="512" y1="202" x2="560" y2="202" class="arrow" marker-end="url(#MK-08-coordination)"/><rect x="564" y="170" width="120" height="64" rx="10" class="on"/><text x="624" y="198" class="h" text-anchor="middle">墒情</text><text x="624" y="222" class="s" text-anchor="middle">读口</text><line x1="686" y1="202" x2="734" y2="202" class="arrow" marker-end="url(#MK-08-coordination)"/><rect x="738" y="170" width="160" height="64" rx="10" class="card"/><text x="818" y="208" class="h" text-anchor="middle">growth_rate</text><rect x="350" y="310" width="160" height="64" rx="10" class="card"/><text x="430" y="348" class="h" text-anchor="middle">饮用 · 做饭</text><line x1="512" y1="342" x2="560" y2="342" class="arrow" marker-end="url(#MK-08-coordination)"/><rect x="564" y="310" width="334" height="64" rx="10" class="card"/><text x="731" y="348" class="h" text-anchor="middle">蒸散开放边界 / 地面受体</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">6 / 6  农田有墒情读口</text><text x="44" y="552" class="note" text-anchor="start">农田模型增加“土水状态→墒情”读口；饮用等用途的去向进入既有