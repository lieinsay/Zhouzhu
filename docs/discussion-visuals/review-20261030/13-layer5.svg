<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title-13-layer5 desc-13-layer5" data-chapter="13-layer5"><title id="title-13-layer5">第五层：先还原，再精绘</title><desc id="desc-13-layer5">旧包显示还原段先行；按三种视距定基准表示；风格化是单调重映射；47米有明确的找回程序。 W0：河心深度染整条：旧路径用河心深度给整条水带着色，岸边浅水也显得深；改为按当处床面深度，只去掉误读，不制造深度。；W0：去掉远处抬水：旧路径随距离无界抬高水面，远处河面浮在岸上；去掉后，改完仍浅就归源几何。；三种视距，三种基准表示：站岸近景用屏幕深度厚度加床面高度；对岸与河谷中景用顶点深度加简化反射；空艇远景只保湿宽连续与反光，不加宽。；风格化只做单调重映射：精绘日式的色阶、手绘波纹与接触描边，都来自物理派生量；“清透”是色类默认清度，由用户确认。；47米的找回程序：收集截图、位置、HUD读数与日期 → 在同代六包按多种口径筛选约47米河段 → 交用户辨认；状态分已定位、候选待认、确认无法定位。。2026-10-30复核补案，待用户确认；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="MK-13-layer5" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2f6b5e"/></marker><marker id="WMK-13-layer5" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b5533f"/></marker><pattern id="HT-13-layer5" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f6e5df"/><line x1="0" y1="0" x2="0" y2="10" stroke="#b5533f" stroke-width="3"/></pattern></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC','PingFang SC',sans-serif;fill:#22332f}.t{font-size:26px;font-weight:700}.b{font-size:14px;fill:#6a5a8a}.cap{font-size:20px;font-weight:700}.note{font-size:17px}.l{font-size:16px}.s{font-size:14px}.m{font-size:14px;fill:#5d6f69}.h{font-size:17px;font-weight:700}.big{font-size:30px;font-weight:700}.pv{font-size:15px;fill:#6a4f96;font-weight:700}.wv{font-size:15px;fill:#a2493a;font-weight:700}
