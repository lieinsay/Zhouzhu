109,172,191)"/><rect x="798" y="320" width="41" height="70" fill="rgb(118,178,195)"/><rect x="839" y="320" width="41" height="70" fill="rgb(127,184,198)"/><text x="60" y="420" class="s" text-anchor="start">岸边浅 → 深槽</text><text x="880" y="420" class="pv" text-anchor="end">只去掉误读，不制造深度</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">1 / 5  W0：河心深度染整条</text><text x="44" y="552" class="note" text-anchor="start">旧路径用河心深度给整条水带着色，岸边浅水也显得深；改为按当处床面深度，只去掉误读，不制造深度。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M40 420L220 170L280 170L460 420Z" class="soil" /><path d="M170 420L244 180L256 180L330 420Z" class="water" /><path d="M236 206L244 160L256 160L264 206Z" class="warnc" /><path d="M500 420L680 170L740 170L920 420Z" class="soil" /><path d="M630 420L704 180L716 180L790 420Z" class="water" /><text x="250" y="140" class="wv" text-anchor="middle">改前：远处水面浮在岸上</text><text x="710" y="140" class="l" text-anchor="middle">改后：水面留在岸内</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">2 / 5  W0：去掉远处抬水</text><text x="44" y="552" class="note" text-anchor="start">旧路径随距离无界抬高水面，远处河面浮在岸上；去掉后，改完仍浅就归源几何。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="40" y="130" width="280" height="300" rx="10" class="card"/><g transform="translate(110 330) scale(1)"><circle cx="0" cy="-52" r="8" class="person"/><line x1="0" y1="-43" x2="0" y2="-20" class="person" /><line x1="0" y1="-37" x2="-14" y2="-27" class="person" /><line x1="0" y1="-37" x2="13" y2="-29" class="person" /><line x1="0" y1="-20" x2="-10" y2="0" class="person" /><line x1="0" y1="-20" x2="10" y2="0" class="person" /></g><path d="M150 330L300 330L300 400L150 400Z" class="water" /><text x="60" y="160" class="h" text-anchor="start">站岸近景</text><text x="60" y="420" class="s" text-anchor="start">屏幕深度 + 床面高度</text><rect x="340" y="130" width="280" height="300" rx="10" class="card"/><path d="M360 330L420 260L540 260L600 330Z" class="soil" /><path d="M430 300L530 300L520 320L440 320Z" class="water" /><text x="360" y="160" class="h" text-anchor="start">对岸 / 河谷中景</text><text x="360" y="420" class="s" text-anchor="start">顶点深度 + 简化反射</text><rect x="640" y="130" width="280" height="300" rx="10" class="card"/><path d="M680 200L760 190L800 200L760 214Z" class="deep" /><path d="M660 360C720 340 800 380 900 350" class="wline" /><text x="660" y="160" class="h" text-anchor="start">空艇远景</text><text x="660" y="420" class="s" text-anchor="start">湿宽连续 · 反光 · 不加宽</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">3 / 5  三种视距，三种基准表示</text><text x="44" y="552" class="note" text-anchor="start">站岸近景用屏幕深度厚度加床面高度；对岸与河谷中景用顶点深度加简化反射；空艇远景只保湿宽连续与</text><text x="44" y="579" class="note" text-anchor="start">反光，不加宽。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><line x1="80" y1="420" x2="560" y2="420" class="axis" /><line x1="80" y1="420" x2="80" y2="150" class="axis" /><text x="320" y="450" class="s" text-anchor="middle">物理派生量</text><path d="M80 400H176V352H272V304H368V256H464V208H560V160" class="wline" /><rect x="620" y="160" width="280" height="60" rx="10" class="on"/><text x="760" y="196" class="h" text-anchor="middle">色阶 · 手绘波纹</text><rect x="620" y="240" width="280" height="60" rx="10" class="on"/><text x="760" y="276" class="h" text-anchor="middle">接触描边</text><rect x="620" y="320" width="280" height="60" rx="10" class="prop"/><text x="760" y="346" class="h" text-anchor="middle">“清透” = 默认清度</text><text x="760" y="370" class="s" text-anchor="middle">需用户确认</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">4 / 5  风格化只做单调重映射</text><text x="44" y="552" class="note" text-anchor="start">精绘日式的色阶、手绘波纹与接触描边，都来自物理派生量；“清透”是色类默认清度，由用户确认。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="40" y="170" width="190" height="70" rx="10" class="card"/><text x="135" y="211" class="h" text-anchor="middle">线索</text><line x1="232" y1="205" x2="268" y2="205" class="arrow" marker-end="url(#MK-13-layer5)"/><rect x="270" y="170" width="190" height="70" rx="10" class="card"/><text x="365" y="211" class="h" text-anchor="middle">六包筛选</text><line x1="462" y1="205" x2="498" y2="205" class="arrow" marker-end="url(#MK-13-layer5)"/><rect x="500" y="170" width="190" height="70" rx="10" class="card"/><text x="595" y="211" class="h" text-anchor="middle">候选</text><line x1="692" y1="205" x2="728" y2="205" class="arrow" marker-end="url(#MK-13-layer5)"/><rect x="730" y="170" width="190" height="70" rx="10" class="prop"/><text x="825" y="211" class="h" text-anchor="middle">用户辨认</text><rect x="80" y="300" width="76" height="30" rx="15" class="chipon"/><text x="118" y="320" class="l" text-anchor="middle">已定位</text><rect x="260" y="300" width="92" height="30" rx="15" class="chip"/><text x="306" y="320" class="l" text-anchor="middle">候选待认</text><rect x="460" y="300" width="158" height="30" rx="15" class="chipx"/><text x="539" y="320" class="l" text-anchor="middle">用户确认无法定位</text><text x="80" y="390" class="pv" text-anchor="start">代表案例另请用户指定，观看门由用户终判</text><rect x="24" y="486" width="912" height="134" rx="12" fill="#e9ece3"/><text x="44" y="520" class="cap" text-anchor="start">5 / 5  47米的找回程序</text><text x="44" y="552" class="note" text-anchor="start">收集截图、位置、HUD读数与日期 → 在同代六包按多种口径筛选约47米河段 → 交用户辨认；</text><text x="44" y="579" class="note" text-anchor="start">状态分已定位、候选待认、确认无法定位。</text></g></svg>
