<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-10-connectivity desc-10-connectivity"><title id="title-10-connectivity">连通过程：路径、时间与分域</title><desc id="desc-10-connectivity">过程合理性不是仅有守恒；非比例图示，不代表已计算输运。。连通需要路径、能力、水态和实际经过时间：位置相邻或账目守恒不足以证明交换；通路自身可储水、有限输送，水势和边界决定当前流向。。包气带可以渗漏，却不是一条满水管：湖河渗漏先改变路径含水和湿润前缘；实际入渗、毛细水势和非饱和导水限制交换，不能直连远端水头。。分湖保留切断时局地水态，不按容量分配：缓慢床脊抬起先挤水和交换，切断时各侧继承实际库存；只有近静水平衡适用时才用共同切断水位。。含水岩层移动，水仍能相对岩层渗流：移动孔隙边界与相对输运共同计算；只有相对交换可忽略时，才能近似把原孔隙水随岩层带走。。地质背景、局部控制点和水响应分开计时：整体更新是一亿年级设计域；局部改水路看控制高差和真实速度。水按同一物理时长响应，不带入地质加速。</desc><defs><marker id="arrow-10-connectivity" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">10 / 连通过程：路径、时间与分域</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="65" y="212" width="180" height="189" rx="12" class="strata"/><text x="79" y="245" class="label">真实路径</text><rect x="275" y="212" width="180" height="189" rx="12" class="strata"/><text x="289" y="245" class="label">水力能力</text><rect x="485" y="212" width="180" height="189" rx="12" class="strata"/><text x="499" y="245" class="label">当前水态</text><rect x="695" y="212" width="180" height="189" rx="12" class="strata"/><text x="709" y="245" class="label">实际时间</text><path d="M250 310 L268 310" class="flow" marker-end="url(#arrow-10-connectivity)"/><path d="M460 310 L478 310" class="flow" marker-end="url(#arrow-10-connectivity)"/><path d="M670 310 L688 310" class="flow" marker-end="url(#arrow-10-connectivity)"/><text x="102" y="468" class="label">四项分别核对；来源映射不是水的瞬间传送</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 5  连通需要路径、能力、水态和实际经过时间</text><text x="43" y="575" class="label">位置相邻或账目守恒不足以证明交换；通路自身可储水、有限输送，水势和边界决定当前流向。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 220 L320 220 L370 300 L450 345 L540 300 L590 220 L860 220 L860 465 L80 465Z" class="rock" /><path d="M348.125 265 L561.875 265 L561.875 265 L540 300 L450 345 L370 300 L348.125 265Z" class="water" /><line x1="348.125" y1="265" x2="561.875" y2="265" class="waterline"/><rect x="90" y="395" width="760" height="60" rx="0" class="sat"/><line x1="90" y1="395" x2="850" y2="395" class="reference"/><path d="M450 350 L450 378" class="flow" marker-end="url(#arrow-10-connectivity)"/><text x="630" y="364" class="label">包气带 / 有限渗流</text><text x="629" y="428" class="label">下部地下水域</text><text x="104" y="158" class="label">有水渗漏不等于连续饱和连接，也不等于零交换</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 5  包气带可以渗漏，却不是一条满水管</text><text x="43" y="575" class="label">湖河渗漏先改变路径含水和湿润前缘；实际入渗、毛细水势和非饱和导水限制交换，不能直连远端</text><text x="43" y="602" class="label">水头。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 220 L170 170 L250 205 L310 290 L385 315 L450 242 L515 312 L575 290 L670 200 L740 170 L860 220 L860 465 L80 465Z" class="rock" /><path d="M288.8235294117647 260 L433.972602739726 260 L433.972602739726 260 L385 315 L310 290 L288.8235294117647 260Z" class="water" /><line x1="288.8235294117647" y1="260" x2="433.972602739726" y2="260" class="waterline"/><path d="M484.35714285714283 279 L586.6111111111111 279 L586.6111111111111 279 L575 290 L515 312 L484.35714285714283 279Z" class="water" /><line x1="484.35714285714283" y1="279" x2="586.6111111111111" y2="279" class="waterline"/><text x="112" y="159" class="label">示意分断后的不同局地状态；不是容量比例计算</text><text x="100" y="472" class="label">新旧网格重分区与真正液水切断，是两种不同动作</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 5  分湖保留切断时局地水态，不按容量分配</text><text x="43" y="575" class="label">缓慢床脊抬起先挤水和交换，切断时各侧继承实际库存；只有近静水平衡适用时才用共同切断水位</text><text x="43" y="602" class="label">。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="100" y="210" width="740" height="215" rx="18" class="rock"/><rect x="125" y="290" width="690" height="98" rx="10" class="sat"/><path d="M190 251 L740 251" class="gravity" marker-end="url(#arrow-10-connectivity)"/><path d="M735 345 L225 345" class="flow" marker-end="url(#arrow-10-connectivity)"/><text x="299" y="233" class="label">岩层运动：示意方向</text><text x="278" y="333" class="label">水相对运动：示意方向</text><text x="103" y="470" class="label">不画成刚性水包；库存移动与真实交换不能计两遍</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 5  含水岩层移动，水仍能相对岩层渗流</text><text x="43" y="575" class="label">移动孔隙边界与相对输运共同计算；只有相对交换可忽略时，才能近似把原孔隙水随岩层带走。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="65" y="211" width="235" height="189" rx="12" class="strata"/><text x="79" y="244" class="label">背景 / 封存与更新</text><rect x="350" y="211" width="245" height="189" rx="12" class="strata"/><text x="364" y="244" class="label">局部 / 高差÷速度</text><rect x="645" y="211" width="235" height="189" rx="12" class="strata"/><text x="659" y="244" class="label">水情 / 路径与储水</text><path d="M304 310 L343 310" class="flow" marker-end="url(#arrow-10-connectivity)"/><path d="M600 310 L638 310" class="flow" marker-end="url(#arrow-10-connectivity)"/><text x="105" y="470" class="label">具体物性速度未标定；守恒、路径、流向、时间与反力一起验收</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 5  地质背景、局部控制点和水响应分开计时</text><text x="43" y="575" class="label">整体更新是一亿年级设计域；局部改水路看控制高差和真实速度。水按同一物理时长响应，不带入</text><text x="43" y="602" class="label">地质加速。</text></g><text x="36" y="637" class="small">非比例水路示意 · 秒数不是季节天数 · 非真实水位 / 流量预测</text></svg>