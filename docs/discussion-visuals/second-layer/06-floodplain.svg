<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-06-floodplain desc-06-floodplain"><title id="title-06-floodplain">洪水、岸地与动态连通</title><desc id="desc-06-floodplain">超过真实低岸才进入邻地，退水后浅塘、湿土和干滩分别出现。。平水在河槽中，不自动给两岸配湿地：这是局部横断面；水沿河槽方向进出，岸边高程控制侧向连接。。水位超过真实岸缘后，邻近低地才连通：来水转入实际空间；不能覆盖更高分水岭或凭洪水另加W水库。。退水后按地形和材料排出，部分土水仍高：土壤入渗转M/G，残留水归R/L；低地不按日历统一变干或常年湖。。窄通道有交换，不意味着立即同水位：先保留各自储量和水位，按真实连接有限交换；不能瞬间调平高低盆地。。可快速调平的近静水域才按共同水位合并：调平与来水/外排时间尺度相容才采用此近似；合并或退水分域仍保留来源与库存。</desc><defs><marker id="arrow-06-floodplain" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">06 / 洪水、岸地与动态连通</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 220 L320 220 L370 300 L450 345 L540 300 L590 220 L860 220 L860 465 L80 465Z" class="rock" /><path d="M366.875 295 L543.125 295 L543.125 295 L540 300 L450 345 L370 300 L366.875 295Z" class="water" /><line x1="366.875" y1="295" x2="543.125" y2="295" class="waterline"/><text x="90" y="172" class="label">局部横断面，纵向输水不在图中</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 5  平水在河槽中，不自动给两岸配湿地</text><text x="43" y="575" class="label">这是局部横断面；水沿河槽方向进出，岸边高程控制侧向连接。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 220 L320 220 L370 300 L450 345 L540 300 L590 220 L860 220 L860 465 L80 465Z" class="rock" /><path d="M80 195 L860 195 L860 220 L590 220 L540 300 L450 345 L370 300 L320 220 L80 220Z" class="water" /><line x1="80" y1="195" x2="860" y2="195" class="waterline"/><path d="M360 201 L210 201" class="flow" marker-end="url(#arrow-06-floodplain)"/><path d="M540 201 L715 201" class="flow" marker-end="url(#arrow-06-floodplain)"/><text x="95" y="150" class="label">此例水位已超过岸缘，侧向连接成立</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 5  水位超过真实岸缘后，邻近低地才连通</text><text x="43" y="575" class="label">来水转入实际空间；不能覆盖更高分水岭或凭洪水另加W水库。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 220 L320 220 L370 300 L450 345 L540 300 L590 220 L860 220 L860 465 L80 465Z" class="rock" /><path d="M373.55555555555554 302 L536 302 L536 302 L450 345 L373.55555555555554 302Z" class="water" /><line x1="373.55555555555554" y1="302" x2="536" y2="302" class="waterline"/><path d="M190 234 L320 234 L350 282 L350 326 L320 278 L190 278Z" class="sat" /><path d="M560 282 L590 234 L720 234 L720 278 L590 278 L560 326Z" class="sat" /><text x="108" y="161" class="label">不同控制体真实储量各自更新</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 5  退水后按地形和材料排出，部分土水仍高</text><text x="43" y="575" class="label">土壤入渗转M/G，残留水归R/L；低地不按日历统一变干或常年湖。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="212" width="330" height="212" rx="12" class="strata"/><text x="94" y="245" class="label">上游蓄水单元</text><rect x="97" y="280" width="296" height="129" rx="7" class="water"/><rect x="520" y="268" width="330" height="155" rx="12" class="strata"/><text x="534" y="301" class="label">下游蓄水单元</text><rect x="537" y="350" width="296" height="58" rx="7" class="water"/><path d="M410 305 L485 305 L520 350" class="flow" marker-end="url(#arrow-06-floodplain)"/><text x="417" y="244" class="label">真实控制口</text><text x="93" y="473" class="label">连边可随水位变化方向，不固定永远单向D8树</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 5  窄通道有交换，不意味着立即同水位</text><text x="43" y="575" class="label">先保留各自储量和水位，按真实连接有限交换；不能瞬间调平高低盆地。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="212" width="770" height="220" rx="12" class="strata"/><text x="94" y="245" class="label">来源A与B：共同近静水域</text><rect x="98" y="286" width="734" height="128" rx="8" class="water"/><line x1="98" y1="286" x2="832" y2="286" class="waterline"/><text x="100" y="470" class="label">连边存在、当前液水相通、同水位近似是不同判断</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 5  可快速调平的近静水域才按共同水位合并</text><text x="43" y="575" class="label">调平与来水/外排时间尺度相容才采用此近似；合并或退水分域仍保留来源与库存。</text></g><text x="36" y="637" class="small">非比例水路示意 · 秒数不是季节天数 · 非真实水位 / 流量预测</text></svg>