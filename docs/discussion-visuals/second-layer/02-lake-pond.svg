<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-02-lake-pond desc-02-lake-pond"><title id="title-02-lake-pond">湖塘：蓄水、交换与真实出口</title><desc id="desc-02-lake-pond">有盆地不等于常年有湖；小浅水域也必须保留预算。。有限来水形成部分水面，盆底不填平：实际库容、初始储量和损失决定水位；同一静水湖区保持水平。。较小或较浅不意味水体可以删除：塘和湖采用同一储水机制，面积深浅是描述，不是生成配额。。同一湖底可以有补给，也可以有渗漏：方向取决于局部水头和接触床，不给整湖固定地下补给比例。。到达实际出口条件后，才有有限地表外排：此例出口已实际降低；出流按断面与下游条件，不穿高岸、不满即清空。。湖底和出口变化，原水进入新几何求响应：盆底抬挤可改变库容，出口变化可改变蓄排；不固定结论，不填满新湖，也不删除超容水。</desc><defs><marker id="arrow-02-lake-pond" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">02 / 湖塘：蓄水、交换与真实出口</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 220 L170 170 L250 205 L310 290 L450 320 L575 290 L670 200 L740 170 L860 220 L860 465 L80 465Z" class="rock" /><path d="M288.8235294117647 260 L606.6666666666666 260 L606.6666666666666 260 L575 290 L450 320 L310 290 L288.8235294117647 260Z" class="water" /><line x1="288.8235294117647" y1="260" x2="606.6666666666666" y2="260" class="waterline"/><g><line x1="250" y1="130" x2="241" y2="153" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="289" y1="130" x2="280" y2="153" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="328" y1="130" x2="319" y2="153" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="367" y1="130" x2="358" y2="153" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="406" y1="130" x2="397" y2="153" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="445" y1="130" x2="436" y2="153" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="484" y1="130" x2="475" y2="153" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="523" y1="130" x2="514" y2="153" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="562" y1="130" x2="553" y2="153" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="601" y1="130" x2="592" y2="153" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="640" y1="130" x2="631" y2="153" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><text x="95" y="440" class="label">局部地表剖面，不是完整岛体</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 5  有限来水形成部分水面，盆底不填平</text><text x="43" y="575" class="label">实际库容、初始储量和损失决定水位；同一静水湖区保持水平。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 220 L170 170 L250 205 L310 290 L450 320 L575 290 L670 200 L740 170 L860 220 L860 465 L80 465Z" class="rock" /><path d="M306.47058823529414 285 L580.2777777777778 285 L580.2777777777778 285 L575 290 L450 320 L310 290 L306.47058823529414 285Z" class="water" /><line x1="306.47058823529414" y1="285" x2="580.2777777777778" y2="285" class="waterline"/><rect x="612" y="363" width="225" height="81" rx="12" class="strata"/><text x="626" y="396" class="label">小型浅水湖塘</text><text x="86" y="135" class="label">小水面有来源、有储量、有损失</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 5  较小或较浅不意味水体可以删除</text><text x="43" y="575" class="label">塘和湖采用同一储水机制，面积深浅是描述，不是生成配额。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 220 L170 170 L250 205 L310 290 L450 320 L575 290 L670 200 L740 170 L860 220 L860 465 L80 465Z" class="rock" /><path d="M271.1764705882353 235 L633.0555555555555 235 L633.0555555555555 235 L575 290 L450 320 L310 290 L271.1764705882353 235Z" class="water" /><line x1="271.1764705882353" y1="235" x2="633.0555555555555" y2="235" class="waterline"/><path d="M360 276 Q375 350 415 375" class="flow" marker-end="url(#arrow-02-lake-pond)"/><path d="M560 379 L560 285" class="flow" marker-end="url(#arrow-02-lake-pond)"/><text x="89" y="430" class="label">一笔地下交换：供体扣、受体加</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 5  同一湖底可以有补给，也可以有渗漏</text><text x="43" y="575" class="label">方向取决于局部水头和接触床，不给整湖固定地下补给比例。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 220 L170 170 L250 205 L310 290 L450 320 L575 290 L670 232 L740 250 L860 280 L860 465 L80 465Z" class="rock" /><path d="M260.5882352941176 220 L670 220 L670 232 L575 290 L450 320 L310 290 L260.5882352941176 220Z" class="water" /><line x1="260.5882352941176" y1="220" x2="670" y2="220" class="waterline"/><path d="M670 200 L670 232" class="ghost" /><path d="M670 220 Q700 230 740 250 L825 275" class="flow" marker-end="url(#arrow-02-lake-pond)"/><text x="595" y="159" class="label">降低后的真实控制口</text><text x="90" y="436" class="label">湖区近静水，出口局部流水；不代替临界水力计算</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 5  到达实际出口条件后，才有有限地表外排</text><text x="43" y="575" class="label">此例出口已实际降低；出流按断面与下游条件，不穿高岸、不满即清空。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="75" y="211" width="340" height="195" rx="12" class="strata"/><text x="89" y="244" class="label">原水 / 原盐 / 原材料</text><rect x="505" y="211" width="345" height="195" rx="12" class="strata"/><text x="519" y="244" class="label">新库容 / 出口与连接</text><path d="M425 310 L495 310" class="flow" marker-end="url(#arrow-02-lake-pond)"/><text x="111" y="337" class="label">库存依实际搬运保留</text><text x="535" y="337" class="label">有限交换求新水情</text><text x="111" y="470" class="label">图示不计算水量；水位与连通不能按标签重置</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 5  湖底和出口变化，原水进入新几何求响应</text><text x="43" y="575" class="label">盆底抬挤可改变库容，出口变化可改变蓄排；不固定结论，不填满新湖，也不删除超容水。</text></g><text x="36" y="637" class="small">非比例水路示意 · 秒数不是季节天数 · 非真实水位 / 流量预测</text></svg>