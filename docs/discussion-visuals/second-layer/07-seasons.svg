<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-07-seasons desc-07-seasons"><title id="title-07-seasons">季节与多年水情</title><desc id="desc-07-seasons">沿同一连续时序演变，四季不分别缩放固定河宽。。湿季事件先改变真实入流，再改变储量和连接：地表可先响应，土水/地下补给有储量和传输延迟，不同步满库。。退雨后储量继续释放，湖岸逐渐回退：湖与地下水可以暂时维持部分河段；持续时间由库存和出口决定。。枯季可断流、留水潭或仅有湿土：有流时长、有水时长和饱和历时分别记录，不能用均流假装每日水情。。冰雪与多年差异按气候条件出现：雪/冰不是水库存为零；本世界历法与统计窗口明确，不要求温暖6068必有雪。。冰盖与未解析薄水层不能按外观判干：液水、地表可见开水面和冰雪覆盖分别记录；误差界内的状态保留不确定。</desc><defs><marker id="arrow-07-seasons" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">07 / 季节与多年水情</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 220 L170 170 L250 205 L310 290 L450 320 L575 290 L670 200 L740 170 L860 220 L860 465 L80 465Z" class="rock" /><path d="M288.8235294117647 260 L606.6666666666666 260 L606.6666666666666 260 L575 290 L450 320 L310 290 L288.8235294117647 260Z" class="water" /><line x1="288.8235294117647" y1="260" x2="606.6666666666666" y2="260" class="waterline"/><g><line x1="260" y1="125" x2="251" y2="148" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="299" y1="125" x2="290" y2="148" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="338" y1="125" x2="329" y2="148" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="377" y1="125" x2="368" y2="148" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="416" y1="125" x2="407" y2="148" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="455" y1="125" x2="446" y2="148" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="494" y1="125" x2="485" y2="148" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="533" y1="125" x2="524" y2="148" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="572" y1="125" x2="563" y2="148" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="611" y1="125" x2="602" y2="148" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><path d="M250 202 L300 264" class="flow" marker-end="url(#arrow-07-seasons)"/><text x="98" y="435" class="label">多个水源是同一预算的输入或内部交换</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 5  湿季事件先改变真实入流，再改变储量和连接</text><text x="43" y="575" class="label">地表可先响应，土水/地下补给有储量和传输延迟，不同步满库。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 220 L170 170 L250 205 L310 290 L450 320 L575 290 L670 200 L740 170 L860 220 L860 465 L80 465Z" class="rock" /><path d="M304.3529411764706 282 L583.4444444444445 282 L583.4444444444445 282 L575 290 L450 320 L310 290 L304.3529411764706 282Z" class="water" /><line x1="304.3529411764706" y1="282" x2="583.4444444444445" y2="282" class="waterline"/><line x1="268" y1="230" x2="638" y2="230" class="reference"/><path d="M575 380 L577 299" class="flow" marker-end="url(#arrow-07-seasons)"/><text x="99" y="175" class="label">虚线：先前水位</text><text x="94" y="432" class="label">当前岸线变动，不重新生成盆地</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 5  退雨后储量继续释放，湖岸逐渐回退</text><text x="43" y="575" class="label">湖与地下水可以暂时维持部分河段；持续时间由库存和出口决定。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 250 L230 250 L300 320 L380 340 L440 260 L510 260 L560 330 L670 345 L750 265 L860 265 L860 465 L80 465Z" class="rock" /><path d="M284 304 L407 304 L407 304 L380 340 L300 320 L284 304Z" class="water" /><line x1="284" y1="304" x2="407" y2="304" class="waterline"/><path d="M541.4285714285714 304 L711 304 L711 304 L670 345 L560 330 L541.4285714285714 304Z" class="water" /><line x1="541.4285714285714" y1="304" x2="711" y2="304" class="waterline"/><rect x="110" y="278" width="125" height="30" rx="0" class="sat"/><text x="99" y="173" class="label">不同部位不必同一天一起干</text><text x="94" y="432" class="label">实际损失、补给和土层状态共同决定</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 5  枯季可断流、留水潭或仅有湿土</text><text x="43" y="575" class="label">有流时长、有水时长和饱和历时分别记录，不能用均流假装每日水情。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="70" y="210" width="365" height="210" rx="12" class="strata"/><text x="84" y="243" class="label">仅在积雪气候：雪蓄水 / 融雪</text><rect x="500" y="210" width="365" height="210" rx="12" class="strata"/><text x="514" y="243" class="label">多个代表年份：干湿不保证相同</text><path d="M270 313 L270 375" class="flow" marker-end="url(#arrow-07-seasons)"/><rect x="540" y="312" width="34" height="32" rx="4" class="water"/><rect x="594" y="312" width="34" height="59" rx="4" class="water"/><rect x="648" y="312" width="34" height="86" rx="4" class="water"/><rect x="702" y="312" width="34" height="32" rx="4" class="water"/><rect x="756" y="312" width="34" height="59" rx="4" class="water"/><text x="98" y="464" class="label">保留预热和初始条件，不挑有利满水日期</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 5  冰雪与多年差异按气候条件出现</text><text x="43" y="575" class="label">雪/冰不是水库存为零；本世界历法与统计窗口明确，不要求温暖6068必有雪。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="70" y="211" width="365" height="210" rx="12" class="strata"/><text x="84" y="244" class="label">冰下仍可有液水 / 输水</text><rect x="88" y="275" width="328" height="20" rx="5" class="ice"/><rect x="88" y="295" width="328" height="110" rx="7" class="water"/><path d="M135 351 L360 351" class="flow" marker-end="url(#arrow-07-seasons)"/><rect x="500" y="211" width="365" height="210" rx="12" class="strata"/><text x="514" y="244" class="label">薄层 / 通量在误差界内</text><line x1="523" y1="343" x2="843" y2="343" class="waterline"/><text x="578" y="388" class="label">未解析 / 未知</text><text x="97" y="469" class="label">标签不删除真实库存，不用固定保持天数伪造稳定</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 5  冰盖与未解析薄水层不能按外观判干</text><text x="43" y="575" class="label">液水、地表可见开水面和冰雪覆盖分别记录；误差界内的状态保留不确定。</text></g><text x="36" y="637" class="small">非比例水路示意 · 秒数不是季节天数 · 非真实水位 / 流量预测</text></svg>