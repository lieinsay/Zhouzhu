<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-01-objects desc-01-objects"><title id="title-01-objects">持久对象与当天水态</title><desc id="desc-01-objects">通路来自第一层地质；水头、饱和与通量是当前状态，分类由结果产生。。真实水路先存在，河流不是年度标签：地形、材料和河槽过程给出来源；小汇流仍记水量，不凭面积阈值造河。。实际入流沿连接进入下游，地下交换也参与：合流有储量、路由和损失；不是同一时刻无条件把上游流量瞬时相加。。当前断流，不删除源河槽或盆地：有连续地表流、有存水不连流、完全干槽分别记录；地下水也可继续通过。。名称描述结果，不控制供水或是否入账：湖塘共用蓄水对象；湿地只描述水文条件，不产生新水源。。来源持久可追溯，真实几何允许慢变：岩层释放、层界移动或侵蚀可改变水路；保留来源及前身后继，不随天气重造地形，也不锁死旧拓扑。</desc><defs><marker id="arrow-01-objects" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">01 / 持久对象与当天水态</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="75" y="182" width="790" height="295" rx="15" class="strata"/><path d="M165 220 Q285 285 455 335 M785 220 Q660 295 455 335 M455 335 L455 453" class="layerline" /><text x="97" y="164" class="label">平面拓扑示意：这里的纵轴不是地形高程</text><text x="97" y="435" class="label">持久河槽与汇流路径</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 5  真实水路先存在，河流不是年度标签</text><text x="43" y="575" class="label">地形、材料和河槽过程给出来源；小汇流仍记水量，不凭面积阈值造河。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="75" y="182" width="790" height="295" rx="15" class="strata"/><path d="M165 220 Q285 285 455 335 M785 220 Q660 295 455 335 M455 335 L455 453" class="layerline" /><path d="M165 220 Q285 285 455 335" class="flow" marker-end="url(#arrow-01-objects)"/><path d="M785 220 Q660 295 455 335" class="flow" marker-end="url(#arrow-01-objects)"/><path d="M455 335 L455 447" class="flow" marker-end="url(#arrow-01-objects)"/><text x="97" y="164" class="label">平面拓扑示意：这里的纵轴不是地形高程</text><text x="183" y="395" class="label">支流A</text><text x="620" y="395" class="label">支流B</text><text x="500" y="451" class="label">下游段</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 5  实际入流沿连接进入下游，地下交换也参与</text><text x="43" y="575" class="label">合流有储量、路由和损失；不是同一时刻无条件把上游流量瞬时相加。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 250 L230 250 L300 320 L380 340 L440 260 L510 260 L560 330 L670 345 L750 265 L860 265 L860 465 L80 465Z" class="rock" /><path d="M284 304 L407 304 L407 304 L380 340 L300 320 L284 304Z" class="water" /><line x1="284" y1="304" x2="407" y2="304" class="waterline"/><path d="M541.4285714285714 304 L711 304 L711 304 L670 345 L560 330 L541.4285714285714 304Z" class="water" /><line x1="541.4285714285714" y1="304" x2="711" y2="304" class="waterline"/><text x="122" y="165" class="label">局部纵断面：床脊露出，水潭保留</text><path d="M280 393 L680 393" class="flow" marker-end="url(#arrow-01-objects)"/><text x="266" y="425" class="label">若有真实通路且水势允许，可继续交换</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 5  当前断流，不删除源河槽或盆地</text><text x="43" y="575" class="label">有连续地表流、有存水不连流、完全干槽分别记录；地下水也可继续通过。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="70" y="220" width="250" height="190" rx="12" class="strata"/><text x="84" y="253" class="label">河槽输水 / 存水</text><rect x="350" y="220" width="250" height="190" rx="12" class="strata"/><text x="364" y="253" class="label">湖塘蓄水对象</text><rect x="630" y="220" width="245" height="190" rx="12" class="strata"/><text x="644" y="253" class="label">湿地水文条件</text><text x="99" y="463" class="label">分类在真实状态之后；当前生态与河槽细节不在本层定案</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 5  名称描述结果，不控制供水或是否入账</text><text x="43" y="575" class="label">湖塘共用蓄水对象；湿地只描述水文条件，不产生新水源。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="65" y="210" width="235" height="190" rx="12" class="strata"/><text x="79" y="243" class="label">原来源 / 原几何</text><rect x="350" y="210" width="245" height="190" rx="12" class="strata"/><text x="364" y="243" class="label">实际地质 / 几何更新</text><rect x="645" y="210" width="235" height="190" rx="12" class="strata"/><text x="659" y="243" class="label">后继来源 / 新控制体</text><path d="M304 310 L343 310" class="flow" marker-end="url(#arrow-01-objects)"/><path d="M600 310 L638 310" class="flow" marker-end="url(#arrow-01-objects)"/><text x="106" y="468" class="label">补充已确认 · 参数与实现未验证：持久对象不等于永不改变</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 5  来源持久可追溯，真实几何允许慢变</text><text x="43" y="575" class="label">岩层释放、层界移动或侵蚀可改变水路；保留来源及前身后继，不随天气重造地形，也不锁死旧拓</text><text x="43" y="602" class="label">扑。</text></g><text x="36" y="637" class="small">非比例水路示意 · 秒数不是季节天数 · 非真实水位 / 流量预测</text></svg>