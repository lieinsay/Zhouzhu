<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-04-permanence desc-04-permanence"><title id="title-04-permanence">连续流、水潭与干河槽</title><desc id="desc-04-permanence">流动持续性与水面存在持续性分别统计。。有连续地表水路时记录沿槽输水：常年供水可来自地下、湖泊释放或融雪等组合，不统一配一口泉。。连通的湿河段也可以暂时近静水：零通过流不等于床脊露出或孤立水潭；液水路径与输水分别判断。。退水露出床脊，连续流可停止而水潭仍在：水潭仍蒸发、渗漏或受地下补给，储量不被清空也不重复当一份湖水。。损失超过补给时，河槽可以完全干涸：干的是当前地表状态；源河槽不消失，地下水也不自动归零。。常年、季节和事件性来自实际时间序列：记录有流时长、最长干段、重复季节和年际变化，不套全球天数阈值。</desc><defs><marker id="arrow-04-permanence" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">04 / 连续流、水潭与干河槽</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 250 L230 250 L300 320 L380 340 L440 260 L510 260 L560 330 L670 345 L750 265 L860 265 L860 465 L80 465Z" class="rock" /><path d="M90 230 L230 233.5 L300 235.25 L380 237.25 L440 238.75 L510 240.5 L560 241.75 L670 244.5 L750 246.5 L860 249.25 L860 265 L750 265 L670 345 L560 330 L510 260 L440 260 L380 340 L300 320 L230 250 L90 250Z" class="water" /><path d="M90 230 L230 233.5 L300 235.25 L380 237.25 L440 238.75 L510 240.5 L560 241.75 L670 244.5 L750 246.5 L860 249.25" class="waterline" /><path d="M160 237 L768 252" class="flow" marker-end="url(#arrow-04-permanence)"/><text x="90" y="167" class="label">局部纵断面：此例水位足以跨过床脊</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 5  有连续地表水路时记录沿槽输水</text><text x="43" y="575" class="label">常年供水可来自地下、湖泊释放或融雪等组合，不统一配一口泉。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 250 L230 250 L300 320 L380 340 L440 260 L510 260 L560 330 L670 345 L750 265 L860 265 L860 465 L80 465Z" class="rock" /><path d="M90 235 L860 235 L860 265 L750 265 L670 345 L560 330 L510 260 L440 260 L380 340 L300 320 L230 250 L90 250Z" class="water" /><line x1="90" y1="235" x2="860" y2="235" class="waterline"/><text x="98" y="165" class="label">连续液水路径仍在；此例水头近似相等</text><text x="101" y="438" class="label">局部断面 / 通道 / 水头仍决定状态，不以标签猜测</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 5  连通的湿河段也可以暂时近静水</text><text x="43" y="575" class="label">零通过流不等于床脊露出或孤立水潭；液水路径与输水分别判断。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 250 L230 250 L300 320 L380 340 L440 260 L510 260 L560 330 L670 345 L750 265 L860 265 L860 465 L80 465Z" class="rock" /><path d="M284 304 L407 304 L407 304 L380 340 L300 320 L284 304Z" class="water" /><line x1="284" y1="304" x2="407" y2="304" class="waterline"/><path d="M541.4285714285714 304 L711 304 L711 304 L670 345 L560 330 L541.4285714285714 304Z" class="water" /><line x1="541.4285714285714" y1="304" x2="711" y2="304" class="waterline"/><text x="116" y="178" class="label">地表连接断开，低点保留储水</text><text x="89" y="436" class="label">断流 ≠ 完全没有存水</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 5  退水露出床脊，连续流可停止而水潭仍在</text><text x="43" y="575" class="label">水潭仍蒸发、渗漏或受地下补给，储量不被清空也不重复当一份湖水。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 250 L230 250 L300 320 L380 340 L440 260 L510 260 L560 330 L670 345 L750 265 L860 265 L860 465 L80 465Z" class="rock" /><path d="M280 397 L710 397" class="flow" marker-end="url(#arrow-04-permanence)"/><text x="245" y="433" class="label">地下通路若成立仍可交换</text><text x="95" y="170" class="label">实际储量为零或低于可分辨水层</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 5  损失超过补给时，河槽可以完全干涸</text><text x="43" y="575" class="label">干的是当前地表状态；源河槽不消失，地下水也不自动归零。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="55" y="185" width="200" height="95" rx="12" class="strata"/><text x="69" y="218" class="label">连续输水</text><rect x="275" y="185" width="200" height="95" rx="12" class="strata"/><text x="289" y="218" class="label">连通近静水</text><rect x="495" y="185" width="200" height="95" rx="12" class="strata"/><text x="509" y="218" class="label">孤立水潭</text><rect x="715" y="185" width="200" height="95" rx="12" class="strata"/><text x="729" y="218" class="label">干槽</text><rect x="90" y="335" width="31" height="60" rx="4" class="water"/><rect x="136" y="335" width="31" height="60" rx="4" class="water"/><rect x="182" y="335" width="31" height="60" rx="4" class="water"/><rect x="228" y="335" width="31" height="60" rx="4" class="water"/><rect x="274" y="335" width="31" height="60" rx="4" class="water"/><rect x="320" y="335" width="31" height="60" rx="4" class="stillwater"/><rect x="366" y="335" width="31" height="60" rx="4" class="stillwater"/><rect x="412" y="335" width="31" height="60" rx="4" class="stillwater"/><rect x="458" y="335" width="31" height="60" rx="4" class="strata"/><rect x="504" y="335" width="31" height="60" rx="4" class="strata"/><rect x="550" y="335" width="31" height="60" rx="4" class="strata"/><rect x="596" y="335" width="31" height="60" rx="4" class="strata"/><rect x="642" y="335" width="31" height="60" rx="4" class="rock"/><rect x="688" y="335" width="31" height="60" rx="4" class="water"/><rect x="734" y="335" width="31" height="60" rx="4" class="water"/><rect x="780" y="335" width="31" height="60" rx="4" class="water"/><text x="96" y="435" class="label">四种状态序列示意；未知区间不强行归流动或干涸</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 5  常年、季节和事件性来自实际时间序列</text><text x="43" y="575" class="label">记录有流时长、最长干段、重复季节和年际变化，不套全球天数阈值。</text></g><text x="36" y="637" class="small">非比例水路示意 · 秒数不是季节天数 · 非真实水位 / 流量预测</text></svg>