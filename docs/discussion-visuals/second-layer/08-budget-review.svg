<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-08-budget-review desc-08-budget-review"><title id="title-08-budget-review">同一预算、输出与验收</title><desc id="desc-08-budget-review">完整初稿承接第一层；参数和实际世界结果尚未验证。。湿地引用原水库，不增加新库存W：C冠层、N雪冰、M土水、G地下、R河段、L湖盆按水质量/水当量记账。。水体合并与分裂保留来源和总储量：当前水面控制体可变，源盆地和河槽标识不重造；退水不能复制水。。物质账来自上游，不按水体名称猜盐度：本图仅演示已有盐水蒸发，无其他盐进出或相态转移；盐度不由封闭标签决定。。6068应分清成因、识别、导出和游戏还原：江南式气候不保证湖数；没有源断面时不声称精确流速和深度。。岩石更新不供水，孔隙变形不丢水：固体承压不复制成地下水头；新出岩不默认饱和，原M/G按移动边界与相对渗流更新，压密或开裂按实际通路响应。。同段输入只计一次，历史按几何版本解释：重算水情不重复加雨或释放岩层；改道保留前身后继，统计注明版本，旧历史不当当前恒定状态。</desc><defs><marker id="arrow-08-budget-review" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke: