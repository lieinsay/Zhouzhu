ect x="103" y="295" width="264" height="90" rx="6" class="water"/><path d="M395 308 L512 308" class="flow" marker-end="url(#arrow-08-budget-review)"/><rect x="525" y="213" width="145" height="190" rx="12" class="strata"/><text x="539" y="246" class="label">分开A</text><rect x="708" y="213" width="145" height="190" rx="12" class="strata"/><text x="722" y="246" class="label">分开B</text><rect x="540" y="283" width="116" height="102" rx="5" class="water"/><rect x="723" y="283" width="116" height="102" rx="5" class="water"/><text x="95" y="471" class="label">符号只说明重映射守恒，不是退水量或实际水量预测</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 6  水体合并与分裂保留来源和总储量</text><text x="43" y="575" class="label">当前水面控制体可变，源盆地和河槽标识不重造；退水不能复制水。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="85" y="212" width="320" height="211" rx="12" class="strata"/><text x="99" y="245" class="label">示例：已有溶解盐</text><rect x="101" y="280" width="288" height="127" rx="7" class="water"/><circle cx="143" cy="380" r="4" class="magma"/><circle cx="171" cy="380" r="4" class="magma"/><circle cx="199" cy="380" r="4" class="magma"/><circle cx="227" cy="380" r="4" class="magma"/><circle cx="255" cy="380" r="4" class="magma"/><circle cx="283" cy="380" r="4" class="magma"/><circle cx="311" cy="380" r="4" class="magma"/><circle cx="339" cy="380" r="4" class="magma"/><rect x="530" y="212" width="320" height="211" rx="12" class="strata"/><text x="544" y="245" class="label">仅蒸发：原盐未移走</text><rect x="546" y="350" width="288" height="57" rx="7" class="water"/><circle cx="588" cy="380" r="4" class="magma"/><circle cx="616" cy="380" r="4" class="magma"/><circle cx="644" cy="380" r="4" class="magma"/><circle cx="672" cy="380" r="4" class="magma"/><circle cx="700" cy="380" r="4" class="magma"/><circle cx="728" cy="380" r="4" class="magma"/><circle cx="756" cy="380" r="4" class="magma"/><circle cx="784" cy="380" r="4" class="magma"/><path d="M700 330 L700 290" class="flow" marker-end="url(#arrow-08-budget-review)"/><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 6  物质账来自上游，不按水体名称猜盐度</text><text x="43" y="575" class="label">本图仅演示已有盐水蒸发，无其他盐进出或相态转移；盐度不由封闭标签决定。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="65" y="185" width="390" height="108" rx="12" class="strata"/><text x="79" y="218" class="label">① 真有库容？ ② 水量支持？</text><rect x="505" y="185" width="370" height="108" rx="12" class="strata"/><text x="519" y="218" class="label">③ 识别遗漏？ ④ 导出/还原？</text><rect x="105" y="343" width="730" height="95" rx="12" class="strata"/><text x="119" y="376" class="label">同版数据 · 守恒 · 连通 · 真实日期 · 多年与尺度误差</text><text x="102" y="472" class="label">第三层补河槽断面，第七层补生态，本层不改第一层已定规则</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 6  6068应分清成因、识别、导出和游戏还原</text><text x="43" y="575" class="label">江南式气候不保证湖数；没有源断面时不声称精确流速和深度。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="65" y="211" width="235" height="195" rx="12" class="strata"/><text x="79" y="244" class="label">岩石 / 层序与应力</text><rect x="350" y="211" width="245" height="195" rx="12" class="strata"/><text x="364" y="244" class="label">孔隙 / 实际通路</text><rect x="645" y="211" width="235" height="195" rx="12" class="strata"/><text x="659" y="244" class="label">原水 / 有限交换</text><path d="M304 310 L343 310" class="flow" ma