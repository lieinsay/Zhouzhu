<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-09-evolution desc-09-evolution"><title id="title-09-evolution">地形慢变：水的去向与历史</title><desc id="desc-09-evolution">完整衔接提案：实际空间、有限去向、初始来历及版本统计，未做水动力计算。。抬床、堵口或切通，先求原水的实际去向：水可留在新空间、淹没真实岸地或经实际通路排出；删除盆地前不能删水，不填满新洼地。。改道改变后续来水，旧槽残水不会瞬移：新汇流按真实分水岭与河床；旧槽已有水潭继续蒸渗或排泄，不能复制给新河，也不重复上游输入。。地下通路关闭，不排干两侧原水：原含水区保留储量与水头，孔隙压密或增加分别响应；新空间需要真实补给，固态压力不额外供泉。。水无处可去时，形变必须受到反力约束：候选几何塞不下原水且排泄不足，就耦合压力与移动岩层；不能先完成形变，再设虚拟超容水或截零。。开局水态有历史，不统一满库或干库：继承实际出生与成熟库存，或用声明的初态和天气历史求响应；地下延迟需核对，不以一年循环假定全部平衡。。统计保留范围与版本，不复制常年标签：当前水态、新几何代表水情和完整历史分开；前身后继不等于复制全部流动时间或把未知样本当干期。</desc><defs><marker id="arrow-09-evolution" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">09 / 地形慢变：水的去向与历史</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M80 220 L170 170 L250 205 L310 290 L450 320 L575 290 L670 200 L740 170 L860 220 L860 465 L80 465Z" class="rock" /><path d="M282.47058823529414 251 L616.1666666666666 251 L616.1666666666666 251 L575 290 L450 320 L310 290 L282.47058823529414 251Z" class="water" /><line x1="282.47058823529414" y1="251" x2="616.1666666666666" y2="251" class="waterline"/><path d="M365 378 Q430 334 490 344" class="fold" /><path d="M417 394 L417 351" class="gravity" marker-end="url(#arrow-09-evolution)"/><text x="104" y="148" class="label">底部变化只是示意；新水位和流量需要重新求解</text><text x="103" y="472" class="label">同一原水库存：新空间与出口能力共同约束</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 6  抬床、堵口或切通，先求原水的实际去向</text><text x="43" y="575" class="label">水可留在新空间、淹没真实岸地或经实际通路排出；删除盆地前不能删水，不填满新洼地。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="75" y="182" width="790" height="295" rx="15" class="strata"/><path d="M165 220 Q285 285 455 335 M785 220 Q660 295 455 335 M455 335 L455 453" class="layerline" /><text x="97" y="164" class="label">平面拓扑示意：这里的纵轴不是地形高程</text><path d="M165 220 Q285 285 455 335" class="flow" marker-end="url(#arrow-09-evolution)"/><path d="M455 335 Q670 337 800 408" class="flow" marker-end="url(#arrow-09-evolution)"/><rect x="420" y="391" width="65" height="34" rx="9" class="water"/><text x="505" y="305" class="label">新路径：仅在源地形支持时</text><text x="107" y="442" class="label">旧槽残水：按本地剩余条件响应</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 6  改道改变后续来水，旧槽残水不会瞬移</text><text x="43" y="575" class="label">新汇流按真实分水岭与河床；旧槽已有水潭继续蒸渗或排泄，不能复制给新河，也不重复上游输入</text><text x="43" y="602" class="label">。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="80" y="209" width="340" height="195" rx="12" class="strata"/><text x="94" y="242" class="label">含水区 A / 原库存</text><rect x="112" y="289" width="274" height="94" rx="8" class="water"/><rect x="510" y="209" width="340" height="195" rx="12" class="strata"/><text x="524" y="242" class="label">含水区 B / 原库存</text><rect x="542" y="323" width="274" height="60" rx="8" class="water"/><line x1="462" y1="210" x2="462" y2="406" class="bridge"/><text x="111" y="472" class="label">示意关闭接触；其他路径与两侧压力继续求解</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 6  地下通路关闭，不排干两侧原水</text><text x="43" y="575" class="label">原含水区保留储量与水头，孔隙压密或增加分别响应；新空间需要真实补给，固态压力不额外供泉</text><text x="43" y="602" class="label">。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="65" y="209" width="235" height="189" rx="12" class="strata"/><text x="79" y="242" class="label">候选形变 / 新空间</text><rect x="350" y="209" width="245" height="189" rx="12" class="strata"/><text x="364" y="242" class="label">原水 / 实际排泄</text><rect x="645" y="209" width="235" height="189" rx="12" class="strata"/><text x="659" y="242" class="label">压力反力 / 回到耦合</text><path d="M304 310 L343 310" class="flow" marker-end="url(#arrow-09-evolution)"/><path d="M600 310 L638 310" class="flow" marker-end="url(#arrow-09-evolution)"/><path d="M758 410 L758 455 L184 455 L184 411" class="flow" marker-end="url(#arrow-09-evolution)"/><text x="105" y="155" class="label">不是无限压缩水；必须有适用储水状态与真实空间</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 6  水无处可去时，形变必须受到反力约束</text><text x="43" y="575" class="label">候选几何塞不下原水且排泄不足，就耦合压力与移动岩层；不能先完成形变，再设虚拟超容水或截</text><text x="43" y="602" class="label">零。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="65" y="209" width="235" height="189" rx="12" class="strata"/><text x="79" y="242" class="label">出生 / 困水与来源</text><rect x="350" y="209" width="245" height="189" rx="12" class="strata"/><text x="364" y="242" class="label">实际几何 / 天气历史</text><rect x="645" y="209" width="235" height="189" rx="12" class="strata"/><text x="659" y="242" class="label">开局 / 水态与未知</text><path d="M304 310 L343 310" class="flow" marker-end="url(#arrow-09-evolution)"/><path d="M600 310 L638 310" class="flow" marker-end="url(#arrow-09-evolution)"/><text x="105" y="470" class="label">旧世界加载不重新预热；未知初态不伪装成真实干涸</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 6  开局水态有历史，不统一满库或干库</text><text x="43" y="575" class="label">继承实际出生与成熟库存，或用声明的初态和天气历史求响应；地下延迟需核对，不以一年循环假</text><text x="43" y="602" class="label">定全部平衡。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="65" y="209" width="235" height="189" rx="12" class="strata"/><text x="79" y="242" class="label">原对象 / 实际历史</text><rect x="350" y="209" width="245" height="189" rx="12" class="strata"/><text x="364" y="242" class="label">前身后继 / 来源范围</text><rect x="645" y="209" width="235" height="189" rx="12" class="strata"/><text x="659" y="242" class="label">新统计 / 版本与误差</text><path d="M304 310 L343 310" class="flow" marker-end="url(#arrow-09-evolution)"/><path d="M600 310 L638 310" class="flow" marker-end="url(#arrow-09-evolution)"/><text x="105" y="470" class="label">只交付物理环境记录；生态与生物演化以后独立设计</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">6 / 6  统计保留范围与版本，不复制常年标签</text><text x="43" y="575" class="label">当前水态、新几何代表水情和完整历史分开；前身后继不等于复制全部流动时间或把未知样本当干</text><text x="43" y="602" class="label">期。</text></g><text x="36" y="637" class="small">非比例水路示意 · 秒数不是季节天数 · 非真实水位 / 流量预测</text></svg>