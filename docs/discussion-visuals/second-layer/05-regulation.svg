<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-05-regulation desc-05-regulation"><title id="title-05-regulation">湖出流与上下游调节</title><desc id="desc-05-regulation">存储可以延迟交换，但不增加全年水量，也不保证总是削峰。。暴雨时仍有可用空间，部分来水先增加储量：只有真实连接与剩余容量成立才可暂存，湿地/湖不是自动海绵倍率。。有限出口可延迟部分下游响应：示意曲线仅说明条件：进入峰与出去峰可不同，不是实际数值预测。。已满或出口通畅时，削峰可能很小：下游顶托还会改变连接与出流，不能承诺所有湖让下游更稳定。。枯季低于出口后，湖仍有水但地表出湖停止：下游若继续有流，应有实际沿程地下等补给，不从湖补恒定出流。</desc><defs><marker id="arrow-05-regulation" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">05 / 湖出流与上下游调节</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 220 L170 170 L250 205 L310 290 L450 320 L575 290 L670 200 L740 170 L860 220 L860 465 L80 465Z" class="rock" /><path d="M302.94117647058823 280 L585.5555555555555 280 L585.5555555555555 280 L575 290 L450 320 L310 290 L302.94117647058823 280Z" class="water" /><line x1="302.94117647058823" y1="280" x2="585.5555555555555" y2="280" class="waterline"/><path d="M250 202 L320 273" class="flow" marker-end="url(#arrow-05-regulation)"/><text x="122" y="432" class="label">当前水位低于出口，尚有可用空间</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  暴雨时仍有可用空间，部分来水先增加储量</text><text x="43" y="575" class="label">只有真实连接与剩余容量成立才可暂存，湿地/湖不是自动海绵倍率。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><line x1="90" y1="425" x2="850" y2="425" class="edge"/><line x1="90" y1="425" x2="90" y2="196" class="edge"/><path d="M100 415 L210 414 Q285 174 350 395 L850 415" class="gravity" /><path d="M100 415 L330 414 Q475 278 565 375 Q650 404 850 415" class="flow" /><text x="120" y="175" class="label">输入响应</text><text x="493" y="250" class="label">有限外排响应</text><text x="596" y="453" class="label">时间 →（示意）</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 4  有限出口可延迟部分下游响应</text><text x="43" y="575" class="label">示意曲线仅说明条件：进入峰与出去峰可不同，不是实际数值预测。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 220 L170 170 L250 205 L310 290 L450 320 L575 290 L670 232 L740 250 L860 280 L860 465 L80 465Z" class="rock" /><path d="M260.5882352941176 220 L670 220 L670 232 L575 290 L450 320 L310 290 L260.5882352941176 220Z" class="water" /><line x1="260.5882352941176" y1="220" x2="670" y2="220" class="waterline"/><path d="M250 202 L330 270" class="flow" marker-end="url(#arrow-05-regulation)"/><path d="M670 220 Q735 250 825 275" class="flow" marker-end="url(#arrow-05-regulation)"/><text x="83" y="441" class="label">效果从储量和通量得到，不预设削峰百分比</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 4  已满或出口通畅时，削峰可能很小</text><text x="43" y="575" class="label">下游顶托还会改变连接与出流，不能承诺所有湖让下游更稳定。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 220 L170 170 L250 205 L310 290 L450 320 L575 290 L670 200 L740 170 L860 220 L860 465 L80 465Z" class="rock" /><path d="M295.88235294117646 270 L596.1111111111111 270 L596.1111111111111 270 L575 290 L450 320 L310 290 L295.88235294117646 270Z" class="water" /><line x1="295.88235294117646" y1="270" x2="596.1111111111111" y2="270" class="waterline"/><path d="M760 397 L816 200" class="flow" marker-end="url(#arrow-05-regulation)"/><text x="94" y="160" class="label">湖水未达到地表出口</text><text x="95" y="434" class="label">V/Q只作适用条件下的名义换水时间，不当瞬时完全混合</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  枯季低于出口后，湖仍有水但地表出湖停止</text><text x="43" y="575" class="label">下游若继续有流，应有实际沿程地下等补给，不从湖补恒定出流。</text></g><text x="36" y="637" class="small">非比例水路示意 · 秒数不是季节天数 · 非真实水位 / 流量预测</text></svg>