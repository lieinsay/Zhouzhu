<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-03-wetland desc-03-wetland"><title id="title-03-wetland">湿地水文条件：有水不等于有湖</title><desc id="desc-03-wetland">地表、土层和地下状态共同描述湿润，湿地不另加W水库。。地下水接近地表，低地可以无开水面仍湿润：出露与饱和依真实层界、水头及土层，不固定全岛泉环。。湖滨和河谷低岸随水位涨退而饱和：岸地只有实际连通才进水；退水后地下和土水可继续高。。真实低渗层形成局部滞水，不是每个平地都不透水：土层储水、侧向来水和蒸散决定持续性；不能给湿地标签补水。。短时洪水水洼不自动成为成熟沼泽：输出淹水历时、频率、近地表饱和与排干史；土壤和群落后层决定。</desc><defs><marker id="arrow-03-wetland" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">03 / 湿地水文条件：有水不等于有湖</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="80" y="230" width="780" height="225" rx="0" class="rock"/><rect x="80" y="230" width="780" height="55" rx="0" class="strata"/><rect x="240" y="252" width="470" height="96" rx="0" class="sat"/><line x1="100" y1="262" x2="840" y2="262" class="reference"/><path d="M450 357 L450 270" class="flow" marker-end="url(#arrow-03-wetland)"/><text x="98" y="166" class="label">无开水面 ≠ 土层干燥</text><text x="96" y="435" class="label">M土水与G地下水是原有库存</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  地下水接近地表，低地可以无开水面仍湿润</text><text x="43" y="575" class="label">出露与饱和依真实层界、水头及土层，不固定全岛泉环。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 220 L320 220 L370 300 L450 345 L540 300 L590 220 L860 220 L860 465 L80 465Z" class="rock" /><path d="M329.375 235 L580.625 235 L580.625 235 L540 300 L450 345 L370 300 L329.375 235Z" class="water" /><line x1="329.375" y1="235" x2="580.625" y2="235" class="waterline"/><path d="M210 234 L320 234 L355 290 L355 332 L320 276 L210 276Z" class="sat" /><path d="M555 290 L590 234 L720 234 L720 276 L590 276 L555 332Z" class="sat" /><text x="104" y="169" class="label">水面与土层饱和条件分别记录</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 4  湖滨和河谷低岸随水位涨退而饱和</text><text x="43" y="575" class="label">岸地只有实际连通才进水；退水后地下和土水可继续高。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="80" y="205" width="780" height="245" rx="0" class="rock"/><rect x="100" y="220" width="740" height="70" rx="0" class="strata"/><rect x="295" y="243" width="355" height="44" rx="0" class="sat"/><line x1="100" y1="300" x2="840" y2="300" class="layerline"/><g><line x1="320" y1="134" x2="311" y2="157" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="359" y1="134" x2="350" y2="157" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="398" y1="134" x2="389" y2="157" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="437" y1="134" x2="428" y2="157" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="476" y1="134" x2="467" y2="157" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="515" y1="134" x2="506" y2="157" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="554" y1="134" x2="545" y2="157" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 22;0 0" dur="2.4s" repeatCount="indefinite"/></g><text x="88" y="180" class="label">实际土层与低渗界面</text><text x="99" y="427" class="label">是否反复饱和由时序决定</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 4  真实低渗层形成局部滞水，不是每个平地都不透水</text><text x="43" y="575" class="label">土层储水、侧向来水和蒸散决定持续性；不能给湿地标签补水。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="70" y="213" width="365" height="208" rx="12" class="strata"/><text x="84" y="246" class="label">短时积水状态</text><rect x="90" y="333" width="325" height="67" rx="8" class="water"/><rect x="500" y="213" width="365" height="208" rx="12" class="strata"/><text x="514" y="246" class="label">反复 / 持续饱和条件</text><rect x="520" y="300" width="325" height="100" rx="8" class="sat"/><text x="91" y="464" class="label">都是已有水库的状态描述，不新增湿地水库存</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  短时洪水水洼不自动成为成熟沼泽</text><text x="43" y="575" class="label">输出淹水历时、频率、近地表饱和与排干史；土壤和群落后层决定。</text></g><text x="36" y="637" class="small">非比例水路示意 · 秒数不是季节天数 · 非真实水位 / 流量预测</text></svg>