<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-04-measures desc-04-measures" data-chapter="04-measures"><title id="title-04-measures">参考、活动与当天宽深</title><desc id="desc-04-measures">一个宽或深的数值，必须带位置、参考面、时间和适用域。 参考河槽跨度有参考依据：参考面和两岸控制点明确；峡谷没有可辨漫溢面时不伪造bankfull。；活动主槽是形态与过程范围：由床岸和形成历史识别，不能拿谷宽或当天湿边代替。；当天湿宽由真实湿区得到：同一槽水位变，湿边可变；露岸下切不是当天水深。；平均、最大与当处水深分开：普通断面平均深=A/T；最深位置可偏侧，岸边和河心分别查询。；多汊湿宽相加，跨洲跨度另列：此例两汊同一水位、同一接受状态，平面另有真实连通；干洲不计湿宽，不把不同水位的分湖合算。。第四层设计已通过，非比例因果示意，不是模拟结果。</desc><defs><marker id="arrow-04-measures" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">04 / 参考、活动与当天宽深</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="220" y1="180" x2="740" y2="180" class="ref" /><line x1="220" y1="174" x2="220" y2="186" class="ref" /><line x1="740" y1="174" x2="740" y2="186" class="ref" /><text x="480" y="168" class="small" text-anchor="middle">参考河槽跨度</text><text x="110" y="465" class="small" text-anchor="start">参考面：此例有依据，不代表所有河都有</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  参考河槽跨度有参考依据</text><text x="42" y="575" class="note" text-anchor="start">参考面和两岸控制点明确；峡谷没有可辨漫溢面时不伪造bankfull。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="300" y1="180" x2="670" y2="180" class="ref" /><line x1="300" y1="174" x2="300" y2="186" class="ref" /><line x1="670" y1="174" x2="670" y2="186" class="ref" /><text x="485" y="168" class="small" text-anchor="middle">活动主槽：形态阶段</text><text x="100" y="465" class="small" text-anchor="start">边滩进退和侧移可以改变活动范围</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  活动主槽是形态与过程范围</text><text x="42" y="575" class="note" text-anchor="start">由床岸和形成历史识别，不能拿谷宽或当天湿边代替。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M483 352 L540 410 L599 352Z" class="water" /><line x1="483" y1="352" x2="599" y2="352" class="flow" /><line x1="483" y1="315" x2="599" y2="315" class="ref" /><line x1="483" y1="309" x2="483" y2="321" class="ref" /><line x1="599" y1="309" x2="599" y2="321" class="ref" /><text x="541" y="303" class="small" text-anchor="middle">当天湿宽</text><line x1="250" y1="245" x2="250" y2="410" class="flow" /><line x1="243" y1="245" x2="257" y2="245" class="flow" /><line x1="243" y1="410" x2="257" y2="410" class="flow" /><text x="263" y="327.5" class="small" text-anchor="start">岸顶下切</text><text x="100" y="475" class="small" text-anchor="start">槽暂未改变，水位与露岸改变</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  当天湿宽由真实湿区得到</text><text x="42" y="575" class="note" text-anchor="start">同一槽水位变，湿边可变；露岸下切不是当天水深。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="540" y1="285" x2="540" y2="410" class="flow" /><line x1="533" y1="285" x2="547" y2="285" class="flow" /><line x1="533" y1="410" x2="547" y2="410" class="flow" /><text x="553" y="347.5" class="small" text-anchor="start">最大深</text><line x1="385" y1="285" x2="385" y2="320" class="flow" /><line x1="378" y1="285" x2="392" y2="285" class="flow" /><line x1="378" y1="320" x2="392" y2="320" class="flow" /><text x="398" y="302.5" class="small" text-anchor="start">局部深</text><text x="120" y="180" class="label" text-anchor="start">平均深 A/T：面积与实际湿宽来自同一断面</text><text x="100" y="475" class="small" text-anchor="start">箭头口径示意；人物位置另定位</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  平均、最大与当处水深分开</text><text x="42" y="575" class="note" text-anchor="start">普通断面平均深=A/T；最深位置可偏侧，岸边和河心分别查询。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 260 L200 260 L230 350 L345 350 L390 260 L540 260 L585 350 L715 350 L755 260 L860 260 L860 455 L90 455Z" class="rock" /><path d="M217 310 L230 350 L345 350 L363 310Z" class="water" /><path d="M565 310 L585 350 L715 350 L733 310Z" class="water" /><line x1="217" y1="310" x2="363" y2="310" class="flow" /><line x1="565" y1="310" x2="733" y2="310" class="flow" /><line x1="217" y1="180" x2="363" y2="180" class="ref" /><line x1="217" y1="174" x2="217" y2="186" class="ref" /><line x1="363" y1="174" x2="363" y2="186" class="ref" /><text x="290" y="168" class="small" text-anchor="middle">湿区一</text><line x1="565" y1="180" x2="733" y2="180" class="ref" /><line x1="565" y1="174" x2="565" y2="186" class="ref" /><line x1="733" y1="174" x2="733" y2="186" class="ref" /><text x="649" y="168" class="small" text-anchor="middle">湿区二</text><line x1="217" y1="425" x2="733" y2="425" class="ref" /><line x1="217" y1="419" x2="217" y2="431" class="ref" /><line x1="733" y1="419" x2="733" y2="431" class="ref" /><text x="475" y="413" class="small" text-anchor="middle">最外湿边跨度（包含干洲）</text><text x="370" y="239" class="small" text-anchor="start">干洲</text><text x="105" y="485" class="small" text-anchor="start">同一接受水态的多汊切片；平面连通不在此剖面内</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  多汊湿宽相加，跨洲跨度另列</text><text x="42" y="575" class="note" text-anchor="start">此例两汊同一水位、同一接受状态，平面另有真实连通；干洲不计湿宽，不把不同水位的分湖合算</text><text x="42" y="603" class="note" text-anchor="start">。</text></g></svg>
