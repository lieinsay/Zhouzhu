<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-01-responsibilities desc-01-responsibilities" data-chapter="01-responsibilities"><title id="title-01-responsibilities">四方职责与权威快照</title><desc id="desc-01-responsibilities">形成事实、包内传递、游戏派生和运行水态各有责任。 生成器交付有成因的连续实体：岛体、层界、床岸与真实出口同源；标签和宽深摘要不能替代实际几何。；导出包保持事实并声明缺项：转换单位、分块与校验，不补宽深、供水或地下通路；依赖一并交付。；游戏派生显示、碰撞和查询：可改变三角化与局部原点，但受源边界、实体和关键特征约束。；运行水态只有一份库存：同版几何决定水空间；当天水位、湿边、盐沙归属由真实状态得到。；共同消费同一接受快照：多个表示不是多份水；第四层及补充已确认通过，设计通过不等于实现验证。。第四层设计已通过，非比例因果示意，不是模拟结果。</desc><defs><marker id="arrow-01-responsibilities" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">01 / 四方职责与权威快照</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="90" y="185" width="180" height="85" rx="9" class="active"/><text x="180" y="217" class="label" text-anchor="middle">生成器</text><text x="180" y="246" class="small" text-anchor="middle">形成与源几何</text><line x1="275" y1="227" x2="290" y2="227" class="flow" marker-end="url(#arrow-01-responsibilities)"/><rect x="295" y="185" width="180" height="85" rx="9" class="card"/><text x="385" y="217" class="label" text-anchor="middle">导出包</text><text x="385" y="246" class="small" text-anchor="middle">事实与依赖</text><line x1="480" y1="227" x2="495" y2="227" class="flow" marker-end="url(#arrow-01-responsibilities)"/><rect x="500" y="185" width="180" height="85" rx="9" class="card"/><text x="590" y="217" class="label" text-anchor="middle">游戏</text><text x="590" y="246" class="small" text-anchor="middle">受约束派生</text><line x1="685" y1="227" x2="700" y2="227" class="flow" marker-end="url(#arrow-01-responsibilities)"/><rect x="705" y="185" width="180" height="85" rx="9" class="card"/><text x="795" y="217" class="label" text-anchor="middle">运行水态</text><text x="795" y="246" class="small" text-anchor="middle">唯一库存</text><rect x="230" y="340" width="480" height="82" rx="9" class="card"/><text x="470" y="372" class="label" text-anchor="middle">共同权威几何与接受时刻</text><text x="470" y="401" class="small" text-anchor="middle">显示 / 碰撞 / 查询 / 水面 / HUD</text><line x1="477" y1="275" x2="477" y2="332" class="flow" marker-end="url(#arrow-01-responsibilities)"/><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x