<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-08-underground desc-08-underground" data-chapter="08-underground"><title id="title-08-underground">地下通路开闭与储量</title><desc id="desc-08-underground">几何接触、能力、当前水态和实际通过时间分别记录。 层界和真实接触来自源几何：岩性相同或挨近不证明连通；固态迁移缝隙也不自动导水。；新通路可能先湿润和储水：干裂隙或包气带不能立即当满水管，未知通量也不当零。；关闭通路保留两侧原水：开度、充填和阻力随有来源的过程改变；封闭不删除储量。；孔隙移动与相对渗流共同更新：孔隙增大不自动满水；压密排水需真实路径，水反力参与。；固态应力与地下孔压分开：有限高压固态岩层更新不新增水；深浅材料与地下版本同步。。第四层设计已通过，非比例因果示意，不是模拟结果。</desc><defs><marker id="arrow-08-underground" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">08 / 地下通路开闭与储量</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="210" width="780" height="260" rx="9" class="rock"/><line x1="80" y1="275" x2="860" y2="275" class="layer" /><line x1="80" y1="400" x2="860" y2="400" class="layer" /><rect x="125" y="302" width="220" height="72" rx="9" class="watercard"/><text x="235" y="334" class="label" text-anchor="middle">原含水域A</text><text x="235" y="363" class="small" text-anchor="middle">已有水 / 局地水头</text><rect x="595" y="302" width="220" height="72" rx="9" class="watercard"/><text x="705" y="334" class="label" text-anchor="middle">原含水域B</text><text x="705" y="363" class="small" text-anchor="middle">已有水 / 局地水头</text><rect x="355" y="305" width="230" height="60" rx="9" class="route"/><text x="378" y="288" class="small" text-anchor="start">源接触与材料</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  层界和真实接触来自源几何</text><text x="42" y="575" class="note" text-anchor="start">岩性相同或挨近不证明连通；固态迁移缝隙也不自动导水。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="210" width="780" height="260" rx="9" class="rock"/><line x1="80" y1="275" x2="860" y2="275" class="layer" /><line x1="80" y1="400" x2="860" y2="400" class="layer" /><rect x="125" y="302" width="220" height="72" rx="9" class="watercard"/><text x="235" y="334" class="label" text-anchor="middle">原含水域A</text><text x="235" y="363" class="small" text-anchor="middle">已有水 / 局地水头</text><rect x="595" y="302" width="220" height="72" rx="9" class="watercard"/><text x="705" y="334" class="label" text-anchor="middle">原含水域B</text><text x="705" y="363" class="small" text-anchor="middle">已有水 / 局地水头</text><rect x="355" y="305" width="230" height="60" rx="9" class="route"/><text x="378" y="288" class="small" text-anchor="start">先填实际路径</text><line x1="363" y1="335" x2="470" y2="335" class="flow" marker-end="url(#arrow-08-underground)"/><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  新通路可能先湿润和储水</text><text x="42" y="575" class="note" text-anchor="start">干裂隙或包气带不能立即当满水管，未知通量也不当零。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="210" width="780" height="260" rx="9" class="rock"/><line x1="80" y1="275" x2="860" y2="275" class="layer" /><line x1="80" y1="400" x2="860" y2="400" class="layer" /><rect x="125" y="302" width="220" height="72" rx="9" class="watercard"/><text x="235" y="334" class="label" text-anchor="middle">原含水域A</text><text x="235" y="363" class="small" text-anchor="middle">已有水 / 局地水头</text><rect x="595" y="302" width="220" height="72" rx="9" class="watercard"/><text x="705" y="334" class="label" text-anchor="middle">原含水域B</text><text x="705" y="363" class="small" text-anchor="middle">已有水 / 局地水头</text><rect x="355" y="305" width="230" height="60" rx="9" class="strata"/><text x="378" y="288" class="small" text-anchor="start">实际充填 / 闭合</text><line x1="465" y1="325" x2="485" y2="345" class="bad" /><line x1="465" y1="345" x2="485" y2="325" class="bad" /><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  关闭通路保留两侧原水</text><text x="42" y="575" class="note" text-anchor="start">开度、充填和阻力随有来源的过程改变；封闭不删除储量。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="210" width="780" height="260" rx="9" class="rock"/><line x1="80" y1="275" x2="860" y2="275" class="layer" /><line x1="80" y1="400" x2="860" y2="400" class="layer" /><rect x="125" y="302" width="220" height="72" rx="9" class="watercard"/><text x="235" y="334" class="label" text-anchor="middle">原含水域A</text><text x="235" y="363" class="small" text-anchor="middle">已有水 / 局地水头</text><rect x="595" y="302" width="220" height="72" rx="9" class="watercard"/><text x="705" y="334" class="label" text-anchor="middle">原含水域B</text><text x="705" y="363" class="small" text-anchor="middle">已有水 / 局地水头</text><rect x="355" y="305" width="230" height="60" rx="9" class="route"/><text x="378" y="288" class="small" text-anchor="start">孔隙边界移动</text><line x1="210" y1="430" x2="210" y2="388" class="event" marker-end="url(#arrow-08-underground)"/><line x1="280" y1="335" x2="402" y2="335" class="flow" marker-end="url(#arrow-08-underground)"/><text x="105" y="175" class="label" text-anchor="start">水可以相对岩层渗流，不能整块刚性拖走</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  孔隙移动与相对渗流共同更新</text><text x="42" y="575" class="note" text-anchor="start">孔隙增大不自动满水；压密排水需真实路径，水反力参与。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="210" width="780" height="260" rx="9" class="rock"/><line x1="80" y1="275" x2="860" y2="275" class="layer" /><line x1="80" y1="400" x2="860" y2="400" class="layer" /><rect x="125" y="302" width="220" height="72" rx="9" class="watercard"/><text x="235" y="334" class="label" text-anchor="middle">原含水域A</text><text x="235" y="363" class="small" text-anchor="middle">已有水 / 局地水头</text><rect x="595" y="302" width="220" height="72" rx="9" class="watercard"/><text x="705" y="334" class="label" text-anchor="middle">原含水域B</text><text x="705" y="363" class="small" text-anchor="middle">已有水 / 局地水头</text><rect x="355" y="305" width="230" height="60" rx="9" class="route"/><text x="378" y="288" class="small" text-anchor="start">不是高压供泉</text><text x="105" y="175" class="label" text-anchor="start">固态承压 ≠ 孔压；新岩石 ≠ 新的液态水</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  固态应力与地下孔压分开</text><text x="42" y="575" class="note" text-anchor="start">有限高压固态岩层更新不新增水；深浅材料与地下版本同步。</text></g></svg>
