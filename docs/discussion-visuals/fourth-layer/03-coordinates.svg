<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-03-coordinates desc-03-coordinates" data-chapter="03-coordinates"><title id="title-03-coordinates">坐标、高程与时间</title><desc id="desc-03-coordinates">物理坐标和显示变换分开，高程零点与三种时钟明确。 群局部坐标统一米制方向：x东、y上、z南；格心、轴向和投影只转换一次。；高程不是海面或云顶以上：床面、水面、层界和岛底都相对同一浮层基准；不要各自加偏移。；整体变换与相对床岸变化分开：整岛平移不加槽深；姿态变化后的静水仍按世界重力求面。；换锚只改变显示表示：CPU权威坐标双精度、局部块单精度；换锚不改变物理水深或坡降。；地质、事件和日常水文分别计时：生成加速不带入游玩；1.8米是当前人物名义尺寸，实际全局比例待验证。；物理度量与显示压缩分别声明：长度、面积、体积和控制高差用源度量；局部平面近似有范围与误差，换锚不改物理量。。第四层设计已通过，非比例因果示意，不是模拟结果。</desc><defs><marker id="arrow-03-coordinates" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">03 / 坐标、高程与时间</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><line x1="220" y1="385" x2="660" y2="385" class="edge" marker-end="url(#arrow-03-coordinates)"/><line x1="220" y1="385" x2="220" y2="155" class="edge" marker-end="url(#arrow-03-coordinates)"/><line x1="220" y1="385" x2="110" y2="445" class="edge" marker-end="url(#arrow-03-coordinates)"/><text x="675" y="391" class="label" text-anchor="start">x 东 · m</text><text x="238" y="164" class="label" text-anchor="start">y 上 · m</text><text x="96" y="470" class="label" text-anchor="start">z 南 · m</text><rect x="415" y="215" width="390" height="100" rx="9" class="card"/><text x="610" y="247" class="label" text-anchor="middle">格心 / 群心 / 岛姿态</text><text x="610" y="276" class="small" text-anchor="middle">源坐标转换只做一次</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  群局部坐标统一米制方向</text><text x="42" y="575" class="note" text-anchor="start">x东、y上、z南；格心、轴向和投影只转换一次。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><line x1="110" y1="175" x2="830" y2="175" class="ref" /><text x="120" y="160" class="label" text-anchor="start">浮层基准 y=0（示意位置）</text><line x1="110" y1="330" x2="830" y2="330" class="ghost" /><text x="120" y="316" class="label" text-anchor="start">云顶：独立绝对高程</text><line x1="110" y1="430" x2="830" y2="430" class="flow" /><text x="120" y="415" class="label" text-anchor="start">海面：独立绝对高程</text><path d="M485 205 L660 195 L760 215 L675 280 L560 275Z" class="rock" /><text x="530" y="245" class="small" text-anchor="start">同源岛体</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  高程不是海面或云顶以上</text><text x="42" y="575" class="note" text-anchor="start">床面、水面、层界和岛底都相对同一浮层基准；不要各自加偏移。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="ghost" transform="translate(0,-55)"/><line x1="760" y1="235" x2="760" y2="165" class="event" marker-end="url(#arrow-03-coordinates)"/><text x="135" y="145" class="label" text-anchor="start">整岛上移：床与岸一起移动，相对深度未增加</text><text x="125" y="465" class="small" text-anchor="start">倾斜时重新求水力；静水面不跟岛旋转</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  整体变换与相对床岸变化分开</text><text x="42" y="575" class="note" text-anchor="start">整岛平移不加槽深；姿态变化后的静水仍按世界重力求面。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="95" y="205" width="255" height="100" rx="9" class="card"/><text x="222.5" y="237" class="label" text-anchor="middle">权威物理位置</text><text x="222.5" y="266" class="small" text-anchor="middle">双精度 / 同一基准</text><line x1="365" y1="255" x2="560" y2="255" class="flow" marker-end="url(#arrow-03-coordinates)"/><rect x="580" y="205" width="265" height="100" rx="9" class="card"/><text x="712.5" y="237" class="label" text-anchor="middle">局部显示位置</text><text x="712.5" y="266" class="small" text-anchor="middle">换锚 / 块原点</text><text x="165" y="405" class="label" text-anchor="start">地形、水面、玩家和标注使用相容显示变换</text><text x="170" y="448" class="small" text-anchor="start">显示压缩不回写床坡和物理长度</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  换锚只改变显示表示</text><text x="42" y="575" class="note" text-anchor="start">CPU权威坐标双精度、局部块单精度；换锚不改变物理水深或坡降。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="100" y="165" width="570" height="70" rx="9" class="card"/><text x="385" y="197" class="label" text-anchor="middle">一亿年级背景</text><text x="385" y="226" class="small" text-anchor="middle">有限保存 / 不指定释放速度</text><rect x="100" y="260" width="570" height="70" rx="9" class="card"/><text x="385" y="292" class="label" text-anchor="middle">局部地质与洪水事件</text><text x="385" y="321" class="small" text-anchor="middle">真实事件时长 / 可以快</text><rect x="100" y="355" width="570" height="70" rx="9" class="card"/><text x="385" y="387" class="label" text-anchor="middle">日常水文</text><text x="385" y="416" class="small" text-anchor="middle">实际历日对应物理时长</text><circle cx="790" cy="347" r="8" class="person"/><line x1="790" y1="356" x2="790" y2="379" class="person" /><line x1="790" y1="362" x2="776" y2="372" class="person" /><line x1="790" y1="362" x2="803" y2="370" class="person" /><line x1="790" y1="379" x2="780" y2="399" class="person" /><line x1="790" y1="379" x2="800" y2="399" class="person" /><text x="720" y="448" class="small" text-anchor="start">名义1.8 m</text><text x="100" y="478" class="small" text-anchor="start">框宽与图形秒数不表示过程的实际时长</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  地质、事件和日常水文分别计时</text><text x="42" y="575" class="note" text-anchor="start">生成加速不带入游玩；1.8米是当前人物名义尺寸，实际全局比例待验证。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="90" y="205" width="230" height="100" rx="9" class="active"/><text x="205" y="237" class="label" text-anchor="middle">源坐标</text><text x="205" y="266" class="small" text-anchor="middle">投影 / 高程 / 重力基准</text><line x1="330" y1="255" x2="355" y2="255" class="flow" marker-end="url(#arrow-03-coordinates)"/><rect x="365" y="205" width="230" height="100" rx="9" class="active"/><text x="480" y="237" class="label" text-anchor="middle">物理度量</text><text x="480" y="266" class="small" text-anchor="middle">长度 / 面积 / 体积</text><line x1="605" y1="255" x2="630" y2="255" class="flow" marker-end="url(#arrow-03-coordinates)"/><rect x="640" y="205" width="230" height="100" rx="9" class="card"/><text x="755" y="237" class="label" text-anchor="middle">显示表示</text><text x="755" y="266" class="small" text-anchor="middle">局部原点 / 距离压缩</text><text x="115" y="405" class="label" text-anchor="start">坐标用米，不保证任意平面距离都等于球面距离</text><text x="125" y="449" class="small" text-anchor="start">“水平”引用同一源重力 / 高程基准</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  物理度量与显示压缩分别声明</text><text x="42" y="575" class="note" text-anchor="start">长度、面积、体积和控制高差用源度量；局部平面近似有范围与误差，换锚不改物理量。</text></g></svg>
