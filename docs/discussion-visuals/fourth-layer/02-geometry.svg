<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-02-geometry desc-02-geometry" data-chapter="02-geometry"><title id="title-02-geometry">连续几何与局部替换</title><desc id="desc-02-geometry">宏观面与实际局部实体一起定义世界，细槽不再重复挖一次。 宏观高度场保留其适用范围：增加三角形不增加源信息；窄槽、控制口须由上游过程细化。；源断面切自连续床岸：偏侧深槽、边滩、层界与真实折点直接传递；不独立造对称模板。；局部域替换相应母面贡献：输出最终实体，明确覆盖和接合；不能母格切谷后再减同一份深度。；复杂节点用实际局部面：弯、分汊、汇流与湖口保留真实实体/空洞，中心线索引不是全部几何。；顶面、侧壁、底面与层界同源：地下、悬挑和岛底不能用单值高度图填满；骨架深埋不是地表露出。；几何摘要与库容表能回到源面：A/T、湿周、库容与求解空间对应同一几何；舍入不造假通路，超出有效范围不任意外推。。第四层设计已通过，非比例因果示意，不是模拟结果。</desc><defs><marker id="arrow-02-geometry" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">02 / 连续几何与局部替换</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M90 245 L300 290 L500 320 L740 245 L855 245" class="ghost" /><text x="125" y="180" class="label" text-anchor="start">粗面摘要 ≠ 人尺度床岸</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  宏观高度场保留其适用范围</text><text x="42" y="575" class="note" text-anchor="start">增加三角形不增加源信息；窄槽、控制口须由上游过程细化。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><path d="M240 210 L720 210 L720 450 L240 450Z" class="patch" /><text x="270" y="177" class="label" text-anchor="start">连续源横断面：最深槽可以偏侧</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  源断面切自连续床岸</text><text x="42" y="575" class="note" text-anchor="start">偏侧深槽、边滩、层界与真实折点直接传递；不独立造对称模板。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><path d="M240 210 L720 210 L720 450 L240 450Z" class="patch" /><text x="270" y="177" class="label" text-anchor="start">局部源域：以最终实体替换母面</text><text x="110" y="460" class="small" text-anchor="start">材料体积只计一次</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  局部域替换相应母面贡献</text><text x="42" y="575" class="note" text-anchor="start">输出最终实体，明确覆盖和接合；不能母格切谷后再减同一份深度。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M130 245 Q340 120 430 290 Q500 430 750 345" class="widewater" /><path d="M430 290 Q650 175 825 245" class="widewater" /><path d="M595 274 L670 230 L700 264 L630 306Z" class="strata" /><text x="105" y="160" class="label" text-anchor="start">平面示意：洲体、分流和岸线来自实际源面</text><text x="120" y="460" class="small" text-anchor="start">不能由planform标签在游戏补弯</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  复杂节点用实际局部面</text><text x="42" y="575" class="note" text-anchor="start">弯、分汊、汇流与湖口保留真实实体/空洞，中心线索引不是全部几何。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M160 205 L340 185 L460 225 L620 195 L790 220 L820 345 L685 405 L510 455 L330 400 L160 330Z" class="rock" /><path d="M165 260 Q440 225 803 280" class="layer" /><path d="M180 305 Q470 265 790 325" class="layer" /><path d="M365 345 Q520 300 645 345 L610 372 Q485 340 365 370Z" class="core" /><text x="135" y="145" class="label" text-anchor="start">完整同源岛体剖面 · 非比例透视</text><text x="130" y="485" class="small" text-anchor="start">骨架与层界在内部；多面查询不能用一个高度替代</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  顶面、侧壁、底面与层界同源</text><text x="42" y="575" class="note" text-anchor="start">地下、悬挑和岛底不能用单值高度图填满；骨架深埋不是地表露出。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><text x="110" y="165" class="label" text-anchor="start">连续实体是依据，摘要和插值表是可核对派生量</text><rect x="100" y="420" width="220" height="62" rx="9" class="card"/><text x="210" y="452" class="label" text-anchor="middle">源断面 A / T</text><rect x="360" y="420" width="220" height="62" rx="9" class="card"/><text x="470" y="452" class="label" text-anchor="middle">实际蓄水空间</text><rect x="620" y="420" width="220" height="62" rx="9" class="card"/><text x="730" y="452" class="label" text-anchor="middle">表格范围与误差</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  几何摘要与库容表能回到源面</text><text x="42" y="575" class="note" text-anchor="start">A/T、湿周、库容与求解空间对应同一几何；舍入不造假通路，超出有效范围不任意外推。</text></g></svg>
