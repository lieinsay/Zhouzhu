<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-05-consistency desc-05-consistency" data-chapter="05-consistency"><title id="title-05-consistency">从源面到HUD的一致性</title><desc id="desc-05-consistency">共同读取同域同版事实，最近一条河不等于脚下实际有水。 源组合几何定义床岸与水空间：显示网格可细化，但不能换成另一个更浅、对称的河床。；可见实体与碰撞面对应：不填平深槽、不堵洞；接缝裙边不是水力地面。；水面来自接受水态：shader读取已支持状态，不独立由Q重估湿宽和深度。；查询区分局部与断面指标：脚下查同一湿域实际床面；河心深不能冒充岸边深。；HUD明确口径并保留未知：当处与断面指标分别标明；冰下液水、不可见、未加载、未解析与真实干态不能都返回0。。第四层设计已通过，非比例因果示意，不是模拟结果。</desc><defs><marker id="arrow-05-consistency" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">05 / 从源面到HUD的一致性</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><rect x="70" y="140" width="132" height="65" rx="9" class="active"/><text x="136" y="172" class="label" text-anchor="middle">源面</text><rect x="215" y="140" width="132" height="65" rx="9" class="card"/><text x="281" y="172" class="label" text-anchor="middle">可见面</text><rect x="360" y="140" width="132" height="65" rx="9" class="card"/><text x="426" y="172" class="label" text-anchor="middle">碰撞</text><rect x="505" y="140" width="132" height="65" rx="9" class="card"/><text x="571" y="172" class="label" text-anchor="middle">水面</text><rect x="650" y="140" width="132" height="65" rx="9" class="card"/><text x="716" y="172" class="label" text-anchor="middle">查询</text><rect x="795" y="140" width="132" height="65" rx="9" class="card"/><text x="861" y="172" class="label" text-anchor="middle">HUD</text><text x="100" y="494" class="small" text-anchor="start">同一实体、同一水域、同一接受时刻</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  源组合几何定义床岸与水空间</text><text x="42" y="575" class="note" text-anchor="start">显示网格可细化，但不能换成另一个更浅、对称的河床。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><rect x="70" y="140" width="132" height="65" rx="9" class="card"/><text x="136" y="172" class="label" text-anchor="middle">源面</text><rect x="215" y="140" width="132" height="65" rx="9" class="active"/><text x="281" y="172" class="label" text-anchor="middle">可见面</text><rect x="360" y="140" width="132" height="65" rx="9" class="active"/><text x="426" y="172" class="label" text-anchor="middle">碰撞</text><rect x="505" y="140" width="132" height="65" rx="9" class="card"/><text x="571" y="172" class="label" text-anchor="middle">水面</text><rect x="650" y="140" width="132" height="65" rx="9" class="card"/><text x="716" y="172" class="label" text-anchor="middle">查询</text><rect x="795" y="140" width="132" height="65" rx="9" class="card"/><text x="861" y="172" class="label" text-anchor="middle">HUD</text><text x="100" y="494" class="small" text-anchor="start">同一实体、同一水域、同一接受时刻</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  可见实体与碰撞面对应</text><text x="42" y="575" class="note" text-anchor="start">不填平深槽、不堵洞；接缝裙边不是水力地面。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L