320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><rect x="70" y="140" width="132" height="65" rx="9" class="card"/><text x="136" y="172" class="label" text-anchor="middle">源面</text><rect x="215" y="140" width="132" height="65" rx="9" class="card"/><text x="281" y="172" class="label" text-anchor="middle">可见面</text><rect x="360" y="140" width="132" height="65" rx="9" class="card"/><text x="426" y="172" class="label" text-anchor="middle">碰撞</text><rect x="505" y="140" width="132" height="65" rx="9" class="card"/><text x="571" y="172" class="label" text-anchor="middle">水面</text><rect x="650" y="140" width="132" height="65" rx="9" class="active"/><text x="716" y="172" class="label" text-anchor="middle">查询</text><rect x="795" y="140" width="132" height="65" rx="9" class="card"/><text x="861" y="172" class="label" text-anchor="middle">HUD</text><circle cx="395" cy="272" r="8" class="person"/><line x1="395" y1="281" x2="395" y2="304" class="person" /><line x1="395" y1="287" x2="381" y2="297" class="person" /><line x1="395" y1="287" x2="408" y2="295" class="person" /><line x1="395" y1="304" x2="385" y2="324" class="person" /><line x1="395" y1="304" x2="405" y2="324" class="person" /><line x1="410" y1="285" x2="410" y2="324" class="flow" /><line x1="403" y1="285" x2="417" y2="285" class="flow" /><line x1="403" y1="324" x2="417" y2="324" class="flow" /><text x="423" y="304.5" class="small" text-anchor="start">当处深</text><line x1="540" y1="285" x2="540" y2="410" class="flow" /><line x1="533" y1="285" x2="547" y2="285" class="flow" /><line x1="533" y1="410" x2="547" y2="410" class="flow" /><text x="553" y="347.5" class="small" text-anchor="start">断面最大深</text><text x="100" y="494" class="small" text-anchor="start">最近中线只选对象，不能据此判脚下有水</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  查询区分局部与断面指标</text><text x="4