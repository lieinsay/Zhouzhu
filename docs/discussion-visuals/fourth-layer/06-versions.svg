<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-06-versions desc-06-versions" data-chapter="06-versions"><title id="title-06-versions">接受状态与版本发布</title><desc id="desc-06-versions">候选状态先相容再发布，发布动作不代替物理过程。 从完整接受的t0提出变化：保留原库存与局地位置；候选几何不是可立即使用的事实。；同区间处理移动边界与水沙：形变、渗流、来水共同推进；水反力限制不相容形变。；构成相容t1并校核依赖：几何、层序、通路、拓扑和水态版本对应，每笔外部输入只计一次。；六类消费者共同切换：跨实际连接域准备显示、碰撞、查询；迟到的旧异步结果被丢弃。；插值不跨屏障或拓扑变化：仅同域相容时插值；等待旧态要有时刻，相连域与边界交换同段相容，不设无物理空间的待处理水库。。第四层设计已通过，非比例因果示意，不是模拟结果。</desc><defs><marker id="arrow-06-versions" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">06 / 接受状态与版本发布</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="90" y="185" width="250" height="125" rx="9" class="active"/><text x="215" y="217" class="label" text-anchor="middle">接受t0</text><text x="215" y="246" class="small" text-anchor="middle">G0 / 水态S0 / 原库存</text><rect x="585" y="185" width="250" height="125" rx="9" class="candidate"/><text x="710" y="217" class="label" text-anchor="middle">候选t1</text><text x="710" y="246" class="small" text-anchor="middle">G1 / 水态S1 / 相容依赖</text><line x1="350" y1="250" x2="575" y2="250" class="event" marker-end="url(#arrow-06-versions)"/><rect x="325" y="360" width="290" height="84" rx="9" class="card"/><text x="470" y="392" class="label" text-anchor="middle">提出实际过程</text><text x="470" y="421" class="small" text-anchor="middle">同一实际时间区间</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  从完整接受的t0提出变化</text><text x="42" y="575" class="note" text-anchor="start">保留原库存与局地位置；候选几何不是可立即使用的事实。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="90" y="185" width="250" height="125" rx="9" class="active"/><text x="215" y="217" class="label" text-anchor="middle">接受t0</text><text x="215" y="246" class="small" text-anchor="middle">G0 / 水态S0 / 原库存</text><rect x="585" y="185" width="250" height="125" rx="9" class="candidate"/><text x="710" y="217" class="label" text-anchor="middle">候选t1</text><text x="710" y="246" class="small" text-anchor="middle">G1 / 水态