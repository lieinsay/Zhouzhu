text-anchor="middle">接受t0</text><text x="215" y="246" class="small" text-anchor="middle">G0 / 水态S0 / 原库存</text><rect x="585" y="185" width="250" height="125" rx="9" class="active"/><text x="710" y="217" class="label" text-anchor="middle">接受t1</text><text x="710" y="246" class="small" text-anchor="middle">G1 / 水态S1 / 相容依赖</text><line x1="350" y1="250" x2="575" y2="250" class="event" marker-end="url(#arrow-06-versions)"/><rect x="325" y="360" width="290" height="84" rx="9" class="card"/><text x="470" y="392" class="label" text-anchor="middle">准备并相容发布</text><text x="470" y="421" class="small" text-anchor="middle">同一实际时间区间</text><line x1="680" y1="440" x2="730" y2="319" class="ghost" marker-end="url(#arrow-06-versions)"/><line x1="694" y1="369" x2="714" y2="389" class="bad" /><line x1="694" y1="389" x2="714" y2="369" class="bad" /><text x="665" y="467" class="small" text-anchor="start">拒绝旧结果</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  六类消费者共同切换</text><text x="42" y="575" class="note" text-anchor="start">跨实际连接域准备显示、碰撞、查询；迟到的旧异步结果被丢弃。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="90" y="185" width="250" height="125" rx="9" class="active"/><text x="215" y="217" class="label" text-anchor="middle">接受t0</text><text x="215" y="246" class="small" text-anchor="middle">G0 / 水态S0 / 原库存</text><rect x="585" y="185" width="250" height="125" rx="9" class="active"/><text x="710" y="217" class="label" text-anchor="middle">接受t1</text><text x="710" y="246" class="small" text-anchor="middle">G1 / 水态S1 / 相容依赖</text><line x1="350" y1="250" x2="575" y2="250" class="event" marker-end="url(#arrow-06-versions)"/><rect x="325" y="360" width="290" height="84" rx="9" class="card"/><text x="470" y="392" class="label" text-anchor="middle">保留真实事件过程</text><text x="470" y="421" class="small" text-anchor="middle">同一实际时间区间</text><text x="94" y="160" class="label" text-anchor="start">不是把两个终态混合成虚构的中间湖</text><text x="90" y="479" class="small" text-anchor="start">当前状态的物理时间与日历显示分别记录</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  插值不跨屏障或拓扑变化</text><text x="42" y="575" class="note" text-anchor="start">仅同域相容时插值；等待旧态要有时刻，相连域与边界交换同段相容，不设无物理空间的待处理水</text><text x="42" y="603" class="note" text-anchor="start">库。</text></g></svg>
