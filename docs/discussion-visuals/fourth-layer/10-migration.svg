<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-10-migration desc-10-migration" data-chapter="10-migration"><title id="title-10-migration">缓存、旧包与存档迁移</title><desc id="desc-10-migration">世界锁定事实与历史，缺失数据不能靠旧摘要精确恢复。 旧世界保留原事实和能力边界：旧包缺项保持缺失；格式可读还需相容旧语义与模型，不能换新默认参数继续推进并声称历史不变。；同物理事实可转换表示：无损转换 / 重建派生缓存不推进时间、不重造水或地形。；声明新能力却缺文件就拒收：不回退补造公式；中断包和混版依赖不进入有效缓存。；存档恢复完整接受状态：几何来源、变化、库存、时刻与驱动对应；不重新预热或填满库。；成因变化须新历史或显式迁移：先在副本提出映射、冲突与缺项，再按授权应用；本轮不执行。；三类保存内容不能混作临时缓存：自然源包、运行库存与派生缓存分开；前两者缺失不能仅凭seed重算，旧格式还需相容模型。。第四层设计已通过，非比例因果示意，不是模拟结果。</desc><defs><marker id="arrow-10-migration" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">10 / 缓存、旧包与存档迁移</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="105" y="195" width="290" height="105" rx="9" class="active"/><text x="250" y="227" class="label" text-anchor="middle">旧世界</text><text x="250" y="256" class="small" text-anchor="middle">原几何 / 原历史 / 原能力</text><rect x="550" y="195" width="290" height="105" rx="9" class="candidate"/><text x="695" y="227" class="label" text-anchor="middle">新契约能力</text><text x="695" y="256" class="small" text-anchor="middle">缺项不能默认补齐</text><line x1="410" y1="246" x2="535" y2="246" class="ghost" /><line x1="463" y1="236" x2="483" y2="256" class="bad" /><line x1="463" y1="256" x2="483" y2="236" class="bad" /><text x="125" y="415" class="label" text-anchor="start">同一个seed不保证同一个物理世界</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  旧世界保留原事实和能力边界</text><text x="42" y="575" class="note" text-anchor="start">旧包缺项保持缺失；格式可读还需相容旧语义与模型，不能换新默认参数继续推进并声称历史不变</text><text x="42" y="603" class="note" text-anchor="start">。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="90" y="200" width="285" height="105" rx="9" class="active"/><text x="232.5" y="232" class="label" text-anchor="middle">同一物理事实</text><text x="232.5" y="261" class="small" text-anchor="middle">原位置 / 原库存 / 原时间</text><line x1="390" y1="250" x2="545" y2="250" class="flow" marker-end="url(#arrow-10-migration)"/><rect x="565" y="200" width="280" height="105" rx="9" class="active"/><text x="705" y="232" class="label" text-anchor="middle">另一种表示</text><text x="705" y="261" class="small" text-anchor="middle">校验语义与误差</text><text x="150" y="420" class="label" text-anchor="start">换表示，不增加一份世界历史</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  同物理事实可转换表示</text><text x="42" y="575" class="note" text-anchor="start">无损转换 / 重建派生缓存不推进时间、不重造水或地形。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="110" y="180" width="295" height="115" rx="9" class="candidate"/><text x="257.5" y="212" class="label" text-anchor="middle">候选包</text><text x="257.5" y="241" class="small" text-anchor="middle">新声明 / 文件缺失</text><line x1="422" y1="240" x2="538" y2="240" class="ghost" marker-end="url(#arrow-10-migration)"/><line x1="469" y1="230" x2="489" y2="250" class="bad" /><line x1="469" y1="250" x2="489" y2="230" class="bad" /><rect x="558" y="180" width="285" height="115" rx="9" class="active"/><text x="700.5" y="212" class="label" text-anchor="middle">有效旧快照</text><text x="700.5" y="241" class="small" text-anchor="middle">完整版本继续保留</text><text x="125" y="420" class="label" text-anchor="start">缺文件 / 哈希不符 / 旧异步结果：明确拒收</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  声明新能力却缺文件就拒收</text><text x="42" y="575" class="note" text-anchor="start">不回退补造公式；中断包和混版依赖不进入有效缓存。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="105" y="175" width="720" height="100" rx="9" class="active"/><text x="465" y="207" class="label" text-anchor="middle">一个接受状态的恢复边界</text><text x="465" y="236" class="small" text-anchor="middle">源几何 + 局地库存 + 水态时刻 + 驱动状态</text><rect x="185" y="350" width="565" height="75" rx="9" class="card"/><text x="467.5" y="382" class="label" text-anchor="middle">不重新预热，不凭日期补满水</text><text x="467.5" y="411" class="small" text-anchor="middle">存档模型必须保留所需分布</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  存档恢复完整接受状态</text><text x="42" y="575" class="note" text-anchor="start">几何来源、变化、库存、时刻与驱动对应；不重新预热或填满库。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="90" y="180" width="230" height="105" rx="9" class="active"/><text x="205" y="212" class="label" text-anchor="middle">保留原世界</text><text x="205" y="241" class="small" text-anchor="middle">可回退</text><rect x="365" y="180" width="230" height="105" rx="9" class="candidate"/><text x="480" y="212" class="label" text-anchor="middle">审阅迁移副本</text><text x="480" y="241" class="small" text-anchor="middle">映射 / 缺项 / 冲突</text><rect x="640" y="180" width="230" height="105" rx="9" class="candidate"/><text x="755" y="212" class="label" text-anchor="middle">新历史或迁移</text><text x="755" y="241" class="small" text-anchor="middle">按以后明确授权</text><line x1="330" y1="230" x2="355" y2="230" class="flow" marker-end="url(#arrow-10-migration)"/><line x1="605" y1="230" x2="630" y2="230" class="flow" marker-end="url(#arrow-10-migration)"/><text x="150" y="415" class="label" text-anchor="start">本轮仅讨论政策，没有清缓存、迁移或重生成</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  成因变化须新历史或显式迁移</text><text x="42" y="575" class="note" text-anchor="start">先在副本提出映射、冲突与缺项，再按授权应用；本轮不执行。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="90" y="200" width="230" height="100" rx="9" class="active"/><text x="205" y="232" class="label" text-anchor="middle">自然源包</text><text x="205" y="261" class="small" text-anchor="middle">锁定事实 / 历史</text><rect x="365" y="200" width="230" height="100" rx="9" class="active"/><text x="480" y="232" class="label" text-anchor="middle">运行水态</text><text x="480" y="261" class="small" text-anchor="middle">库存 / 时刻 / 驱动</text><rect x="640" y="200" width="230" height="100" rx="9" class="card"/><text x="755" y="232" class="label" text-anchor="middle">派生缓存</text><text x="755" y="261" class="small" text-anchor="middle">网格 / 索引 / 摘要</text><text x="110" y="395" class="label" text-anchor="start">前两者是重建依据；只有派生表示可据完整事实重建</text><text x="135" y="448" class="small" text-anchor="start">目录叫cache，也不改变物理责任</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  三类保存内容不能混作临时缓存</text><text x="42" y="575" class="note" text-anchor="start">自然源包、运行库存与派生缓存分开；前两者缺失不能仅凭seed重算，旧格式还需相容模型。</text></g></svg>
