<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-07-topology desc-07-topology" data-chapter="07-topology"><title id="title-07-topology">改道、合并与分裂</title><desc id="desc-07-topology">来源映射用于追溯，水沿真实接触与有限通量移动。 改道改变以后来水路径：新来水沿新沟；旧槽已有水留在真实低点继续蒸渗或排出。；旧槽水不会瞬移给新河：改名、对象ID或前身后继映射都不能代替实际搬运。；窄口连通先发生有限交换：两盆水位可以不同，有路不等于立即成为同水位湖。；实际调平成立才共同水面：合并后库存只记一份；这是第二层适用条件，不是连通布尔开关。；分裂继承切断时局地库存：床脊先挤水、通路逐渐变窄；不按新总容量比例分旧水。。第四层设计已通过，非比例因果示意，不是模拟结果。</desc><defs><marker id="arrow-07-topology" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">07 / 改道、合并与分裂</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M100 250 Q280 155 465 260 Q600 375 830 325" class="route" /><path d="M100 250 Q260 245 360 335 Q550 460 830 430" class="widewater" /><line x1="155" y1="260" x2="245" y2="292" class="flow" marker-end="url(#arrow-07-topology)"/><path d="M480 269 Q535 305 590 315" class="widewater" /><text x="125" y="155" class="label" text-anchor="start">新来水转入真实新通路</text><text x="460" y="220" class="small" text-anchor="start">旧槽保留已有水潭</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  改道改变以后来水路径</text><text x="42" y="575" class="note" text-anchor="start">新来水沿新沟；旧槽已有水留在真实低点继续蒸渗或排出。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M100 250 Q280 155 465 260 Q600 375 830 325" class="route" /><path d="M100 250 Q260 245 360 335 Q550 460 830 430" class="widewater" /><line x1="155" y1="260" x2="245" y2="292" class="flow" marker-end="url(#arrow-07-topology)"/><path d="M480 269 Q535 305 590 315" class="widewater" /><text x="125" y="155" class="label" text-anchor="start">新来水转入真实新通路</text><text x="460" y="220" class="small" text-anchor="start">旧槽保留已有水潭</text><line x1="550" y1="319" x2="550" y2="393" class="ghost" marker-end="url(#arrow-07-topology)"/><line x1="540" y1="345" x2="560" y2="365" class="bad" /><line x1="540" y1="365" x2="560" y2="345" class="bad" /><text x="100" y="480" class="small" text-anchor="start">来源映射不搬水；上下游输入也不复制</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  旧槽水不会瞬移给新河</text><text x="42" y="575" class="note" text-anchor="start">改名、对象ID或前身后继映射都不能代替实际搬运。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 260 L200 260 L230 350 L345 350 L390 330 L540 330 L585 350 L715 350 L755 260 L860 260 L860 455 L90 455Z" class="rock" /><path d="M217 310 L230 350 L345 350 L390 330 L540 330 L585 350 L715 350 L731 315Z" class="water" /><line x1="217" y1="310" x2="380" y2="310" class="flow" /><line x1="380" y1="310" x2="550" y2="315" class="flow" /><line x1="550" y1="315" x2="731" y2="315" class="flow" /><line x1="405" y1="319" x2="520" y2="323" class="flow" marker-end="url(#arrow-07-topology)"/><text x="105" y="173" class="label" text-anchor="start">水位可不同：通道本身也有储水与输运时长</text><text x="103" y="485" class="small" text-anchor="start">有交换 ≠ 已调平</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  窄口连通先发生有限交换</text><text x="42" y="575" class="note" text-anchor="start">两盆水位可以不同，有路不等于立即成为同水位湖。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 260 L200 260 L230 350 L345 350 L390 330 L540 330 L585 350 L715 350 L755 260 L860 260 L860 455 L90 455Z" class="rock" /><path d="M213 300 L230 350 L345 350 L390 330 L540 330 L585 350 L715 350 L737 300Z" class="water" /><line x1="213" y1="300" x2="737" y2="300" class="flow" /><line x1="405" y1="312" x2="520" y2="312" class="flow" marker-end="url(#arrow-07-topology)"/><line x1="210" y1="300" x2="740" y2="300" class="ref" /><text x="112" y="172" class="label" text-anchor="start">此步假定实际能力与时长已支持近静水调平</text><text x="125" y="485" class="small" text-anchor="start">一个共同控制域，库存不重复</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  实际调平成立才共同水面</text><text x="42" y="575" class="note" text-anchor="start">合并后库存只记一份；这是第二层适用条件，不是连通布尔开关。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 260 L200 260 L230 350 L345 350 L390 260 L540 260 L585 350 L715 350 L755 260 L860 260 L860 455 L90 455Z" class="rock" /><path d="M217 310 L230 350 L345 350 L363 310Z" class="water" /><line x1="217" y1="310" x2="363" y2="310" class="flow" /><path d="M566 315 L585 350 L715 350 L731 315Z" class="water" /><line x1="566" y1="315" x2="731" y2="315" class="flow" /><path d="M420 310 L438 243 L496 243 L515 310Z" class="strata" /><line x1="458" y1="291" x2="478" y2="311" class="bad" /><line x1="458" y1="311" x2="478" y2="291" class="bad" /><text x="100" y="170" class="label" text-anchor="start">切断瞬间：两侧原水分别保留</text><text x="105" y="485" class="small" text-anchor="start">非静水不强行同水位；分网格不是物理分湖</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  分裂继承切断时局地库存</text><text x="42" y="575" class="note" text-anchor="start">床脊先挤水、通路逐渐变窄；不按新总容量比例分旧水。</text></g></svg>
