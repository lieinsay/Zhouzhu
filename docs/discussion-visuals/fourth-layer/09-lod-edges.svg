<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-09-lod-edges desc-09-lod-edges" data-chapter="09-lod-edges"><title id="title-09-lod-edges">LOD、接缝与岛缘裁切</title><desc id="desc-09-lod-edges">简化表示时保护关键床岸、控制口和独立岛身份。 源几何不随相机距离改变：求解和查询不读显示LOD，远处水面不画也仍有库存。；LOD保护最深线、岸脚与控制口：简化可少三角形，不能填潭、堵口或桥接干洲。；接缝不能用盖板封住河槽：共享同源边界或受约束过渡；裙边不变水力或碰撞。；斜口按真实边界求交：陆地水面止于真实出口，离体落水不是空中河床。；遮挡只影响是否绘制：不能隐藏几何缺口冒充正确还原；包围范围要覆盖实际水位。；卸载近景不丢水态或重置历史：远域保存接受状态、时刻与真实驱动；后台或相容补算仅结算一次边界交换，缺历史标缺失。。第四层设计已通过，非比例因果示意，不是模拟结果。</desc><defs><marker id="arrow-09-lod-edges" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">09 / LOD、接缝与岛缘裁切</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><text x="105" y="173" class="label" text-anchor="start">相机远近只改变表示，源床岸保持</text><text x="100" y="480" class="small" text-anchor="start">远景省略特征不等于水量归零</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  源几何不随相机距离改变</text><text x="42" y="575" class="note" text-anchor="start">求解和查询不读显示LOD，远处水面不画也仍有库存。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="220" cy="245" r="6" class="dot"/><circle cx="300" cy="295" r="6" class="dot"/><circle cx="385" cy="320" r="6" class="dot"/><circle cx="465" cy="334" r="6" class="dot"/><circle cx="540" cy="410" r="6" class="dot"/><circle cx="605" cy="345" r="6" class="dot"/><circle cx="670" cy="290" r="6" class="dot"/><circle cx="740" cy="245" r="6" class="dot"/><text x="100" y="176" class="label" text-anchor="start">关键折点保留；不沿岸顶直接连一条粗面</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  LOD保护最深线、岸脚与控制口</text><text x="42" y="575" class="note" text-anchor="start">简化可少三角形，不能填潭、堵口或桥接干洲。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="460" y1="220" x2="460" y2="450" class="ref" /><line x1="350" y1="310" x2="650" y2="310" class="ghost" /><line x1="490" y1="300" x2="510" y2="320" class="bad" /><line x1="490" y1="320" x2="510" y2="300" class="bad" /><text x="110" y="173" class="label" text-anchor="start">跨块边界共享床岸事实，盖板会改变真实河槽</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  接缝不能用盖板封住河槽</text><text x="42" y="575" class="note" text-anchor="start">共享同源边界或受约束过渡；裙边不变水力或碰撞。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M100 230 L600 230 L640 280 L620 355 L480 420 L100 395Z" class="rock" /><path d="M100 248 L600 248 L623 278" class="flow" /><path d="M623 278 Q660 323 690 455" class="fall" /><line x1="623" y1="280" x2="700" y2="280" class="ghost" /><line x1="665" y1="270" x2="685" y2="290" class="bad" /><line x1="665" y1="290" x2="685" y2="270" class="bad" /><text x="108" y="164" class="label" text-anchor="start">侧剖面：出口唇与顶 / 侧 / 底同源</text><text x="705" y="360" class="small" text-anchor="start">离体落水</text><text x="130" y="477" class="small" text-anchor="start">不能裁窄河口或在空中补床</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  斜口按真实边界求交</text><text x="42" y="575" class="note" text-anchor="start">陆地水面止于真实出口，离体落水不是空中河床。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><rect x="282" y="225" width="400" height="210" rx="9" class="patch"/><text x="120" y="175" class="label" text-anchor="start">可见性范围跟随水位与几何，不以床面旧范围误剔除</text><text x="110" y="479" class="small" text-anchor="start">未绘制 ≠ 干槽；遮挡不参与物理账</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  遮挡只影响是否绘制</text><text x="42" y="575" class="note" text-anchor="start">不能隐藏几何缺口冒充正确还原；包围范围要覆盖实际水位。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="95" y="190" width="280" height="110" rx="9" class="active"/><text x="235" y="222" class="label" text-anchor="middle">近景域</text><text x="235" y="251" class="small" text-anchor="middle">当前几何 / 接受水态</text><rect x="565" y="190" width="280" height="110" rx="9" class="active"/><text x="705" y="222" class="label" text-anchor="middle">远域 / 卸载显示</text><text x="705" y="251" class="small" text-anchor="middle">保有源事实 / 状态 / 时间</text><line x1="390" y1="241" x2="545" y2="241" class="flow" marker-end="url(#arrow-09-lod-edges)"/><text x="470" y="205" class="small" text-anchor="middle">真实界面</text><rect x="255" y="360" width="440" height="80" rx="9" class="card"/><text x="475" y="392" class="label" text-anchor="middle">同一接受区间，一份累计交换</text><text x="475" y="421" class="small" text-anchor="middle">供体扣、受体加；不凭重载补水</text><text x="125" y="473" class="small" text-anchor="start">显示tile不是封闭水文边界</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  卸载近景不丢水态或重置历史</text><text x="42" y="575" class="note" text-anchor="start">远域保存接受状态、时刻与真实驱动；后台或相容补算仅结算一次边界交换，缺历史标缺失。</text></g></svg>
