<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-11-time-cycle desc-11-time-cycle"><title id="title-11-time-cycle">时间与循环：形成、成熟与回收</title><desc id="desc-11-time-cycle">物理库存跨阶段保留；动画秒数不是地质年数。。第一代由初始库存形成，回收不是它的前提：元素迁移、富集、深部结晶接合；没有上一代也能启动。。地质演化与日内水文使用不同时间尺度：多年水沙统计推进地貌；新几何重算出口，原水、盐、沙不重置。。非常老的岛实际剥蚀露核，长期失能可进入回收：侵蚀减重不自动使岛下沉；衰减、变形和外部作用按现有循环处理。。落海、埋藏和地质运输后再受热：保存有效结构的材料可再充和接合；失效材料可重新进入深部结晶路径。</desc><defs><marker id="arrow-11-time-cycle" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">11 / 时间与循环：形成、成熟与回收</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="45" y="185" width="850" height="105" rx="0" class="strata"/><rect x="45" y="290" width="850" height="190" rx="0" class="rock"/><line x1="45" y1="255" x2="895" y2="255" class="layerline"/><line x1="45" y1="340" x2="895" y2="340" class="layerline"/><line x1="45" y1="414" x2="895" y2="414" class="layerline"/><path d="M255 377 Q470 310 685 377 Q470 444 255 377Z" class="inactive" /><path d="M303 377 Q470 329 637 377 Q470 425 303 377Z" class="core" /><path d="M470 459 L470 416" class="force" marker-end="url(#arrow-11-time-cycle)"/><text x="115" y="168" class="label">初始元素库存 → 分异富集 → 首次骨架</text><text x="125" y="471" class="label">后续旧骨架材料可加入同一深部循环</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  第一代由初始库存形成，回收不是它的前提</text><text x="43" y="575" class="label">元素迁移、富集、深部结晶接合；没有上一代也能启动。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="65" y="192" width="365" height="145" rx="12" class="strata"/><text x="80" y="225" class="label">形成 / 构造 / 地表材料</text><rect x="500" y="192" width="370" height="145" rx="12" class="strata"/><text x="515" y="225" class="label">天气 / 储量 / 有限出流</text><path d="M438 242 L490 242" class="flow" marker-end="url(#arrow-11-time-cycle)"/><path d="M490 291 L438 291" class="flow" marker-end="url(#arrow-11-time-cycle)"/><text x="105" y="387" class="label">事件时间与材料变化</text><text x="546" y="387" class="label">天与必要暴雨子步</text><text x="90" y="474" class="label">成熟快照有明确历史时刻，不按画面满意停迭代</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 4  地质演化与日内水文使用不同时间尺度</text><text x="43" y="575" class="label">多年水沙统计推进地貌；新几何重算出口，原水、盐、沙不重置。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M180 316 L280 302 L355 312 L395 309 Q465 315 535 309 L565 315 L730 316 Q620 369 510 395 Q465 426 405 386 Q275 352 180 316Z" class="rock" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><path d="M465 410 L465 466" class="gravity" marker-end="url(#arrow-11-time-cycle)"/><text x="95" y="155" class="label">人尺度不播放岛体生灭</text><text x="95" y="474" class="label">整体失效细节延期；并非所有碎块立刻沉底</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 4  非常老的岛实际剥蚀露核，长期失能可进入回收</text><text x="43" y="575" class="label">侵蚀减重不自动使岛下沉；衰减、变形和外部作用按现有循环处理。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="45" y="182" width="850" height="76" rx="0" class="water"/><rect x="45" y="258" width="850" height="224" rx="0" class="rock"/><circle cx="265" cy="233" r="27" class="inactive"/><path d="M265 271 Q340 420 518 432" class="gravity" marker-end="url(#arrow-11-time-cycle)"/><path d="M640 478 Q580 381 733 367 Q850 420 850 478Z" class="magma" /><path d="M666 421 Q730 394 794 421 Q730 448 666 421Z" class="core" /><path d="M768 361 L768 291" class="force" marker-end="url(#arrow-11-time-cycle)"/><text x="82" y="151" class="label">外海、埋藏与深部输运</text><text x="96" y="475" class="label">不是自由穿岩或快速气泡；循环不增加元素总量</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  落海、埋藏和地质运输后再受热</text><text x="43" y="575" class="label">保存有效结构的材料可再充和接合；失效材料可重新进入深部结晶路径。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>