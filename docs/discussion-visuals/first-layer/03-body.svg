<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-03-body desc-03-body"><title id="title-03-body">完整岛体：四条件的连续出生过程</title><desc id="desc-03-body">先保留内部传力，再解除外部连接；水和储能变化后重新检查平衡。。内部包覆岩体必须有真实传力路径：上部受压；下部和悬伸区经岩桥、接头或连续围岩承受拉伸与剪切。。三维外部连接仍在，就不能自由脱离：侧剖面两端断开仍可能有背面或底部岩桥；局部圈线不是分离证明。。连到海的分离缝才允许海水进入：进水受截面、水头和阻力限制；封闭腔保持原有状态，不瞬间灌满。。三维脱离后出水，更新实际携带水：困住或暂存水计载荷与重心，进排水只记一次；留存海水不是淡水。。用剩余储能求高度，并检查恢复方向：出水后普通浮力退出；上升做功先更新储能，再求当前高度平衡。。姿态必须单独通过扰动检查：低侧支撑增强不保证自动扶正；检查根部、支撑分布、纹理和水的迁移。</desc><defs><marker id="arrow-03-body" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">04 / 完整岛体：四条件的连续出生过程</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="45" y="185" width="850" height="105" rx="0" class="strata"/><rect x="45" y="290" width="850" height="190" rx="0" class="rock"/><line x1="45" y1="255" x2="895" y2="255" class="layerline"/><line x1="45" y1="340" x2="895" y2="340" class="layerline"/><line x1="45" y1="414" x2="895" y2="414" class="layerline"/><g transform="translate(0 20)"><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><line x1="340" y1="340" x2="360" y2="395" class="bridge"/><line x1="580" y1="340" x2="560" y2="395" class="bridge"/><path d="M330 395 L330 325" class="force" marker-end="url(#arrow-03-body)"/><path d="M610 395 L610 325" class="force" marker-end="url(#arrow-03-body)"/><path d="M465 414 L465 462" class="gravity" marker-end="url(#arrow-03-body)"/><text x="100" y="125" class="label">内部岩桥与外部海底连接分别检查</text><text x="95" y="468" class="label">总支撑足够，不等于下部岩体能被带走</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 6  内部包覆岩体必须有真实传力路径</text><text x="43" y="575" class="label">上部受压；下部和悬伸区经岩桥、接头或连续围岩承受拉伸与剪切。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="45" y="190" width="445" height="240" rx="0" class="rock"/><g transform="translate(-45 100) scale(.68)"><g transform="translate(0 0)"><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><path d="M170 250 Q235 350 410 395 Q475 438 540 385 Q675 325 735 250" class="fault" /><line x1="445" y1="397" x2="460" y2="440" class="bridge"/></g><ellipse cx="710" cy="320" rx="155" ry="88" class="strata"/><ellipse cx="710" cy="320" rx="117" ry="62" class="fault"/><path d="M635 320 Q710 290 785 320 Q710 350 635 320Z" class="core" /><line x1="710" y1="255" x2="710" y2="211" class="bridge"/><text x="110" y="175" class="label">侧剖面：底部桥</text><text x="601" y="175" class="label">平面：背面桥</text><text x="568" y="451" class="label">全周与底部都需实际解除连接</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 6  三维外部连接仍在，就不能自由脱离</text><text x="43" y="575" class="label">侧剖面两端断开仍可能有背面或底部岩桥；局部圈线不是分离证明。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="45" y="263" width="850" height="220" rx="0" class="water"/><rect x="45" y="450" width="850" height="38" rx="0" class="rock"/><g transform="translate(0 0)"><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><line x1="45" y1="263" x2="180" y2="263" class="waterline"/><line x1="735" y1="263" x2="895" y2="263" class="waterline"/><path d="M840 350 Q770 425 622 435" class="flow" marker-end="url(#arrow-03-body)"/><path d="M110 340 Q170 422 335 435" class="flow" marker-end="url(#arrow-03-body)"/><line x1="445" y1="424" x2="445" y2="450" class="bridge"/><text x="80" y="115" class="label">海水可在完全脱离之前进入连通缝</text><text x="95" y="466" class="label">自由交换水：不双计为岛重和排水体积</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 6  连到海的分离缝才允许海水进入</text><text x="43" y="575" class="label">进水受截面、水头和阻力限制；封闭腔保持原有状态，不瞬间灌满。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="45" y="355" width="850" height="130" rx="0" class="water"/><line x1="45" y1="355" x2="895" y2="355" class="waterline"/><g transform="translate(0 -20)"><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><rect x="503" y="252" width="55" height="17" rx="5" class="water"/><path d="M503 252 L503 269 L558 269 L558 252" class="layerline" /><line x1="557" y1="261" x2="686" y2="209" class="reference"/><text x="643" y="191" class="label">示例：实际困水</text><path d="M737 356 Q768 397 785 447" class="flow" marker-end="url(#arrow-03-body)"/><text x="80" y="340" class="label">海面</text><text x="80" y="107" class="label">全周与底部外部连接已实际解除</text><text x="81" y="470" class="label">开放水排回海；暂存水按真实出口能力逐步排出</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 6  三维脱离后出水，更新实际携带水</text><text x="43" y="575" class="label">困住或暂存水计载荷与重心，进排水只记一次；留存海水不是淡水。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="45" y="425" width="850" height="60" rx="0" class="water"/><line x1="45" y1="425" x2="895" y2="425" class="waterline"/><g><g transform="translate(0 -10)"><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><animateTransform attributeName="transform" type="translate" values="0 -8;0 0;0 8;0 0;0 -8" dur="6s" repeatCount="indefinite"/></g><path d="M335 350 L335 295" class="force" marker-end="url(#arrow-03-body)"/><path d="M610 350 L610 295" class="force" marker-end="url(#arrow-03-body)"/><path d="M465 188 L465 230" class="gravity" marker-end="url(#arrow-03-body)"/><path d="M824 221 L824 268" class="gravity" marker-end="url(#arrow-03-body)"/><path d="M824 376 L824 329" class="force" marker-end="url(#arrow-03-body)"/><text x="691" y="191" class="label">偏高：净作用向下</text><text x="691" y="402" class="label">偏低：净作用向上</text><text x="86" y="470" class="label">方向与位移仅作讲解；有恢复趋势不等于瞬间静止</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 6  用剩余储能求高度，并检查恢复方向</text><text x="43" y="575" class="label">出水后普通浮力退出；上升做功先更新储能，再求当前高度平衡。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><g transform="translate(-35 102) scale(.64)"><g><g transform="translate(0 0)"><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><animateTransform attributeName="transform" type="rotate" values="-5 465 300;0 465 300;5 465 300;0 465 300;-5 465 300" dur="6s" repeatCount="indefinite"/></g></g><g transform="translate(417 102) scale(.64)"><g transform="rotate(19 465 300)"><g transform="translate(0 0)"><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g></g></g><text x="92" y="165" class="label">候选A：有可维持的扶正趋势</text><text x="510" y="165" class="label">候选B：扰动放大，出生失败</text><text x="95" y="469" class="label">两个水平轴及耦合扰动都要检查；不能增加倍率保证成功</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">6 / 6  姿态必须单独通过扰动检查</text><text x="43" y="575" class="label">低侧支撑增强不保证自动扶正；检查根部、支撑分布、纹理和水的迁移。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>