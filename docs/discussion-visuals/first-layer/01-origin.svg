<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-01-origin desc-01-origin"><title id="title-01-origin">第一代：元素怎样成为骨架</title><desc id="desc-01-origin">从初始元素库存开始，不借上一代岛屿作起点。。分散元素随地下岩浆迁移：初始库存有限；热不制造元素，也不把整个地幔供给一座岛。。结晶分异与富集液相分离：普通矿物先结晶；剩余熔体富集，并在适用条件下分出较重液滴。。重液滴在真实低部位聚集：沿液态介质路径汇集；位置由地下体几何决定，不预放未来岛心。。首次成核、长大并接合：适合的深部温压下原位结晶；残液排出或留下夹杂，不自动除杂。</desc><defs><marker id="arrow-01-origin" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">01 / 第一代：元素怎样成为骨架</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，