<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-05-merge desc-05-merge"><title id="title-05-merge">多核心：保留前身与拼合历史</title><desc id="desc-05-merge">较大岛希望更常见多核心；不能按面积直接配核数。。各前身保留自己的层序、骨架和水路：山地与盆地先有成因，不用随机地貌标签拼图。。相对运动引起接缝变形：挤压、伸展和剪切各需运动来源；不随机添加断层。。伸展与剪切必须有对应相对运动：正断层改变层界和断块高程；侧向错断不能由倾斜标签生成。。冷态拼合先靠岩体嵌合和实际承载连接：风 / 大气供水平机械功，大骨架受很大但有限约束；不新增水平相吸。。山地来水只有实际连通才进入盆地：拼合可能增加汇水，也可能切开出口，不能规定必生大湖。</desc><defs><marker id="arrow-05-merge" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">06 / 多核心：保留前身与拼合历史</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><g transform="translate(-70 55) scale(.62)"><g transform="translate(0 0)"><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g></g><g transform="translate(410 55) scale(.62)"><g transform="translate(0 0)"><path d="M170 250 L245 200 L300 223 L370 250 L500 260 L605 240 L670 204 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L245 200 L300 223 L370 250 L500 260 L605 240 L670 204 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g></g><text x="135" y="435" class="label">山地前身</text><text x="630" y="435" class="label">盆地前身</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 5  各前身保留自己的层序、骨架和水路</text><text x="43" y="575" class="label">山地与盆地先有成因，不用随机地貌标签拼图。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M115 290 L245 170 L380 250 L470 220 L540 288 L610 308 L725 252 L845 290 Q705 407 560 410 Q320 430 115 290Z" class="rock" /><path d="M182 325 Q290 282 398 325 Q290 368 182 325Z" class="core" /><path d="M570 336 Q655 306 740 336 Q655 366 570 336Z" class="core" /><path d="M410 274 Q430 234 450 269 Q470 303 490 266" class="fold" /><path d="M210 470 L390 470" class="flow" marker-end="url(#arrow-05-merge)"/><path d="M740 470 L560 470" class="flow" marker-end="url(#arrow-05-merge)"/><text x="390" y="172" class="label">真实接缝与变形</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 5  相对运动引起接缝变形</text><text x="43" y="575" class="label">挤压、伸展和剪切各需运动来源；不随机添加断层。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="55" y="180" width="410" height="240" rx="12" class="strata"/><text x="70" y="213" class="label">剖面：有限伸展</text><path d="M90 278 L247 278 L247 337 L430 337" class="layerline" /><path d="M247 238 L247 383" class="fault" /><path d="M195 400 L 90 400" class="flow" marker-end="url(#arrow-05-merge)"/><path d="M315 400 L430 400" class="flow" marker-end="url(#arrow-05-merge)"/><rect x="505" y="180" width="380" height="240" rx="12" class="strata"/><text x="520" y="213" class="label">平面：侧向剪切</text><path d="M680 232 L680 379" class="fault" /><path d="M637 350 L637 257" class="flow" marker-end="url(#arrow-05-merge)"/><path d="M727 250 L727 355" class="flow" marker-end="url(#arrow-05-merge)"/><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 5  伸展与剪切必须有对应相对运动</text><text x="43" y="575" class="label">正断层改变层界和断块高程；侧向错断不能由倾斜标签生成。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 250 L300 220 L434 280 L472 265 L498 315 L540 299 L830 250 L850 424 L90 424Z" class="rock" /><path d="M175 342 Q290 302 405 342 Q290 382 175 342Z" class="core" /><path d="M564 342 Q679 302 794 342 Q679 382 564 342Z" class="core" /><path d="M434 280 L472 265 L498 315 L540 299" class="bridge" /><text x="86" y="164" class="label">相遇记录有驱动、方向、时间和能量</text><text x="93" y="471" class="label">两核分别供力；碰撞不会自动热焊或复制浮能</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 5  冷态拼合先靠岩体嵌合和实际承载连接</text><text x="43" y="575" class="label">风 / 大气供水平机械功，大骨架受很大但有限约束；不新增水平相吸。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M115 290 L245 170 L380 250 L470 220 L540 288 L610 308 L725 252 L845 290 Q705 407 560 410 Q320 430 115 290Z" class="rock" /><path d="M182 325 Q290 282 398 325 Q290 368 182 325Z" class="core" /><path d="M570 336 Q655 306 740 336 Q655 366 570 336Z" class="core" /><path d="M260 190 Q310 245 365 260" class="flow" marker-end="url(#arrow-05-merge)"/><text x="315" y="195" class="label">分水岭可能阻断水路</text><text x="540" y="464" class="label">供水、损失与出口共同决定水况</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 5  山地来水只有实际连通才进入盆地</text><text x="43" y="575" class="label">拼合可能增加汇水，也可能切开出口，不能规定必生大湖。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>