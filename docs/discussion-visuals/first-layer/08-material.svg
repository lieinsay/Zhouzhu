<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-08-material desc-08-material"><title id="title-08-material">材料规则：结构、储能与可用支撑</title><desc id="desc-08-material">结构保持、能量多少、姿态和宏观连接分别判断。。普通结构、有效缺能与有效已充能分别存在：加热不制造元素；缺能不等于结构坏，结构坏也不能靠普通热充自动恢复。。天然温压促成有效结构，常压可以长期保留：形成路径和保持路径不同；卸压后回退受转变障碍限制，不永久不可变。。正常热充与明显结构重排分开：正确结构达到充能条件即可补能；当前科技不默认低压晶种再造高压相。。支撑有限，接合传力不制造额外能量：按统一有限能量势记账；静止无机械功，下降可逆部分返回，实际耗散另扣。</desc><defs><marker id="arrow-08-material" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">02 / 材料规则：结构、储能与可用支撑</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="65" y="212" width="240" height="205" rx="12" class="rock"/><text x="80" y="245" class="label">普通结构</text><rect x="350" y="212" width="240" height="205" rx="12" class="strata"/><text x="365" y="245" class="label">有效结构 · 缺能</text><rect x="635" y="212" width="240" height="205" rx="12" class="strata"/><text x="650" y="245" class="label">有效结构 · 已充能</text><circle cx="185" cy="325" r="45" class="inactive"/><circle cx="470" cy="325" r="45" class="core"/><circle cx="755" cy="325" r="45" class="core"/><line x1="437" y1="325" x2="503" y2="325" class="texture"/><line x1="722" y1="325" x2="788" y2="325" class="texture"/><rect x="714" y="381" width="82" height="13" rx="4" class="core"/><text x="87" y="468" class="label">同一种元素的不同结构与储能状态</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  普通结构、有效缺能与有效已充能分别存在</text><text x="43" y="575" class="label">加热不制造元素；缺能不等于结构坏，结构坏也不能靠普通热充自动恢复。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="45" y="185" width="850" height="105" rx="0" class="strata"/><rect x="45" y="290" width="850" height="190" rx="0" class="rock"/><line x1="45" y1="255" x2="895" y2="255" class="layerline"/><line x1="45" y1="340" x2="895" y2="340" class="layerline"/><line x1="45" y1="414" x2="895" y2="414" class="layerline"/><rect x="110" y="285" width="250" height="115" rx="12" class="strata"/><text x="125" y="318" class="label">深部热处理</text><path d="M392 342 L540 342" class="flow" marker-end="url(#arrow-08-material)"/><rect x="580" y="250" width="230" height="150" rx="12" class="strata"/><text x="595" y="283" class="label">常压保留区</text><circle cx="710" cy="333" r="34" class="core"/><text x="133" y="169" class="label">压力帮助结构形成，不是每次充能的许可</text><text x="153" y="458" class="label">保留需要可行的降温、卸压历史</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 4  天然温压促成有效结构，常压可以长期保留</text><text x="43" y="575" class="label">形成路径和保持路径不同；卸压后回退受转变障碍限制，不永久不可变。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="65" y="210" width="365" height="220" rx="12" class="strata"/><text x="80" y="243" class="label">结构保持的热充区间</text><circle cx="245" cy="320" r="43" class="core"/><path d="M111 326 L184 326" class="gravity" marker-end="url(#arrow-08-material)"/><rect x="202" y="388" width="87" height="13" rx="3" class="core"/><rect x="480" y="210" width="395" height="220" rx="12" class="strata"/><text x="495" y="243" class="label">更易重排的处理条件</text><circle cx="677" cy="320" r="43" class="inactive"/><line x1="642" y1="297" x2="712" y2="343" class="texture"/><text x="105" y="470" class="label">温度、时间、结构与加载共同决定结果；无虚构数值</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 4  正常热充与明显结构重排分开</text><text x="43" y="575" class="label">正确结构达到充能条件即可补能；当前科技不默认低压晶种再造高压相。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><g transform="translate(0 -5)"><path d="M170 250 L250 225 L315 190 L570 190 L630 226 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L250 225 L315 190 L570 190 L630 226 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><path d="M345 352 L345 282" class="force" marker-end="url(#arrow-08-material)"/><path d="M605 352 L605 282" class="force" marker-end="url(#arrow-08-material)"/><path d="M468 205 L468 248" class="gravity" marker-end="url(#arrow-08-material)"/><text x="89" y="155" class="label">体积、有效域、储能、姿态和高度共同约束</text><text x="120" y="464" class="label">转轴调支撑，不产生水平推力或无来源净能</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  支撑有限，接合传力不制造额外能量</text><text x="43" y="575" class="label">按统一有限能量势记账；静止无机械功，下降可逆部分返回，实际耗散另扣。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>