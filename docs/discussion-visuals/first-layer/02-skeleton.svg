<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-02-skeleton desc-02-skeleton"><title id="title-02-skeleton">核心与骨架：展布和增厚</title><desc id="desc-02-skeleton">核心是主要支撑区，骨架是有范围和连接的分布体。。形成体上移，受到真实围岩约束：特殊作用向上；接合、充能、移动可以同时发生。。遇阻后沿可变形层界展布：侧向运动来自应力与围岩变形，不是水平浮力或相互吸引。。持续供给使内部较厚，边缘有限扩展：内部仍能容纳、外围扩展较难时才增厚；不强制钟形。。不同约束可以留下薄片、偏心体或失败：材料、热、连接与围岩条件共同决定形态，不按核心倍率画山。</desc><defs><marker id="arrow-02-skeleton" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">03 / 核心与骨架：展布和增厚</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="45" y="185" width="850" height="105" rx="0" class="strata"/><rect x="45" y="290" width="850" height="190" rx="0" class="rock"/><line x1="45" y1="255" x2="895" y2="255" class="layerline"/><line x1="45" y1="340" x2="895" y2="340" class="layerline"/><line x1="45" y1="414" x2="895" y2="414" class="layerline"/><path d="M360 398 Q470 352 580 398 Q470 444 360 398Z" class="core" /><path d="M470 350 L470 260" class="force" marker-end="url(#arrow-02-skeleton)"/><text x="350" y="177" class="label">较完整上覆岩层</text><text x="100" y="471" class="label">不是气泡自由穿岩</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  形成体上移，受到真实围岩约束</text><text x="43" y="575" class="label">特殊作用向上；接合、充能、移动可以同时发生。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="45" y="185" width="850" height="105" rx="0" class="strata"/><rect x="45" y="290" width="850" height="190" rx="0" class="rock"/><line x1="45" y1="255" x2="895" y2="255" class="layerline"/><line x1="45" y1="340" x2="895" y2="340" class="layerline"/><line x1="45" y1="414" x2="895" y2="414" class="layerline"/><path d="M250 354 Q470 312 690 354 Q470 396 250 354Z" class="core" /><path d="M445 355 L280 355" class="flow" marker-end="url(#arrow-02-skeleton)"/><path d="M495 355 L665 355" class="flow" marker-end="url(#arrow-02-skeleton)"/><path d="M470 430 L470 376" class="force" marker-end="url(#arrow-02-skeleton)"/><text x="295" y="179" class="label">实际层界与容纳空间</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 4  遇阻后沿可变形层界展布</text><text x="43" y="575" class="label">侧向运动来自应力与围岩变形，不是水平浮力或相互吸引。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="45" y="185" width="850" height="105" rx="0" class="strata"/><rect x="45" y="290" width="850" height="190" rx="0" class="rock"/><line x1="45" y1="255" x2="895" y2="255" class="layerline"/><line x1="45" y1="340" x2="895" y2="340" class="layerline"/><line x1="45" y1="414" x2="895" y2="414" class="layerline"/><path d="M180 350 Q470 267 760 350 Q470 433 180 350Z" class="core" /><path d="M435 470 L435 420 Q470 395 505 420 L505 470" class="inactive" /><path d="M470 465 L470 412" class="force" marker-end="url(#arrow-02-skeleton)"/><text x="362" y="343" class="oncore">主要支撑区</text><text x="188" y="465" class="label">薄外展部分</text><text x="683" y="465" class="label">薄外展部分</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 4  持续供给使内部较厚，边缘有限扩展</text><text x="43" y="575" class="label">内部仍能容纳、外围扩展较难时才增厚；不强制钟形。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="80" y="195" width="780" height="285" rx="18" class="strata"/><path d="M135 320 Q290 298 445 320 Q290 342 135 320Z" class="core" /><path d="M525 325 Q640 252 755 325 Q640 398 525 325Z" class="core" /><text x="155" y="415" class="label">侧向展布容易：薄片</text><text x="528" y="415" class="label">供给偏置：偏心厚体</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  不同约束可以留下薄片、偏心体或失败</text><text x="43" y="575" class="label">材料、热、连接与围岩条件共同决定形态，不按核心倍率画山。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>