<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-07-old-island desc-07-old-island"><title id="title-07-old-island">非常老的岛：露出、取材与控制</title><desc id="desc-07-old-island">骨架不是普通岛缘随处可采；当前科技利用天然有效结构。。正常岛屿的骨架深埋：普通风化、小规模崩落只能移除当处岩层，不能越过覆岩。。非常老且长期剥蚀后，骨架局部实际出露：不能按“老岛”标签自动露核；必须移除足够覆岩材料。。局部脱落中，部分有效小块仍能漂浮：保留结构、能量和自重共同决定；不是所有老岛碎块都可用。。识别、切取有效材料，转轴可逆调节姿态：转动利用既有纹理，不再造高压结构；特殊支撑始终向上。</desc><defs><marker id="arrow-07-old-island" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">10 / 非常老的岛：露出、取材与控制</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><g transform="translate(0 20)"><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><text x="117" y="171" class="label">有实际厚覆岩层</text><text x="90" y="475" class="label">当前人类无法直接挖到岛级核心与结构层</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  正常岛屿的骨架深埋</text><text x="43" y="575" class="label">普通风化、小规模崩落只能移除当处岩层，不能越过覆岩。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M180 316 L280 302 L355 312 L395 309 Q465 315 535 309 L565 315 L730 316 Q620 369 510 395 Q465 426 405 386 Q275 352 180 316Z" class="rock" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250" class="ghost" /><text x="95" y="188" class="label">虚线：过去的覆岩顶面</text><text x="357" y="274" class="label">露出部位，不是全核裸露</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 4  非常老且长期剥蚀后，骨架局部实际出露</text><text x="43" y="575" class="label">不能按“老岛”标签自动露核；必须移除足够覆岩材料。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M180 316 L355 310 Q468 285 565 315 L730 316 Q620 369 510 395 Q465 426 405 386 Q275 352 180 316Z" class="rock" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><g><circle cx="765" cy="275" r="17" class="core"/><animateTransform attributeName="transform" type="translate" values="0 0;25 -20;0 0" dur="5s" repeatCount="indefinite"/></g><g><circle cx="800" cy="350" r="13" class="inactive"/><animateTransform attributeName="transform" type="translate" values="0 0;0 30;0 0" dur="5s" repeatCount="indefinite"/></g><text x="643" y="225" class="label">部分仍漂浮</text><text x="650" y="435" class="label">部分不能漂浮</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 4  局部脱落中，部分有效小块仍能漂浮</text><text x="43" y="575" class="label">保留结构、能量和自重共同决定；不是所有老岛碎块都可用。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="245" y="254" width="450" height="34" rx="8" class="strata"/><rect x="295" y="291" width="350" height="82" rx="12" class="frame"/><g transform="translate(470 332)"><g><rect x="-60" y="-23" width="120" height="46" rx="8" class="core"/><line x1="-44" y1="0" x2="44" y2="0" class="texture"/><animateTransform attributeName="transform" type="rotate" values="-90;0;-90" dur="6s" repeatCount="indefinite"/></g></g><circle cx="470" cy="332" r="7" class="pivot"/><path d="M385 245 L385 185" class="force" marker-end="url(#arrow-07-old-island)"><animate attributeName="d" values="M385 245 L385 185;M385 245 L385 225;M385 245 L385 185" dur="6s" repeatCount="indefinite"/></path><path d="M555 245 L555 185" class="force" marker-end="url(#arrow-07-old-island)"><animate attributeName="d" values="M555 245 L555 185;M555 245 L555 225;M555 245 L555 185" dur="6s" repeatCount="indefinite"/></path><text x="305" y="165" class="label">手柄、传动、锁定与承载架</text><text x="145" y="445" class="label">获取天然材料 → 加工装配 → 调节支撑 → 受控热充再用</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  识别、切取有效材料，转轴可逆调节姿态</text><text x="43" y="575" class="label">转动利用既有纹理，不再造高压结构；特殊支撑始终向上。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>