path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><line x1="305" y1="186" x2="646" y2="186" class="reference"/><text x="323" y="174" class="label">候选最低溢口高程</text><text x="344" y="234" class="label">低于出口的真实盆底</text><text x="90" y="470" class="label">仅示意一个剖面；需检查全周出口</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  整体抬升可保留盆底与出口的相对高差</text><text x="43" y="575" class="label">差异变形、倾斜或出口降低可以破坏围合；盆地也不自动有湖。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>