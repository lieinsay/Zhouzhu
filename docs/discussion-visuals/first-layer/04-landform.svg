<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-04-landform desc-04-landform"><title id="title-04-landform">单核心：山、高地和盆地</title><desc id="desc-04-landform">同一深埋骨架可承载不同顶面，用户示意图不是固定模板。。继承地形与托举变形共同决定顶面：整体升高只改变绝对高度；产生起伏需要差异变形。。广域抬升与层序可保留高地：边缘陡坎须由层界、位移或侵蚀产生；不是游戏后补岩墙。。断陷低地只有真实围合才是盆地：原有低地须有位移历史；剥离切掉围缘可使盆地开口。。整体抬升可保留盆底与出口的相对高差：差异变形、倾斜或出口降低可以破坏围合；盆地也不自动有湖。</desc><defs><marker id="arrow-04-landform" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">05 / 单核心：山、高地和盆地</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><g transform="translate(0 25)"><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L240 235 L315 175 L380 140 L440 184 L520 214 L625 230 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><text x="93" y="163" class="label">山的位置不按核心点直接指定</text><text x="618" y="414" class="label">下方是完整山根</text><path d="M170 310 L735 310" class="ghost" /><path d="M380 275 L380 195" class="force" marker-end="url(#arrow-04-landform)"/><text x="95" y="115" class="label">虚线：前身参考面；差异位移产生相对隆起</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  继承地形与托举变形共同决定顶面</text><text x="43" y="575" class="label">整体升高只改变绝对高度；产生起伏需要差异变形。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><g transform="translate(0 25)"><path d="M170 250 L250 225 L315 190 L570 190 L630 226 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L250 225 L315 190 L570 190 L630 226 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><line x1="315" y1="215" x2="570" y2="215" class="edge"/><text x="326" y="164" class="label">高地顶面</text><text x="90" y="470" class="label">骨架与岛底仍来自同源岩体</text><path d="M240 310 L640 310" class="ghost" /><path d="M340 295 L340 240" clas