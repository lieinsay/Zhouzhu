<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-10-process desc-10-process"><title id="title-10-process">地表演化：硬边界、材料与库容</title><desc id="desc-10-process">改变地形必须实际移走、转移或沉积材料。。基岩与松散覆盖分别演化：裸岩不统一套土坡休止角；风化残余、溶解物及供沙分账。。层界与实际位移生成源硬边界：断崖和台地不是贴标签或游戏挤墙；局部几何参与过程。。河流侵蚀和湖内沉积更新真实材料库存：从来源扣沙，再沿真实通路搬运；湖内沉积改变地面和库容，不等于涨水。。真实盆地保留，辅助填洼面只分析连接：库容、溢口和嵌套关系随真实几何变化；空洞与天生桥保留局部多面。。局部空洞与天生桥不被高度图抹掉：溶蚀/侵蚀移走实际材料，残留桥须能承载；必要通道保留三维连通。</desc><defs><marker id="arrow-10-process" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">07 / 地表演化：硬边界、材料与库容</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 240 L350 240 L350 350 L860 425 L860 485 L90 485Z" class="rock" /><path d="M 90 240 L350 240 L350 260 L90 260Z" class="strata" /><path d="M350 350 L860 425 L860 441 L350 368Z" class="strata" /><path d="M460 374 L680 413" class="flow" marker-end="url(#arrow-10-process)"/><text x="100" y="195" class="label">裸岩陡坎</text><text x="480" y="330" class="label">松散覆盖的实际搬运</text><text x="115" y="466" class="label">软坡和硬崖共存，不做统一平滑</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 5  基岩与松散覆盖分别演化</text><text x="43" y="575" class="label">裸岩不统一套土坡休止角；风化残余、溶解物及供沙分账。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M 90 315 L345 315 L345 240 L625 240 L625 335 L865 390 L865 485 L90 485Z" class="rock" /><path d="M345 240 L625 240 L625 260 L345 260Z" class="strata" /><path d="M345 315 L345 240 M625 260 L625 335" class="fault" /><text x="95" y="193" class="label">位移 / 差异剥蚀形成的实际折坡</text><text x="92" y="470" class="label">崖顶、崖脚、层界和碰撞都来自同一源几何</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 5  层界与实际位移生成源硬边界</text><text x="43" y="575" class="label">断崖和台地不是贴标签或游戏挤墙；局部几何参与过程。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><g transform="translate(0 0)"><path d="M170 250 L245 200 L300 223 L370 250 L500 260 L605 240 L670 204 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L245 200 L300 223 L370 250 L500 260 L605 240 L670 204 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><path d="M316 229 L625 229 L605 240 L500 260 L370 250Z" class="water" /><path d="M390 253 Q470 273 555 250 L555 252 Q470 283 390 255Z" class="strata" /><path d="M350 229 L454 244" class="gravity" marker-end="url(#arrow-10-process)"/><text x="328" y="174" class="label">实际入沙后沉积</text><text x="104" y="468" class="label">离岛水沙退出陆地账，临空河口不堆出无底冲积平原</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 5  河流侵蚀和湖内沉积更新真实材料库存</text><text x="43" y="575" class="label">从来源扣沙，再沿真实通路搬运；湖内沉积改变地面和库容，不等于涨水。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><g transform="translate(0 0)"><path d="M170 250 L245 200 L300 223 L370 250 L500 260 L605 240 L670 204 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L245 200 L300 223 L370 250 L500 260 L605 240 L670 204 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><line x1="300" y1="223" x2="625" y2="223" class="reference"/><text x="331" y="178" class="label">虚线：路由分析面</text><text x="350" y="294" class="label">真实盆底不抬平</text><text x="108" y="470" class="label">源细化参与演化，游戏不猜出口或补洞</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 5  真实盆地保留，辅助填洼面只分析连接</text><text x="43" y="575" class="label">库容、溢口和嵌套关系随真实几何变化；空洞与天生桥保留局部多面。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 270 L300 200 L640 200 L850 280 L850 480 L90 480Z M310 340 Q470 240 630 340 L630 395 L310 395Z" class="rock" fill-rule="evenodd"/><path d="M290 438 Q470 413 650 438 Q470 463 290 438Z" class="core" /><text x="110" y="167" class="label">残留岩桥与空洞都是源几何</text><text x="365" y="352" class="label">实际空洞剖面</text><text x="94" y="473" class="label">只是必要局部多面，不要求模拟全球完整洞网</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 5  局部空洞与天生桥不被高度图抹掉</text><text x="43" y="575" class="label">溶蚀/侵蚀移走实际材料，残留桥须能承载；必要通道保留三维连通。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>