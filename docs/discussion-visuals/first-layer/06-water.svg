<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-06-water desc-06-water"><title id="title-06-water">地形与水：储量、交换和外排</title><desc id="desc-06-water">降雨只有一份；湖底渗漏、地下回河都是内部转移。。降雨进入冠层、土层或水面：入渗受实际水势、材料与容量控制，不固定配径流比例。。盆地可以干、部分蓄水或溢流：水位由来水、原储量、损失和库容决定，不是填洼抬地面。。河湖与地下水双向交换，泉有真实出露点：供体扣、受体加，只记一笔；骨架闭孔不等于所有接缝封水。。真实出口被切低后才允许有限溢流：湖区保持水平；出口断面与下游水位限制出流，不穿过高岸。。嵌套盆地先分别蓄水，过真实鞍口后交换：拓扑图不是地形模板；顶托与淹没可使盆地连成水面，但仍有有限出流。。初始海水保留水与盐，蒸发移水不移盐：本图只有已有盐水蒸发；实际盐度还取决于来源、去向和相态转移，不由封闭决定。</desc><defs><marker id="arrow-06-water" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">09 / 地形与水：储量、交换和外排</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><g transform="translate(0 0)"><path d="M170 250 L245 200 L300 223 L370 250 L500 260 L605 240 L670 204 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L245 200 L300 223 L370 250 L500 260 L605 240 L670 204 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><g><line x1="260" y1="150" x2="250" y2="175" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 35;0 0" dur="2s" repeatCount="indefinite"/></g><g><line x1="315" y1="150" x2="305" y2="175" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 35;0 0" dur="2s" repeatCount="indefinite"/></g><g><line x1="370" y1="150" x2="360" y2="175" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 35;0 0" dur="2s" repeatCount="indefinite"/></g><g><line x1="425" y1="150" x2="415" y2="175" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 35;0 0" dur="2s" repeatCount="indefinite"/></g><g><line x1="480" y1="150" x2="470" y2="175" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 35;0 0" dur="2s" repeatCount="indefinite"/></g><g><line x1="535" y1="150" x2="525" y2="175" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 35;0 0" dur="2s" repeatCount="indefinite"/></g><g><line x1="590" y1="150" x2="580" y2="175" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 35;0 0" dur="2s" repeatCount="indefinite"/></g><g><line x1="645" y1="150" x2="635" y2="175" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 35;0 0" dur="2s" repeatCount="indefinite"/></g><path d="M310 237 L355 275" class="flow" marker-end="url(#arrow-06-water)"/><path d="M605 241 L560 271" class="flow" marker-end="url(#arrow-06-water)"/><text x="100" y="465" class="label">土水、地下水、地表水分别记库存</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 6  降雨进入冠层、土层或水面</text><text x="43" y="575" class="label">入渗受实际水势、材料与容量控制，不固定配径流比例。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><g transform="translate(0 0)"><path d="M170 250 L245 200 L300 223 L370 250 L500 260 L605 240 L670 204 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L245 200 L300 223 L370 250 L500 260 L605 240 L670 204 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><path d="M360 246 L573.5 246 L500 260 L370 250Z" class="water" /><line x1="360" y1="246" x2="573.5" y2="246" class="waterline"/><text x="330" y="187" class="label">真实盆底上的水平静水面</text><text x="103" y="468" class="label">部分蓄水：没有把地面填平</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 6  盆地可以干、部分蓄水或溢流</text><text x="43" y="575" class="label">水位由来水、原储量、损失和库容决定，不是填洼抬地面。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><g transform="translate(0 0)"><path d="M170 250 L245 200 L300 223 L370 250 L500 260 L605 240 L670 204 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L245 200 L300 223 L370 250 L500 260 L605 240 L670 204 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><path d="M316 229 L625 229 L605 240 L500 260 L370 250Z" class="water" /><line x1="316" y1="229" x2="625" y2="229" class="waterline"/><path d="M400 262 Q420 284 445 303" class="flow" marker-end="url(#arrow-06-water)"/><path d="M556 296 L556 267" class="flow" marker-end="url(#arrow-06-water)"/><path d="M372 296 Q292 310 226 278" class="flow" marker-end="url(#arrow-06-water)"/><text x="104" y="470" class="label">湖底渗漏在岛账内；真实侧壁外排才离岛</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 6  河湖与地下水双向交换，泉有真实出露点</text><text x="43" y="575" class="label">供体扣、受体加，只记一笔；骨架闭孔不等于所有接缝封水。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><g transform="translate(0 0)"><path d="M170 250 L245 200 L300 223 L370 250 L500 260 L605 240 L670 232 L735 250 Q635 330 510 395 Q465 426 405 386 Q275 332 170 250Z" class="rock" /><path d="M170 250 L245 200 L300 223 L370 250 L500 260 L605 240 L670 232 L735 250 L735 267 Q520 290 170 267Z" class="strata" /><path d="M205 280 Q465 315 700 277" class="layerline" /><path d="M305 324 Q465 281 625 324 Q465 367 305 324Z" class="core" /><text x="391" y="329" class="oncore">深埋浮石骨架</text></g><path d="M316 229 L655 229 L670 232 L605 240 L500 260 L370 250Z" class="water" /><line x1="316" y1="229" x2="655" y2="229" class="waterline"/><path d="M670 204 L670 232" class="ghost" /><path d="M655 229 Q694 237 735 250 L755 359" class="flow" marker-end="url(#arrow-06-water)"/><g><line x1="752" y1="365" x2="752" y2="407" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 25;0 0" dur="2s" repeatCount="indefinite"/></g><text x="602" y="175" class="label">旧高岸实际降低为出口</text><text x="92" y="470" class="label">有限排水；侵蚀移出的材料也要记账</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 6  真实出口被切低后才允许有限溢流</text><text x="43" y="575" class="label">湖区保持水平；出口断面与下游水位限制出流，不穿过高岸。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="90" y="225" width="315" height="210" rx="12" class="strata"/><text x="105" y="258" class="label">上游子盆</text><rect x="105" y="285" width="285" height="135" rx="8" class="water"/><rect x="520" y="275" width="315" height="160" rx="12" class="strata"/><text x="535" y="308" class="label">下游子盆</text><rect x="535" y="365" width="285" height="55" rx="8" class="water"/><path d="M405 307 L485 307 L520 365" class="flow" marker-end="url(#arrow-06-water)"/><text x="410" y="249" class="label">实际鞍口</text><text x="95" y="478" class="label">水位—面积—库容来自同一几何，交换只记一次</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 6  嵌套盆地先分别蓄水，过真实鞍口后交换</text><text x="43" y="575" class="label">拓扑图不是地形模板；顶托与淹没可使盆地连成水面，但仍有有限出流。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="80" y="215" width="340" height="210" rx="12" class="strata"/><text x="95" y="248" class="label">初始水量与盐质量</text><rect x="95" y="286" width="310" height="123" rx="7" class="water"/><rect x="520" y="215" width="340" height="210" rx="12" class="strata"/><text x="535" y="248" class="label">蒸发后水少、盐保留</text><rect x="535" y="348" width="310" height="61" rx="7" class="water"/><circle cx="126" cy="383" r="4" class="magma"/><circle cx="566" cy="383" r="4" class="magma"/><circle cx="156" cy="383" r="4" class="magma"/><circle cx="596" cy="383" r="4" class="magma"/><circle cx="186" cy="383" r="4" class="magma"/><circle cx="626" cy="383" r="4" class="magma"/><circle cx="216" cy="383" r="4" class="magma"/><circle cx="656" cy="383" r="4" class="magma"/><circle cx="246" cy="383" r="4" class="magma"/><circle cx="686" cy="383" r="4" class="magma"/><circle cx="276" cy="383" r="4" class="magma"/><circle cx="716" cy="383" r="4" class="magma"/><circle cx="306" cy="383" r="4" class="magma"/><circle cx="746" cy="383" r="4" class="magma"/><circle cx="336" cy="383" r="4" class="magma"/><circle cx="776" cy="383" r="4" class="magma"/><circle cx="366" cy="383" r="4" class="magma"/><circle cx="806" cy="383" r="4" class="magma"/><path d="M689 330 L689 288" class="flow" marker-end="url(#arrow-06-water)"/><text x="90" y="470" class="label">水主账按质量 / 水当量；盐另有守恒账，几何需换算</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">6 / 6  初始海水保留水与盐，蒸发移水不移盐</text><text x="43" y="575" class="label">本图只有已有盐水蒸发；实际盐度还取决于来源、去向和相态转移，不由封闭决定。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>