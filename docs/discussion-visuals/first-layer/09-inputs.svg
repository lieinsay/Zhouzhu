<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-09-inputs desc-09-inputs"><title id="title-09-inputs">水文输入：天气、土层与含水层</title><desc id="desc-09-inputs">输入来自气候和地质材料，不能按目标湖面或河宽倒推。。同一雨区共同驱动，日内雨程积分回日量：事件在空间相关并有实际移动；已有地形雨效应不重复乘倍率。。风化和沉积库存决定真实土层性质：先有母岩、材料组成、米制厚度和压实，再估保水与导水性质。。含水层连通来自层界、裂隙与通道：导水率、给水度、床层接触分别定义；岩性标签不等于固定地下补给比例。。联合天气给出蒸散需求，真实库存限制实际蒸散：冠层、土面与蒸腾共享能量；雪记水当量，开水面另计热储存。</desc><defs><marker id="arrow-09-inputs" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">08 / 水文输入：天气、土层与含水层</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="80" y="290" width="780" height="155" rx="10" class="strata"/><g><line x1="200" y1="180" x2="191" y2="204" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 28;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="237" y1="180" x2="228" y2="204" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 28;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="274" y1="180" x2="265" y2="204" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 28;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="311" y1="180" x2="302" y2="204" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 28;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="348" y1="180" x2="339" y2="204" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 28;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="385" y1="180" x2="376" y2="204" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 28;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="422" y1="180" x2="413" y2="204" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 28;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="459" y1="180" x2="450" y2="204" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 28;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="496" y1="180" x2="487" y2="204" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 28;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="533" y1="180" x2="524" y2="204" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 28;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="570" y1="180" x2="561" y2="204" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 28;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="607" y1="180" x2="598" y2="204" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 28;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="644" y1="180" x2="635" y2="204" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 28;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="681" y1="180" x2="672" y2="204" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 28;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><line x1="718" y1="180" x2="709" y2="204" class="rain"/><animateTransform attributeName="transform" type="translate" values="0 0;0 28;0 0" dur="2.4s" repeatCount="indefinite"/></g><g><path d="M150 175 Q130 135 185 130 Q210 95 250 135 Q300 118 320 165Z" class="water" /><animateTransform attributeName="transform" type="translate" values="0 0;250 0;0 0" dur="7s" repeatCount="indefinite"/></g><path d="M330 126 L600 126" class="flow" marker-end="url(#arrow-09-inputs)"/><text x="89" y="471" class="label">参考点、岛群均量与面积总雨量先统一口径</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  同一雨区共同驱动，日内雨程积分回日量</text><text x="43" y="575" class="label">事件在空间相关并有实际移动；已有地形雨效应不重复乘倍率。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="80" y="215" width="780" height="260" rx="0" class="rock"/><rect x="80" y="215" width="780" height="55" rx="0" class="strata"/><rect x="475" y="215" width="260" height="95" rx="0" class="strata"/><line x1="80" y1="270" x2="475" y2="270" class="layerline"/><line x1="475" y1="310" x2="735" y2="310" class="layerline"/><text x="100" y="194" class="label">实际松散层库存</text><path d="M220 330 L220 262" class="gravity" marker-end="url(#arrow-09-inputs)"/><path d="M320 252 L530 252" class="flow" marker-end="url(#arrow-09-inputs)"/><text x="105" y="450" class="label">基岩风化移出质量；坡面与冲积搬运移入/移出</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 4  风化和沉积库存决定真实土层性质</text><text x="43" y="575" class="label">先有母岩、材料组成、米制厚度和压实，再估保水与导水性质。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="45" y="185" width="850" height="105" rx="0" class="strata"/><rect x="45" y="290" width="850" height="190" rx="0" class="rock"/><line x1="45" y1="255" x2="895" y2="255" class="layerline"/><line x1="45" y1="340" x2="895" y2="340" class="layerline"/><line x1="45" y1="414" x2="895" y2="414" class="layerline"/><path d="M195 419 Q470 377 745 419 Q470 461 195 419Z" class="core" /><path d="M310 220 L355 290" class="flow" marker-end="url(#arrow-09-inputs)"/><path d="M355 290 Q420 315 570 309" class="flow" marker-end="url(#arrow-09-inputs)"/><path d="M635 240 L604 309 L642 371" class="fault" /><path d="M642 371 L744 341" class="flow" marker-end="url(#arrow-09-inputs)"/><text x="100" y="170" class="label">孔隙、裂隙及必要岩溶通道各有实际几何</text><text x="104" y="474" class="label">闭孔材料不等于所有接缝和上覆岩层封水</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 4  含水层连通来自层界、裂隙与通道</text><text x="43" y="575" class="label">导水率、给水度、床层接触分别定义；岩性标签不等于固定地下补给比例。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="70" y="180" width="365" height="98" rx="12" class="strata"/><text x="85" y="213" class="label">温度 · 水汽压 · 云与辐射</text><rect x="503" y="180" width="367" height="98" rx="12" class="strata"/><text x="518" y="213" class="label">风速测高 · 地形遮阴</text><rect x="80" y="330" width="195" height="111" rx="12" class="strata"/><text x="95" y="363" class="label">冠层 / 雪冰</text><rect x="315" y="330" width="215" height="111" rx="12" class="strata"/><text x="330" y="363" class="label">土水 / 地下水</text><rect x="574" y="330" width="275" height="111" rx="12" class="strata"/><text x="589" y="363" class="label">河湖实际储量</text><path d="M230 280 L230 322" class="flow" marker-end="url(#arrow-09-inputs)"/><path d="M686 280 L686 322" class="flow" marker-end="url(#arrow-09-inputs)"/><text x="104" y="472" class="label">缺测用适用类比与误差范围，不把天气标签当净辐射</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  联合天气给出蒸散需求，真实库存限制实际蒸散</text><text x="43" y="575" class="label">冠层、土面与蒸腾共享能量；雪记水当量，开水面另计热储存。</text></g><text x="36" y="637" class="small">非比例剖面 · 剖面可见不等于实物外露 · 动画秒数不是地质年数 · 非物理计算</text></svg>