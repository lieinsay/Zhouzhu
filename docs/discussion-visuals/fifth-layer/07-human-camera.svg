water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="220" cy="193" r="8" class="person"/><line x1="220" y1="202" x2="220" y2="225" class="person" /><line x1="220" y1="208" x2="206" y2="218" class="person" /><line x1="220" y1="208" x2="233" y2="216" class="person" /><line x1="220" y1="225" x2="210" y2="245" class="person" /><line x1="220" y1="225" x2="230" y2="245" class="person" /><circle cx="420" cy="200" r="8" class="dot"/><circle cx="570" cy="350" r="8" class="dot"/><text x="100" y="155" class="small" text-anchor="start">玩家仍在高岸：相机所在介质独立判定</text><text x="340" y="185" class="small" text-anchor="start">相机在空气</text><text x="650" y="375" class="small" text-anchor="start">相机在液水</text><text x="100" y="494" class="small" text-anchor="start">双面绘制不替代介质判断，也不改变真实水面</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  普通镜头跨水面也要判观察侧</text><text x="42" y="575" class="note" text-anchor="start">用相机实际所在水域，不能拿玩家头高或河心深代替；这是渲染边界，不新增潜水玩法。</text></g></svg>
