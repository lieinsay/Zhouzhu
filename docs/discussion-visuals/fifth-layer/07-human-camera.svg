<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-07-human-camera desc-07-human-camera" data-chapter="07-human-camera"><title id="title-07-human-camera">人物与正常镜头</title><desc id="desc-07-human-camera">正常观看提供尺度，工具图不能替代人物镜头验收。 名义人物尺寸还须全局核对：当前模型/胶囊名义高1.8米；图中人形非比例，不算现场尺寸验收。；高岸站位不等于脚下深水：岸边、浅滩和深槽位置分别定位；不要只按屏幕人高倒算河宽。；镜头缩臂和FOV不改变世界：碰撞、俯仰和画幅影响观看；河宽变化不触发专门变焦放大体量。；开发俯视和剖面是辅证：正常站岸、转向与沿岸移动仍要检查，不能靠工具FOV或长焦截图过关。；参照物与水在同一真实空间：已有实体与移动视差提供线索，不额外摆小人、楼房或放大石块。；普通镜头跨水面也要判观察侧：用相机实际所在水域，不能拿玩家头高或河心深代替；这是渲染边界，不新增潜水玩法。。第五层设计已通过；非比例、非物理/光学模拟，不是47米现场验收。</desc><defs><marker id="arrow-07-human-camera" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">07 / 人物与正常镜头</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="220" cy="193" r="8" class="person"/><line x1="220" y1="202" x2="220" y2="225" class="person" /><line x1="220" y1="208" x2="206" y2="218" class="person" /><line x1="220" y1="208" x2="233" y2="216" class="person" /><line x1="220" y1="225" x2="210" y2="245" class="person" /><line x1="220" y1="225" x2="230" y2="245" class="person" /><text x="115" y="165" class="label" text-anchor="start">当前名义1.8m；全局变换和实际站位待核对</text><text x="115" y="489" class="small" text-anchor="start">不缩人物，不放大河槽</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  名义人物尺寸还须全局核对</text><text x="42" y="575" class="note" text-anchor="start">当前模型/胶囊名义高1.8米；图中人形非比例，不算现场尺寸验收。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="220" cy="193" r="8" class="person"/><line x1="220" y1="202" x2="220" y2="225" class="person" /><line x1="220" y1="208" x2="206" y2="218" class="person" /><line x1="220" y1="208" x2="233" y2="216" class="person" /><line x1="220" y1="225" x2="210" y2="245" class="person" /><line x1="220" y1="225" x2="230" y2="245" class="person" /><line x1="260" y1="245" x2="260" y2="285" class="flow" /><line x1="253" y1="245" x2="267" y2="245" class="flow" /><line x1="253" y1="285" x2="267" y2="285" class="flow" /><text x="273" y="265" class="small" text-anchor="start">露岸</text><line x1="540" y1="285" x2="540" y2="410" class="flow" /><line x1="533" y1="285" x2="547" y2="285" class="flow" /><line x1="533" y1="410" x2="547" y2="410" class="flow" /><text x="553" y="347.5" class="small" text-anchor="start">深槽</text><text x="100" y="171" class="label" text-anchor="start">人物在高岸，不能把河心深度称脚下水深</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  高岸站位不等于脚下深水</text><text x="42" y="575" class="note" text-anchor="start">岸边、浅滩和深槽位置分别定位；不要只按屏幕人高倒算河宽。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M100 330 L270 292 L380 306 L730 285 L850 332 L745 385 L390 440 L260 392Z" class="rock" /><path d="M285 325 L705 311 L770 334 L381 414Z" class="water" /><circle cx="215" cy="290" r="8" class="person"/><line x1="215" y1="299" x2="215" y2="322" class="person" /><line x1="215" y1="305" x2="201" y2="315" class="person" /><line x1="215" y1="305" x2="228" y2="313" class="person" /><line x1="215" y1="322" x2="205" y2="342" class="person" /><line x1="215" y1="322" x2="225" y2="342" class="person" /><text x="110" y="168" class="small" text-anchor="start">观看关系示意 · 非比例 · 非真实游戏画面</text><path d="M120 220 L240 350 L760 220" class="ghost" /><text x="145" y="445" class="small" text-anchor="start">镜头变化是观看条件，实体尺度未变化</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  镜头缩臂和FOV不改变世界</text><text x="42" y="575" class="note" text-anchor="start">碰撞、俯仰和画幅影响观看；河宽变化不触发专门变焦放大体量。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M100 330 L270 292 L380 306 L730 285 L850 332 L745 385 L390 440 L260 392Z" class="rock" /><path d="M285 325 L705 311 L770 334 L381 414Z" class="water" /><circle cx="215" cy="290" r="8" class="person"/><line x1="215" y1="299" x2="215" y2="322" class="person" /><line x1="215" y1="305" x2="201" y2="315" class="person" /><line x1="215" y1="305" x2="228" y2="313" class="person" /><line x1="215" y1="322" x2="205" y2="342" class="person" /><line x1="215" y1="322" x2="225" y2="342" class="person" /><text x="110" y="168" class="small" text-anchor="start">观看关系示意 · 非比例 · 非真实游戏画面</text><rect x="315" y="165" width="510" height="70" rx="9" class="card"/><text x="570" y="197" class="label" text-anchor="middle">普通人物镜头是主要观看证据</text><text x="140" y="467" class="small" text-anchor="start">俯视、侧剖和尺线仅用于诊断</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 