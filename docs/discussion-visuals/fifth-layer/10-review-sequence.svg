0" y="251" class="small" text-anchor="middle">版本 / 状态记录</text><rect x="195" y="365" width="550" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">同位置数值与正常画面成对解释</text><text x="470" y="426" class="small" text-anchor="middle">截图不替代过程，数字不替代正常观看</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  诊断覆盖是辅证，最终回正常观看</text><text x="42" y="575" class="note" text-anchor="start">尺线、剖面或去材质可定位原因；数值和实际查看的普通画面成对解释。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="110" y="190" width="220" height="105" rx="9" class="card"/><text x="220" y="222" class="label" text-anchor="middle">实际开局</text><text x="220" y="251" class="small" text-anchor="middle">接受快照</text><line x1="340" y1="240" x2="370" y2="240" class="flow" marker-end="url(#arrow-10-review-sequence)"/><rect x="380" y="190" width="220" height="105" rx="9" class="card"/><text x="490" y="222" class="label" text-anchor="middle">事件 / 涨退</text><text x="490" y="251" class="small" text-anchor="middle">真实经过时长</text><line x1="610" y1="240" x2="640" y2="240" class="flow" marker-end="url(#arrow-10-review-sequence)"/><rect x="650" y="190" width="220" height="105" rx="9" class="card"/><text x="760" y="222" class="label" text-anchor="middle">后续状态</text><text x="760" y="251" class="small" text-anchor="middle">版本 / 状态记录</text><rect x="195" y="365" width="550" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">物理门 → 还原门 → 观看门</text><text x="470" y="426" class="small" text-anchor="middle">动画通过不等于实际河流验证</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  验收区分物理、还原和观看失败</text><text x="42" y="575" class="note" text-anchor="start">第五层设计已确认；参数与实际结果未验证，不授权实现或提交。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="220" cy="193" r="8" class="person"/><line x1="220" y1="202" x2="220" y2="225" class="person" /><line x1="220" y1="208" x2="206" y2="218" class="person" /><line x1="220" y1="208" x2="233" y2="216" class="person" /><line x1="220" y1="225" x2="210" y2="245" class="person" /><line x1="220" y1="225" x2="230" y2="245" class="person" /><text x="110" y="135" class="small" text-anchor="start">有依据且可观察的正常情景：线索指向真实床岸</text><line x1="284" y1="182" x2="677" y2="182" class="ref" /><line x1="284" y1="176" x2="284" y2="188" class="ref" /><line x1="677" y1="176" x2="677" y2="188" class="ref" /><text x="480.5" y="170" class="small" text-anchor="middle">真实湿域与岸水关系</text><line x1="385" y1="285" x2="385" y2="320" class="flow" /><line x1="378" y1="285" x2="392" y2="285" class="flow" /><line x1="378" y1="320" x2="392" y2="320" class="flow" /><text x="398" y="302.5" class="small" text-anchor="start">浅部</text><line x1="540" y1="285" x2="540" y2="410" class="flow" /><line x1="533" y1="285" x2="547" y2="285" class="flow" /><line x1="533" y1="410" x2="547" y2="410" class="flow" /><text x="553" y="347.5" class="small" text-anchor="start">较深部</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  正向通过：线索指向真实几何</text><text x="42" y="575" class="note" text-anchor="start">在有依据且可观察的正常情景中辨湿边、露岸和相对浅深，不要求凭颜色估米，也不靠尺线独自过</text><text x="42" y="603" class="note" text-anchor="start">关。</text></g></svg>
