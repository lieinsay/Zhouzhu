<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-06-motion-time desc-06-motion-time" data-chapter="06-motion-time"><title id="title-06-motion-time">流动、泡沫与时间</title><desc id="desc-06-motion-time">纹波不等于流速量具，快流和深水也不是同一件事。 显示运动消费受支持的水态：局部流向、平均量与未解析分开；当前坡度代理不是实际流速。；风波传播与净水流可以不同：显示风波方向不意味着水整体倒流，回水反向则读取相应真实状态。；泡沫需要实际条件和位置：真实接触或跌水可产生、搬运、衰减；平稳岸边不永久画白沫。；法线扰动不改床岸或水深：基底、沿程定位和换锚须相容；有表面位移时另有状态与范围约束。；显示相位和接受水态分别计时：暂停验收支持一致冻结；仅显示动画不表示已多推进水沙或地质过程。；米制相同，附着的空间职责不同：床岸材质随实体与材料，纹波随当前液水域；换锚不滑纹理，真实形变/改道后核对新域。。第五层设计已通过；非比例、非物理/光学模拟，不是47米现场验收。</desc><defs><marker id="arrow-06-motion-time" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">06 / 流动、泡沫与时间</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M100 302 Q290 208 465 297 Q630 375 835 294" class="widewater" /><text x="110" y="167" class="small" text-anchor="start">平面因果示意：波传播、漂移与净水流分别表达</text><line x1="330" y1="285" x2="450" y2="294" class="flow" marker-end="url(#arrow-06-motion-time)"/><text x="320" y="262" class="small" text-anchor="start">净水流</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  显示运动消费受支持的水态</text><text x="42" y="575" class="note" text-anchor="start">局部流向、平均量与未解析分开；当前坡度代理不是实际流速。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M100 302 Q290 208 465 297 Q630 375 835 294" class="widewater" /><text x="110" y="167" class="small" text-anchor="start">平面因果示意：波传播、漂移与净水流分别表达</text><line x1="330" y1="285" x2="450" y2="294" class="flow" marker-end="url(#arrow-06-motion-time)"/><text x="320" y="262" class="small" text-anchor="start">净水流</text><line x1="675" y1="233" x2="565" y2="228" class="event" marker-end="url(#arrow-06-motion-time)"/><text x="601" y="206" class="small" text-anchor="start">风波传播</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  风波传播与净水流可以不同</text><text x="42" y="575" class="note" text-anchor="start">显示风波方向不意味着水整体倒流，回水反向则读取相应真实状态。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M100 302 Q290 208 465 297 Q630 375 835 294" class="widewater" /><text x="110" y="167" class="small" text-anchor="start">平面因果示意：波传播、漂移与净水流分别表达</text><line x1="330" y1="285" x2="450" y2="294" class="flow" marker-end="url(#arrow-06-motion-time)"/><text x="320" y="262" class="small" text-anchor="start">净水流</text><circle cx="580" cy="329" r="13" class="rock"/><circle cx="610" cy="332" r="5" class="watercard"/><circle cx="637" cy="332" r="4" class="watercard"/><text x="110" y="418" class="label" text-anchor="start">此例假定源上已有真实接触与相应水力条件</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  泡沫需要实际条件和位置</text><text x="42" y="575" class="note" text-anchor="start">真实接触或跌水可产生、搬运、衰减；平稳岸边不永久画白沫。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M100 302 Q290 208 465 297 Q630 375 835 294" class="widewater" /><text x="110" y="167" class="small" text-anchor="start">平面因果示意：波传播、漂移与净水流分别表达</text><line x1="330" y1="285" x2="450" y2="294" class="flow" marker-end="url(#arrow-06-motion-time)"/><text x="320" y="262" class="small" text-anchor="start">净水流</text><path d="M210 378 Q240 358 270 378 T330 378 T390 378" class="flow" /><text x="110" y="432" class="label" text-anchor="start">微表面光学方向改变，权威水位与碰撞不变</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  法线扰动不改床岸或水深</text><text x="42" y="575" class="note" text-anchor="start">基底、沿程定位和换锚须相容；有表面位移时另有状态与范围约束。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="95" y="190" width="300" height="110" rx="9" class="active"/><text x="245" y="222" class="label" text-anchor="middle">接受水态与物理时间</text><text x="245" y="251" class="small" text-anchor="middle">库存 / 流向 / 日期</text><rect x="550" y="190" width="300" height="110" rx="9" class="card"/><text x="700" y="222" class="label" text-anchor="middle">显示相位</text><text x="700" y="251" class="small" text-anchor="middle">波纹 / 暂停 / 重载</text><rect x="245" y="360" width="450" height="80" rx="9" class="card"/><text x="470" y="392" class="label" text-anchor="middle">只改相位不多结算水沙</text><text x="470" y="421" class="small" text-anchor="middle">暂停模式与实际状态明确</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  显示相位和接受水态分别计时</text><text x="42" y="575" class="note" text-anchor="start">暂停验收支持一致冻结；仅显示动画不表示已多推进水沙或地质过程。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="90" y="205" width="335" height="105" rx="9" class="active"/><text x="257.5" y="237" class="label" text-anchor="middle">床岸材质的实体附着</text><text x="257.5" y="266" class="small" text-anchor="middle">源材料 / 层界 / 形变</text><rect x="515" y="205" width="335" height="105" rx="9" class="active"/><text x="682.5" y="237" class="label" text-anchor="middle">当前液水域的纹波</text><text x="682.5" y="266" class="small" text-anchor="middle">运动定位 / 支持的相位</text><text x="260" y="165" class="label" text-anchor="start">共同米制尺度，不是共同附着坐标</text><text x="120" y="412" class="small" text-anchor="start">反射与屏幕采样还依赖相机；显示相位不结算物质</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  米制相同，附着的空间职责不同</text><text x="42" y="575" class="note" text-anchor="start">床岸材质随实体与材料，纹波随当前液水域；换锚不滑纹理，真实形变/改道后核对新域。</text></g></svg>
