<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-02-bank-bed desc-02-bank-bed" data-chapter="02-bank-bed"><title id="title-02-bank-bed">岸、浅滩与深槽</title><desc id="desc-02-bank-bed">看清实体关系，不能用材质制造不存在的河床。 低水位先露出真实岸与滩：水只占当天湿域；露岸下切和水面以下深度分别定位。；水位上涨可少露岸而更深：同槽对照只用于没有显著床变的区间；真实冲淤另有版本。；浅滩和偏侧深槽不能被抹平：各处实际床面不同，不能把河心深度涂给整个水面。；干洲保留真实实体与遮挡：多汊湿宽求和不包含干洲；水位不支持时不铺满水面。；正常移动中保留轮廓和视差：光照和参照物来自实际场景，不为显深加黑沟、岩墙或楼房。。第五层设计已通过；非比例、非物理/光学模拟，不是47米现场验收。</desc><defs><marker id="arrow-02-bank-bed" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">02 / 岸、浅滩与深槽</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M483 352 L540 410 L599 352Z" class="water" /><line x1="483" y1="352" x2="599" y2="352" class="flow" /><line x1="260" y1="245" x2="260" y2="352" class="flow" /><line x1="253" y1="245" x2="267" y2="245" class="flow" /><line x1="253" y1="352" x2="267" y2="352" class="flow" /><text x="273" y="298.5" class="small" text-anchor="start">露岸高差</text><line x1="540" y1="352" x2="540" y2="410" class="flow" /><line x1="533" y1="352" x2="547" y2="352" class="flow" /><line x1="533" y1="410" x2="547" y2="410" class="flow" /><text x="553" y="381" class="small" text-anchor="start">当处水深</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  低水位先露出真实岸与滩</text><text x="42" y="575" class="note" text-anchor="start">水只占当天湿域；露岸下切和水面以下深度分别定位。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="260" y1="245" x2="260" y2="285" class="flow" /><line x1="253" y1="245" x2="267" y2="245" class="flow" /><line x1="253" y1="285" x2="267" y2="285" class="flow" /><text x="273" y="265" class="small" text-anchor="start">露岸减少</text><line x1="540" y1="285" x2="540" y2="410" class="flow" /><line x1="533" y1="285" x2="547" y2="285" class="flow" /><line x1="533" y1="410" x2="547" y2="410" class="flow" /><text x="553" y="347.5" class="small" text-anchor="start">水深增加</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  水位上涨可少露岸而更深</text><text x="42" y="575" class="note" text-anchor="start">同槽对照只用于没有显著床变的区间；真实冲淤另有版本。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="385" y1="285" x2="385" y2="320" class="flow" /><line x1="378" y1="285" x2="392" y2="285" class="flow" /><line x1="378" y1="320" x2="392" y2="320" class="flow" /><text x="398" y="302.5" class="small" text-anchor="start">浅部</text><line x1="540" y1="285" x2="540" y2="410" class="flow" /><line x1="533" y1="285" x2="547" y2="285" class="flow" /><line x1="533" y1="410" x2="547" y2="410" class="flow" /><text x="553" y="347.5" class="small" text-anchor="start">深槽</text><text x="100" y="173" class="label" text-anchor="start">最深处偏侧；坡面、浅滩和床脊来自实际几何</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  浅滩和偏侧深槽不能被抹平</text><text x="42" y="575" class="note" text-anchor="start">各处实际床面不同，不能把河心深度涂给整个水面。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 260 L200 260 L230 350 L345 350 L390 260 L540 260 L585 350 L715 350 L755 260 L860 260 L860 455 L90 455Z" class="rock" /><path d="M217 310 L230 350 L345 350 L363 310Z" class="water" /><path d="M565 310 L585 350 L715 350 L733 310Z" class="water" /><line x1="217" y1="310" x2="363" y2="310" class="flow" /><line x1="565" y1="310" x2="733" y2="310" class="flow" /><text x="111" y="173" class="label" text-anchor="start">同一接受水态的多汊切片；干洲不是透明水</text><text x="430" y="225" class="small" text-anchor="start">干洲</text><line x1="217" y1="418" x2="733" y2="418" class="ref" /><line x1="217" y1="412" x2="217" y2="424" class="ref" /><line x1="733" y1="412" x2="733" y2="424" class="ref" /><text x="475" y="406" class="small" text-anchor="middle">跨洲跨度另列</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  干洲保留真实实体与遮挡</text><text x="42" y="575" class="note" text-anchor="start">多汊湿宽求和不包含干洲；水位不支持时不铺满水面。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M100 330 L270 292 L380 306 L730 285 L850 332 L745 385 L390 440 L260 392Z" class="rock" /><path d="M285 325 L705 311 L770 334 L381 414Z" class="water" /><circle cx="215" cy="290" r="8" class="person"/><line x1="215" y1="299" x2="215" y2="322" class="person" /><line x1="215" y1="305" x2="201" y2="315" class="person" /><line x1="215" y1="305" x2="228" y2="313" class="person" /><line x1="215" y1="322" x2="205" y2="342" class="person" /><line x1="215" y1="322" x2="225" y2="342" class="person" /><text x="110" y="168" class="small" text-anchor="start">观看关系示意 · 非比例 · 非真实游戏画面</text><text x="120" y="472" class="small" text-anchor="start">人物、岸坡与水线共同提供尺度线索</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  正常移动中保留轮廓和视差</text><text x="42" y="575" class="note" text-anchor="start">光照和参照物来自实际场景，不为显深加黑沟、岩墙或楼房。</text></g></svg>
