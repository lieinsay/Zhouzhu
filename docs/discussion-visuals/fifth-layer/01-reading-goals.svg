<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-01-reading-goals desc-01-reading-goals" data-chapter="01-reading-goals"><title id="title-01-reading-goals">真实几何与观看目标</title><desc id="desc-01-reading-goals">先有同版物理事实，再讨论正常观察怎样读出它。 真实床岸和当天水态是起点：第五层不改宽深或供水；前三层成因和第四层契约保持已确认。；几何层次先于深色和白沫：岸、浅滩、深槽及对岸来自实体；不能用永久黑沟或白边假造层次。；材质、环境与镜头共同表达：水底可见性受光程、成分、反光和遮挡影响；不是所有深水都应黑蓝。；数字和画面分别验收：正确读数不保证正常画面可读；漂亮图片也不证明源宽深正确。；缺输入不在显示端补事实：原47米问题仍待同版定位；本层设计已确认，图示不是修复或模拟结果。；有水、通过流和湿润分别判断：零通过流可仍存水；无开水面的饱和低地不凭名称铺镜面，真实干槽和未知状态分别保留。。第五层设计已通过；非比例、非物理/光学模拟，不是47米现场验收。</desc><defs><marker id="arrow-01-reading-goals" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">01 / 真实几何与观看目标</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="75" y="185" width="190" height="90" rx="9" class="active"/><text x="170" y="217" class="label" text-anchor="middle">真实几何</text><text x="170" y="246" class="small" text-anchor="middle">成因与实体</text><line x1="275" y1="230" x2="282" y2="230" class="flow" marker-end="url(#arrow-01-reading-goals)"/><rect x="290" y="185" width="190" height="90" rx="9" class="card"/><text x="385" y="217" class="label" text-anchor="middle">接受水态</text><text x="385" y="246" class="small" text-anchor="middle">同域同版</text><line x1="490" y1="230" x2="497" y2="230" class="flow" marker-end="url(#arrow-01-reading-goals)"/><rect x="505" y="185" width="190" height="90" rx="9" class="card"/><text x="600" y="217" class="label" text-anchor="middle">材质 / 镜头</text><text x="600" y="246" class="small" text-anchor="middle">受约束表达</text><line x1="705" y1="230" x2="712" y2="230" class="flow" marker-end="url(#arrow-01-reading-goals)"/><rect x="720" y="185" width="190" height="90" rx="9" class="card"/><text x="815" y="217" class="label" text-anchor="middle">正常观看</text><text x="815" y="246" class="small" text-anchor="middle">尺度与层次</text><rect x="245" y="355" width="450" height="85" rx="9" class="card"/><text x="470" y="387" class="label" text-anchor="middle">一份事实，多种相容线索</text><text x="470" y="416" class="small" text-anchor="middle">图示不提供宽深、光学或镜头参数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="