<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-04-optics desc-04-optics" data-chapter="04-optics"><title id="title-04-optics">反射、透射与屏幕限制</title><desc id="desc-04-optics">光程和界面解释外观，颜色不提供一套独立水动力。 同一水面可以反光，也可以透底：界面与观察方向影响反射/透射；反光强不代表水一定深。；底部可见性随介质和光程改变：同一光学状态下浅部与深部可以不同；不保证清水透到任意深度。；颜色不能唯一确定几米深：底材、阴影、天空和浑浊都能改变外观；碰撞与HUD沿真实深度。；屏幕结果有有效范围和缺失：透明物体、前景和画外对象可能不被支持；不能穿岸折射或补成假深槽。；信息不足时保留诚实近似：退回受约束材质并说明限制，不给旧包虚构准确水质或底部信息。；反射与透射共享同一入射输入：界面分配、入水后的衰减/散射相容；不全强叠亮，空气雾与水中路径也不重复全额计入。。第五层设计已通过；非比例、非物理/光学模拟，不是47米现场验收。</desc><defs><marker id="arrow-04-optics" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">04 / 反射、透射与屏幕限制</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="650" y1="145" x2="575" y2="285" class="event" marker-end="url(#arrow-04-optics)"/><line x1="575" y1="285" x2="500" y2="145" class="event" marker-end="url(#arrow-04-optics)"/><line x1="575" y1="285" x2="540" y2="410" class="event" marker-end="url(#arrow-04-optics)"/><line x1="575" y1="125" x2="575" y2="285" class="ref" /><text x="105" y="120" class="small" text-anchor="start">界面方向关系示意，非光学模拟</text><text x="662" y="203" class="small" text-anchor="start">入射</text><text x="425" y="205" class="small" text-anchor="start">反射</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  同一水面可以反光，也可以透底</text><text x="42" y="575" class="note" text-anchor="start">界面与观察方向影响反射/透射；反光强不代表水一定深。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="395" cy="309" r="3" class="dot"/><circle cx="445" cy="318" r="5" class="dot"/><circle cx="513" cy="372" r="3" class="dot"/><circle cx="540" cy="405" r="6" class="dot"/><circle cx="583" cy="363" r="4" class="dot"/><circle cx="627" cy="324" r="3" class="dot"/><path d="M470 340 L540 410 L605 345 L580 315 L500 315Z" class="water" fill-opacity="0.35"/><text x="115" y="170" class="label" text-anchor="start">底部信号可随水中路径衰减；不搬动真实床面</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  底部可见性随介质和光程改变</text><text x="42" y="575" class="note" text-anchor="start">同一光学状态下浅部与深部可以不同；不保证清水透到任意深度。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><rect x="130" y="152" width="680" height="65" rx="9" class="card"/><text x="470" y="184" class="label" text-anchor="middle">深色也可能来自阴影、底材、反光或浑浊</text><text x="115" y="488" class="small" text-anchor="start">物理深度不从最终颜色回推</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  颜色不能唯一确定几米深</text><text x="42" y="575" class="note" text-anchor="start">底材、阴影、天空和浑浊都能改变外观；碰撞与HUD沿真实深度。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="95" y="180" width="310" height="105" rx="9" class="active"/><text x="250" y="212" class="label" text-anchor="middle">受支持的画面输入</text><text x="250" y="241" class="small" text-anchor="middle">不透明结果 / 有效视域</text><rect x="545" y="180" width="310" height="105" rx="9" class="candidate"/><text x="700" y="212" class="label" text-anchor="middle">可能缺失的信息</text><text x="700" y="241" class="small" text-anchor="middle">透明 / 画外 / 前景判别</text><line x1="420" y1="230" x2="530" y2="230" class="flow" marker-end="url(#arrow-04-optics)"/><rect x="240" y="365" width="460" height="80" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">有效采样与保守退回</text><text x="470" y="426" class="small" text-anchor="middle">不把前景岸或人物当水底</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  屏幕结果有有效范围和缺失</text><text x="42" y="575" class="note" text-anchor="start">透明物体、前景和画外对象可能不被支持；不能穿岸折射或补成假深槽。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><rect x="270" y="155" width="400" height="72" rx="9" class="card"/><text x="470" y="187" class="label" text-anchor="middle">光学能力与近似范围明确</text><text x="470" y="216" class="small" text-anchor="middle">未知光学不等于无水</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  信息不足时保留诚实近似</text><text x="42" y="575" class="note" text-anchor="start">退回受约束材质并说明限制，不给旧包虚构准确水质或底部信息。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="340" y="145" width="260" height="80" rx="9" class="active"/><text x="470" y="177" class="label" text-anchor="middle">同一环境入射</text><text x="470" y="206" class="small" text-anchor="middle">界面分配</text><line x1="440" y1="235" x2="270" y2="285" class="flow" marker-end="url(#arrow-04-optics)"/><line x1="500" y1="235" x2="690" y2="285" class="flow" marker-end="url(#arrow-04-optics)"/><rect x="90" y="295" width="310" height="85" rx="9" class="card"/><text x="245" y="327" class="label" text-anchor="middle">界面反射</text><text x="245" y="356" class="small" text-anchor="middle">不是额外一份全强光</text><rect x="540" y="295" width="310" height="85" rx="9" class="card"/><text x="695" y="327" class="label" text-anchor="middle">透射进入介质</text><text x="695" y="356" class="small" text-anchor="middle">继续按实际路径响应</text><text x="115" y="455" class="small" text-anchor="start">分支只表示职责，不按线宽给出能量比例</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  反射与透射共享同一入射输入</text><text x="42" y="575" class="note" text-anchor="start">界面分配、入水后的衰减/散射相容；不全强叠亮，空气雾与水中路径也不重复全额计入。</text></g></svg>
