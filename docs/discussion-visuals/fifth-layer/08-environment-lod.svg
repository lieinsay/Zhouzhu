<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-08-environment-lod desc-08-environment-lod" data-chapter="08-environment-lod"><title id="title-08-environment-lod">光照、LOD与稳定性</title><desc id="desc-08-environment-lod">保留真实岸线和物理尺度，不能靠抬水或特殊灯光显深。 水、岸和人物共享实际环境：太阳、天空、云雾及曝光一起核对，不给每条河补独立显深灯。；粗地形盖水不能用无界抬水补：虚线为错误的距离抬升示意；回查几何和LOD，物理水位不随镜头变。；透明排序和接缝不造新水域：河湖口、相邻块与水位范围同版，不能叠水、穿岸或误剔除。；远处滤细节不扩大世界米制宽度：纹波可减细，窄水面可难辨；像素覆盖不能冒充物理加宽。；不同观看条件诚实保留限制：雾、浑水、夜间或质量近似不保证见底；仍要验普通条件下的层次。；旧显示历史不能跨新屏障：冲淤、改道或分湖后核对几何/水态与历史相容；失效时丢派生帧，不删除水盐沙或真实湿润历史。。第五层设计已通过；非比例、非物理/光学模拟，不是47米现场验收。</desc><defs><marker id="arrow-08-environment-lod" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">08 / 光照、LOD与稳定性</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="165" y1="150" x2="320" y2="280" class="event" marker-end="url(#arrow-08-environment-lod)"/><circle cx="220" cy="193" r="8" class="person"/><line x1="220" y1="202" x2="220" y2="225" class="person" /><line x1="220" y1="208" x2="206" y2="218" class="person" /><line x1="220" y1="208" x2="233" y2="216" class="person" /><line x1="220" y1="225" x2="210" y2="245" class="person" /><line x1="220" y1="225" x2="230" y2="245" class="person" /><text x="380" y="165" class="label" text-anchor="start">同一环境光照，不设河流专用黑影</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  水、岸和人物共享实际环境</text><text x="42" y="575" class="note" text-anchor="start">太阳、天空、云雾及曝光一起核对，不给每条河补独立显深灯。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="284" y1="230" x2="677" y2="230" class="ghost" /><line x1="615" y1="220" x2="635" y2="240" class="bad" /><line x1="615" y1="240" x2="635" y2="220" class="bad" /><line x1="730" y1="230" x2="730" y2="285" class="flow" /><line x1="723" y1="230" x2="737" y2="230" class="flow" /><line x1="723" y1="285" x2="737" y2="285" class="flow" /><text x="743" y="257.5" class="small" text-anchor="start">错误抬升</text><text x="115" y="171" class="label" text-anchor="start">实际水面保持；距离不能决定另一套河水位</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  粗地形盖水不能用无界抬水补</text><text x="42" y="575" class="note" text-anchor="start">虚线为错误的距离抬升示意；回查几何和LOD，物理水位不随镜头变。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="460" y1="220" x2="460" y2="450" class="ref" /><text x="110" y="169" class="label" text-anchor="start">共同边界与透明顺序，不能叠加两份水面</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  透明排序和接缝不造新水域</text><text x="42" y="575" class="note" text-anchor="start">河湖口、相邻块与水位范围同版，不能叠水、穿岸或误剔除。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="284" y1="180" x2="677" y2="180" class="ref" /><line x1="284" y1="174" x2="284" y2="186" class="ref" /><line x1="677" y1="174" x2="677" y2="186" class="ref" /><text x="480.5" y="168" class="small" text-anchor="middle">同一物理湿宽</text><text x="110" y="489" class="small" text-anchor="start">换距离或质量，真实湿边和库存未改变</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  远处滤细节不扩大世界米制宽度</text><text x="42" y="575" class="note" text-anchor="start">纹波可减细，窄水面可难辨；像素覆盖不能冒充物理加宽。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><rect x="286" y="250" width="400" height="185" rx="9" class="patch"/><text x="115" y="164" class="label" text-anchor="start">能见度限制与真实浅槽缺陷分别记录</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  不同观看条件诚实保留限制</text><text x="42" y="575" class="note" text-anchor="start">雾、浑水、夜间或质量近似不保证见底；仍要验普通条件下的层次。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="85" y="200" width="280" height="105" rx="9" class="candidate"/><text x="225" y="232" class="label" text-anchor="middle">旧派生画面历史</text><text x="225" y="261" class="small" text-anchor="middle">G0 / 水态S0</text><line x1="385" y1="250" x2="555" y2="250" class="ghost" /><line x1="460" y1="240" x2="480" y2="260" class="bad" /><line x1="460" y1="260" x2="480" y2="240" class="bad" /><rect x="575" y="200" width="280" height="105" rx="9" class="active"/><text x="715" y="232" class="label" text-anchor="middle">当前接受状态</text><text x="715" y="261" class="small" text-anchor="middle">G1 / 水态S1</text><rect x="230" y="370" width="480" height="85" rx="9" class="card"/><text x="470" y="402" class="label" text-anchor="middle">可靠对应才复用，不相容就重建表示</text><text x="470" y="431" class="small" text-anchor="middle">只丢派生历史，不删源事实和物质库存</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  旧显示历史不能跨新屏障</text><text x="42" y="575" class="note" text-anchor="start">冲淤、改道或分湖后核对几何/水态与历史相容；失效时丢派生帧，不删除水盐沙或真实湿润历史</text><text x="42" y="603" class="note" text-anchor="start">。</text></g></svg>
