<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-09-original-case desc-09-original-case" data-chapter="09-original-case"><title id="title-09-original-case">同版47米问题诊断</title><desc id="desc-09-original-case">原问题没有被本轮源码调查或示意图解决。 先定位原世界、河段、日期和站位：47米原现场仍未同版验证；其他河段的通过不能替它关闭。；确认47米到底是哪种宽度：参考跨度、活动主槽、当天湿宽或含干洲跨度分别读取，不能混比。；先比较同版源面与实际还原：床岸、显示、碰撞、水面和查询必须相符，缺几何回上游而非补材质。；再分离材质、镜头和显示问题：整段深度色、抬水与HUD口径只是候选原因；正常现场证据才确定贡献。；原始现场未定位就保留未完成：不凭1.2米混色值、名义人物尺寸或漂亮动画宣布问题已解释。。第五层设计已通过；非比例、非物理/光学模拟，不是47米现场验收。</desc><defs><marker id="arrow-09-original-case" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">09 / 同版47米问题诊断</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="150" y="185" width="640" height="115" rx="9" class="candidate"/><text x="470" y="217" class="label" text-anchor="middle">47米原始现场：待同版定位</text><text x="470" y="246" class="small" text-anchor="middle">世界 / 河段 / 日期 / 指标 / 人物 / 相机</text><text x="135" y="412" class="label" text-anchor="start">本轮只读调查，没有启动游戏或重做现场</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  先定位原世界、河段、日期和站位</text><text x="42" y="575" class="note" text-anchor="start">47米原现场仍未同版验证；其他河段的通过不能替它关闭。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="110" y="180" width="305" height="90" rx="9" class="card"/><text x="262.5" y="212" class="label" text-anchor="middle">参考 / 活动</text><text x="262.5" y="241" class="small" text-anchor="middle">地貌与形成历史</text><rect x="525" y="180" width="305" height="90" rx="9" class="card"/><text x="677.5" y="212" class="label" text-anchor="middle">当天湿宽 / 跨洲跨度</text><text x="677.5" y="241" class="small" text-anchor="middle">当前水态与湿域</text><text x="180" y="408" class="label" text-anchor="start">先确认指标，再比较人物尺度和实际几何</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  确认47米到底是哪种宽度</text><text x="42" y="575" class="note" text-anchor="start">参考跨度、活动主槽、当天湿宽或含干洲跨度分别读取，不能混比。</text></g><g data-step="2" opacity="0"><animat