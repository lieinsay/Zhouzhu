xt-anchor="start">整段深度色、抬水与HUD口径只是候选原因；正常现场证据才确定贡献。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="150" y="185" width="640" height="115" rx="9" class="candidate"/><text x="470" y="217" class="label" text-anchor="middle">47米原始现场：待同版定位</text><text x="470" y="246" class="small" text-anchor="middle">世界 / 河段 / 日期 / 指标 / 人物 / 相机</text><text x="135" y="412" class="label" text-anchor="start">当前状态仍是未完成，不用代表样本替代原问题</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  原始现场未定位就保留未完成</text><text x="42" y="575" class="note" text-anchor="start">不凭1.2米混色值、名义人物尺寸或漂亮动画宣布问题已解释。</text></g></svg>
