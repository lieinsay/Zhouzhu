<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-03-depth-path desc-03-depth-path" data-chapter="03-depth-path"><title id="title-03-depth-path">水深与水下光程</title><desc id="desc-03-depth-path">垂向水深、断面摘要和视线里的水下路径不是同一量。 当处深度取同域实际床面：水位到床面的垂向差不从颜色或透明度反算。；平均深与最大深有各自口径：普通断面平均深为A/T；最大深在实际最深点，不赋给所有像素。；光在水中走的路径另有长度：此图只示意界面转向与水中路径，不计算折射角或光学系数。；换观察方向，物理深度不变：水中光程与反光可以改变；同一点的床高、水位和深度保持。；屏幕深度不是米制水深：投影、前景遮挡与显示压缩需分别处理；屏幕缺信息不能补造水底。。第五层设计已通过；非比例、非物理/光学模拟，不是47米现场验收。</desc><defs><marker id="arrow-03-depth-path" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">03 / 水深与水下光程</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="540" y1="285" x2="540" y2="410" class="flow" /><line x1="533" y1="285" x2="547" y2="285" class="flow" /><line x1="533" y1="410" x2="547" y2="410" class="flow" /><text x="553" y="347.5" class="small" text-anchor="start">垂向深度</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  当处深度取同域实际床面</text><text x="42" y="575" class="note" text-anchor="start">水位到床面的垂向差不从颜色或透明度反算。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="540" y1="285" x2="540" y2="410" class="flow" /><line x1="533" y1="285" x2="547" y2="285" class="flow" /><line x1="533" y1="410" x2="547" y2="410" class="flow" /><text x="553" y="347.5" class="small" text-anchor="start">垂向深度</text><text x="120" y="172" class="label" text-anchor="start">A/T、最大深和局部深分别定义</text><line x1="385" y1="285" x2="385" y2="320" class="flow" /><line x1="378" y1="285" x2="392" y2="285" class="flow" /><line x1="378" y1="320" x2="392" y2="320" class="flow" /><text x="398" y="302.5" class="small" text-anchor="start">局部深</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  平均深与最大深有各自口径</text><text x="42" y="575" class="note" text-anchor="start">普通断面平均深为A/T；最大深在实际最深点，不赋给所有像素。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="540" y1="285" x2="540" y2="410" class="flow" /><line x1="533" y1="285" x2="547" y2="285" class="flow" /><line x1="533" y1="410" x2="547" y2="410" class="flow" /><text x="720" y="365" class="small" text-anchor="start">垂向深度</text><line x1="690" y1="135" x2="580" y2="285" class="event" marker-end="url(#arrow-03-depth-path)"/><line x1="580" y1="285" x2="540" y2="410" class="event" marker-end="url(#arrow-03-depth-path)"/><text x="645" y="177" class="small" text-anchor="start">观察方向</text><text x="650" y="430" class="small" text-anchor="start">水中路径</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  光在水中走的路径另有长度</text><text x="42" y="575" class="note" text-anchor="start">此图只示意界面转向与水中路径，不计算折射角或光学系数。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="540" y1="285" x2="540" y2="410" class="flow" /><line x1="533" y1="285" x2="547" y2="285" class="flow" /><line x1="533" y1="410" x2="547" y2="410" class="flow" /><text x="553" y="347.5" class="small" text-anchor="start">垂向深度</text><line x1="400" y1="135" x2="500" y2="285" class="event" marker-end="url(#arrow-03-depth-path)"/><line x1="500" y1="285" x2="540" y2="410" class="event" marker-end="url(#arrow-03-depth-path)"/><text x="120" y="175" class="label" text-anchor="start">观察方向改变，同一最深点与水位未改变</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  换观察方向，物理深度不变</text><text x="42" y="575" class="note" text-anchor="start">水中光程与反光可以改变；同一点的床高、水位和深度保持。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="90" y="200" width="260" height="105" rx="9" class="active"/><text x="220" y="232" class="label" text-anchor="middle">物理水深</text><text x="220" y="261" class="small" text-anchor="middle">同域床面 / 水面</text><rect x="590" y="200" width="260" height="105" rx="9" class="candidate"/><text x="720" y="232" class="label" text-anchor="middle">屏幕深度</text><text x="720" y="261" class="small" text-anchor="middle">视图 / 投影 / 遮挡</text><line x1="370" y1="250" x2="565" y2="250" class="ghost" /><line x1="458" y1="240" x2="478" y2="260" class="bad" /><line x1="458" y1="260" x2="478" y2="240" class="bad" /><text x="130" y="420" class="label" text-anchor="start">不能把深度纹理灰度或压缩距离当成水中米数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  屏幕深度不是米制水深</text><text x="42" y="575" class="note" text-anchor="start">投影、前景遮挡与显示压缩需分别处理；屏幕缺信息不能补造水底。</text></g></svg>
