<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-05-material-state desc-05-material-state" data-chapter="05-material-state"><title id="title-05-material-state">材料、浑浊与覆盖</title><desc id="desc-05-material-state">底材、湿岸和水中成分要有实际状态，不能按标签涂一圈。 床岸材料来自同源库存：砂、砾、细料和基岩分别表达；不是每条河床都铺一样卵石。；雨湿、当日水线与淹水历史分开：湿岸范围有状态依据，不能用全局天气湿度画永久涨水痕迹。；浑浊不能只看当天Q指数：引用实际悬移物及光学资料；盐不是泥沙，涨退水可以有时滞。；冰盖下面仍可能有液水：冰、雪和液水分开表达；看不到开水面不等于干槽或库存为零。；缺材料或光学时明确显示近似：诊断清/浑情景不冒充真实当天状态，也不为看深槽换清水。。第五层设计已通过；非比例、非物理/光学模拟，不是47米现场验收。</desc><defs><marker id="arrow-05-material-state" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">05 / 材料、浑浊与覆盖</text><text x="35" y="77" class="small" text-anchor="start">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="395" cy="309" r="3" class="dot"/><circle cx="445" cy="318" r="5" class="dot"/><circle cx="513" cy="372" r="3" class="dot"/><circle cx="540" cy="405" r="6" class="dot"/><circle cx="583" cy="363" r="4" class="dot"/><circle cx="627" cy="324" r="3" class="dot"/><text x="125" y="170" class="label" text-anchor="start">实际底材有差异；符号不提供粒径参数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  床岸材料来自同源库存</text><text x="42" y="575" class="note" text-anchor="start">砂、砾、细料和基岩分别表达；不是每条河床都铺一样卵石。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="264" y1="272" x2="697" y2="272" class="ghost" /><text x="115" y="167" class="label" text-anchor="start">虚线仅表示有依据的先前水线，不是永久湿带</text><text x="115" y="489" class="small" text-anchor="start">降雨湿润与河水淹没是不同来源</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  雨湿、当日水线与淹水历史分开</text><text x="42" y="575" class="note" text-anchor="start">湿岸范围有状态依据，不能用全局天气湿度画永久涨水痕迹。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="410" cy="307" r="4" class="strata"/><circle cx="470" cy="314" r="4" class="strata"/><circle cx="515" cy="338" r="4" class="strata"/><circle cx="550" cy="363" r="4" class="strata"/><circle cx="607" cy="313" r="4" class="strata"/><circle cx="587" cy="296" r="4" class="strata"/><text x="110" y="170" class="label" text-anchor="start">有来源的悬移颗粒与真实输运；盐另有质量账</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  浑浊不能只看当天Q指数</text><text x="42" y="575" class="note" text-anchor="start">引用实际悬移物及光学资料；盐不是泥沙，涨退水可以有时滞。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><path d="M296 276 L668 276 L677 285 L284 285Z" class="watercard" /><text x="110" y="166" class="label" text-anchor="start">实际覆盖状态：冰面不是液水水位或河床</text><text x="470" y="310" class="small" text-anchor="start">冰下液水</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  冰盖下面仍可能有液水</text><text x="42" y="575" class="note" text-anchor="start">冰、雪和液水分开表达；看不到开水面不等于干槽或库存为零。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><rect x="250" y="155" width="440" height="75" rx="9" class="card"/><text x="470" y="187" class="label" text-anchor="middle">光学 / 材料未定，水态仍保留</text><text x="470" y="216" class="small" text-anchor="middle">不从名称或观感补事实</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  缺材料或光学时明确显示近似</text><text x="42" y="575" class="note" text-anchor="start">诊断清/浑情景不冒充真实当天状态，也不为看深槽换清水。</text></g></svg>
