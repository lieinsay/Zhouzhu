<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-01-shared-water desc-01-shared-water" data-chapter="01-shared-water"><title id="title-01-shared-water">同一份水与本层边界</title><desc id="desc-01-shared-water">取用、用途与通行依赖同一真实水陆环境；生态和生物演化继续延期。 前六层提供真实水陆环境：第六层完整方案与补充已确认；本层继续有限来源、实际几何与统一时钟。；环境水转移到实际存放位置：容器、村缸与工序不是新增水源，原供体与受体不各留一份。；水量、容量和用途资格分开：一担、一罐与体积质量的换算以后定；满器具不自动适合所有用途。；使用与经过水域都消费当前事实：玩家、村民、农田、物体和船不各造水态，也不从shader判断通路。；生态和具体模型继续延期：本层讨论用水与水上交互，不确定物种、演化、作物生理或完整船型工艺。。第七层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-01-shared-water" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">01 / 同一份水与本层边界</text><text x="35" y="77" class="small" text-anchor="start">第七层设计已通过 · 非比例因果示意 · 图形秒数不是水力或作业时间</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="180" width="260" height="110" rx="9" class="active"/><text x="210" y="212" class="label" text-anchor="middle">同版环境水陆</text><text x="210" y="241" class="small" text-anchor="middle">来源 / 库存 / 通路</text><line x1="355" y1="235" x2="580" y2="235" class="event" marker-end="url(#arrow-01-shared-water)"/><rect x="600" y="180" width="260" height="110" rx="9" class="active"/><text x="730" y="212" class="label" text-anchor="middle">实际操作与受体</text><text x="730" y="241" class="small" text-anchor="middle">容量 / 能力 / 去向</text><rect x="205" y="365" width="530" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">前六层已确认，参数与实际结果未验证</text><text x="470" y="426" class="small" text-anchor="middle">本图为职责示意，不提供水量或技术参数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  前六层提供真实水陆环境</text><text x="42" y="575" class="note" text-anchor="start">第六层完整方案与补充已确认；本层继续有限来源、实际几何与统一时钟。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="180" width="260" height="110" rx="9" class="active"/><text x="210" y="212" class="label" text-anchor="middle">同版环境水陆</text><text x="210" y="241" class="small" text-anchor="middle">来源 / 库存 / 通路</text><line x1="355" y1="235" x2="580" y2="235" class="event" marker-end="url(#arrow-01-shared-water)"/><rect x="600" y="180" width="260" height="110" rx="9" class="active"/><text x="730" y="212" class="label" text-anchor="middle">实际操作与受体</text><text x="730" y="241" class="small" text-anchor="middle">容量 / 能力 / 去向</text><rect x="205" y="365" width="530" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">只转移一份，空间与当前存放位置可追溯</text><text x="470" y="426" class="small" text-anchor="middle">本图为职责示意，不提供水量或技术参数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  环境水转移到实际存放位置</text><text x="42" y="575" class="note" text-anchor="start">容器、村缸与工序不是新增水源，原供体与受体不各留一份。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="180" width="260" height="110" rx="9" class="active"/><text x="210" y="212" class="label" text-anchor="middle">同版环境水陆</text><text x="210" y="241" class="small" text-anchor="middle">来源 / 库存 / 通路</text><line x1="355" y1="235" x2="580" y2="235" class="event" marker-end="url(#arrow-01-shared-water)"/><rect x="600" y="180" width="260" height="110" rx="9" class="active"/><text x="730" y="212" class="label" text-anchor="middle">实际操作与受体</text><text x="730" y="241" class="small" text-anchor="middle">容量 / 能力 / 去向</text><rect x="205" y="365" width="530" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">可装、够量、可用，不是同一判断</text><text x="470" y="426" class="small" text-anchor="middle">本图为职责示意，不提供水量或技术参数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  水量、容量和用途资格分开</text><text x="42" y="575" class="note" text-anchor="start">一担、一罐与体积质量的换算以后定；满器具不自动适合所有用途。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="180" width="260" height="110" rx="9" class="active"/><text x="210" y="212" class="label" text-anchor="middle">同版环境水陆</text><text x="210" y="241" class="small" text-anchor="middle">来源 / 库存 / 通路</text><line x1="355" y1="235" x2="580" y2="235" class="event" marker-end="url(#arrow-01-shared-water)"/><rect x="600" y="180" width="260" height="110" rx="9" class="active"/><text x="730" y="212" class="label" text-anchor="middle">使用与接触</text><text x="730" y="241" class="small" text-anchor="middle">身体 / 载物 / 路线</text><rect x="205" y="365" width="530" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">镜头、LOD与物品标签不改变物理事实</text><text x="470" y="426" class="small" text-anchor="middle">本图为职责示意，不提供水量或技术参数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  使用与经过水域都消费当前事实</text><text x="42" y="575" class="note" text-anchor="start">玩家、村民、农田、物体和船不各造水态，也不从shader判断通路。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="180" width="260" height="110" rx="9" class="active"/><text x="210" y="212" class="label" text-anchor="middle">同版环境水陆</text><text x="210" y="241" class="small" text-anchor="middle">来源 / 库存 / 通路</text><line x1="355" y1="235" x2="580" y2="235" class="event" marker-end="url(#arrow-01-shared-water)"/><rect x="600" y="180" width="260" height="110" rx="9" class="active"/><text x="730" y="212" class="label" text-anchor="middle">实际操作与受体</text><text x="730" y="241" class="small" text-anchor="middle">容量 / 能力 / 去向</text><rect x="205" y="365" width="530" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">第七层已确认；生态环境与生物演化延期</text><text x="470" y="426" class="small" text-anchor="middle">本图为职责示意，不提供水量或技术参数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  生态和具体模型继续延期</text><text x="42" y="575" class="note" text-anchor="start">本层讨论用水与水上交互，不确定物种、演化、作物生理或完整船型工艺。</text></g></svg>
