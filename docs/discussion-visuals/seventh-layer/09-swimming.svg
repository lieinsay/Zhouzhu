<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-09-swimming desc-09-swimming" data-chapter="09-swimming"><title id="title-09-swimming">游泳、流动与回岸</title><desc id="desc-09-swimming">输入与有限能力、负载和实际水流相容，上岸需要真实可达接触。 游泳读取真实浸没与液水状态：近静水也可有浮游；水面不是地板，不按Q为零让水消失。；输入不是直接指定地面速度：浮力、阻力、实际相对水流和有限划水能力共同响应，不统一强拖曳。；负载和身体能力影响可支持动作：水与货物质量不能游泳时消失；具体疲劳、伤害和失败规则以后定。；回岸要有真实岸阶、梯子或方法：不拉高玩家、削岸或补隐形平台；能力不支持时明确限制。；冰盖、瀑布、承压空间分适用域：冰下有水不等于可游入，画出水面也不证明承载或呼吸条件。；恢复位置不回滚或复制物质历史：未来游戏恢复约定需公开且与水货账相容；旧坠落重置不是溺水模型。。第七层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-09-swimming" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">09 / 游泳、流动与回岸</text><text x="35" y="77" class="small" text-anchor="start">第七层设计已通过 · 非比例因果示意 · 图形秒数不是水力或作业时间</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="450" cy="280" r="8" class="person"/><line x1="460" y1="288" x2="510" y2="307" class="person" /><line x1="482" y1="299" x2="525" y2="280" class="person" /><line x1="510" y1="307" x2="550" y2="302" class="person" /><line x1="510" y1="307" x2="540" y2="330" class="person" /><text x="470" y="155" class="small" text-anchor="middle">实际液水与浸没，不从水色猜深度</text><text x="470" y="460" class="small" text-anchor="middle">人体、水流与器具为因果示意，不是动作或受力模拟</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  游泳读取真实浸没与液水状态</text><text x="42" y="575" class="note" text-anchor="start">近静水也可有浮游；水面不是地板，不按Q为零让水消失。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="450" cy="280" r="8" class="person"/><line x1="460" y1="288" x2="510" y2="307" class="person" /><line x1="482" y1="299" x2="525" y2="280" class="person" /><line x1="510" y1="307" x2="550" y2="302" class="person" /><line x1="510" y1="307" x2="540" y2="330" class="person" /><line x1="385" y1="355" x2="475" y2="355" class="flow" marker-end="url(#arrow-09-swimming)"/><text x="265" y="390" class="small" text-anchor="start">相对水流</text><text x="470" y="155" class="small" text-anchor="middle">输入 + 能力 + 相对水流，而非无条件逆流</text><text x="470" y="460" class="small" text-anchor="middle">人体、水流与器具为因果示意，不是动作或受力模拟</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  输入不是直接指定地面速度</text><text x="42" y="575" class="note" text-anchor="start">浮力、阻力、实际相对水流和有限划水能力共同响应，不统一强拖曳。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="450" cy="280" r="8" class="person"/><line x1="460" y1="288" x2="510" y2="307" class="person" /><line x1="482" y1="299" x2="525" y2="280" class="person" /><line x1="510" y1="307" x2="550" y2="302" class="person" /><line x1="510" y1="307" x2="540" y2="330" class="person" /><line x1="385" y1="355" x2="475" y2="355" class="flow" marker-end="url(#arrow-09-swimming)"/><text x="265" y="390" class="small" text-anchor="start">相对水流</text><text x="470" y="155" class="small" text-anchor="middle">负载与可支持动作，具体参数以后细化</text><text x="470" y="460" class="small" text-anchor="middle">人体、水流与器具为因果示意，不是动作或受力模拟</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  负载和身体能力影响可支持动作</text><text x="42" y="575" class="note" text-anchor="start">水与货物质量不能游泳时消失；具体疲劳、伤害和失败规则以后定。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="450" cy="280" r="8" class="person"/><line x1="460" y1="288" x2="510" y2="307" class="person" /><line x1="482" y1="299" x2="525" y2="280" class="person" /><line x1="510" y1="307" x2="550" y2="302" class="person" /><line x1="510" y1="307" x2="540" y2="330" class="person" /><line x1="740" y1="245" x2="650" y2="290" class="layer" /><line x1="713" y1="250" x2="727" y2="260" class="layer" /><line x1="683" y1="265" x2="697" y2="275" class="layer" /><line x1="653" y1="280" x2="667" y2="290" class="layer" /><text x="470" y="155" class="small" text-anchor="middle">本例存在真实梯子；仍需核对可达与方法</text><text x="470" y="460" class="small" text-anchor="middle">人体、水流与器具为因果示意，不是动作或受力模拟</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  回岸要有真实岸阶、梯子或方法</text><text x="42" y="575" class="note" text-anchor="start">不拉高玩家、削岸或补隐形平台；能力不支持时明确限制。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="450" cy="280" r="8" class="person"/><line x1="460" y1="288" x2="510" y2="307" class="person" /><line x1="482" y1="299" x2="525" y2="280" class="person" /><line x1="510" y1="307" x2="550" y2="302" class="person" /><line x1="510" y1="307" x2="540" y2="330" class="person" /><text x="470" y="155" class="small" text-anchor="middle">复杂覆盖与流况，只在支持范围内交互</text><text x="470" y="460" class="small" text-anchor="middle">不把未知状态默认为干地、静水或可通行</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  冰盖、瀑布、承压空间分适用域</text><text x="42" y="575" class="note" text-anchor="start">冰下有水不等于可游入，画出水面也不证明承载或呼吸条件。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="95" y="185" width="300" height="115" rx="9" class="active"/><text x="245" y="217" class="label" text-anchor="middle">已经发生的过程</text><text x="245" y="246" class="small" text-anchor="middle">水 / 货物 / 时间历史</text><line x1="410" y1="242" x2="530" y2="242" class="event" marker-end="url(#arrow-09-swimming)"/><rect x="545" y="185" width="300" height="115" rx="9" class="card"/><text x="695" y="217" class="label" text-anchor="middle">明确的恢复约定</text><text x="695" y="246" class="small" text-anchor="middle">不复制、不假称未发生</text><text x="470" y="425" class="small" text-anchor="middle">本层不决定致死秒数或实现救援系统</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  恢复位置不回滚或复制物质历史</text><text x="42" y="575" class="note" text-anchor="start">未来游戏恢复约定需公开且与水货账相容；旧坠落重置不是溺水模型。</text></g></svg>
