<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-11-navigation desc-11-navigation" data-chapter="11-navigation"><title id="title-11-navigation">通航、载况与靠泊</title><desc id="desc-11-navigation">整条路线、当时水情与实际载况共同决定通行，空艇保留独立设定。 水面船与现有浮石空艇分开：当前Ship走飞行模型，不因此具备排水、密封、搁浅或两栖能力。；通航看全路，不只看一点最深：浅滩、弯口、洲体、控制口与结构净空都在当前源几何中核对。；载重和水情改变船下余量：参考河宽、当天湿宽和最大深不是整路可通证明，不替船补宽深。；可等待、减载、换路或合理接驳：低水停航并非错误，也不保证每条河全年通船；具体运输技术以后定。；靠泊与上下船有真实接触条件：不能沿用空艇对位就穿岸，水位、船底、系泊和可达方法共同成立。；岛缘出水不生成跨空隙水路：保留真实外排和有限世界边界，不把下方海面吸水或水路接成航道。。第七层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-11-navigation" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">11 / 通航、载况与靠泊</text><text x="35" y="77" class="small" text-anchor="start">第七层设计已通过 · 非比例因果示意 · 图形秒数不是水力或作业时间</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="90" y="185" width="300" height="115" rx="9" class="card"/><text x="240" y="217" class="label" text-anchor="middle">现有浮石空艇</text><text x="240" y="246" class="small" text-anchor="middle">空气 / 托举 / 飞行</text><rect x="550" y="185" width="300" height="115" rx="9" class="card"/><text x="700" y="217" class="label" text-anchor="middle">未来水面运输</text><text x="700" y="246" class="small" text-anchor="middle">液水 / 载况 / 排水</text><text x="470" y="425" class="small" text-anchor="middle">本层只定责任，具体船型和两栖接触不默认已有</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  水面船与现有浮石空艇分开</text><text x="42" y="575" class="note" text-anchor="start">当前Ship走飞行模型，不因此具备排水、密封、搁浅或两栖能力。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M80 425L370 425L450 365L650 365L750 425L860 425L860 475L80 475Z" class="rock" /><path d="M80 285L860 285L860 425L750 425L650 365L450 365L370 425L80 425Z" class="water" /><line x1="80" y1="285" x2="860" y2="285" class="flow" /><path d="M370 257L610 257L580 312L405 312Z" class="strata" /><path d="M370 257L610 257L580 312L405 312Z" class="edge" /><text x="690" y="455" class="small" text-anchor="start">实际床面 / 浅滩</text><text x="470" y="155" class="small" text-anchor="middle">示意浅滩：全路控制条件决定可通性</text><text x="160" y="460" class="small" text-anchor="start">水下几何不由通航需求改写</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  通航看全路，不只看一点最深</text><text x="42" y="575" class="note" text-anchor="start">浅滩、弯口、洲体、控制口与结构净空都在当前源几何中核对。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M80 425L370 425L450 365L650 365L750 425L860 425L860 475L80 475Z" class="rock" /><path d="M80 335L860 335L860 425L750 425L650 365L450 365L370 425L80 425Z" class="water" /><line x1="80" y1="335" x2="860" y2="335" class="flow" /><path d="M370 310L610 310L580 365L405 365Z" class="strata" /><path d="M370 310L610 310L580 365L405 365Z" class="edge" /><rect x="435" y="275" width="85" height="34" rx="9" class="card"/><text x="690" y="455" class="small" text-anchor="start">实际床面 / 浅滩</text><text x="470" y="155" class="small" text-anchor="middle">载况与低水条件示意；不能据图量出船下余量</text><text x="160" y="460" class="small" text-anchor="start">水下几何不由通航需求改写</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  载重和水情改变船下余量</text><text x="42" y="575" class="note" text-anchor="start">参考河宽、当天湿宽和最大深不是整路可通证明，不替船补宽深。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="105" y="185" width="330" height="115" rx="9" class="watercard"/><text x="270" y="217" class="label" text-anchor="middle">当前限制</text><text x="270" y="246" class="small" text-anchor="middle">低水 / 载重 / 流况</text><line x1="450" y1="242" x2="510" y2="242" class="event" marker-end="url(#arrow-11-navigation)"/><rect x="525" y="185" width="330" height="115" rx="9" class="card"/><text x="690" y="217" class="label" text-anchor="middle">调整选择</text><text x="690" y="246" class="small" text-anchor="middle">等候 / 减载 / 换路</text><text x="470" y="425" class="small" text-anchor="middle">能否替代由现场和技术决定，不强迫每处都有等价解</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  可等待、减载、换路或合理接驳</text><text x="42" y="575" class="note" text-anchor="start">低水停航并非错误，也不保证每条河全年通船；具体运输技术以后定。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="80" y="185" width="245" height="110" rx="9" class="card"/><text x="202.5" y="217" class="label" text-anchor="middle">真实岸 / 构造</text><text x="202.5" y="246" class="small" text-anchor="middle">接触与可达点</text><rect x="350" y="185" width="245" height="110" rx="9" class="watercard"/><text x="472.5" y="217" class="label" text-anchor="middle">当前水与船底</text><text x="472.5" y="246" class="small" text-anchor="middle">水位 / 吃水 / 支撑</text><rect x="620" y="185" width="245" height="110" rx="9" class="card"/><text x="742.5" y="217" class="label" text-anchor="middle">受支持方法</text><text x="742.5" y="246" class="small" text-anchor="middle">系泊 / 上下船</text><text x="470" y="425" class="small" text-anchor="middle">泊位ID不把船永远锁在固定物理高度</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  靠泊与上下船有真实接触条件</text><text x="42" y="575" class="note" text-anchor="start">不能沿用空艇对位就穿岸，水位、船底、系泊和可达方法共同成立。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 270L420 270L420 475L90 475Z" class="rock" /><path d="M90 255L420 255L420 270L90 270Z" class="water" /><path d="M420 255Q450 285 450 435" class="fall" /><line x1="600" y1="440" x2="850" y2="440" class="ref" /><text x="595" y="215" class="label" text-anchor="start">岛间空隙</text><text x="470" y="155" class="small" text-anchor="middle">下游没有实际接收通道时，不补空中河床</text><text x="595" y="420" class="small" text-anchor="start">下方边界不等于航路</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  岛缘出水不生成跨空隙水路</text><text x="42" y="575" class="note" text-anchor="start">保留真实外排和有限世界边界，不把下方海面吸水或水路接成航道。</text></g></svg>
