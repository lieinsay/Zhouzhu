<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-07-village-domains desc-07-village-domains" data-chapter="07-village-domains"><title id="title-07-village-domains">村民、分配与远域</title><desc id="desc-07-village-domains">保留作息搬运入口，玩家与NPC、远近域共用同一份水。 挑水任务操作时再核对供体：旧缓存点只作候选，退水、断路或改道后不能仍按旧水线取水。；玩家、村民和工位共用供给：分配看有限供体与真实入口，不每户每域各拿一份完整旧Q。；初始村缸来自一次明确历史：不招人或重建布局就半满，满缸余水也不随携带清空消失。；近远域沿同一接受历程继续：行为可粗化，水源已干、路径断连、受体已满仍需生效，离屏不生水。；合理物流减少无谓长途挑水：保留可理解作息与取用，搜索半径不是批准长期手挑数百米。。第七层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-07-village-domains" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">07 / 村民、分配与远域</text><text x="35" y="77" class="small" text-anchor="start">第七层设计已通过 · 非比例因果示意 · 图形秒数不是水力或作业时间</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="85" y="185" width="250" height="110" rx="9" class="watercard"/><text x="210" y="217" class="label" text-anchor="middle">实际共享供体</text><text x="210" y="246" class="small" text-anchor="middle">当前水态 / 库存</text><line x1="350" y1="240" x2="580" y2="240" class="flow" marker-end="url(#arrow-07-village-domains)"/><rect x="600" y="185" width="250" height="110" rx="9" class="active"/><text x="725" y="217" class="label" text-anchor="middle">当前任务与接收</text><text x="725" y="246" class="small" text-anchor="middle">可达 / 容量 / 进度</text><rect x="200" y="365" width="540" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">候选取水点按相关依赖重新检查</text><text x="470" y="426" class="small" text-anchor="middle">本图不规定社会优先制度或具体日需水量</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  挑水任务操作时再核对供体</text><text x="42" y="575" class="note" text-anchor="start">旧缓存点只作候选，退水、断路或改道后不能仍按旧水线取水。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="85" y="185" width="250" height="110" rx="9" class="watercard"/><text x="210" y="217" class="label" text-anchor="middle">实际共享供体</text><text x="210" y="246" class="small" text-anchor="middle">当前水态 / 库存</text><line x1="350" y1="240" x2="580" y2="240" class="flow" marker-end="url(#arrow-07-village-domains)"/><rect x="600" y="185" width="250" height="110" rx="9" class="active"/><text x="725" y="217" class="label" text-anchor="middle">当前任务与接收</text><text x="725" y="246" class="small" text-anchor="middle">可达 / 容量 / 进度</text><rect x="200" y="365" width="540" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">预留只是意向，实际扣加只有一次</text><text x="470" y="426" class="small" text-anchor="middle">本图不规定社会优先制度或具体日需水量</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  玩家、村民和工位共用供给</text><text x="42" y="575" class="note" text-anchor="start">分配看有限供体与真实入口，不每户每域各拿一份完整旧Q。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="85" y="185" width="250" height="110" rx="9" class="watercard"/><text x="210" y="217" class="label" text-anchor="middle">实际共享供体</text><text x="210" y="246" class="small" text-anchor="middle">当前水态 / 库存</text><line x1="350" y1="240" x2="580" y2="240" class="flow" marker-end="url(#arrow-07-village-domains)"/><rect x="600" y="185" width="250" height="110" rx="9" class="active"/><text x="725" y="217" class="label" text-anchor="middle">当前任务与接收</text><text x="725" y="246" class="small" text-anchor="middle">可达 / 容量 / 进度</text><rect x="200" y="365" width="540" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">初始历史、在途水与入缸进度要对应</text><text x="470" y="426" class="small" text-anchor="middle">本图不规定社会优先制度或具体日需水量</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  初始村缸来自一次明确历史</text><text x="42" y="575" class="note" text-anchor="start">不招人或重建布局就半满，满缸余水也不随携带清空消失。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="85" y="185" width="250" height="110" rx="9" class="watercard"/><text x="210" y="217" class="label" text-anchor="middle">实际共享供体</text><text x="210" y="246" class="small" text-anchor="middle">当前水态 / 库存</text><line x1="350" y1="240" x2="580" y2="240" class="flow" marker-end="url(#arrow-07-village-domains)"/><rect x="600" y="185" width="250" height="110" rx="9" class="active"/><text x="725" y="217" class="label" text-anchor="middle">近 / 远域当前状态</text><text x="725" y="246" class="small" text-anchor="middle">统一时间与边界</text><rect x="200" y="365" width="540" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">显示卸载不删状态，不再重放免费供水</text><text x="470" y="426" class="small" text-anchor="middle">本图不规定社会优先制度或具体日需水量</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  近远域沿同一接受历程继续</text><text x="42" y="575" class="note" text-anchor="start">行为可粗化，水源已干、路径断连、受体已满仍需生效，离屏不生水。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="85" y="185" width="250" height="110" rx="9" class="watercard"/><text x="210" y="217" class="label" text-anchor="middle">实际共享供体</text><text x="210" y="246" class="small" text-anchor="middle">当前水态 / 库存</text><line x1="350" y1="240" x2="580" y2="240" class="flow" marker-end="url(#arrow-07-village-domains)"/><rect x="600" y="185" width="250" height="110" rx="9" class="active"/><text x="725" y="217" class="label" text-anchor="middle">当前任务与接收</text><text x="725" y="246" class="small" text-anchor="middle">可达 / 容量 / 进度</text><rect x="200" y="365" width="540" height="85" rx="9" class="card"/><text x="470" y="397" class="label" text-anchor="middle">近距手搬，远距改用合宜储水与运输</text><text x="470" y="426" class="small" text-anchor="middle">本图不规定社会优先制度或具体日需水量</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  合理物流减少无谓长途挑水</text><text x="42" y="575" class="note" text-anchor="start">保留可理解作息与取用，搜索半径不是批准长期手挑数百米。</text></g></svg>
