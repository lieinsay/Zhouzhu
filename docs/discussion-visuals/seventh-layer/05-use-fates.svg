<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-05-use-fates desc-05-use-fates" data-chapter="05-use-fates"><title id="title-05-use-fates">生活、生产与去向</title><desc id="desc-05-use-fates">需求、供给与实际使用分开，用水后的物质不能凭累计数消失。 需求不是实际可供或已经使用：不足时部分完成、等待或调整；不从空缸完成已声明需水的活动。；使用先进入真实过程与暂存：实际承载与有限容量成立；不设无物理空间的已用水库，具体生物过程以后细化。；回水、蒸发与产品带水各有边界：未知不自动返还河流，也不从全局账删除；没有模型不编造具体代谢。；循环用的是原水，不是重新供水：实际水量与去向闭合，色类按简单规则更新；不要求污染物模型，也不把同一水全额留在产品再回用。；水流取能与耗水分开，接第13类：做功从水流机械能转移，过流水仍有下游去向；小型近似与大型反馈见专门分类。。第七层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-05-use-fates" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">05 / 生活、生产与去向</text><text x="35" y="77" class="small" text-anchor="start">第七层设计已通过 · 非比例因果示意 · 图形秒数不是水力或作业时间</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="95" y="180" width="300" height="110" rx="9" class="card"/><text x="245" y="212" class="label" text-anchor="middle">用途需求</text><text x="245" y="241" class="small" text-anchor="middle">要多少 / 什么条件</text><rect x="545" y="180" width="300" height="110" rx="9" class="active"/><text x="695" y="212" class="label" text-anchor="middle">实际供给与操作</text><text x="695" y="241" class="small" text-anchor="middle">能提供和完成多少</text><text x="470" y="420" class="small" text-anchor="middle">生存后果与具体配方以后定，不默认新增惩罚倒计时</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 5  需求不是实际可供或已经使用</text><text x="42" y="575" class="note" text-anchor="start">不足时部分完成、等待或调整；不从空缸完成已声明需水的活动。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="185" width="245" height="110" rx="9" class="watercard"/><text x="202.5" y="217" class="label" text-anchor="middle">原供体 / 储水</text><text x="202.5" y="246" class="small" text-anchor="middle">扣实际进入量</text><line x1="337" y1="240" x2="359" y2="240" class="flow" marker-end="url(#arrow-05-use-fates)"/><rect x="370" y="185" width="230" height="110" rx="9" class="active"/><text x="485" y="217" class="label" text-anchor="middle">使用过程控制域</text><text x="485" y="246" class="small" text-anchor="middle">当前暂存 / 已完成</text><line x1="612" y1="240" x2="634" y2="240" class="flow" marker-end="url(#arrow-05-use-fates)"/><rect x="645" y="185" width="220" height="110" rx="9" class="card"/><text x="755" y="217" class="label" text-anchor="middle">实际去向</text><text x="755" y="246" class="small" text-anchor="middle">产品 / 回水 / 其他</text><text x="470" y="425" class="small" text-anchor="middle">累计使用量不是仍可取用的库存</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 5  使用先进入真实过程与暂存</text><text x="42" y="575" class="note" text-anchor="start">实际承载与有限容量成立；不设无物理空间的已用水库，具体生物过程以后细化。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="185" width="245" height="110" rx="9" class="watercard"/><text x="202.5" y="217" class="label" text-anchor="middle">原供体 / 储水</text><text x="202.5" y="246" class="small" text-anchor="middle">扣实际进入量</text><line x1="337" y1="240" x2="359" y2="240" class="flow" marker-end="url(#arrow-05-use-fates)"/><rect x="370" y="185" width="230" height="110" rx="9" class="active"/><text x="485" y="217" class="label" text-anchor="middle">使用过程控制域</text><text x="485" y="246" class="small" text-anchor="middle">当前暂存 / 已完成</text><line x1="612" y1="240" x2="634" y2="240" class="flow" marker-end="url(#arrow-05-use-fates)"/><rect x="645" y="185" width="220" height="110" rx="9" class="card"/><text x="755" y="217" class="label" text-anchor="middle">实际去向</text><text x="755" y="246" class="small" text-anchor="middle">产品 / 回水 / 其他</text><text x="470" y="425" class="small" text-anchor="middle">去向按支持过程声明，不做未授权生物模型</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 5  回水、蒸发与产品带水各有边界</text><text x="42" y="575" class="note" text-anchor="start">未知不自动返还河流，也不从全局账删除；没有模型不编造具体代谢。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="80" y="185" width="245" height="110" rx="9" class="watercard"/><text x="202.5" y="217" class="label" text-anchor="middle">原供体 / 储水</text><text x="202.5" y="246" class="small" text-anchor="middle">扣实际进入量</text><line x1="337" y1="240" x2="359" y2="240" class="flow" marker-end="url(#arrow-05-use-fates)"/><rect x="370" y="185" width="230" height="110" rx="9" class="active"/><text x="485" y="217" class="label" text-anchor="middle">使用过程控制域</text><text x="485" y="246" class="small" text-anchor="middle">当前暂存 / 已完成</text><line x1="612" y1="240" x2="634" y2="240" class="flow" marker-end="url(#arrow-05-use-fates)"/><rect x="645" y="185" width="220" height="110" rx="9" class="card"/><text x="755" y="217" class="label" text-anchor="middle">实际去向</text><text x="755" y="246" class="small" text-anchor="middle">产品 / 回水 / 其他</text><text x="470" y="425" class="small" text-anchor="middle">循环在原存量内复用，不重复给环境供水</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 5  循环用的是原水，不是重新供水</text><text x="42" y="575" class="note" text-anchor="start">实际水量与去向闭合，色类按简单规则更新；不要求污染物模型，也不把同一水全额留在产品再回</text><text x="42" y="603" class="note" text-anchor="start">用。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><rect x="90" y="185" width="270" height="110" rx="9" class="watercard"/><text x="225" y="217" class="label" text-anchor="middle">实际来水与水头</text><text x="225" y="246" class="small" text-anchor="middle">有限库存与过程</text><line x1="375" y1="240" x2="565" y2="240" class="flow" marker-end="url(#arrow-05-use-fates)"/><rect x="580" y="185" width="270" height="110" rx="9" class="card"/><text x="715" y="217" class="label" text-anchor="middle">有限设备与受体</text><text x="715" y="246" class="small" text-anchor="middle">功与水的去向相容</text><text x="470" y="425" class="small" text-anchor="middle">本图不确定科技、设备尺寸、功率或配方</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 5  水流取能与耗水分开，接第13类</text><text x="42" y="575" class="note" text-anchor="start">做功从水流机械能转移，过流水仍有下游去向；小型近似与大型反馈见专门分类。</text></g></svg>
