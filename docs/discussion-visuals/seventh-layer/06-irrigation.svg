<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-06-irrigation desc-06-irrigation" data-chapter="06-irrigation"><title id="title-06-irrigation">灌排到田与真实土水</title><desc id="desc-06-irrigation">水实际到达并进入相应地表或土层，才改变该处状态。 近河与熟地标签不等于供水：全路高程、入口和真实到达先成立，不从16米距离规则生成灌溉水。；原水经实际通路有限到田：源水、渠道、地表和土层相应转移，不另加农业墒情水。；湿土、饱和和田面水深分开：无开水面不代表无土水，有湿地名字也不自动铺满田面。；排出、储留、蒸发与地下交换相容：有真实驱动与去向；生物吸水/蒸腾留未来过程提供，不用生长倍率造通量。；水色从简，实际地貌材料另记：到田色类可用简单规则；真实淤积和清理仍有物料去向，不由颜色生成盐浓度或泥沙量。；不强迫全湿地排干或全岛铺渠：保留、改址或缩小目标有效；完整作物生理和生态响应以后另做。。第七层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-06-irrigation" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">06 / 灌排到田与真实土水</text><text x="35" y="77" class="small" text-anchor="start">第七层设计已通过 · 非比例因果示意 · 图形秒数不是水力或作业时间</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="90" y="185" width="270" height="110" rx="9" class="watercard"/><text x="225" y="217" class="label" text-anchor="middle">近处河水</text><text x="225" y="246" class="small" text-anchor="middle">真实供体</text><line x1="380" y1="240" x2="560" y2="240" class="ghost" /><line x1="460" y1="230" x2="480" y2="250" class="bad" /><line x1="460" y1="250" x2="480" y2="230" class="bad" /><rect x="580" y="185" width="270" height="110" rx="9" class="card"/><text x="715" y="217" class="label" text-anchor="middle">田区 / 土层</text><text x="715" y="246" class="small" text-anchor="middle">尚需通路与到达</text><text x="470" y="425" class="small" text-anchor="middle">靠近的距离不是入渗或供水证明</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  近河与熟地标签不等于供水</text><text x="42" y="575" class="note" text-anchor="start">全路高程、入口和真实到达先成立，不从16米距离规则生成灌溉水。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="75" y="185" width="245" height="110" rx="9" class="watercard"/><text x="197.5" y="217" class="label" text-anchor="middle">来水 / 原有土水</text><text x="197.5" y="246" class="small" text-anchor="middle">实际入口与历程</text><line x1="333" y1="240" x2="355" y2="240" class="flow" marker-end="url(#arrow-06-irrigation)"/><rect x="365" y="185" width="235" height="110" rx="9" class="active"/><text x="482.5" y="217" class="label" text-anchor="middle">当前田区与土层</text><text x="482.5" y="246" class="small" text-anchor="middle">储留 / 水位 / 水色</text><line x1="613" y1="240" x2="635" y2="240" class="flow" marker-end="url(#arrow-06-irrigation)"/><rect x="645" y="185" width="220" height="110" rx="9" class="card"/><text x="755" y="217" class="label" text-anchor="middle">实际下游受体</text><text x="755" y="246" class="small" text-anchor="middle">按条件继续交换</text><text x="470" y="425" class="small" text-anchor="middle">到田有时间和能力，不保证同时全田满流</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  原水经实际通路有限到田</text><text x="42" y="575" class="note" text-anchor="start">源水、渠道、地表和土层相应转移，不另加农业墒情水。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="80" y="185" width="245" height="110" rx="9" class="card"/><text x="202.5" y="217" class="label" text-anchor="middle">湿土状态</text><text x="202.5" y="246" class="small" text-anchor="middle">实际含水与孔隙</text><rect x="350" y="185" width="245" height="110" rx="9" class="watercard"/><text x="472.5" y="217" class="label" text-anchor="middle">饱和状态</text><text x="472.5" y="246" class="small" text-anchor="middle">真实层位和接触</text><rect x="620" y="185" width="245" height="110" rx="9" class="watercard"/><text x="742.5" y="217" class="label" text-anchor="middle">田面自由水</text><text x="742.5" y="246" class="small" text-anchor="middle">实际水面 / 水深</text><text x="470" y="425" class="small" text-anchor="middle">三类示意不是三个重复库存，也不是必经的生物阶段</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  湿土、饱和和田面水深分开</text><text x="42" y="575" class="note" text-anchor="start">无开水面不代表无土水，有湿地名字也不自动铺满田面。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="75" y="185" width="245" height="110" rx="9" class="watercard"/><text x="197.5" y="217" class="label" text-anchor="middle">来水 / 原有土水</text><text x="197.5" y="246" class="small" text-anchor="middle">实际入口与历程</text><line x1="333" y1="240" x2="355" y2="240" class="flow" marker-end="url(#arrow-06-irrigation)"/><rect x="365" y="185" width="235" height="110" rx="9" class="active"/><text x="482.5" y="217" class="label" text-anchor="middle">当前田区与土层</text><text x="482.5" y="246" class="small" text-anchor="middle">储留 / 水位 / 水色</text><line x1="613" y1="240" x2="635" y2="240" class="flow" marker-end="url(#arrow-06-irrigation)"/><rect x="645" y="185" width="220" height="110" rx="9" class="card"/><text x="755" y="217" class="label" text-anchor="middle">所支持的去向</text><text x="755" y="246" class="small" text-anchor="middle">排出 / 沉积 / 交换</text><text x="470" y="425" class="small" text-anchor="middle">不把作物生长倍率当实际吸水或蒸散</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  排出、储留、蒸发与地下交换相容</text><text x="42" y="575" class="note" text-anchor="start">有真实驱动与去向；生物吸水/蒸腾留未来过程提供，不用生长倍率造通量。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="75" y="185" width="245" height="110" rx="9" class="watercard"/><text x="197.5" y="217" class="label" text-anchor="middle">来水 / 原有土水</text><text x="197.5" y="246" class="small" text-anchor="middle">实际入口与历程</text><line x1="333" y1="240" x2="355" y2="240" class="flow" marker-end="url(#arrow-06-irrigation)"/><rect x="365" y="185" width="235" height="110" rx="9" class="active"/><text x="482.5" y="217" class="label" text-anchor="middle">当前田区与土层</text><text x="482.5" y="246" class="small" text-anchor="middle">储留 / 水位 / 水色</text><line x1="613" y1="240" x2="635" y2="240" class="flow" marker-end="url(#arrow-06-irrigation)"/><rect x="645" y="185" width="220" height="110" rx="9" class="card"/><text x="755" y="217" class="label" text-anchor="middle">所支持的去向</text><text x="755" y="246" class="small" text-anchor="middle">排出 / 沉积 / 交换</text><text x="470" y="425" class="small" text-anchor="middle">地形、水态或工程变化需失效相关旧勘察</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  水色从简，实际地貌材料另记</text><text x="42" y="575" class="note" text-anchor="start">到田色类可用简单规则；真实淤积和清理仍有物料去向，不由颜色生成盐浓度或泥沙量。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M483 352 L540 410 L599 352Z" class="water" /><line x1="483" y1="352" x2="599" y2="352" class="flow" /><text x="470" y="170" class="label" text-anchor="middle">自然条件与具体目标共同决定是否灌排</text><text x="470" y="450" class="small" text-anchor="middle">可保留低地，不由产量配额倒推水源</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  不强迫全湿地排干或全岛铺渠</text><text x="42" y="575" class="note" text-anchor="start">保留、改址或缩小目标有效；完整作物生理和生态响应以后另做。</text></g></svg>
