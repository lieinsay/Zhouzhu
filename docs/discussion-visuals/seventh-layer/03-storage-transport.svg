<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-03-storage-transport desc-03-storage-transport" data-chapter="03-storage-transport"><title id="title-03-storage-transport">容器、余水与运输</title><desc id="desc-03-storage-transport">部分装量、组成与实际承载位置跟随同一份水。 容器容量不等于里面已有水：造罐、建缸、放下或重载都不自动装满，单件与批次差异需要保留。；部分装量与水色不能无条件合叠：同一商品ID不代表相同装量和色类；本轮不要求每只器具保存实际成分清单。；转罐受容量和有限操作约束：装不下的留原器具，实际溢出才进入真实受体；不合叠清零余水。；破损、漏水与蒸发有实际去向：只在材料、接触和驱动成立时发生，不按维护配额固定扣水。；运的是同一份水和实际载荷：器具、水和其他货物一起计承载，交接不让在途和收货各记足。；长途大量用水依赖合理物流：手搬维持近距；储水、引水、运输与设施按现场选择，不强迫抱水走一公里。；容量与状态改变，不截水或补满：人工空间只记一份；变形、破损或支持的相变与原库存相容，复杂工况未支持就明确。。第七层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-03-storage-transport" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">03 / 容器、余水与运输</text><text x="35" y="77" class="small" text-anchor="start">第七层设计已通过 · 非比例因果示意 · 图形秒数不是水力或作业时间</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;0;1" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><path d="M110 195L110 365L320 365L320 195" class="edge" /><text x="215" y="395" class="small" text-anchor="middle">原器具 / 实际装量</text><path d="M620 225L620 365L800 365L800 225" class="edge" /><text x="710" y="395" class="small" text-anchor="middle">受体 / 剩余容量</text><line x1="360" y1="290" x2="580" y2="290" class="ghost" /><text x="470" y="430" class="small" text-anchor="middle">空器具不生水</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 7  容器容量不等于里面已有水</text><text x="42" y="575" class="note" text-anchor="start">造罐、建缸、放下或重载都不自动装满，单件与批次差异需要保留。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><path d="M115 254.5L115 360L315 360L315 254.5Z" class="water" /><path d="M110 195L110 365L320 365L320 195" class="edge" /><text x="215" y="395" class="small" text-anchor="middle">原器具 / 实际装量</text><path d="M625 330L625 360L795 360L795 330Z" class="water" /><path d="M620 225L620 365L800 365L800 225" class="edge" /><text x="710" y="395" class="small" text-anchor="middle">受体 / 剩余容量</text><line x1="360" y1="290" x2="580" y2="290" class="ghost" /><text x="470" y="430" class="small" text-anchor="middle">合叠条件须保留不同状态</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 7  部分装量与水色不能无条件合叠</text><text x="42" y="575" class="note" text-anchor="start">同一商品ID不代表相同装量和色类；本轮不要求每只器具保存实际成分清单。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><path d="M115 254.5L115 360L315 360L315 254.5Z" class="water" /><path d="M110 195L110 365L320 365L320 195" class="edge" /><text x="215" y="395" class="small" text-anchor="middle">原器具 / 实际装量</text><path d="M625 239L625 360L795 360L795 239Z" class="water" /><path d="M620 225L620 365L800 365L800 225" class="edge" /><text x="710" y="395" class="small" text-anchor="middle">受体 / 剩余容量</text><line x1="345" y1="270" x2="595" y2="290" class="flow" marker-end="url(#arrow-03-storage-transport)"/><text x="470" y="430" class="small" text-anchor="middle">留余水或有依据地溢出，不静默丢弃</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 7  转罐受容量和有限操作约束</text><text x="42" y="575" class="note" text-anchor="start">装不下的留原器具，实际溢出才进入真实受体；不合叠清零余水。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="90" y="185" width="270" height="110" rx="9" class="active"/><text x="225" y="217" class="label" text-anchor="middle">原器具与原水</text><text x="225" y="246" class="small" text-anchor="middle">实际材料 / 接触</text><line x1="375" y1="240" x2="565" y2="240" class="flow" marker-end="url(#arrow-03-storage-transport)"/><rect x="580" y="185" width="270" height="110" rx="9" class="watercard"/><text x="715" y="217" class="label" text-anchor="middle">明确的真实受体</text><text x="715" y="246" class="small" text-anchor="middle">脚下 / 排水 / 相态</text><text x="470" y="425" class="small" text-anchor="middle">没有相应过程与驱动，不强制按秒损耗</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 7  破损、漏水与蒸发有实际去向</text><text x="42" y="575" class="note" text-anchor="start">只在材料、接触和驱动成立时发生，不按维护配额固定扣水。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="80" y="185" width="245" height="110" rx="9" class="card"/><text x="202.5" y="217" class="label" text-anchor="middle">出发处</text><text x="202.5" y="246" class="small" text-anchor="middle">交出原装量</text><line x1="337" y1="240" x2="359" y2="240" class="event" marker-end="url(#arrow-03-storage-transport)"/><rect x="370" y="185" width="230" height="110" rx="9" class="active"/><text x="485" y="217" class="label" text-anchor="middle">实际在途载物</text><text x="485" y="246" class="small" text-anchor="middle">器具 + 水 + 货物</text><line x1="612" y1="240" x2="634" y2="240" class="event" marker-end="url(#arrow-03-storage-transport)"/><rect x="645" y="185" width="220" height="110" rx="9" class="card"/><text x="755" y="217" class="label" text-anchor="middle">目的受体</text><text x="755" y="246" class="small" text-anchor="middle">完成后再接收</text><text x="470" y="425" class="small" text-anchor="middle">移动和交接不复制水，换锚不改变库存</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 7  运的是同一份水和实际载荷</text><text x="42" y="575" class="note" text-anchor="start">器具、水和其他货物一起计承载，交接不让在途和收货各记足。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="80" y="185" width="245" height="110" rx="9" class="card"/><text x="202.5" y="217" class="label" text-anchor="middle">出发处</text><text x="202.5" y="246" class="small" text-anchor="middle">交出原装量</text><line x1="337" y1="240" x2="359" y2="240" class="event" marker-end="url(#arrow-03-storage-transport)"/><rect x="370" y="185" width="230" height="110" rx="9" class="active"/><text x="485" y="217" class="label" text-anchor="middle">实际在途载物</text><text x="485" y="246" class="small" text-anchor="middle">器具 + 水 + 货物</text><line x1="612" y1="240" x2="634" y2="240" class="event" marker-end="url(#arrow-03-storage-transport)"/><rect x="645" y="185" width="220" height="110" rx="9" class="card"/><text x="755" y="217" class="label" text-anchor="middle">目的受体</text><text x="755" y="246" class="small" text-anchor="middle">完成后再接收</text><text x="470" y="425" class="small" text-anchor="middle">依赖合宜物流减少反复长途手搬</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 7  长途大量用水依赖合理物流</text><text x="42" y="575" class="note" text-anchor="start">手搬维持近距；储水、引水、运输与设施按现场选择，不强迫抱水走一公里。</text></g><g data-step="6" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;0;1;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="75" y="185" width="245" height="110" rx="9" class="watercard"/><text x="197.5" y="217" class="label" text-anchor="middle">原水与原空间</text><text x="197.5" y="246" class="small" text-anchor="middle">唯一库存 / 原状态</text><line x1="333" y1="240" x2="355" y2="240" class="event" marker-end="url(#arrow-03-storage-transport)"/><rect x="365" y="185" width="235" height="110" rx="9" class="candidate"/><text x="482.5" y="217" class="label" text-anchor="middle">容量 / 边界变化</text><text x="482.5" y="246" class="small" text-anchor="middle">真实几何与材料</text><line x1="613" y1="240" x2="635" y2="240" class="event" marker-end="url(#arrow-03-storage-transport)"/><rect x="645" y="185" width="220" height="110" rx="9" class="active"/><text x="755" y="217" class="label" text-anchor="middle">相容新状态</text><text x="755" y="246" class="small" text-anchor="middle">有限去向 / 能力</text><text x="470" y="425" class="small" text-anchor="middle">不能容量小就删水，容量大就自动灌满</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">7 / 7  容量与状态改变，不截水或补满</text><text x="42" y="575" class="note" text-anchor="start">人工空间只记一份；变形、破损或支持的相变与原库存相容，复杂工况未支持就明确。</text></g></svg>
