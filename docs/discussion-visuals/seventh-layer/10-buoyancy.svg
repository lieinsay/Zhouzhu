<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-10-buoyancy desc-10-buoyancy" data-chapter="10-buoyancy"><title id="title-10-buoyancy">浮沉、载荷与排水</title><desc id="desc-10-buoyancy">几何、总质量、浸没与状态支持浮沉，实体占据与原水相容。 浮沉依赖实际物体与浸没状态：材料名、物品标签或碰撞不能独立保证永浮、瞬沉或承重。；货水载荷与舱内进水分口径：封闭货水、人员与货物计实际载荷；连通舱水核对环境交换与排水，不重复计同一份。；载荷改变可支持的吃水和姿态：轻重示意只表达条件差异，不给船型、稳性或承载参数。；下水与排水不能删掉原有水：实际占据、有限迁移与反力同区间接受，不先插入船再删超容水。；适用近似与反作用需说明边界：小物可有经过说明的弱反馈近似，不能越界用于堵口或大体积占水。；封闭货水与连通进水舱不能混算：内外水只有一份，质量、压力与有效排水采用相容口径；不把进水舱当干密封浮舱。。第七层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-10-buoyancy" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">10 / 浮沉、载荷与排水</text><text x="35" y="77" class="small" text-anchor="start">第七层设计已通过 · 非比例因果示意 · 图形秒数不是水力或作业时间</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="90" y="185" width="300" height="115" rx="9" class="card"/><text x="240" y="217" class="label" text-anchor="middle">实际物体</text><text x="240" y="246" class="small" text-anchor="middle">几何 / 材料 / 总质量</text><rect x="550" y="185" width="300" height="115" rx="9" class="watercard"/><text x="700" y="217" class="label" text-anchor="middle">当前水与接触</text><text x="700" y="246" class="small" text-anchor="middle">浸没 / 支撑 / 能力</text><text x="470" y="425" class="small" text-anchor="middle">不是给所有物品统一一个漂浮标签</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  浮沉依赖实际物体与浸没状态</text><text x="42" y="575" class="note" text-anchor="start">材料名、物品标签或碰撞不能独立保证永浮、瞬沉或承重。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M80 425L370 425L450 365L650 365L750 425L860 425L860 475L80 475Z" class="rock" /><path d="M80 285L860 285L860 425L750 425L650 365L450 365L370 425L80 425Z" class="water" /><line x1="80" y1="285" x2="860" y2="285" class="flow" /><path d="M370 257L610 257L580 312L405 312Z" class="strata" /><path d="M370 257L610 257L580 312L405 312Z" class="edge" /><text x="690" y="455" class="small" text-anchor="start">实际床面 / 浅滩</text><text x="470" y="155" class="small" text-anchor="middle">封闭货水与货物计实际载荷；连通进水另核对</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  货水载荷与舱内进水分口径</text><text x="42" y="575" class="note" text-anchor="start">封闭货水、人员与货物计实际载荷；连通舱水核对环境交换与排水，不重复计同一份。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M80 425L370 425L450 365L650 365L750 425L860 425L860 475L80 475Z" class="rock" /><path d="M80 285L860 285L860 425L750 425L650 365L450 365L370 425L80 425Z" class="water" /><line x1="80" y1="285" x2="860" y2="285" class="flow" /><path d="M370 278L610 278L580 333L405 333Z" class="strata" /><path d="M370 278L610 278L580 333L405 333Z" class="edge" /><rect x="435" y="243" width="85" height="34" rx="9" class="card"/><text x="690" y="455" class="small" text-anchor="start">实际床面 / 浅滩</text><text x="470" y="155" class="small" text-anchor="middle">载荷较大的一种示意状态，不提供数值结论</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  载荷改变可支持的吃水和姿态</text><text x="42" y="575" class="note" text-anchor="start">轻重示意只表达条件差异，不给船型、稳性或承载参数。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="80" y="185" width="270" height="115" rx="9" class="active"/><text x="215" y="217" class="label" text-anchor="middle">实体与原水空间</text><text x="215" y="246" class="small" text-anchor="middle">原库存仍有位置</text><line x1="365" y1="242" x2="575" y2="242" class="event" marker-end="url(#arrow-10-buoyancy)"/><rect x="590" y="185" width="270" height="115" rx="9" class="active"/><text x="725" y="217" class="label" text-anchor="middle">相容接受与反作用</text><text x="725" y="246" class="small" text-anchor="middle">有限过程 / 适用误差</text><text x="470" y="425" class="small" text-anchor="middle">不创建无空间的待处理水库，不删除被排挤的水</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  下水与排水不能删掉原有水</text><text x="42" y="575" class="note" text-anchor="start">实际占据、有限迁移与反力同区间接受，不先插入船再删超容水。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="80" y="185" width="270" height="115" rx="9" class="active"/><text x="215" y="217" class="label" text-anchor="middle">实体与原水空间</text><text x="215" y="246" class="small" text-anchor="middle">原库存仍有位置</text><line x1="365" y1="242" x2="575" y2="242" class="event" marker-end="url(#arrow-10-buoyancy)"/><rect x="590" y="185" width="270" height="115" rx="9" class="active"/><text x="725" y="217" class="label" text-anchor="middle">相容接受与反作用</text><text x="725" y="246" class="small" text-anchor="middle">有限过程 / 适用误差</text><text x="470" y="425" class="small" text-anchor="middle">无需全尺度精算，也不能无限从冻结水面取功</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  适用近似与反作用需说明边界</text><text x="42" y="575" class="note" text-anchor="start">小物可有经过说明的弱反馈近似，不能越界用于堵口或大体积占水。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="90" y="160" width="330" height="110" rx="9" class="active"/><text x="255" y="192" class="label" text-anchor="middle">封闭货器 / 储水舱</text><text x="255" y="221" class="small" text-anchor="middle">已转移的货水与实际载荷</text><rect x="520" y="160" width="330" height="110" rx="9" class="watercard"/><text x="685" y="192" class="label" text-anchor="middle">与环境连通的舱域</text><text x="685" y="221" class="small" text-anchor="middle">连通 / 进出 / 压力 / 占据</text><rect x="155" y="355" width="630" height="90" rx="9" class="active"/><text x="470" y="387" class="label" text-anchor="middle">同一进水影响不在两套模型里重复计入</text><text x="470" y="416" class="small" text-anchor="middle">封口、堵漏、排水按真实过程和唯一水账</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  封闭货水与连通进水舱不能混算</text><text x="42" y="575" class="note" text-anchor="start">内外水只有一份，质量、压力与有效排水采用相容口径；不把进水舱当干密封浮舱。</text></g></svg>
