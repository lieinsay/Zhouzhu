<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-08-wading desc-08-wading" data-chapter="08-wading"><title id="title-08-wading">涉水与实际支撑</title><desc id="desc-08-wading">身体处液水、足下支撑和相对流况分别判断。 脚下水深不取河心最大深：身体、地面、液水和覆盖同版查询，不能按最近源段摘要切运动状态。；薄水涉行与深水失去支撑有区别：身体尺寸、浸没与能力以后标定，避免刚碰到水就切成全身游泳。；浅急、深缓和回水不能只看水深：流速方向来自受支持局部水态，不用Q或泡沫滚动直接当推力。；桥上有支撑不判为水中游泳：实际桥面、梯子与岸阶决定接触，不能把桥下河深套给桥上身体。；玩家与NPC能力可异，环境事实相同：干路、涉水点、桥船或等待按可达条件选择，不为路线强迫跳未知深水。；移动甲板按真实支撑和相对运动续接：身体随实际接触承载，不按船下河深判游泳；换锚或切控制权不重复搬运、不消掉载荷。。第七层设计已通过；非比例因果示意，不是游戏、生成或物理模拟结果。</desc><defs><marker id="arrow-08-wading" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.caption{font-size:20px;font-weight:700}.note{font-size:18px}.card{fill:#e9eee7;stroke:#83988e;stroke-width:1.6}.active{fill:#d7e8dd;stroke:#315f56;stroke-width:3}.candidate{fill:#eee7f4;stroke:#8067a2;stroke-width:2;stroke-dasharray:8 5}.watercard{fill:#b9dee6;stroke:#267f9d;stroke-width:2}.rock{fill:#b4a183;stroke:#7d6d52;stroke-width:2}.strata{fill:#dccdaf;stroke:#a38b65;stroke-width:2}.core{fill:#826ab4;stroke:#54417e;stroke-width:2}.water{fill:#78bfd1;fill-opacity:.82}.flow{fill:none;stroke:#267f9d;stroke-width:3}.edge{fill:none;stroke:#6c604e;stroke-width:3}.ref{fill:none;stroke:#78609f;stroke-width:2;stroke-dasharray:7 5}.ghost{fill:none;stroke:#9b9387;stroke-width:2;stroke-dasharray:7 5}.layer{fill:none;stroke:#826f54;stroke-width:3}.event{fill:none;stroke:#ae6545;stroke-width:3}.bad{stroke:#b64d43;stroke-width:4}.patch{fill:none;stroke:#65896e;stroke-width:2;stroke-dasharray:8 5}.route{fill:none;stroke:#90796b;stroke-width:18}.widewater{fill:none;stroke:#78bfd1;stroke-width:24;stroke-linecap:round}.fall{fill:none;stroke:#78bfd1;stroke-width:12}.person{fill:#394c45;stroke:#394c45;stroke-width:4;stroke-linecap:round}.dot{fill:#315f56;stroke:#e9eee7;stroke-width:2}</style><rect width="940" height="650" fill="#f7f5ee"/><text x="35" y="44" class="title" text-anchor="start">08 / 涉水与实际支撑</text><text x="35" y="77" class="small" text-anchor="start">第七层设计已通过 · 非比例因果示意 · 图形秒数不是水力或作业时间</text><g data-step="0" opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="650" cy="255" r="8" class="person"/><line x1="650" y1="264" x2="650" y2="287" class="person" /><line x1="650" y1="270" x2="636" y2="280" class="person" /><line x1="650" y1="270" x2="663" y2="278" class="person" /><line x1="650" y1="287" x2="640" y2="307" class="person" /><line x1="650" y1="287" x2="660" y2="307" class="person" /><text x="470" y="150" class="small" text-anchor="middle">身体接触位置，和河心摘要分开</text><text x="470" y="460" class="small" text-anchor="middle">图中人体与水线非比例，不提供切换深度参数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">1 / 6  脚下水深不取河心最大深</text><text x="42" y="575" class="note" text-anchor="start">身体、地面、液水和覆盖同版查询，不能按最近源段摘要切运动状态。</text></g><g data-step="1" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="650" cy="255" r="8" class="person"/><line x1="650" y1="264" x2="650" y2="287" class="person" /><line x1="650" y1="270" x2="636" y2="280" class="person" /><line x1="650" y1="270" x2="663" y2="278" class="person" /><line x1="650" y1="287" x2="640" y2="307" class="person" /><line x1="650" y1="287" x2="660" y2="307" class="person" /><text x="470" y="150" class="small" text-anchor="middle">实际支撑 + 局部液水 + 身体浸没</text><text x="470" y="460" class="small" text-anchor="middle">图中人体与水线非比例，不提供切换深度参数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">2 / 6  薄水涉行与深水失去支撑有区别</text><text x="42" y="575" class="note" text-anchor="start">身体尺寸、浸没与能力以后标定，避免刚碰到水就切成全身游泳。</text></g><g data-step="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="650" cy="255" r="8" class="person"/><line x1="650" y1="264" x2="650" y2="287" class="person" /><line x1="650" y1="270" x2="636" y2="280" class="person" /><line x1="650" y1="270" x2="663" y2="278" class="person" /><line x1="650" y1="287" x2="640" y2="307" class="person" /><line x1="650" y1="287" x2="660" y2="307" class="person" /><line x1="385" y1="355" x2="475" y2="355" class="flow" marker-end="url(#arrow-08-wading)"/><text x="265" y="390" class="small" text-anchor="start">相对水流</text><text x="470" y="150" class="small" text-anchor="middle">相对水流，不能从视觉波纹反推</text><text x="470" y="460" class="small" text-anchor="middle">图中人体与水线非比例，不提供切换深度参数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">3 / 6  浅急、深缓和回水不能只看水深</text><text x="42" y="575" class="note" text-anchor="start">流速方向来自受支持局部水态，不用Q或泡沫滚动直接当推力。</text></g><g data-step="3" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><line x1="220" y1="245" x2="740" y2="245" class="layer" /><circle cx="505" cy="193" r="8" class="person"/><line x1="505" y1="202" x2="505" y2="225" class="person" /><line x1="505" y1="208" x2="491" y2="218" class="person" /><line x1="505" y1="208" x2="518" y2="216" class="person" /><line x1="505" y1="225" x2="495" y2="245" class="person" /><line x1="505" y1="225" x2="515" y2="245" class="person" /><text x="230" y="210" class="small" text-anchor="start">脚在实际支撑面上</text><text x="470" y="150" class="small" text-anchor="middle">身体站在桥面，液水仍在下方</text><text x="470" y="460" class="small" text-anchor="middle">桥面仅表示已存在的真实支撑</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">4 / 6  桥上有支撑不判为水中游泳</text><text x="42" y="575" class="note" text-anchor="start">实际桥面、梯子与岸阶决定接触，不能把桥下河深套给桥上身体。</text></g><g data-step="4" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245 L855 475 L90 475Z" class="rock" /><path d="M90 245 L220 245 L300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L740 245 L855 245" class="edge" /><line x1="90" y1="245" x2="855" y2="245" class="ref" /><path d="M300 295 L385 320 L465 334 L540 410 L605 345 L670 290 L677 285 L284 285Z" class="water" /><line x1="284" y1="285" x2="677" y2="285" class="flow" /><circle cx="650" cy="255" r="8" class="person"/><line x1="650" y1="264" x2="650" y2="287" class="person" /><line x1="650" y1="270" x2="636" y2="280" class="person" /><line x1="650" y1="270" x2="663" y2="278" class="person" /><line x1="650" y1="287" x2="640" y2="307" class="person" /><line x1="650" y1="287" x2="660" y2="307" class="person" /><text x="470" y="150" class="small" text-anchor="middle">能力与路线可不同，环境状态保持唯一</text><text x="470" y="460" class="small" text-anchor="middle">图中人体与水线非比例，不提供切换深度参数</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">5 / 6  玩家与NPC能力可异，环境事实相同</text><text x="42" y="575" class="note" text-anchor="start">干路、涉水点、桥船或等待按可达条件选择，不为路线强迫跳未知深水。</text></g><g data-step="5" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M80 300L860 300L860 475L80 475Z" class="water" /><line x1="80" y1="300" x2="860" y2="300" class="flow" /><path d="M280 260L620 260L585 335L315 335Z" class="strata" /><path d="M280 260L620 260L585 335L315 335Z" class="edge" /><line x1="280" y1="260" x2="620" y2="260" class="layer" /><circle cx="450" cy="208" r="8" class="person"/><line x1="450" y1="217" x2="450" y2="240" class="person" /><line x1="450" y1="223" x2="436" y2="233" class="person" /><line x1="450" y1="223" x2="463" y2="231" class="person" /><line x1="450" y1="240" x2="440" y2="260" class="person" /><line x1="450" y1="240" x2="460" y2="260" class="person" /><line x1="670" y1="250" x2="810" y2="250" class="event" marker-end="url(#arrow-08-wading)"/><text x="670" y="215" class="small" text-anchor="start">载体相对世界</text><line x1="345" y1="380" x2="455" y2="380" class="flow" marker-end="url(#arrow-08-wading)"/><text x="490" y="385" class="small" text-anchor="start">液水相对运动另核对</text><text x="470" y="150" class="small" text-anchor="middle">当前甲板是支撑面，水仍在下方</text><text x="470" y="450" class="small" text-anchor="middle">身体相对载体、载体相对世界与相对水流分开</text><rect x="25" y="507" width="890" height="122" rx="12" fill="#e8ede4"/><text x="42" y="541" class="caption" text-anchor="start">6 / 6  移动甲板按真实支撑和相对运动续接</text><text x="42" y="575" class="note" text-anchor="start">身体随实际接触承载，不按船下河深判游泳；换锚或切控制权不重复搬运、不消掉载荷。</text></g></svg>
