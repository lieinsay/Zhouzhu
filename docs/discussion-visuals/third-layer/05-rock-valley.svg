<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-05-rock-valley desc-05-rock-valley"><title id="title-05-rock-valley">基岩、覆盖与谷地约束</title><desc id="desc-05-rock-valley">岩性/裂隙、工具与覆盖共同限制床蚀和侧蚀。。基岩河从实际岩层与裂隙条件开始：强度和暴露决定哪里可移除；核心强弱、岛龄不直接乘出峡谷。。移动颗粒可成为磨蚀工具：工具不足时某些磨蚀受限，不能清水无沙自动切到最深。。来沙也能覆盖保护岩床，或抬高床面：工具作用与覆盖作用并存，所以供沙更多不必导致更深。。受限谷地不能继续扩宽，不代表必然下切：还可能加速、回水或越岸；由床岸能力、储量及上下游控制决定。</desc><defs><marker id="arrow-05-rock-valley" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">05 / 基岩、覆盖与谷地约束</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 210 L330 210 L375 312 L460 395 L530 312 L575 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M356.47058823529414 270 L548.5294117647059 270 L548.5294117647059 270 L530 312 L460 395 L375 312 L356.47058823529414 270Z" class="water" /><line x1="356.47058823529414" y1="270" x2="548.5294117647059" y2="270" class="waterline"/><line x1="360" y1="245" x2="559" y2="245" class="layerline"/><line x1="379" y1="322" x2="541" y2="322" class="layerline"/><path d="M460 347 L489 390" class="fault" /><text x="93" y="165" class="label">有来源的岩层 / 裂隙，非随机槽深</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  基岩河从实际岩层与裂隙条件开始</text><text x="43" y="575" class="label">强度和暴露决定哪里可移除；核心强弱、岛龄不直接乘出峡谷。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M300 270 L611.6666666666666 270 L611.6666666666666 270 L590 300 L500 355 L390 332 L310 280 L300 270Z" class="water" /><line x1="300" y1="270" x2="611.6666666666666" y2="270" class="waterline"/><g><circle cx="371" cy="316" r="5" class="magma"/><circle cx="398" cy="325" r="5" class="magma"/><circle cx="425" cy="316" r="5" class="magma"/><circle cx="452" cy="325" r="5" class="magma"/><circle cx="479" cy="316" r="5" class="magma"/><circle cx="506" cy="325" r="5" class="magma"/><circle cx="533" cy="316" r="5" class="magma"/><animateTransform attributeName="transform" type="translate" values="0 0;55 13;0 0" dur="4s" repeatCount="indefinite"/></g><text x="92" y="163" class="label">粒级与实际接触条件参与岩床作用</text><text x="97" y="444" class="label">不把工具机制套所有侵蚀方式或所有河型</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 4  移动颗粒可成为磨蚀工具</text><text x="43" y="575" class="label">工具不足时某些磨蚀受限，不能清水无沙自动切到最深。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M300 270 L611.6666666666666 270 L611.6666666666666 270 L590 300 L500 355 L390 332 L310 280 L300 270Z" class="water" /><line x1="300" y1="270" x2="611.6666666666666" y2="270" class="waterline"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 242 L655 242 L590 332 L500 387 L390 364 L310 312 L240 242 L80 242Z" class="strata" /><circle cx="375" cy="327" r="5" class="magma"/><circle cx="402" cy="336" r="5" class="magma"/><circle cx="429" cy="327" r="5" class="magma"/><circle cx="456" cy="336" r="5" class="magma"/><circle cx="483" cy="327" r="5" class="magma"/><circle cx="510" cy="336" r="5" class="magma"/><circle cx="537" cy="327" r="5" class="magma"/><text x="95" y="162" class="label">薄/厚覆盖各有真实库存与输运</text><text x="94" y="443" class="label">多余材料沉积或离开，不凭空消失</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 4  来沙也能覆盖保护岩床，或抬高床面</text><text x="43" y="575" class="label">工具作用与覆盖作用并存，所以供沙更多不必导致更深。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 210 L330 210 L375 312 L460 395 L530 312 L575 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M344.11764705882354 242 L560.8823529411765 242 L560.8823529411765 242 L530 312 L460 395 L375 312 L344.11764705882354 242Z" class="water" /><line x1="344.11764705882354" y1="242" x2="560.8823529411765" y2="242" class="waterline"/><path d="M330 179 L575 179" class="reference" marker-start="url(#arrow-05-rock-valley)" marker-end="url(#arrow-05-rock-valley)"/><text x="93" y="148" class="label">实际岩壁限制侧向范围</text><text x="88" y="438" class="label">水力与材料若不支持深切，就不能强挖目标河深</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  受限谷地不能继续扩宽，不代表必然下切</text><text x="43" y="575" class="label">还可能加速、回水或越岸；由床岸能力、储量及上下游控制决定。</text></g><text x="36" y="637" class="small">非比例过程示意 · 像素不是米 · 非实际47米河段 / 水动力结果</text></svg>