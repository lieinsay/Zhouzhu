<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-06-along-channel desc-06-along-channel"><title id="title-06-along-channel">沿程：深槽、浅滩与阶坎</title><desc id="desc-06-along-channel">沿程床面允许局部逆坡，当前水位决定是否连通。。床面可有潭底逆坡，水面不沿床逐点复制：局部纵断面；真实岩槛、分选与冲淤造成床形，不强制最低全段坡降。。收窄、障碍和输沙可形成不同冲淤部位：潭滩依相应河型维持或调整，不保证每隔固定倍数河宽一个潭。。陡坡粗块或基岩可形成阶坎与下游池：必须有实际障碍、连接和侵蚀条件；不是所有山溪都加瀑布。。低水位露出床脊，深潭可变成孤立水潭：连流 / 连通近静水 / 孤立池 / 干槽承接第二层，床形不因标签清零。</desc><defs><marker id="arrow-06-along-channel" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">06 / 沿程：深槽、浅滩与阶坎</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 260 L190 275 L280 350 L350 335 L405 280 L500 315 L590 378 L670 315 L730 322 L860 344 L860 465 L80 465Z" class="rock" /><path d="M80 230 L190 238.8 L280 246 L350 251.6 L405 256 L500 263.6 L590 270.8 L670 277.2 L730 282 L860 292.4 L860 344 L730 322 L670 315 L590 378 L500 315 L405 280 L350 335 L280 350 L190 275 L80 260Z" class="water" /><path d="M80 230 L190 238.8 L280 246 L350 251.6 L405 256 L500 263.6 L590 270.8 L670 277.2 L730 282 L860 292.4" class="waterline" /><text x="95" y="163" class="label">纵断面：下游 →，像素不对应米</text><text x="223" y="422" class="label">潭</text><text x="369" y="314" class="label">床脊 / 滩</text><text x="564" y="438" class="label">潭</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  床面可有潭底逆坡，水面不沿床逐点复制</text><text x="43" y="575" class="label">局部纵断面；真实岩槛、分选与冲淤造成床形，不强制最低全段坡降。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 260 L190 275 L280 350 L350 335 L405 280 L500 315 L590 378 L670 315 L730 322 L860 344 L860 465 L80 465Z" class="rock" /><path d="M80 230 L190 238.8 L280 246 L350 251.6 L405 256 L500 263.6 L590 270.8 L670 277.2 L730 282 L860 292.4 L860 344 L730 322 L670 315 L590 378 L500 315 L405 280 L350 335 L280 350 L190 275 L80 260Z" class="water" /><path d="M80 230 L190 238.8 L280 246 L350 251.6 L405 256 L500 263.6 L590 270.8 L670 277.2 L730 282 L860 292.4" class="waterline" /><path d="M232 260 Q270 299 315 316" class="flow" marker-end="url(#arrow-06-along-channel)"/><path d="M462 280 Q510 298 552 322" class="flow" marker-end="url(#arrow-06-along-channel)"/><circle cx="373" cy="282" r="5" class="magma"/><circle cx="400" cy="291" r="5" class="magma"/><circle cx="427" cy="282" r="5" class="magma"/><text x="93" y="164" class="label">汇聚 / 分散与分级供沙共同作用</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 4  收窄、障碍和输沙可形成不同冲淤部位</text><text x="43" y="575" class="label">潭滩依相应河型维持或调整，不保证每隔固定倍数河宽一个潭。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 220 L280 220 L280 285 L405 285 L450 359 L510 344 L510 323 L860 355 L860 465 L80 465Z" class="rock" /><path d="M446 316 L510 316 L530 322 L530 324.8 L510 323 L510 344 L450 359 L446 352.4Z" class="water" /><path d="M85 210 L283 210 L283 277 L405 277 L446 316 L510 316 L530 322 L860 345" class="flow" /><circle cx="386" cy="274" r="19" class="rock"/><text x="96" y="171" class="label">实际阶坎，而不是床面平滑后的特效</text><text x="90" y="438" class="label">临空跌水仍受真实出口控制，不把整河拉到海面</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 4  陡坡粗块或基岩可形成阶坎与下游池</text><text x="43" y="575" class="label">必须有实际障碍、连接和侵蚀条件；不是所有山溪都加瀑布。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 260 L190 275 L280 350 L350 335 L405 280 L500 315 L590 378 L670 315 L730 322 L860 344 L860 465 L80 465Z" class="rock" /><path d="M257.2 331 L354 331 L354 331 L350 335 L280 350 L257.2 331Z" class="water" /><line x1="257.2" y1="331" x2="354" y2="331" class="waterline"/><path d="M522.8571428571429 331 L649.6825396825396 331 L649.6825396825396 331 L590 378 L522.8571428571429 331Z" class="water" /><line x1="522.8571428571429" y1="331" x2="649.6825396825396" y2="331" class="waterline"/><path d="M783.1818181818181 331 L860 331 L860 344 L783.1818181818181 331Z" class="water" /><line x1="783.1818181818181" y1="331" x2="860" y2="331" class="waterline"/><text x="96" y="165" class="label">有水和有连续输水是两个判断</text><text x="98" y="442" class="label">水量与水位按真实库存演变，不重新随机挖坑</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  低水位露出床脊，深潭可变成孤立水潭</text><text x="43" y="575" class="label">连流 / 连通近静水 / 孤立池 / 干槽承接第二层，床形不因标签清零。</text></g><text x="36" y="637" class="small">非比例过程示意 · 像素不是米 · 非实际47米河段 / 水动力结果</text></svg>