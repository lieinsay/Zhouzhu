<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-10-layer-coupling desc-10-layer-coupling"><title id="title-10-layer-coupling">承接一二层：位移、水沙与时间</title><desc id="desc-10-layer-coupling">2026-10-14承接已确认的一二层；有限岩层更新不直接等于供沙或挖槽。。整岛移动、层界慢变与冲淤分别记账：整岛浮高不自动改变相对坡降；岩层更新扣深部库存，床岸冲淤移除或加入实际材料，三者不重复计算。。新原岩不是即时供沙，材料先有可动过程：有限挤出岩层留在真实层序，风化、崩落或适用直接床岩侵蚀才释放材料；供沙可磨蚀或形成覆盖。。改道或地下接触变化，水沙历程重新相容：第一层更新层序和地形，第二层求新的真实来水与连接；不能拿旧Q曲线在任意新槽持续侵蚀。。新层界与相对渗流进入岸体孔压过程：岸体渗流为M/G细化，河水位只是部分边界；岩层承压不是孔压，含水岩层也不是刚性携水包。。抬床会挤水改流，不只替换容量表：水需真实空间与有限去向；水反力制约不相容形变，断连时保存局地库存，不能复制或截零。。慢骨架与洪水冲淤有不同时间尺度：一亿年级是背景保存设计域，不能乘给河床过程。开局只推进真实时长，事件可快但不强制每日变槽。</desc><defs><marker id="arrow-10-layer-coupling" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">10 / 承接一二层：位移、水沙与时间</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="65" y="209" width="235" height="189" rx="12" class="strata"/><text x="79" y="242" class="label">整岛 / 坐标与姿态</text><rect x="350" y="209" width="245" height="189" rx="12" class="strata"/><text x="364" y="242" class="label">层界 / 岩层与体积</text><rect x="645" y="209" width="235" height="189" rx="12" class="strata"/><text x="659" y="242" class="label">床岸 / 实际冲淤</text><text x="108" y="460" class="label">同一三维源几何；高程差不能直接当全部河沙</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 6  整岛移动、层界慢变与冲淤分别记账</text><text x="43" y="575" class="label">整岛浮高不自动改变相对坡降；岩层更新扣深部库存，床岸冲淤移除或加入实际材料，三者不重复</text><text x="43" y="602" class="label">计算。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="65" y="209" width="235" height="189" rx="12" class="strata"/><text x="79" y="242" class="label">深源 / 原岩层库存</text><rect x="350" y="209" width="245" height="189" rx="12" class="strata"/><text x="364" y="242" class="label">释放 / 粒级与强度</text><rect x="645" y="209" width="235" height="189" rx="12" class="strata"/><text x="659" y="242" class="label">输运 / 工具或覆盖</text><path d="M304 310 L343 310" class="flow" marker-end="url(#arrow-10-layer-coupling)"/><path d="M600 310 L638 310" class="flow" marker-end="url(#arrow-10-layer-coupling)"/><text x="108" y="460" class="label">不把全部更新质量乘比例送给河流，不保证河更深</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 6  新原岩不是即时供沙，材料先有可动过程</text><text x="43" y="575" class="label">有限挤出岩层留在真实层序，风化、崩落或适用直接床岩侵蚀才释放材料；供沙可磨蚀或形成覆盖</text><text x="43" y="602" class="label">。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="65" y="209" width="235" height="189" rx="12" class="strata"/><text x="79" y="242" class="label">第一层 / 真实慢变</text><rect x="350" y="209" width="245" height="189" rx="12" class="strata"/><text x="364" y="242" class="label">第二层 / 水情与路径</text><rect x="645" y="209" width="235" height="189" rx="12" class="strata"/><text x="659" y="242" class="label">第三层 / 床岸响应</text><path d="M304 310 L343 310" class="flow" marker-end="url(#arrow-10-layer-coupling)"/><path d="M600 310 L638 310" class="flow" marker-end="url(#arrow-10-layer-coupling)"/><text x="106" y="460" class="label">原槽残水保留；来源、统计与bankfull注明版本</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 6  改道或地下接触变化，水沙历程重新相容</text><text x="43" y="575" class="label">第一层更新层序和地形，第二层求新的真实来水与连接；不能拿旧Q曲线在任意新槽持续侵蚀。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M326.9230769230769 291 L596.5 291 L596.5 291 L590 300 L500 355 L390 332 L326.9230769230769 291Z" class="water" /><line x1="326.9230769230769" y1="291" x2="596.5" y2="291" class="waterline"/><path d="M160 224 L240 224 L310 294 L315 297.25 L315 347.25 L310 344 L240 274 L160 274Z" class="sat" /><text x="95" y="155" class="label">更新的材料、接触和岸内实际水态共同决定</text><text x="107" y="460" class="label">岸脚作用与力学失稳分别求，不按退水标签自动崩岸</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 6  新层界与相对渗流进入岸体孔压过程</text><text x="43" y="575" class="label">岸体渗流为M/G细化，河水位只是部分边界；岩层承压不是孔压，含水岩层也不是刚性携水包。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="65" y="209" width="235" height="189" rx="12" class="strata"/><text x="79" y="242" class="label">候选床岸 / 移动边界</text><rect x="350" y="209" width="245" height="189" rx="12" class="strata"/><text x="364" y="242" class="label">原水 / 实际迁移</text><rect x="645" y="209" width="235" height="189" rx="12" class="strata"/><text x="659" y="242" class="label">压力与反力 / 同段求解</text><path d="M304 310 L343 310" class="flow" marker-end="url(#arrow-10-layer-coupling)"/><path d="M600 310 L638 310" class="flow" marker-end="url(#arrow-10-layer-coupling)"/><path d="M758 410 L758 454 L184 454 L184 411" class="flow" marker-end="url(#arrow-10-layer-coupling)"/><text x="106" y="155" class="label">临界、急变或强局部过程不由普通平均断面假装解决</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 6  抬床会挤水改流，不只替换容量表</text><text x="43" y="575" class="label">水需真实空间与有限去向；水反力制约不相容形变，断连时保存局地库存，不能复制或截零。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="65" y="209" width="235" height="189" rx="12" class="strata"/><text x="79" y="242" class="label">背景 / 骨架与层序</text><rect x="350" y="209" width="245" height="189" rx="12" class="strata"/><text x="364" y="242" class="label">事件 / 可动床岸</text><rect x="645" y="209" width="235" height="189" rx="12" class="strata"/><text x="659" y="242" class="label">水情 / 同时段响应</text><text x="107" y="460" class="label">仍验收真实断面与人物尺度；47米和4米不是生成配额</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">6 / 6  慢骨架与洪水冲淤有不同时间尺度</text><text x="43" y="575" class="label">一亿年级是背景保存设计域，不能乘给河床过程。开局只推进真实时长，事件可快但不强制每日变</text><text x="43" y="602" class="label">槽。</text></g><text x="36" y="637" class="small">非比例过程示意 · 像素不是米 · 非实际47米河段 / 水动力结果</text></svg>