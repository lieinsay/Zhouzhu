<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-09-outputs-review desc-09-outputs-review"><title id="title-09-outputs-review">同源输出与原始浅河问题验收</title><desc id="desc-09-outputs-review">先检生成器和物理口径，后检游戏还原与正常视角。。水力面积与可见断面必须来自同一几何：不能用矩形容量计算，却在游戏重建另一条曲线后声称宽深一致。。河槽细化嵌入第一层权威地形，不叠加第二轮侵蚀：水沙、床岸和几何更新守恒，第二层原水和盐库存按新连接重映射。。47米与4米参照先核对位置、日期与口径：固定槽跨度、当天湿宽、最大深、平均深和人物位置分别核对，不能据一个数字判合理。。按适用域和独立证据检验，不倒推参数：材料、供沙、床岸、水力、时间与分辨率收敛后验收，不保证宽河必深也不放弃浅河诊断。。水情和床形同段耦合，外部输入只计一次：床变影响库容或连接时在新几何重算；中间迭代不额外加雨、不重复产沙或推进时间。。地质历史与开局后时间分开：成熟地貌来自漫长历史；开局后只结算实际推进的过程时长，缓慢变化累计，洪水事件按条件发生。。岛内沉积与保土，不会凭空造土：侵蚀物可在岛内储留；真正越过岛缘才净损失。植被、护岸与滞沙改变实际过程，容量有限，具体玩家措施留后层细化。</desc><defs><marker id="arrow-09-outputs-review" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">09 / 同源输出与原始浅河问题验收</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;0;1" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><g transform="translate(-5 105) scale(0.54)"><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M300 270 L611.6666666666666 270 L611.6666666666666 270 L590 300 L500 355 L390 332 L310 280 L300 270Z" class="water" /><line x1="300" y1="270" x2="611.6666666666666" y2="270" class="waterline"/></g><g transform="translate(460 105) scale(0.54)"><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M300 270 L611.6666666666666 270 L611.6666666666666 270 L590 300 L500 355 L390 332 L310 280 L300 270Z" class="water" /><line x1="300" y1="270" x2="611.6666666666666" y2="270" class="waterline"/></g><text x="98" y="169" class="label">水力读取</text><text x="611" y="169" class="label">还原读取</text><text x="115" y="439" class="label">同一源断面，不是两种模型分别补形状</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 7  水力面积与可见断面必须来自同一几何</text><text x="43" y="575" class="label">不能用矩形容量计算，却在游戏重建另一条曲线后声称宽深一致。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="65" y="203" width="250" height="214" rx="12" class="strata"/><text x="79" y="236" class="label">第一层源地形 / 材料</text><rect x="350" y="203" width="245" height="214" rx="12" class="strata"/><text x="364" y="236" class="label">局部槽岸过程</text><rect x="635" y="203" width="240" height="214" rx="12" class="strata"/><text x="649" y="236" class="label">第二层水态 / 储量</text><path d="M319 310 L342 310" class="flow" marker-end="url(#arrow-09-outputs-review)"/><path d="M599 310 L627 310" class="flow" marker-end="url(#arrow-09-outputs-review)"/><text x="94" y="460" class="label">各层共享来源与预算，不各自重新产水 / 产沙 / 挖槽</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 7  河槽细化嵌入第一层权威地形，不叠加第二轮侵蚀</text><text x="43" y="575" class="label">水沙、床岸和几何更新守恒，第二层原水和盐库存按新连接重映射。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="70" y="210" width="370" height="210" rx="12" class="strata"/><text x="84" y="243" class="label">同版河段 / 真实日期 / 实际断面</text><rect x="510" y="210" width="365" height="210" rx="12" class="strata"/><text x="524" y="243" class="label">深槽 / 露岸 / 湿宽 / 人物坐标</text><text x="94" y="464" class="label">本图无米制比例；视觉问题仍需后层真实现场验收</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 7  47米与4米参照先核对位置、日期与口径</text><text x="43" y="575" class="label">固定槽跨度、当天湿宽、最大深、平均深和人物位置分别核对，不能据一个数字判合理。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="70" y="190" width="370" height="115" rx="12" class="strata"/><text x="84" y="223" class="label">独立参数与过程检查</text><rect x="510" y="190" width="365" height="115" rx="12" class="strata"/><text x="524" y="223" class="label">同源几何与当前水态</text><rect x="130" y="356" width="680" height="86" rx="12" class="strata"/><text x="144" y="389" class="label">真实失败或未解析保留；不加水源与统一宽深倍率</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 7  按适用域和独立证据检验，不倒推参数</text><text x="43" y="575" class="label">材料、供沙、床岸、水力、时间与分辨率收敛后验收，不保证宽河必深也不放弃浅河诊断。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="65" y="212" width="240" height="187" rx="12" class="strata"/><text x="79" y="245" class="label">当前水情 / 水沙</text><rect x="350" y="212" width="245" height="187" rx="12" class="strata"/><text x="364" y="245" class="label">新床岸 / 库容</text><rect x="640" y="212" width="235" height="187" rx="12" class="strata"/><text x="654" y="245" class="label">同时间段重算</text><path d="M309 310 L343 310" class="flow" marker-end="url(#arrow-09-outputs-review)"/><path d="M599 310 L632 310" class="flow" marker-end="url(#arrow-09-outputs-review)"/><path d="M757 207 L757 181 L185 181 L185 205" class="flow" marker-end="url(#arrow-09-outputs-review)"/><text x="125" y="141" class="label">同一时段的外部来水与材料：只记一份</text><text x="96" y="469" class="label">急剧改变用事件子步；加速不能跳过切口与岸体变化</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 7  水情和床形同段耦合，外部输入只计一次</text><text x="43" y="575" class="label">床变影响库容或连接时在新几何重算；中间迭代不额外加雨、不重复产沙或推进时间。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="65" y="210" width="250" height="190" rx="12" class="strata"/><text x="79" y="243" class="label">初始形成 / 地质历史</text><rect x="350" y="210" width="250" height="190" rx="12" class="strata"/><text x="364" y="243" class="label">开局 / 正常过程时钟</text><rect x="635" y="210" width="245" height="190" rx="12" class="strata"/><text x="649" y="243" class="label">洪水 / 局部响应</text><path d="M319 310 L343 310" class="flow" marker-end="url(#arrow-09-outputs-review)"/><path d="M604 310 L628 310" class="flow" marker-end="url(#arrow-09-outputs-review)"/><text x="97" y="446" class="label">不继承地貌加速倍数；不按日期强制退岸</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">6 / 7  地质历史与开局后时间分开</text><text x="43" y="575" class="label">成熟地貌来自漫长历史；开局后只结算实际推进的过程时长，缓慢变化累计，洪水事件按条件发生</text><text x="43" y="602" class="label">。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;0;1;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="65" y="210" width="240" height="190" rx="12" class="strata"/><text x="79" y="243" class="label">坡面 / 岸体来源</text><rect x="350" y="210" width="245" height="190" rx="12" class="strata"/><text x="364" y="243" class="label">岛内 / 沉积库存</text><rect x="640" y="210" width="235" height="190" rx="12" class="strata"/><text x="654" y="243" class="label">岛缘 / 实际外排</text><path d="M309 310 L343 310" class="flow" marker-end="url(#arrow-09-outputs-review)"/><path d="M599 310 L632 310" class="flow" marker-end="url(#arrow-09-outputs-review)"/><text x="96" y="446" class="label">风化成土转化岩石；滞沙设施需维护，不新增质量</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">7 / 7  岛内沉积与保土，不会凭空造土</text><text x="43" y="575" class="label">侵蚀物可在岛内储留；真正越过岛缘才净损失。植被、护岸与滞沙改变实际过程，容量有限，具体</text><text x="43" y="602" class="label">玩家措施留后层细化。</text></g><text x="36" y="637" class="small">非比例过程示意 · 像素不是米 · 非实际47米河段 / 水动力结果</text></svg>