<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-11-width-depth desc-11-width-depth"><title id="title-11-width-depth">宽深与潭滩：形态如何闭合</title><desc id="desc-11-width-depth">补齐单向扩宽、平均床蚀及沿程维护的缺项；图形不是计算结果或目标比例。。宽度要能双向调整，迁移不等于扩宽：退岸移除材料，边滩/岸脚堆积增加实体；外岸退与内岸进共同决定迁移或净宽度，不能只累计侧蚀。。床料局部净搬运塑造深槽，不均匀挖一层：横向与沿程进出、沉降和再悬浮在各处不同；局部净移出才下切，相邻弱输运处可以同时成滩。。横向输沙与颗粒稳定性参与反馈：近床流动偏转与横坡重力共同影响颗粒路径；深处可以回填，不能用统一平滑抹平，也不关闭回填保深坑。。床岸组合解释宽深，不把强岸直接变深：较抗侧移岸加可动床及真实净床蚀可发展较深槽；弱岸或抗蚀床可以宽浅，必须有相容材料和时间。。潭滩由跨事件净冲淤维护，允许调整或消失：真实收窄、汇聚、分选与控制造成局部进出沙差；低流可积沙，洪水不一定清空潭，也不每年模板重挖。。深化会改变水力与覆盖，不能沿旧应力无限切：新断面重算面积、湿周、作用分布和下游控制；粗化、岩层或覆盖可限制继续下切，侧移也有实际反馈。。普遍宽浅必须诊断成因，不能只验总账：对照材料/谷约束与同版事件历史，核对实际床退移、岸进退、最深线连续和尺度；物性支持净床蚀却仍锁浅槽应排查。</desc><defs><marker id="arrow-11-width-depth" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">11 / 宽深与潭滩：形态如何闭合</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;0;1" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><g transform="translate(0 -20)"><path d="M80 210 L265 210 L315 282 L375 300 L545 300 L615 282 L665 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M292.77777777777777 250 L637.2222222222222 250 L637.2222222222222 250 L615 282 L545 300 L375 300 L315 282 L292.77777777777777 250Z" class="water" /><line x1="292.77777777777777" y1="250" x2="637.2222222222222" y2="250" class="waterline"/><path d="M80 210 L185 210 L245 268 L345 300 L575 300 L675 268 L735 210 L860 210" class="ghost" /><path d="M197 263 L270 263" class="gravity" marker-end="url(#arrow-11-width-depth)"/><path d="M700 263 L635 263" class="gravity" marker-end="url(#arrow-11-width-depth)"/></g><text x="100" y="156" class="label">图中示意收窄分支；实际也可能扩宽或迁移</text><text x="105" y="464" class="label">旧谷宽、参考槽宽、活动主槽与当天湿宽分别记录</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 7  宽度要能双向调整，迁移不等于扩宽</text><text x="43" y="575" class="label">退岸移除材料，边滩/岸脚堆积增加实体；外岸退与内岸进共同决定迁移或净宽度，不能只累计侧</text><text x="43" y="602" class="label">蚀。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><g transform="translate(0 -20)"><path d="M80 210 L240 210 L310 295 L390 359 L500 389 L590 320 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M297.6470588235294 280 L613.6363636363636 280 L613.6363636363636 280 L590 320 L500 389 L390 359 L310 295 L297.6470588235294 280Z" class="water" /><line x1="297.6470588235294" y1="280" x2="613.6363636363636" y2="280" class="waterline"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210" class="ghost" /><path d="M500 387 L558 346" class="flow" marker-end="url(#arrow-11-width-depth)"/></g><text x="97" y="156" class="label">实线与虚线为因果示意，不是本次水沙模拟</text><text x="102" y="465" class="label">粒级、覆盖、有效水力和库存共同决定，不固定最深点</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 7  床料局部净搬运塑造深槽，不均匀挖一层</text><text x="43" y="575" class="label">横向与沿程进出、沉降和再悬浮在各处不同；局部净移出才下切，相邻弱输运处可以同时成滩。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><g transform="translate(0 -20)"><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M305 275 L608.0555555555555 275 L608.0555555555555 275 L590 300 L500 355 L390 332 L310 280 L305 275Z" class="water" /><line x1="305" y1="275" x2="608.0555555555555" y2="275" class="waterline"/><path d="M374 334 L462 350" class="gravity" marker-end="url(#arrow-11-width-depth)"/><path d="M532 331 L476 341" class="flow" marker-end="url(#arrow-11-width-depth)"/></g><text x="98" y="156" class="label">箭头仅示意不同过程，非统一颗粒运动方向</text><text x="101" y="464" class="label">普通段也需横断面响应；强弯/汇流局部细化</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 7  横向输沙与颗粒稳定性参与反馈</text><text x="43" y="575" class="label">近床流动偏转与横坡重力共同影响颗粒路径；深处可以回填，不能用统一平滑抹平，也不关闭回填</text><text x="43" y="602" class="label">保深坑。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><g transform="translate(0 105) scale(0.49)"><path d="M80 210 L185 210 L245 268 L345 300 L575 300 L675 268 L735 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M226.3793103448276 250 L693.6206896551724 250 L693.6206896551724 250 L675 268 L575 300 L345 300 L245 268 L226.3793103448276 250Z" class="water" /><line x1="226.3793103448276" y1="250" x2="693.6206896551724" y2="250" class="waterline"/></g><g transform="translate(460 105) scale(0.49)"><path d="M80 210 L330 210 L375 312 L460 395 L530 312 L575 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M347.6470588235294 250 L557.3529411764706 250 L557.3529411764706 250 L530 312 L460 395 L375 312 L347.6470588235294 250Z" class="water" /><line x1="347.6470588235294" y1="250" x2="557.3529411764706" y2="250" class="waterline"/></g><text x="91" y="169" class="label">可能分支：易侧移岸</text><text x="518" y="169" class="label">可能分支：限侧移且可床蚀</text><text x="107" y="454" class="label">非比例结果示意；不是强岸倍率或深河数量配额</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 7  床岸组合解释宽深，不把强岸直接变深</text><text x="43" y="575" class="label">较抗侧移岸加可动床及真实净床蚀可发展较深槽；弱岸或抗蚀床可以宽浅，必须有相容材料和时间</text><text x="43" y="602" class="label">。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><g transform="translate(0 -20)"><path d="M80 260 L190 275 L280 350 L350 335 L405 280 L500 315 L590 378 L670 315 L730 322 L860 344 L860 465 L80 465Z" class="rock" /><path d="M80 230 L190 238.8 L280 246 L350 251.6 L405 256 L500 263.6 L590 270.8 L670 277.2 L730 282 L860 292.4 L860 344 L730 322 L670 315 L590 378 L500 315 L405 280 L350 335 L280 350 L190 275 L80 260Z" class="water" /><path d="M80 230 L190 238.8 L280 246 L350 251.6 L405 256 L500 263.6 L590 270.8 L670 277.2 L730 282 L860 292.4" class="waterline" /></g><text x="101" y="149" class="label">过程改变后，潭可以淤浅或迁移，不强制永久存在</text><text x="98" y="472" class="label">局部速度、颗粒路径与净输运分别看；不只取平均流速</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 7  潭滩由跨事件净冲淤维护，允许调整或消失</text><text x="43" y="575" class="label">真实收窄、汇聚、分选与控制造成局部进出沙差；低流可积沙，洪水不一定清空潭，也不每年模板</text><text x="43" y="602" class="label">重挖。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="65" y="209" width="235" height="189" rx="12" class="strata"/><text x="79" y="242" class="label">当前断面 / 作用</text><rect x="350" y="209" width="245" height="189" rx="12" class="strata"/><text x="364" y="242" class="label">局部净变化 / 材料</text><rect x="645" y="209" width="235" height="189" rx="12" class="strata"/><text x="659" y="242" class="label">新断面 / 反馈限制</text><path d="M304 310 L343 310" class="flow" marker-end="url(#arrow-11-width-depth)"/><path d="M600 310 L638 310" class="flow" marker-end="url(#arrow-11-width-depth)"/><path d="M758 410 L758 451 L184 451 L184 411" class="flow" marker-end="url(#arrow-11-width-depth)"/><text x="103" y="156" class="label">被阻止的侧蚀量不能直接转成同额床蚀</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">6 / 7  深化会改变水力与覆盖，不能沿旧应力无限切</text><text x="43" y="575" class="label">新断面重算面积、湿周、作用分布和下游控制；粗化、岩层或覆盖可限制继续下切，侧移也有实际</text><text x="43" y="602" class="label">反馈。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;0;1;0" keyTimes="0;0.14285714285714285;0.2857142857142857;0.42857142857142855;0.5714285714285714;0.7142857142857143;0.8571428571428571;1" calcMode="discrete" dur="42s" repeatCount="indefinite"/><rect x="65" y="209" width="235" height="189" rx="12" class="strata"/><text x="79" y="242" class="label">材料 / 水情 / 历史</text><rect x="350" y="209" width="245" height="189" rx="12" class="strata"/><text x="364" y="242" class="label">局部过程 / 实体几何</text><rect x="645" y="209" width="235" height="189" rx="12" class="strata"/><text x="659" y="242" class="label">原河段 / 深度层次</text><path d="M304 310 L343 310" class="flow" marker-end="url(#arrow-11-width-depth)"/><path d="M600 310 L638 310" class="flow" marker-end="url(#arrow-11-width-depth)"/><text x="102" y="463" class="label">47米不是最低4米深；也不能用浅河存在来跳过系统性问题</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">7 / 7  普遍宽浅必须诊断成因，不能只验总账</text><text x="43" y="575" class="label">对照材料/谷约束与同版事件历史，核对实际床退移、岸进退、最深线连续和尺度；物性支持净床</text><text x="43" y="602" class="label">蚀却仍锁浅槽应排查。</text></g><text x="36" y="637" class="small">非比例过程示意 · 像素不是米 · 非实际47米河段 / 水动力结果</text></svg>