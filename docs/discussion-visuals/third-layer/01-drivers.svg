<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-01-drivers desc-01-drivers"><title id="title-01-drivers">河槽成因：水沙、材料与谷地</title><desc id="desc-01-drivers">宽深是床岸反馈结果，不由单个年均流量或速度决定。。实际谷地、层序和材料是起点：局部细化需要形成依据；母格插值或数值种子不能变成永久目标断面。。事件强度和出现次数共同贡献造槽：年均、当天、年最大与平岸不是一个量；不统一取1.5/2年流量或成槽比。。相同来水与供沙，不同床岸条件可有不同形态：弱岸可能扩宽，受限或抗蚀岸可能限制侧向；不保证所有强岸都更深。。形成与当天水位分开，但通过同源几何耦合：先计算当时水沙，再更新真实床岸和库存，再重算水位与连接；不重复第一层侵蚀。</desc><defs><marker id="arrow-01-drivers" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">01 / 河槽成因：水沙、材料与谷地</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 226 L655 226 L590 316 L500 371 L390 348 L310 296 L240 226 L80 226Z" class="strata" /><text x="91" y="160" class="label">局部源横断面：横向不是下游方向</text><text x="95" y="443" class="label">岸脚、床面、层界与材料库存分别存在</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  实际谷地、层序和材料是起点</text><text x="43" y="575" class="label">局部细化需要形成依据；母格插值或数值种子不能变成永久目标断面。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="65" y="192" width="395" height="208" rx="12" class="strata"/><text x="79" y="225" class="label">真实流量历程</text><rect x="510" y="192" width="370" height="208" rx="12" class="strata"/><text x="524" y="225" class="label">真实分级供沙</text><rect x="91" y="300" width="19" height="22" rx="3" class="water"/><rect x="119" y="300" width="19" height="39" rx="3" class="water"/><rect x="147" y="300" width="19" height="56" rx="3" class="water"/><rect x="175" y="300" width="19" height="73" rx="3" class="water"/><rect x="203" y="300" width="19" height="22" rx="3" class="water"/><rect x="231" y="300" width="19" height="39" rx="3" class="water"/><rect x="259" y="300" width="19" height="56" rx="3" class="water"/><rect x="287" y="300" width="19" height="73" rx="3" class="water"/><rect x="315" y="300" width="19" height="22" rx="3" class="water"/><rect x="343" y="300" width="19" height="39" rx="3" class="water"/><rect x="371" y="300" width="19" height="56" rx="3" class="water"/><rect x="399" y="300" width="19" height="73" rx="3" class="water"/><circle cx="555" cy="331" r="5" class="magma"/><circle cx="582" cy="340" r="5" class="magma"/><circle cx="609" cy="331" r="5" class="magma"/><circle cx="636" cy="340" r="5" class="magma"/><circle cx="663" cy="331" r="5" class="magma"/><circle cx="690" cy="340" r="5" class="magma"/><circle cx="717" cy="331" r="5" class="magma"/><circle cx="744" cy="340" r="5" class="magma"/><circle cx="771" cy="331" r="5" class="magma"/><text x="103" y="463" class="label">柱形仅表示事件差异，非实际年景与数值</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 4  事件强度和出现次数共同贡献造槽</text><text x="43" y="575" class="label">年均、当天、年最大与平岸不是一个量；不统一取1.5/2年流量或成槽比。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><g transform="translate(-15 105) scale(0.54)"><path d="M80 210 L185 210 L245 268 L345 300 L575 300 L675 268 L735 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M241.89655172413794 265 L678.1034482758621 265 L678.1034482758621 265 L675 268 L575 300 L345 300 L245 268 L241.89655172413794 265Z" class="water" /><line x1="241.89655172413794" y1="265" x2="678.1034482758621" y2="265" class="waterline"/></g><g transform="translate(455 105) scale(0.54)"><path d="M80 210 L330 210 L375 312 L460 395 L530 312 L575 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M354.2647058823529 265 L550.7352941176471 265 L550.7352941176471 265 L530 312 L460 395 L375 312 L354.2647058823529 265Z" class="water" /><line x1="354.2647058823529" y1="265" x2="550.7352941176471" y2="265" class="waterline"/></g><text x="108" y="181" class="label">条件示例：宽浅</text><text x="594" y="181" class="label">条件示例：窄深</text><text x="89" y="444" class="label">结果仍需完整床岸与水力相容；像素不是米</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 4  相同来水与供沙，不同床岸条件可有不同形态</text><text x="43" y="575" class="label">弱岸可能扩宽，受限或抗蚀岸可能限制侧向；不保证所有强岸都更深。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="65" y="200" width="240" height="185" rx="12" class="strata"/><text x="79" y="233" class="label">水沙与水力</text><rect x="350" y="200" width="245" height="185" rx="12" class="strata"/><text x="364" y="233" class="label">床岸与材料变化</text><rect x="640" y="200" width="235" height="185" rx="12" class="strata"/><text x="654" y="233" class="label">新几何与水位</text><path d="M311 301 L342 301" class="flow" marker-end="url(#arrow-01-drivers)"/><path d="M601 301 L632 301" class="flow" marker-end="url(#arrow-01-drivers)"/><text x="106" y="456" class="label">更新原水与物质库存，不重置成满河</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  形成与当天水位分开，但通过同源几何耦合</text><text x="43" y="575" class="label">先计算当时水沙，再更新真实床岸和库存，再重算水位与连接；不重复第一层侵蚀。</text></g><text x="36" y="637" class="small">非比例过程示意 · 像素不是米 · 非实际47米河段 / 水动力结果</text></svg>