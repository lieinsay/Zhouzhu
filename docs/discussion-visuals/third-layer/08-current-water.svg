<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-08-current-water desc-08-current-water"><title id="title-08-current-water">同源河槽中的当天水位</title><desc id="desc-08-current-water">同槽对照限无显著床变时段，真正洪水可以按物质过程改床。。无显著床变时段，低水位保留同一河床：当天水面和局部深浅从实际断面得到，不按流量指数重挖槽。。水位升高使面积与湿宽变化，床面可以暂时不变：洪峰不是每日均流；同一断面的A、T和湿周供计算与还原。。越岸后进入真实洪泛单元，不无限塞回固定槽：左右控制高程或参考面没有依据时不伪造；新增水仍来自同一预算。。回水与局部急变不能用床坡替代水面 / 能量坡：同一完整断面、上下游边界和有限通量一起求水位，Manning不生成河床。</desc><defs><marker id="arrow-08-current-water" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">08 / 同源河槽中的当天水位</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M380.7692307692308 326 L547.4545454545455 326 L547.4545454545455 326 L500 355 L390 332 L380.7692307692308 326Z" class="water" /><line x1="380.7692307692308" y1="326" x2="547.4545454545455" y2="326" class="waterline"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210" class="ghost" /><text x="91" y="165" class="label">同一源断面：低水位示例</text><path d="M500 326 L500 355" class="reference" marker-start="url(#arrow-08-current-water)" marker-end="url(#arrow-08-current-water)"/><text x="101" y="442" class="label">水深变小，不等于岸顶—床面下切变小</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  无显著床变时段，低水位保留同一河床</text><text x="43" y="575" class="label">当天水面和局部深浅从实际断面得到，不按流量指数重挖槽。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M276 246 L629 246 L629 246 L590 300 L500 355 L390 332 L310 280 L276 246Z" class="water" /><line x1="276" y1="246" x2="629" y2="246" class="waterline"/><text x="90" y="166" class="label">同一源断面：较高水位示例</text><path d="M500 246 L500 355" class="reference" marker-start="url(#arrow-08-current-water)" marker-end="url(#arrow-08-current-water)"/><text x="95" y="437" class="label">Q=A×平均流速只是相容式，不能单独决定宽深</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 4  水位升高使面积与湿宽变化，床面可以暂时不变</text><text x="43" y="575" class="label">洪峰不是每日均流；同一断面的A、T和湿周供计算与还原。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M80 188 L860 188 L860 210 L655 210 L590 300 L500 355 L390 332 L310 280 L240 210 L80 210Z" class="water" /><line x1="80" y1="188" x2="860" y2="188" class="waterline"/><line x1="240" y1="210" x2="655" y2="210" class="reference"/><path d="M290 194 L142 194" class="flow" marker-end="url(#arrow-08-current-water)"/><path d="M605 194 L773 194" class="flow" marker-end="url(#arrow-08-current-water)"/><text x="90" y="161" class="label">此例已达到实际岸缘连通条件</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 4  越岸后进入真实洪泛单元，不无限塞回固定槽</text><text x="43" y="575" class="label">左右控制高程或参考面没有依据时不伪造；新增水仍来自同一预算。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="65" y="213" width="390" height="211" rx="12" class="strata"/><text x="79" y="246" class="label">几何：A / T / 湿周 / 材料</text><rect x="505" y="213" width="370" height="211" rx="12" class="strata"/><text x="519" y="246" class="label">边界：湖位 / 控制口 / 岩槛</text><path d="M458 309 L494 309" class="flow" marker-end="url(#arrow-08-current-water)"/><text x="98" y="467" class="label">真正事件床变另按过程更新源版本，不从日期标签造槽</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  回水与局部急变不能用床坡替代水面 / 能量坡</text><text x="43" y="575" class="label">同一完整断面、上下游边界和有限通量一起求水位，Manning不生成河床。</text></g><text x="36" y="637" class="small">非比例过程示意 · 像素不是米 · 非实际47米河段 / 水动力结果</text></svg>