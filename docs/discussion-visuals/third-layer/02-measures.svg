3 174 L673 174" class="reference" marker-start="url(#arrow-02-measures)" marker-end="url(#arrow-02-measures)"/><text x="306" y="153" class="label">最外湿边跨度</text><path d="M263 395 L405 395" class="reference" marker-start="url(#arrow-02-measures)" marker-end="url(#arrow-02-measures)"/><path d="M511 395 L673 395" class="reference" marker-start="url(#arrow-02-measures)" marker-end="url(#arrow-02-measures)"/><text x="275" y="435" class="label">湿宽1</text><text x="539" y="435" class="label">湿宽2</text><text x="427" y="238" class="label">干洲</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  多汊湿宽求和与跨洲跨度分别记录</text><text x="43" y="575" class="label">干洲不计入湿宽；最外湿边很宽不代表整段都是过水面积。</text></g><text x="36" y="637" class="small">非比例过程示意 · 像素不是米 · 非实际47米河段 / 水动力结果</text></svg>