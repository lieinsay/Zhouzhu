<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-02-measures desc-02-measures"><title id="title-02-measures">宽深口径：岸、槽和当天水面</title><desc id="desc-02-measures">局部最大深、平均深、露岸与湿宽分别取真实源断面。。参考槽与当天湿宽不是一个宽度：此例有可辨漫溢参考面；峡谷没有依据时不能伪造bankfull。。岸顶下切包含水面上方露岸：岸顶到最深床面，不等于当天水面到床面的水深。。最深槽偏离河心，平均水深另用A/T：岸边局部深、当天最大深与断面平均深不能互相替代。。多汊湿宽求和与跨洲跨度分别记录：干洲不计入湿宽；最外湿边很宽不代表整段都是过水面积。</desc><defs><marker id="arrow-02-measures" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">02 / 宽深口径：岸、槽和当天水面</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M340.7692307692308 300 L590 300 L590 300 L500 355 L390 332 L340.7692307692308 300Z" class="water" /><line x1="340.7692307692308" y1="300" x2="590" y2="300" class="waterline"/><line x1="240" y1="210" x2="655" y2="210" class="reference"/><path d="M240 178 L655 178" class="reference" marker-start="url(#arrow-02-measures)" marker-end="url(#arrow-02-measures)"/><text x="345" y="153" class="label">参考河槽跨度</text><path d="M341 401 L590 401" class="reference" marker-start="url(#arrow-02-measures)" marker-end="url(#arrow-02-measures)"/><text x="359" y="434" class="label">当天实际湿宽</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  参考槽与当天湿宽不是一个宽度</text><text x="43" y="575" class="label">此例有可辨漫溢参考面；峡谷没有依据时不能伪造bankfull。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M310 280 L604.4444444444445 280 L604.4444444444445 280 L590 300 L500 355 L390 332 L310 280Z" class="water" /><line x1="310" y1="280" x2="604.4444444444445" y2="280" class="waterline"/><path d="M735 210 L735 355" class="reference" marker-start="url(#arrow-02-measures)" marker-end="url(#arrow-02-measures)"/><line x1="500" y1="355" x2="752" y2="355" class="reference"/><text x="628" y="183" clas