<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-04-banks desc-04-banks"><title id="title-04-banks">河岸：岸脚冲刷与岸体稳定</title><desc id="desc-04-banks">岸体材料、层序、孔压和实际载荷决定侧向变化。。弱岸可扩宽，较强岸可限制侧向活动：床蚀和退岸一起决定几何；不能全世界固定一个岸坡角或宽深比。。岸脚侵蚀先改变支撑与渗流边界：水力、层界与材料使局部掏蚀；真实开口/悬伸用局部多面而不是平滑掩盖。。退水后外侧水压降低，岸内孔压可能滞后：局部岸体渗流用真实材料、河水位历程和地下边界；不是复制全岛水头或固定延迟。。真实岸体失稳才崩落，崩落料仍要搬运：岸线退后与床面局部堆积同步入账；崩落不等于立即全冲到出口。。岸边堆积也改变有效宽度，不是只会退岸：实际边滩/岸脚及漫滩沉积可使主槽收窄或迁移；沉积的固结与强度要有过程，露出一次不永久成岸。</desc><defs><marker id="arrow-04-banks" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">04 / 河岸：岸脚冲刷与岸体稳定</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;1" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><g transform="translate(-15 115) scale(0.54)"><path d="M80 210 L185 210 L245 268 L345 300 L575 300 L675 268 L735 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M251.25 270 L668.75 270 L668.75 270 L575 300 L345 300 L251.25 270Z" class="water" /><line x1="251.25" y1="270" x2="668.75" y2="270" class="waterline"/></g><g transform="translate(455 115) scale(0.54)"><path d="M80 210 L330 210 L375 312 L460 395 L530 312 L575 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M356.47058823529414 270 L548.5294117647059 270 L548.5294117647059 270 L530 312 L460 395 L375 312 L356.47058823529414 270Z" class="water" /><line x1="356.47058823529414" y1="270" x2="548.5294117647059" y2="270" class="waterline"/></g><text x="105" y="169" class="label">弱岸条件示例</text><text x="594" y="169" class="label">抗蚀岸条件示例</text><text x="90" y="442" class="label">不是“岸强度越高河就必然越深”的单变量公式</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 5  弱岸可扩宽，较强岸可限制侧向活动</text><text x="43" y="575" class="label">床蚀和退岸一起决定几何；不能全世界固定一个岸坡角或宽深比。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 210 L340 210 L340 278 L307 295 L390 337 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M340 270 L611.667 270 L590 300 L500 355 L390 337 L307 295 L340 278Z" class="water" /><line x1="340" y1="270" x2="611.667" y2="270" class="waterline"/><circle cx="345" cy="295" r="5" class="magma"/><circle cx="372" cy="304" r="5" class="magma"/><circle cx="399" cy="295" r="5" class="magma"/><circle cx="426" cy="304" r="5" class="magma"/><path d="M355 298 L467 328" class="gravity" marker-end="url(#arrow-04-banks)"/><text x="94" y="159" class="label">局部岸脚被移除，材料进入实际账</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 5  岸脚侵蚀先改变支撑与渗流边界</text><text x="43" y="575" class="label">水力、层界与材料使局部掏蚀；真实开口/悬伸用局部多面而不是平滑掩盖。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M350 306 L580.1818181818182 306 L580.1818181818182 306 L500 355 L390 332 L350 306Z" class="water" /><line x1="350" y1="306" x2="580.1818181818182" y2="306" class="waterline"/><path d="M160 224 L240 224 L310 294 L315 297.25 L315 347.25 L310 344 L240 274 L160 274Z" class="sat" /><line x1="270" y1="250" x2="598" y2="250" class="reference"/><text x="94" y="169" class="label">虚线：先前较高水位</text><text x="95" y="432" class="label">岸内局部渗流沿用材料和边界；水头不是整岸孔压</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 5  退水后外侧水压降低，岸内孔压可能滞后</text><text x="43" y="575" class="label">局部岸体渗流用真实材料、河水位历程和地下边界；不是复制全岛水头或固定延迟。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 210 L185 210 L245 268 L345 300 L575 300 L675 268 L735 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M251.25 270 L668.75 270 L668.75 270 L575 300 L345 300 L251.25 270Z" class="water" /><line x1="251.25" y1="270" x2="668.75" y2="270" class="waterline"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210" class="ghost" /><path d="M289 292 L348 314 L376 300 L333 281Z" class="strata" /><path d="M293 241 L337 284" class="gravity" marker-end="url(#arrow-04-banks)"/><text x="94" y="166" class="label">材料转入崩落堆积或随后输运</text><text x="90" y="445" class="label">河岸事件不是延期的整岛摧毁功能</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 5  真实岸体失稳才崩落，崩落料仍要搬运</text><text x="43" y="575" class="label">岸线退后与床面局部堆积同步入账；崩落不等于立即全冲到出口。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0;0.2;0.4;0.6;0.8;1" calcMode="discrete" dur="30s" repeatCount="indefinite"/><path d="M80 210 L265 210 L315 282 L375 300 L545 300 L615 282 L665 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M292.77777777777777 250 L637.2222222222222 250 L637.2222222222222 250 L615 282 L545 300 L375 300 L315 282 L292.77777777777777 250Z" class="water" /><line x1="292.77777777777777" y1="250" x2="637.2222222222222" y2="250" class="waterline"/><path d="M80 210 L185 210 L245 268 L345 300 L575 300 L675 268 L735 210 L860 210" class="ghost" /><circle cx="270" cy="235" r="5" class="magma"/><circle cx="297" cy="244" r="5" class="magma"/><circle cx="631" cy="235" r="5" class="magma"/><circle cx="658" cy="244" r="5" class="magma"/><text x="96" y="156" class="label">实线仅示意一种淤积收窄；虚线为旧轮廓</text><text x="107" y="465" class="label">有限材料与新断面水力共同核对，不自动补根系或强岸</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 5  岸边堆积也改变有效宽度，不是只会退岸</text><text x="43" y="575" class="label">实际边滩/岸脚及漫滩沉积可使主槽收窄或迁移；沉积的固结与强度要有过程，露出一次不永久成</text><text x="43" y="602" class="label">岸。</text></g><text x="36" y="637" class="small">非比例过程示意 · 像素不是米 · 非实际47米河段 / 水动力结果</text></svg>