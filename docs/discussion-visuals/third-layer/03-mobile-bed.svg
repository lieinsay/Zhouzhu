<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-03-mobile-bed desc-03-mobile-bed"><title id="title-03-mobile-bed">移动床：侵蚀、沉积与分选</title><desc id="desc-03-mobile-bed">砂砾床不能从水深反推粒径，再用粒径证明水深。。床料和上游来沙都有真实来源：床面粒级、覆盖厚度与坡面输入分开；没有对应来源就不加固定供沙。。实际输运作用移除床料，床面才降低：虚线为先前床面；被移走的材料转入输运/堆积或实际外排，不消失。。供沙超过当地带走能力，可沉积抬床：来沙多并不总使河更深；沉积和再悬浮是库存间转移，不是新增材料。。分选和表层粗化会反过来改变床面响应：床材、阻力、局部作用和供沙共同调整；参数分别核对砂床与砾床适用域。。断面平均作用不能直接分给每处床岸：分别取得床面、岸脚和局部有效作用；阻力、形态和材料适用性需独立校验。。粒径不能替代黏聚和固结条件：散砂 / 砾与黏性细床的起动、侵蚀和床面更新分域，缺资料时不强套。</desc><defs><marker id="arrow-03-mobile-bed" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">03 / 移动床：侵蚀、沉积与分选</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M300 270 L611.6666666666666 270 L611.6666666666666 270 L590 300 L500 355 L390 332 L310 280 L300 270Z" class="water" /><line x1="300" y1="270" x2="611.6666666666666" y2="270" class="waterline"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 228 L655 228 L590 318 L500 373 L390 350 L310 298 L240 228 L80 228Z" class="strata" /><circle cx="358" cy="325" r="5" class="magma"/><circle cx="385" cy="334" r="5" class="magma"/><circle cx="412" cy="325" r="5" class="magma"/><circle cx="439" cy="334" r="5" class="magma"/><circle cx="466" cy="325" r="5" class="magma"/><circle cx="493" cy="334" r="5" class="magma"/><circle cx="520" cy="325" r="5" class="magma"/><path d="M240 219 L314 289" class="gravity" marker-end="url(#arrow-03-mobile-bed)"/><text x="90" y="165" class="label">实际床面与分级材料</text><text x="89" y="437" class="label">来源可以有限或间歇，不是每段每天凭空产沙</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 6  床料和上游来沙都有真实来源</text><text x="43" y="575" class="label">床面粒级、覆盖厚度与坡面输入分开；没有对应来源就不加固定供沙。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M80 210 L240 210 L310 295 L390 359 L500 389 L590 320 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M289.4117647058824 270 L619.5454545454545 270 L619.5454545454545 270 L590 320 L500 389 L390 359 L310 295 L289.4117647058824 270Z" class="water" /><line x1="289.4117647058824" y1="270" x2="619.5454545454545" y2="270" class="waterline"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210" class="ghost" /><g><circle cx="413" cy="329" r="5" class="magma"/><circle cx="440" cy="338" r="5" class="magma"/><circle cx="467" cy="329" r="5" class="magma"/><circle cx="494" cy="338" r="5" class="magma"/><circle cx="521" cy="329" r="5" class="magma"/><animateTransform attributeName="transform" type="translate" values="0 0;100 -18;0 0" dur="5s" repeatCount="indefinite"/></g><path d="M515 350 Q668 359 800 412" class="gravity" marker-end="url(#arrow-03-mobile-bed)"/><text x="100" y="161" class="label">床蚀必须从原库存扣质量</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 6  实际输运作用移除床料，床面才降低</text><text x="43" y="575" class="label">虚线为先前床面；被移走的材料转入输运/堆积或实际外排，不消失。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M300 270 L611.6666666666666 270 L611.6666666666666 270 L590 300 L500 355 L390 332 L310 280 L300 270Z" class="water" /><line x1="300" y1="270" x2="611.6666666666666" y2="270" class="waterline"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 238 L655 238 L590 328 L500 383 L390 360 L310 308 L240 238 L80 238Z" class="strata" /><circle cx="376" cy="328" r="5" class="magma"/><circle cx="403" cy="337" r="5" class="magma"/><circle cx="430" cy="328" r="5" class="magma"/><circle cx="457" cy="337" r="5" class="magma"/><circle cx="484" cy="328" r="5" class="magma"/><circle cx="511" cy="337" r="5" class="magma"/><circle cx="538" cy="328" r="5" class="magma"/><path d="M279 275 L424 317" class="gravity" marker-end="url(#arrow-03-mobile-bed)"/><text x="90" y="162" class="label">抬床来自实际沉积，不是为浅滩加地形噪声</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 6  供沙超过当地带走能力，可沉积抬床</text><text x="43" y="575" class="label">来沙多并不总使河更深；沉积和再悬浮是库存间转移，不是新增材料。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="65" y="210" width="395" height="210" rx="12" class="strata"/><text x="79" y="243" class="label">细料移动 / 再沉积</text><circle cx="100" cy="331" r="5" class="magma"/><circle cx="127" cy="340" r="5" class="magma"/><circle cx="154" cy="331" r="5" class="magma"/><circle cx="181" cy="340" r="5" class="magma"/><circle cx="208" cy="331" r="5" class="magma"/><circle cx="235" cy="340" r="5" class="magma"/><circle cx="262" cy="331" r="5" class="magma"/><circle cx="289" cy="340" r="5" class="magma"/><circle cx="316" cy="331" r="5" class="magma"/><circle cx="343" cy="340" r="5" class="magma"/><circle cx="370" cy="331" r="5" class="magma"/><rect x="510" y="210" width="370" height="210" rx="12" class="strata"/><text x="524" y="243" class="label">粗料保留 / 条件性起动</text><circle cx="563" cy="334" r="15" class="rock"/><circle cx="620" cy="334" r="15" class="rock"/><circle cx="677" cy="334" r="15" class="rock"/><circle cx="734" cy="334" r="15" class="rock"/><circle cx="791" cy="334" r="15" class="rock"/><text x="93" y="464" class="label">材质反馈不是固定粗粒保护倍数，也不保证永远不动</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 6  分选和表层粗化会反过来改变床面响应</text><text x="43" y="575" class="label">床材、阻力、局部作用和供沙共同调整；参数分别核对砂床与砾床适用域。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><path d="M80 210 L240 210 L310 280 L390 332 L500 355 L590 300 L655 210 L860 210 L860 465 L80 465Z" class="rock" /><path d="M300 270 L611.6666666666666 270 L611.6666666666666 270 L590 300 L500 355 L390 332 L310 280 L300 270Z" class="water" /><line x1="300" y1="270" x2="611.6666666666666" y2="270" class="waterline"/><circle cx="310" cy="280" r="6" class="pivot"/><circle cx="500" cy="355" r="6" class="pivot"/><line x1="205" y1="195" x2="310" y2="280" class="reference"/><line x1="606" y1="410" x2="500" y2="355" class="reference"/><text x="95" y="170" class="label">岸脚作用</text><text x="580" y="440" class="label">床面有效作用</text><text x="95" y="465" class="label">仅标计算位置，不画应力数值或统一冲刷倍率</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">5 / 6  断面平均作用不能直接分给每处床岸</text><text x="43" y="575" class="label">分别取得床面、岸脚和局部有效作用；阻力、形态和材料适用性需独立校验。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;0.16666666666666666;0.3333333333333333;0.5;0.6666666666666666;0.8333333333333334;1" calcMode="discrete" dur="36s" repeatCount="indefinite"/><rect x="65" y="211" width="395" height="210" rx="12" class="strata"/><text x="79" y="244" class="label">散砂 / 砾：分级颗粒作用</text><circle cx="102" cy="330" r="5" class="magma"/><circle cx="129" cy="339" r="5" class="magma"/><circle cx="156" cy="330" r="5" class="magma"/><circle cx="183" cy="339" r="5" class="magma"/><circle cx="210" cy="330" r="5" class="magma"/><circle cx="237" cy="339" r="5" class="magma"/><circle cx="264" cy="330" r="5" class="magma"/><circle cx="291" cy="339" r="5" class="magma"/><circle cx="318" cy="330" r="5" class="magma"/><circle cx="345" cy="339" r="5" class="magma"/><circle cx="372" cy="330" r="5" class="magma"/><rect x="510" y="211" width="370" height="210" rx="12" class="strata"/><text x="524" y="244" class="label">黏性细床：黏聚 / 固结</text><rect x="549" y="305" width="290" height="63" rx="6" class="strata"/><text x="94" y="465" class="label">气候标签不是河床材质，类型也不直接规定深度</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">6 / 6  粒径不能替代黏聚和固结条件</text><text x="43" y="575" class="label">散砂 / 砾与黏性细床的起动、侵蚀和床面更新分域，缺资料时不强套。</text></g><text x="36" y="637" class="small">非比例过程示意 · 像素不是米 · 非实际47米河段 / 水动力结果</text></svg>