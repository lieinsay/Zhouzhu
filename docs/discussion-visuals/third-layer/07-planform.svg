<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" role="img" aria-labelledby="title-07-planform desc-07-planform"><title id="title-07-planform">平面：直段、弯道与多汊</title><desc id="desc-07-planform">平面轴不是高程；河型由谷地、床岸和实际输沙约束。。受谷地约束的河段可以近直，不要求条条曲流：此图为平面；地貌和床岸提供方向，不从planform标签在游戏自由摆线。。弯道外岸冲刷与内岸沉积，深槽可以偏侧：局部水力与材料才支持这一反馈；不把一条正弦线当曲流成因。。河岸迁移留下的材料需要去向，不能日期换弯度：旧岸线用虚线示意；实际冲刷、沉积和连接改变才更新平面源几何。。多汊需要洲体、分流和侧向输沙几何：干洲不计湿宽，不因泥沙标签随机多画一条河；无法解析时明确列缺失。</desc><defs><marker id="arrow-07-planform" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans SC',sans-serif;fill:#253b38}.label{font-size:19px}.oncore{font-size:18px;fill:#fff}.small{font-size:16px}.title{font-size:28px;font-weight:700}.heading{font-size:22px;font-weight:700}.rock{fill:#ae9b7c;stroke:#766751;stroke-width:2}.strata{fill:#d8c8a8;stroke:#a49170;stroke-width:1.5}.core{fill:#765cc0;stroke:#483285;stroke-width:2}.inactive{fill:#b8a6cf;stroke:#806899;stroke-width:1}.magma{fill:#e9a56b;stroke:#ce834c;stroke-width:2}.water{fill:#72bdd3;fill-opacity:.8}.waterline{stroke:#267f9d;stroke-width:3}.rain{stroke:#3b93b5;stroke-width:3}.layerline{fill:none;stroke:#796e59;stroke-width:2}.fault{fill:none;stroke:#c65a45;stroke-width:4;stroke-dasharray:9 7}.bridge{stroke:#554e45;stroke-width:8}.fold{fill:none;stroke:#b56b3e;stroke-width:6}.edge{stroke:#746750;stroke-width:3}.reference{stroke:#3d7f91;stroke-width:2;stroke-dasharray:7 6}.flow{fill:none;stroke:#347f97;stroke-width:3}.force{fill:none;stroke:#6c50a8;stroke-width:4}.gravity{fill:none;stroke:#b06045;stroke-width:4}.ghost{fill:none;stroke:#9b9383;stroke-width:3;stroke-dasharray:7 6}.frame{fill:none;stroke:#3a5655;stroke-width:7}.texture{stroke:#e8def9;stroke-width:4}.pivot{fill:#243b38;stroke:#fff;stroke-width:2}.sat{fill:#81b19a;stroke:#497e63;stroke-width:1.5}.rootzone{fill:none;stroke:#578771;stroke-width:2;stroke-dasharray:7 5}.stillwater{fill:#a9d4db;stroke:#2a8298;stroke-width:1.5}.ice{fill:#dde8ed;stroke:#99b6c4;stroke-width:2}</style><rect x="0" y="0" width="940" height="650" rx="0" fill="#f7f5ee"/><text x="36" y="43" class="title">07 / 平面：直段、弯道与多汊</text><text x="36" y="74" class="small">已确认 · 10/15成分以水色简化，细化延期 · 非比例示意</text><g opacity="1"><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="75" y="183" width="790" height="287" rx="14" class="strata"/><path d="M90 247 L850 257 M90 404 L850 395" class="layerline" /><path d="M120 324 L820 324" fill="none" stroke="#72bdd3" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/><path d="M185 324 L759 324" class="flow" marker-end="url(#arrow-07-planform)"/><text x="94" y="154" class="label">平面示意：纵横都不是高度</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">1 / 4  受谷地约束的河段可以近直，不要求条条曲流</text><text x="43" y="575" class="label">此图为平面；地貌和床岸提供方向，不从planform标签在游戏自由摆线。</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="75" y="183" width="790" height="287" rx="14" class="strata"/><path d="M135 280 Q365 192 445 328 Q531 450 810 359" fill="none" stroke="#72bdd3" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/><path d="M138 274 Q365 188 457 322 Q543 438 803 352" class="layerline" /><path d="M343 276 Q420 260 435 321 Q397 320 343 276Z" class="magma" /><text x="101" y="154" class="label">实际局部模型需支持侧向水沙，不只一维中心线</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">2 / 4  弯道外岸冲刷与内岸沉积，深槽可以偏侧</text><text x="43" y="575" class="label">局部水力与材料才支持这一反馈；不把一条正弦线当曲流成因。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="75" y="183" width="790" height="287" rx="14" class="strata"/><path d="M135 290 Q330 150 457 323 Q548 453 810 350" fill="none" stroke="#72bdd3" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/><path d="M135 280 Q365 192 445 328 Q531 450 810 359" class="ghost" /><text x="94" y="154" class="label">迁移来自过程，不为视觉增加弯曲倍率</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">3 / 4  河岸迁移留下的材料需要去向，不能日期换弯度</text><text x="43" y="575" class="label">旧岸线用虚线示意；实际冲刷、沉积和连接改变才更新平面源几何。</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="24s" repeatCount="indefinite"/><rect x="75" y="183" width="790" height="287" rx="14" class="strata"/><path d="M125 324 Q360 224 510 245 Q672 274 818 324" fill="none" stroke="#72bdd3" stroke-width="35" stroke-linecap="round" stroke-linejoin="round"/><path d="M125 324 Q353 420 510 398 Q670 370 818 324" fill="none" stroke="#72bdd3" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><path d="M305 324 Q465 267 665 324 Q460 381 305 324Z" class="magma" /><path d="M125 324 Q360 224 510 245 Q672 274 818 324" class="flow" marker-end="url(#arrow-07-planform)"/><text x="92" y="154" class="label">两条实际湿区与中间洲体（非模板输出）</text><rect x="25" y="505" width="890" height="120" rx="14" fill="#e9ede5"/><text x="43" y="541" class="heading">4 / 4  多汊需要洲体、分流和侧向输沙几何</text><text x="43" y="575" class="label">干洲不计湿宽，不因泥沙标签随机多画一条河；无法解析时明确列缺失。</text></g><text x="36" y="637" class="small">非比例过程示意 · 像素不是米 · 非实际47米河段 / 水动力结果</text></svg>