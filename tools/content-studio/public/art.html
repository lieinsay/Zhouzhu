<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>州渚 · 正式美术资源</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/art.css"></head>
<body><main class="art-main"><header><a href="/">← 内容工坊</a><h1>正式美术资源</h1><p>正式图片与三维实体供工具和游戏按相同身份共用。两类美术分别暂存、应用，与内容草稿分开；应用后重新启动游戏读取。</p></header><div class="art-toolbar"><button id="refresh" class="btn">刷新</button><button id="stage" class="btn">暂存美术绑定</button><button id="apply" class="btn primary">应用美术到游戏</button><label>资源 <select id="resource-kind"><option value="images">图片与材质</option><option value="models">三维实体模型</option></select></label><label>类别 <select id="namespace"><option value="">全部</option><option value="item">物品</option><option value="module">船模块</option><option value="building">建筑</option><option value="furniture">家具</option><option value="material">共享材质</option><option value="character">人物贴图</option><option value="actor">人物模型</option><option value="prop">场景道具</option></select></label><span id="status" role="status"></span></div><p class="helper" id="resource-helper">此页只应用已登记并通过代理审图的图片版本；不应用配方、经济、模型变换或其他内容草稿。用户确认栏仅在用户逐项确认后记录。</p><section id="assets" class="art-grid"></section><details><summary>当前应用记录</summary><pre id="application"></pre></details></main><dialog id="model-dialog" style="width:min(800px,92vw);max-width:92vw"><button class="btn" id="model-close">关闭</button><label><input id="model-wire" type="checkbox">线框</label><p>形体检查；材质观感以正式渲染图和游戏为准。</p><canvas id="model-canvas" style="width:100%;height:min(480px,65vh);display:block"></canvas><p id="model-status"></p></dialog><script type="module" src="/art.js"></script></body></html>
